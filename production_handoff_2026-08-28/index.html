              TEXT.act.toUpperCase() + " " + ROMAN[(saved.act || 0) + 1] + " \u00b7 " +
              disciplineName(saved.wizard).toUpperCase() + " \u00b7 " +
              saved.hp + "/" + saved.maxHP)
          : primary("mmNew", "New game")) +
        /* ALWAYS THERE, DIMMED WITH NOTHING TO ABANDON. It used to appear only with a
           run, so the stack was two rows or three and its height changed between them.
           A menu whose buttons move as you look at it is worse than one greyed control,
           and a player learns where a thing is only if it stays put.
           Disabled to a FINGER and to a SCREEN READER, not merely faded. */
        '<button class="mmBtn mmAnew' + (saved ? "" : " off") + '" id="mmAnew"' +
          (saved ? "" : ' disabled aria-disabled="true"') +
          ' aria-label="Start Anew' + (saved ? "" : " \u2014 no run to abandon") + '">' +
          (dressed ? "" : '<span class="mmLabel">Start anew</span>') + '</button>' +
        second("mmSettings", "Settings", "\u2699") +
      '</div>' +
      /* Trials is earned and occasional, so it sits apart from the stack rather than
         becoming a third row that changes its height. */
      (anyTrialsOpen() ? '<button class="mmTrialsTab" id="mmTrials">\ud83c\udf02 Trials</button>' : "") +
      '<div class="mmVersion">Version ' + ver + '</div>' +
    '</div>');

  dressStage(true);
  applyLayout("title");
  on("#mmContinue", () => { if (!RUNSAVE.resume()) showTitle(); });
  on("#mmAnew", startAnew);
  /* With Continue holding the primary slot, "new game" moves to Settings — a
     destructive action belongs behind a menu, not beside the button you press most. */
  on("#mmTrials",   () => showTrials("title"));
  on("#mmSettings", () => showSettings("title"));
  on("#mmNew", () => {
    /* Starting over throws away a run in progress, so say so once rather than
       silently. */
    if (saved && !TITLE.newArmed){
      TITLE.newArmed = true;
      toast("That will abandon your run in " + disciplineName(saved.wizard) +
            ". Tap again to begin anew.", 3400);
      return;
    }
    TITLE.newArmed = false;
    RUNSAVE.clear();
    if (!LESSON.done()) LESSON.begin();
    else showSchools();
  });
}
const TITLE = { newArmed:false };

/* ABANDONING A RUN — asked properly, and scoped properly.
   The first tap opens a question rather than destroying anything, and the two answers
   are named for what they DO rather than "yes" and "no", so neither can be pressed by
   reflex. */
function startAnew(){
  const saved = RUNSAVE.peek();
  if (!saved) return showTitle();
  showScreen(
    '<div class="eyebrow" style="text-align:center">A road already walked</div>' +
    '<h1>Abandon this journey?</h1>' +
    '<p class="lede">Your run as <b>' + disciplineName(saved.wizard) + '</b> in ' +
      TEXT.act + " " + ROMAN[(saved.act || 0) + 1] + ' will be lost.<br><br>' +
      'Everything you have <b>earned</b> stays: opened disciplines, filled trees, ' +
      'Veilglass, trials and the Record.</p>' +
    '<button class="btn" id="anewKeep">Keep this run</button>' +
    '<button class="btn ghost anewGo" id="anewGo">Abandon it and start anew</button>');
  /* the safe answer is the primary one and takes the focus */
  const keep = $("#anewKeep");
  if (keep && keep.focus) try { keep.focus(); } catch(e){}
  on("#anewKeep", showTitle);
  on("#anewGo", () => {
    /* ONE OPERATION. If clearing the run fails the player keeps it and is told, rather
       than being sent onward into a half-reset game with a stale Continue behind them. */
    let cleared = false;
    try {
      RUNSAVE.clear();
      cleared = RUNSAVE.peek() === null;
    } catch(e){ cleared = false; }
    if (!cleared){
      toast("The run could not be set aside. Nothing has been changed.", 3200);
      return showTitle();
    }
    /* Only the RUN goes. SAVE holds the permanent things — opened disciplines, trees,
       Veilglass, trials, the Record, settings — and is never touched here. */
    RUN = null;
    SCHOOLS.pick = null;          // no craft carried over from the run just ended
    showSchools();                // straight to the choice, never back past the title
  });
}

/* Position on the unlock ladder: 0 for the starting discipline, then boss count.
   Declaration order in WIZARDS is arbitrary and must not drive the screen. */
function unlockRank(id){
  const u = UNLOCKS.find(x => x.wizard === id);
  return u ? u.bosses : 0;
}
function disciplinesInLadderOrder(){
  return WIZARDS.slice().sort((a,b) => unlockRank(a.id) - unlockRank(b.id));
}

/* THE DISCIPLINES.
   The same figure as the title, with the seven crafts circling him — so choosing one
   reads as the game opening out from where the player just was, rather than a new
   screen with a list on it. A craft is TAPPED to inspect and only then ventured into,
   because with the ladder stretched to 3/8/15/24/35/48 a new player meets one open
   craft and six sealed ones, and a list of "not yet" is a poor second screen.
   Locked crafts are still tappable: what they DO stays hidden, but what they COST is
   the thing worth knowing. */
/* ============================================================================
   THE PAGE TURN.  Kerry, 2026-08-26: only between UNLOCKED disciplines, and the
   new page must be hidden by the animation rather than appearing to be drawn on
   a turning sheet — which is the hard version and not worth it.

   So the content is swapped at the MIDPOINT, when the leaf is edge-on and hides
   the spread entirely. The player sees a page lift, go edge-on, and settle down
   already showing the new craft. Nothing has to be painted onto a moving
   surface, and nothing can be caught half-loaded, because the swap happens
   behind an opaque edge.

   Locked disciplines redraw immediately: a turn that leads nowhere the player
   can go is a delay with nothing at the end of it.
   ============================================================================ */
let TURNING = false;
function turnPageTo(id){
  if (TURNING || !id || id === SCHOOLS.pick) return;
  const canTurn = wizardUnlocked(id) && wizardUnlocked(SCHOOLS.pick) &&
                  !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!canTurn){ SCHOOLS.pick = id; return showSchools(); }

  const sheet = document.querySelector(".dSheet");
  if (!sheet){ SCHOOLS.pick = id; return showSchools(); }

  /* ============================================================================
     A REAL PAGE TURN.

     The previous version slid a picture of a page across the book. It was a PROP
     being moved, and it read as one, because the thing travelling was generic
     parchment rather than the page you were looking at.

     This turns the actual page. A leaf occupies the right half of the spread and
     rotates on the spine through 180 degrees, and its two faces carry REAL
     CONTENT: the front is the right page as it was a moment ago, the back is the
     left page of the craft you just chose. So you watch the page you were
     reading lift, pass edge-on, and settle as the facing page of the new entry —
     which is what a book does and why it needs no explaining.

     Three things do the convincing, and none of them is the rotation itself:
       PERSPECTIVE   without it a rotateY is an affine squash, which is exactly
                     what "looked like something turned sideways" was describing.
       SHADING       each face darkens as it approaches edge-on and lightens as
                     it comes back to flat. A page catches less light at an
                     angle; without this the leaf looks like a decal.
       CAST SHADOW   a soft shadow sweeps across the page beneath as the leaf
                     passes over it, then leaves. This is what puts the leaf ABOVE
                     the book rather than inside it.
     ============================================================================ */
  TURNING = true;

  /* the spread exactly as it is now, before anything changes */
  const before = sheet.cloneNode(true);
  const w = sheet.getBoundingClientRect().width;

  /* DRAW THE NEW CRAFT — BUT ONLY THE BOOK.
     showSchools() goes through showScreen(), which rebuilds the WHOLE screen:
     the wright, the disciplines logo and all seven orbit icons are torn down
     and recreated. Every one of those is an <img>, and a replaced <img> paints
     blank for a frame before its decode lands — which is the flicker Kerry saw
     on exactly those three things, and nothing else.
     So the screen is rebuilt OFF to one side, the new book is lifted out of it,
     and only that is swapped in. The wright, the logo and the orbit are never
     touched, so they cannot flicker. */
  /* THE HEAD AND THE ORBIT ARE KEPT, NOT REBUILT.
     showSchools() goes through showScreen(), which replaces the whole screen —
     so the logo, the wright and all seven orbit icons are destroyed and made
     again. Each is an <img>, and a freshly created <img> paints blank for a
     frame before its decode lands, which is precisely the flicker Kerry saw on
     exactly those things and nothing else.
     The already-painted nodes are lifted out first and put back afterwards, in
     place of the new ones. A node that was never removed from the document
     cannot repaint, so it cannot flicker; only the book is genuinely new. */
  const keepHead  = document.querySelector(".dHead");
  const keepOrbit = document.querySelector(".dOrbit");

  SCHOOLS.pick = id;
  showSchools();                                   /* rebuilds the screen */
  let after = document.querySelector(".dSheet");
  if (!after){ TURNING = false; return; }

  /* MOVING A NODE RESTARTS ITS ANIMATIONS — and worse, it CANCELS the old
     Animation objects and creates new ones, so a handle captured beforehand
     refers to something that no longer exists and writing to it succeeds
     silently while changing nothing. The wright's slow drift went back to frame
     zero on every tap because of exactly that.
     Captured by ELEMENT AND KEYFRAME NAME, then matched onto whatever is running
     after the move, so each animation resumes where it left off. */
  const resume = [];
  [keepHead, keepOrbit].forEach(node => {
    if (!node || !node.getAnimations) return;
    node.getAnimations({ subtree:true }).forEach(a => {
      const el = a.effect && a.effect.target;
      if (el && a.animationName != null) resume.push([el, a.animationName, a.currentTime]);
    });
  });

  [[keepHead, ".dHead"], [keepOrbit, ".dOrbit"]].forEach(([old, sel]) => {
    const fresh = document.querySelector(sel);
    if (old && fresh && fresh.parentNode) fresh.parentNode.replaceChild(old, fresh);
  });

  /* THE KEPT NODES NEED A FRESH DELAY. Re-inserting a node restarts its
     animations, and the kept orbit still carried the animation-delay computed
     when the screen FIRST drew — so it restarted at that old phase and the
     wright snapped back to where he was minutes ago. My two fixes were working
     against each other: keeping the node preserved a stale delay, and the delay
     is the very thing that has to be current.
     applyLayout recomputes it from FX_EPOCH, so one call after the swap puts
     every kept piece back in phase with the clock. */
  applyLayout("disciplines");

  /* the kept orbit still shows the OLD craft as chosen, so its state is moved by
     hand — the one thing the rebuild would have done for us */
  if (keepOrbit){
    keepOrbit.querySelectorAll(".dOrb").forEach(o => {
      const isPick = o.dataset.disc === id;
      o.classList.toggle("on", isPick);
      if (isPick && artPath("ui", "disc-aura-" + id))
        o.style.setProperty("--aura", "url(" + artPath("ui","disc-aura-" + id) + ")");
    });
    keepOrbit.querySelectorAll(".dWrightLight").forEach(l => {
      const src = l.getAttribute("src") || "";
      l.classList.toggle("on", src.indexOf("disc-light-" + id) !== -1);
    });
    /* the orbit's buttons were bound by the rebuild that we just undid */
    keepOrbit.querySelectorAll("[data-disc]").forEach(b => {
      if (b.dataset.bound) return;
      b.dataset.bound = "1";
      b.addEventListener("click", () => turnPageTo(b.dataset.disc));
    });
  }

  /* a face shows ONE HALF of a full spread: the clone is laid in at double the
     face's width and slid so the wanted half is the part on show. */
  const half = (cloneOf, which) => {
    const f = document.createElement("div");
    f.className = "leafFace " + which;
    const holder = document.createElement("div");
    holder.className = "leafHolder";
    holder.style.width = w + "px";
    holder.style.left = (which === "front" ? -w / 2 : 0) + "px";
    holder.appendChild(cloneOf);
    f.appendChild(holder);
    const shade = document.createElement("div");
    shade.className = "leafShade";
    f.appendChild(shade);
    return f;
  };

  const leaf = document.createElement("div");
  leaf.className = "dLeaf3";
  leaf.setAttribute("aria-hidden", "true");
  leaf.appendChild(half(before, "front"));                    /* the old right page */
  leaf.appendChild(half(after.cloneNode(true), "back"));      /* the new left page */

  /* THE OLD LEFT PAGE STAYS until the leaf comes over it. Drawing the new spread
     underneath put the new left page on show before the page had turned, so
     there was nothing left to reveal and the turn read as nothing happening at
     all. It is held on top of the left half and pulled once the leaf is past
     upright — at which point the leaf's own back face is what covers it. */
  const under = document.createElement("div");
  under.className = "leafUnder";
  const uh = document.createElement("div");
  uh.className = "leafHolder";
  uh.style.width = w + "px"; uh.style.left = "0px";
  uh.appendChild(before.cloneNode(true));
  under.appendChild(uh);

  const cast = document.createElement("div");                 /* the shadow it throws */
  cast.className = "leafCast";

  /* OVERFLOW:HIDDEN FLATTENS 3D. The sheet was given it when the book's height
     was locked, and a clipped ancestor forces its subtree into a flattened
     rendering context — so preserve-3d was ignored, the leaf rotated as an
     affine squash, and at every frame it looked like nothing was happening.
     Lifted for the length of the turn and put back after; the clip exists to
     stop TEXT spilling past the covers, which nothing is doing mid-turn. */
  const clip = after.style.overflow;
  after.style.overflow = "visible";

  /* THE PAGE BENEATH IS ALREADY PRINTED. Hiding the live buttons until the leaf
     passed upright made them APPEAR, and an appearance is a pop however well
     timed — a book does not print its next page halfway through the turn.
     They are present from the first frame, as they would be, but IN SHADOW:
     the lifting page is over them, so they are dark, and they come up to full
     light as it uncovers them. That removes the pop and the doubling at once —
     at t=0 the copy on the leaf is lit and these are not, so the eye reads one
     page above another rather than two identical sets in the same place.
     DECLARED HERE, above its first use: a `const` read before its declaration
     is a temporal-dead-zone throw, and it took the whole turn down. */
  /* THE WHOLE PAGE IS IN SHADOW, not just the buttons on it. Filtering .dActs
     darkened the controls and left the parchment around them lit, which read as
     the buttons being dim rather than as the page being covered. A shade panel
     over the entire right half is what a page under another page looks like. */
  const underShade = document.createElement("div");
  underShade.className = "leafUnderShade";
  after.appendChild(underShade);

  /* one duration, read by every keyframe on the leaf — and by the page
     underneath, whose lighting must finish exactly when the leaf does */
  leaf.style.setProperty("--turnMs", CONFIG.pageTurnMs + "ms");
  cast.style.setProperty("--turnMs", CONFIG.pageTurnMs + "ms");
  underShade.style.setProperty("--turnMs", CONFIG.pageTurnMs + "ms");
  under.style.setProperty("--turnMs", CONFIG.pageTurnMs + "ms");
  after.appendChild(under);
  after.appendChild(cast);
  after.appendChild(leaf);
  /* NOTHING MOVES UNTIL THE NEW PAGE HAS PAINTED. The craft's icon on the left
     page is a brand-new <img>, and a new <img> shows nothing for a frame or two
     while it decodes — which is why it flickered the moment the held page was
     pulled away. decode() resolves only once the bitmap is ready to draw, so
     waiting on every image in the new spread means the page beneath is complete
     before the leaf ever lifts. Cached images resolve at once, so this costs
     nothing from the second turn on; a 120ms ceiling stops a slow decode from
     stalling the tap.
     THE TIMERS START WITH THE ANIMATION, not before it — they used to be set
     the moment the leaf was built, so any wait would have desynchronised the
     held page from the leaf that is supposed to hide its removal. */
  const imgs = [...after.querySelectorAll("img"), ...leaf.querySelectorAll("img")];
  Promise.race([
    Promise.all(imgs.map(im => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}))),
    new Promise(r => setTimeout(r, 120))
  ]).then(() => requestAnimationFrame(() => {
    leaf.classList.add("go");
    cast.classList.add("go");
    underShade.classList.add("go");
    /* THE HELD PAGE FADES; IT IS NOT PULLED. Removing it at 52% put the new left
       page on screen at the exact moment the leaf is EDGE-ON — which is the one
       moment the leaf covers nothing at all — so the swap happened in full view
       and read as the icon flickering. It now fades across the second half,
       under the leaf as it comes over, so there is no instant at which anything
       appears. */
    under.classList.add("fading");
    setTimeout(finish, CONFIG.pageTurnMs + 60);
  }));

  function finish(){
    leaf.remove(); cast.remove(); under.remove();
    underShade.remove();                       /* never leave the page dark */
    after.style.overflow = clip;
    TURNING = false;
  }
}

function showSchools(){
  const order = disciplinesInLadderOrder();
  const openIds = order.filter(w => wizardUnlocked(w.id)).map(w => w.id);
  if (!SCHOOLS.pick || !order.some(w => w.id === SCHOOLS.pick))
    SCHOOLS.pick = openIds[openIds.length - 1] || order[0].id;

  const pick = SCHOOLS.pick;
  const w = WIZ[pick];
  const unlocked = wizardUnlocked(pick);
  const need = UNLOCKS.find(u => u.wizard === pick);
  const left = need ? Math.max(0, need.bosses - SAVE.data.bossesDefeated) : 0;
  const mine = nativeElementsOf2(pick);
  const hue = EL[mine[0]] ? "var(--" + mine[0] + ")" : "var(--gold)";

  /* Seven orbs on a ring, evenly spaced, the chosen one lit in its own element. */
  /* THE KIT'S OWN ORBIT, not a perfect circle — it says so, and the composition is
     hand-painted, so an even ring would fight the artwork. Positions are percentages of
     the stage, which is also what makes it hold on a narrow phone. */
  const ORBIT = { pyromancer:[15,31], cryomancer:[50,19], warlock:[81,29],
                  apothecary:[87,48], hexweaver:[78,65], diviner:[17,65],
                  alchemist:[10,48] };
  const orbs = order.map((d, n) => {
    const open = wizardUnlocked(d.id);
    const el = nativeElementsOf2(d.id)[0];
    const seal = artPath("seal", d.id);
    const at = ORBIT[d.id] || [50, 50];
    const deg = -90 + (360 / order.length) * n;
    /* THE ORBIT IS THE PACK'S. With the new frame the selectors are placed by
       percentage exactly as the seals were — the old `--a` degree fallback was
       for a build with no art at all, and choosing it because `seal` happened to
       be missing put five of the seven at 0deg on top of one another. The frame
       decides, not the seal. */
    const placed = !!(artPath("ui","selector") || seal);
    const place = placed ? 'style="--x:' + at[0] + '%; --y:' + at[1] + '%; --c:var(--' + el + ')"'
                         : 'style="--a:' + deg + 'deg; --c:var(--' + el + ')"';
    /* THE 2026-08 SELECTOR. The frame, its state overlays and the lock medallion
       are all CSS on .dOrb — the pack ships them on one shared canvas, so they
       must layer, not replace. Only the discipline's own icon comes through as a
       child, and only the ICON: `locked` is a class, not a different picture,
       because the pack's note says the discipline must stay recognisable
       underneath the lock. */
    const newFrame = !!artPath("ui","selector");
    const dIcon = artPath("ui","disc-icon-" + d.id);
    return '<button class="dOrb' + (newFrame ? " packOrb" : (seal ? " sealArt" : "")) +
      (d.id === pick ? " on" : "") + (open ? "" : " sealed locked") +
      '" data-disc="' + d.id + '" ' + place +
      ' aria-label="' + disciplineName(d.id) + (open ? "" : ", locked") + '"' +
      (newFrame && d.id === pick
        ? ' style="' + place.slice(7, -1) + '; --aura:url(' +
          (artPath("ui","disc-aura-" + d.id) || "") + ')"' : "") + '>' +
      (newFrame && dIcon
        ? '<span class="dOrbIcon" style="background-image:url(' + dIcon + ')"></span>'
        : seal ? '<img class="dSeal" src="' + seal + '" alt="">'
               : '<span class="dGlyph">' + (d.glyph || "\u2726") + '</span>') +
      (open || newFrame ? ""
            : (artPath("ui","menu-lock-badge")
                ? '<img class="dLockArt" src="' + artPath("ui","menu-lock-badge") + '" alt="">'
                : '<span class="dLock">\ud83d\udd12</span>')) +
      '</button>';
  }).join("");

  showScreen(
    '<div class="dHead">' +
      '<button class="dBack' + (artPath("ui","menu-button-back") ? " art" : "") +
        '" id="schoolsBack" aria-label="Back">' +
        (artPath("ui","menu-button-back") ? "" : "\u2039") + '</button>' +
      (artPath("ui","disc-logo")
        ? '<img class="dLogo" src="' + artPath("ui","disc-logo") + '" alt="Disciplines">'
        : '<h1 class="dTitle">Disciplines</h1>') +
      '<span class="dCount">' + openIds.length + ' / ' + order.length + '</span>' +
    '</div>' +

    '<div class="dOrbit' + (artPath("ui","menu-wizard") ? " hasStage" : "") +
      '" style="--hue:' + hue + '">' +
      (artPath("ui","menu-astrolabe")
        ? '<img class="mmAstro" src="' + artPath("ui","menu-astrolabe") + '" alt="">'
        : '<div class="dRing"></div><div class="dRing two"></div>') +
      (artPath("ui","menu-wizard")
        ? '<img class="mmWizard" src="' + artPath("ui","menu-wizard") + '" alt="">' +
          /* THE EYES, over the figure at the SAME anchor, so an overlay cannot drift
             from the hood. Nothing is drawn until art is registered for a craft. */
          (artPath("eyes", pick)
            ? '<img class="mmEyes" src="' + artPath("eyes", pick) + '" alt="">' : "") +
          /* THE CRAFT'S LIGHT ON THE FIGURE. One overlay per discipline, all on
             the wright's own canvas so they cannot drift from him — the pack is
             explicit about that. All seven are drawn and only the chosen one is
             opaque, so switching crafts CROSS-FADES instead of flashing a
             newly-loaded image. */
          DISC_LADDER.filter(id => artPath("ui","disc-light-" + id)).map(id =>
            '<img class="mmWizard dWrightLight' + (id === pick ? " on" : "") +
            '" src="' + artPath("ui","disc-light-" + id) + '" alt="" aria-hidden="true">').join("")
        : '<div class="dFigure">\ud83e\uddd9</div>') +
      orbs +
    '</div>' +

    /* THE BOOK, IN TWO REGIONS: what the craft is, and what you may do about it. */
    '<div class="dSheet' + (artPath("ui","menu-grimoire-panel") ? " onPanel" : "") +
      '" style="--hue:' + hue + '">' +

      /* THE LEFT PAGE, AS A PAGE. Kerry, 2026-08-26: a title across the top, the
         craft's icon as a DROP CAP beginning the paragraph, and the description
         as one running paragraph — not lines, not columns.
         The lines are joined into a single string here rather than wrapped in
         .dLine spans: those spans were the whole reason the text could not fill
         its page. A paragraph is a paragraph. The same treatment covers the
         sealed text, which is prose too.
         NO "Sealed" pill: the padlock on the selector above already says it, and
         the greyed controls on the right say what it costs you. */
      '<div class="dPage">' +
        /* THE EMBLEM SITS BESIDE THE TITLE, not in the paragraph (Kerry,
           2026-08-26). It wears the same round plate as the selectors above it,
           so the two read as the same object — the craft's mark — rather than
           as a framed icon up there and a bare glyph down here. */
        '<div class="dTitleRow">' +
          '<span class="dCap">' +
            (artPath("ui","disc-icon-" + pick)
              ? '<img src="' + artPath("ui","disc-icon-" + pick) + '" alt="">'
              : (artPath("seal", pick)
                  ? '<img src="' + artPath("seal", pick) + '" alt="">'
                  : (w.glyph || "\u2726"))) + '</span>' +
          '<h2 class="dName">' + w.name + '</h2>' +
        '</div>' +
        '<p class="dBlurb' + (unlocked ? "" : " req") + '">' +
          (unlocked
            ? (DISCIPLINE_SHORT[pick] || ["", ""]).join(" ")
            : "Sealed. Fell <b>" + left + "</b> more boss" +
              (left === 1 ? "" : "es") + " to open this craft — " +
              need.bosses + " in all.") +
        '</p>' +
      '</div>' +

      /* THE ACTIONS. Both carry their lettering in the art, so nothing is retyped over
         them — the accessible name is on the button itself. */
      '<div class="dActs">' +
        '<button class="dTree' + (artPath("ui","btn-talents") ? " art" : "") +
          '" id="dTree" aria-label="View talent tree">' +
          (artPath("ui","btn-talents")
            ? '<img src="' + artPath("ui","btn-talents") + '" alt="">'
            : "\u2726 View talent tree") + '</button>' +
        '<button class="dGo' + (artPath("ui","btn-venture") ? " art" : "") +
          (unlocked ? "" : " off") + '" id="dGo" aria-label="Venture forth"' +
          (unlocked ? "" : ' disabled aria-disabled="true"') + '>' +
          (artPath("ui","btn-venture")
            ? '<img src="' + artPath("ui","btn-venture") + '" alt="">'
            : "Venture forth") + '</button>' +
      '</div>' +
    '</div>');

  dressStage(true);
  applyLayout("disciplines");
  document.querySelectorAll("[data-disc]").forEach(b =>
    b.addEventListener("click", () => turnPageTo(b.dataset.disc)));
  on("#schoolsBack", showTitle);
  /* The tree is readable before committing — that is the point of looking. */
  on("#dTree", () => showTalents("schools", pick));
  on("#dGo", () => {
    if (!wizardUnlocked(pick)) return;
    newRun(pick); beginAct(0); mapOrTalents();
  });
}
const SCHOOLS = { pick:null };

function findableSpells(){
  return (RUN.acquired || []).filter(id => !RUN.spells.includes(id));
}
/* Everything a boss could still teach: sealed spells never learned at all, plus
   spells this discipline knows but has not brought into this run. */
function bossOfferings(){
  const known = SAVE.unlockedSpells(RUN.wizard);
  const sealed = (LOCKED_SPELLS[RUN.wizard] || []).filter(id => !known.includes(id));
  const unbrought = known.filter(id => !(RUN.acquired || []).includes(id));
  return { sealed, unbrought };
}
/* One place where a talent becomes a live effect. Generic kinds are data; the
   handful of bespoke ones are simply recorded and read where they matter. */
/* ---------- the talent tree ----------
   SAVE holds which nodes a discipline has taken; it persists between runs and is
   the only thing that decides what a run begins with. */
function treeOf(wiz){ return TREES[wiz] || { gates:[0], nodes:[], links:[] }; }
function nodeById(wiz, id){ return treeOf(wiz).nodes.find(n => n.id === id); }
function takenIds(wiz){ return (SAVE.data.trees && SAVE.data.trees[wiz]) || []; }
function isTaken(wiz, id){ return takenIds(wiz).includes(id); }
function spentIn(wiz){ return takenIds(wiz).length; }
function fragmentsSpare(wiz){ return fragmentsOf(wiz) - spentIn(wiz); }

/* Nodes sharing a slot are alternatives: taking one forgoes the rest. */
function slotmates(wiz, node){
  return treeOf(wiz).nodes.filter(n => n.tier === node.tier && n.col === node.col &&
    (n.row || 1) === (node.row || 1) && n.id !== node.id);
}
function parentsIn(wiz, id){ return treeOf(wiz).links.filter(l => l[1] === id).map(l => l[0]); }

/* Why a node cannot be taken — a string, or null when it can. */
function blockedBecause(wiz, node){
  if (isTaken(wiz, node.id)) return "already taken";
  const gate = treeOf(wiz).gates[node.tier - 1] || 0;
  if (spentIn(wiz) < gate)
    return "tier " + node.tier + " opens at " + gate + " Veilglass spent";
  const rival = slotmates(wiz, node).find(n => isTaken(wiz, n.id));
  if (rival) return "you took " + talentName(wiz, rival) + " instead";
  const parents = parentsIn(wiz, node.id);
  if (parents.length){
    /* Parents that are alternatives of one another are satisfied by any one;
       genuinely separate parents are all required. */
    const groups = {};
    parents.forEach(p => {
      const pn = nodeById(wiz, p);
      const key = pn ? pn.tier + ":" + (pn.row || 1) + ":" + pn.col : p;
      (groups[key] = groups[key] || []).push(p);
    });
    const unmet = Object.values(groups).filter(g => !g.some(p => isTaken(wiz, p)));
    if (unmet.length){
      const need = unmet[0].map(p => talentName(wiz, nodeById(wiz, p))).join(" or ");
      return "requires " + need;
    }
  }
  if (fragmentsSpare(wiz) < 1) return "no Veilglass to spend";
  return null;
}
function canTake(wiz, node){ return !blockedBecause(wiz, node); }

function talentName(wiz, node){
  if (!node) return "?";
  if (node.name) return node.name;
  if (node.kind === "passive") return WIZ[wiz].passiveName || "Class passive";
  if (node.kind === "mastery"){
    const [sid, i] = node.ref.split(":");
    const m = (MASTERIES[sid] || [])[+i];
    return m ? m.name : sid;
  }
  const sp = SPELLS[node.ref];
  if (!sp) return node.id;
  if (node.kind === "potency") return sp.name + " — Potency";
  if (node.kind === "efficiency") return sp.name + " — Efficiency";
  return sp.name;
}
function talentDesc(wiz, node){
  if (node.desc) return node.desc;
  if (node.kind === "passive") return WIZ[wiz].passive;
  if (node.kind === "mastery"){
    const [sid, i] = node.ref.split(":");
    const m = (MASTERIES[sid] || [])[+i];
    return m ? m.desc : "";
  }
  const sp = SPELLS[node.ref];
  if (!sp) return "";
  if (node.kind === "potency") return "One level of Potency: " + (sp.potencyStep || "stronger");
  if (node.kind === "efficiency") return sp.name + " costs 1 less mana (never below " +
    CONFIG.talents.efficiencyFloor + ").";
  return sp.desc;
}

function takeTalent(wiz, id){
  playSfx("talent");
  const node = nodeById(wiz, id);
  if (!node) return false;
  const why = blockedBecause(wiz, node);
  if (why){ toast(why + ".", 2200); return false; }
  SAVE.data.trees = SAVE.data.trees || {};
  SAVE.data.trees[wiz] = takenIds(wiz).concat(id);
  SAVE.commit();
  if (node.kind === "mastery"){
    const [sid, i] = node.ref.split(":");
    const m = (MASTERIES[sid] || [])[+i];
    if (m) SAVE.setMastery(sid, m.id);
  }
  if (RUN && RUN.wizard === wiz) applyTalent(node);
  return true;
}
/* Everything the tree grants, applied to a run as it begins. */
function applyTreeToRun(){
  const wiz = RUN.wizard;
  RUN.spells = []; RUN.acquired = [];
  takenIds(wiz).forEach(id => {
    const n = nodeById(wiz, id);
    if (n) applyTalent(n);
  });
  RUN.acquired = RUN.acquired.length ? RUN.acquired : RUN.spells.slice();
  if (B) renderSpells();          // only meaningful once a battle exists
}

function applyTalent(node){
  const t = RUN.talents;
  t.taken[node.id] = true;
  if (node.kind === "spell"){ acquireSpell(node.ref); equipSpell(node.ref); }
  else if (node.kind === "mastery"){
    const [sid, i] = node.ref.split(":");
    const m = (MASTERIES[sid] || [])[+i];
    if (m) SAVE.setMastery(sid, m.id);
  }
  /* Amplify was Potency under another name; one kind, one counter, taken once. */
  else if (node.kind === "potency"){
    t.potency[node.ref] = Math.min(CONFIG.talents.potencyMax, (t.potency[node.ref] || 0) + 1);
  }
  else if (node.kind === "efficiency"){
    t.efficiency[node.ref] = Math.min(CONFIG.talents.efficiencyMax, (t.efficiency[node.ref] || 0) + 1);
  }
  /* passive and bespoke: taken-only, read by hasTalent() where they apply */
}
function hasTalent(nodeId){ return !!(RUN && RUN.talents && RUN.talents.taken[nodeId]); }
/* The tree builder mints random node ids. Rather than scatter them through the
   engine, they are named once here and read by name everywhere else. */
/* An unknown key means the talent was retired — never taken, never fires. */
const has = key => !!TALENT[key] && hasTalent(TALENT[key]);

function acquireSpell(id){
  RUN.acquired = RUN.acquired || [];
  if (!RUN.acquired.includes(id)) RUN.acquired.push(id);
}
function equipCap(){ return Math.max(MAX_EQUIPPED, (RUN && RUN.sandboxSpellCap) || 0); }
function equipSpell(id){
  acquireSpell(id);
  if (RUN.spells.length >= equipCap()) return false;
  RUN.spells.push(id);
  return true;
}

function swapSpell(outId, inId){
  const i = RUN.spells.indexOf(outId);
  if (i === -1) return false;
  RUN.spells[i] = inId;
  return true;
}
/* Offering a spell you cannot take is worse than not offering it, so when the
   slots are full the player is asked what to give up instead. */
function takeSpell(id, then){
  acquireSpell(id);
  if (RUN.spells.length < equipCap()){
    equipSpell(id);
    if (then) then();
    return;
  }
  openChoice("Carry " + SPELLS[id].name + "?", "Your " + MAX_EQUIPPED +
    " slots are full. Choose one to set aside.",
    RUN.spells.map(sid => ({ v:sid, glyph:SPELLS[sid].glyph, sub:SPELLS[sid].name.toUpperCase() })),
    outId => {
      swapSpell(outId, id);
      toast("<b>" + SPELLS[outId].name + "</b> set aside for <b>" + SPELLS[id].name + "</b>.", 2600);
      if (then) then();
    });
}

/* The player's kit, changeable at will between fights. Spells set aside are not
   lost — they return to the pool this run and can be picked back up. */
function showLoadout(back){
  const equipped = RUN.spells.slice();
  const shelf = findableSpells();
  const card = (id, mode) => {
    const sp = SPELLS[id], base = spellBase(id);
    const cost = base.element === "gold"
      ? base.amount + " " + TEXT.currencyShort
      : base.amount + EL[base.element].glyph;
    const m = masteryOf(id);
    const pot = potency(id);
    return '<button class="pick" data-' + mode + '="' + id +
      '" data-tip="spell" data-tip-id="' + id + '">' +
      '<span class="ph"><span class="pi">' + sp.glyph + '</span>' +
      '<span class="pn">' + sp.name + '</span>' +
      '<span class="pmeta">' + cost + (mode === "unequip" ? " · CARRIED" : " · SET ASIDE") + '</span></span>' +
      '<span class="pd">' + sp.desc + '</span>' +
      (m ? '<span class="pd"><b>' + m.name + '</b> — ' + m.desc + '</span>' : "") +
      (pot ? '<span class="pd">Potency +' + pot + (sp.potencyStep ? " (" + sp.potencyStep + " each)" : "") + '</span>' : "") +
      '</button>';
  };
  showScreen(
    '<div class="eyebrow" style="text-align:center">Your kit</div>' +
    '<h1>✦ Spells</h1>' +
    '<p class="lede">Carrying <b>' + equipped.length + ' of ' + equipCap() + '</b>. ' +
      'Anything set aside stays available for the rest of the run.<br>' +
      '<i>New spells are learned only by felling a boss.</i></p>' +
    '<div class="sbSec"><h4>Carried</h4></div>' +
    equipped.map(id => card(id, "unequip")).join("") +
    (shelf.length
      ? '<div class="sbSec"><h4>Set aside — ' + shelf.length + ' known</h4></div>' +
        shelf.map(id => card(id, "equip")).join("")
      : '<p class="lede" style="font-size:12px">Nothing set aside. <b>Spells are learned only by defeating a boss</b> — ordinary victories and elites pay in ' + TEXT.currency + ', relics and vials instead.</p>') +
    '<button class="btn" id="loadBack">Back to ' + TEXT.map.toLowerCase() + '</button>');

  document.querySelectorAll("[data-unequip]").forEach(b => b.addEventListener("click", () => {
    if (RUN.spells.length <= 1){ toast("You must carry at least one spell.", 1900); return; }
    RUN.spells = RUN.spells.filter(x => x !== b.dataset.unequip);
    showLoadout(back);
  }));
  document.querySelectorAll("[data-equip]").forEach(b => b.addEventListener("click", () => {
    takeSpell(b.dataset.equip, () => showLoadout(back));
  }));
  on("#loadBack", () => (back === "settings" ? showSettings() : showMap()));
}

function showReward(kind, gold, healed){
  /* the board is free here, so anything a full satchel had to defer mid-fight
     gets its prompt now rather than being forgotten */
  if (typeof flushPendingGrants === "function") setTimeout(flushPendingGrants, 400);
  /* An elite pays coin, prises loose a Veilglass shard, and offers a choice of three
     vials. Spells come from the talent tree; relics come from treasure and events. */
  if (kind === "rare") awardShards(CONFIG.souls.eliteShards);
  const frag = fragmentsOf(RUN.wizard), rem = shardRemainder(RUN.wizard);
  const owned = RUN.relics;
  let pool = REWARD_POOL.filter(id => !owned.includes(id));
  /* A boss may offer two uncommons instead of a rare — a different shape of prize
     rather than a lesser one. Both are drawn fresh and are never the same. */
  let twin = null;
  if (kind === "rare"){
    const uncommons = pool.filter(id => relicRarity(id) === "uncommon");
    if (uncommons.length >= 2 && Math.random() < CONFIG.rarity.twinUncommonChance){
      twin = weightedSample(uncommons, 2, relicRarity);
    } else {
      const rares = pool.filter(id => relicRarity(id) === "rare");
      if (rares.length >= CONFIG.rewards.choices) pool = rares;
    }
  }
  /* When the twin rolls, the rares stay on the table — the player chooses between a
     single strong relic and a pair of lesser ones, rather than being handed the pair. */
  const howMany = kind === "elite" ? CONFIG.rewards.eliteChoices
                : twin ? 2 : CONFIG.rewards.choices;
  const offer = weightedSample(pool, howMany, relicRarity);
  /* Elite Quarry: the elite yields a second relic outright, on top of the choice. */
  if (kind === "elite" && relicAny("eliteExtraRelic")){
    const extra = pool.filter(id => !offer.includes(id));
    if (extra.length){
      const bonus = weightedSample(extra, 1, relicRarity)[0];
      grantRelic(bonus);
      if (RELICS[bonus].onGain) RELICS[bonus].onGain();
      applyRelicMaxHP();
      toast("<b>Elite Quarry</b> — " + RELICS[bonus].name + " taken from the body.", 3000);
    }
  }
  const card = (id, tag) => {
    const r = RELICS[id], rr = relicRarity(id);
    return '<button class="pick' + (rr === "rare" ? " rare" : "") + '" data-r="' + id +
      '" data-tip="relic" data-tip-id="' + id + '">' +
      '<span class="ph"><span class="pi">' + r.glyph + '</span>' +
      '<span class="pn">' + r.name + '</span>' +
      '<span class="pmeta">' + (tag || rr.toUpperCase()) + '</span></span>' +
      '<span class="pd">' + r.desc + '</span></button>';
  };
  /* An elite's third card: one permanent upgrade, competing with the two relics
     rather than following them. A boss offers relics only. */
  const upOffer = kind === "elite" ? rollUpgradeOffer() : null;
  const cards = offer.map(id => card(id)).join("") +
    (upOffer ? upgradeCard(upOffer) : "") +
    (twin
      ? '<div class="shelfLabel">or the pair</div>' +
        '<button class="pick" data-pair="' + twin.join("|") +
        '" data-tip="relic" data-tip-id="' + twin[0] + '">' +
        '<span class="ph"><span class="pi">' + RELICS[twin[0]].glyph + RELICS[twin[1]].glyph + '</span>' +
        '<span class="pn">' + RELICS[twin[0]].name + " &amp; " + RELICS[twin[1]].name + '</span>' +
        '<span class="pmeta">BOTH YOURS</span></span>' +
        '<span class="pd">' + RELICS[twin[0]].desc + "<br>" + RELICS[twin[1]].desc + '</span></button>'
      : "");

  showScreenWithStatus('<div class="eyebrow" style="text-align:center">The elite falls · +' +
      gold + " " + TEXT.currencyShort + '</div>' +
    '<h1 class="win">Choose Your Reward</h1>' +
    '<p class="lede">' + (healed ? "You bind your wounds for " + healed + " HP. " : "") +
      RUN.hp + ' of ' + RUN.maxHP + ' HP carries onward. Mana does not travel.</p>' +
    '<div class="pick rare" style="pointer-events:none"><span class="ph">' +
      '<span class="pi">◆</span><span class="pn">A Veilglass shard</span>' +
      '<span class="pmeta">' + frag + ' ◆' + (rem ? " + " + rem + "/" +
        CONFIG.souls.shardsPerFragment : "") + '</span></span>' +
      '<span class="pd">' + (rem ? rem + " of " + CONFIG.souls.shardsPerFragment +
        " toward your next Veilglass." : "That makes a whole Veilglass — spend it in your tree.") +
      '</span></div>' +
    cards +
    '<button class="btn ghost" id="skipReward">Take nothing</button>');

  /* A single relic card takes that relic; the pair card takes both. Pressing a rare no
     longer silently hands over the twin instead, which it did before. */
  document.querySelectorAll("[data-r]").forEach(b =>
    b.addEventListener("click", () => takeReward(b.dataset.r)));
  document.querySelectorAll("[data-pair]").forEach(b =>
    b.addEventListener("click", () => takeReward(b.dataset.pair.split("|"))));
  document.querySelectorAll("[data-up]").forEach(b =>
    b.addEventListener("click", () => {
      UPGRADES[upOffer.id].take(upOffer.el);
      toast("<b>" + UPGRADES[upOffer.id].name + "</b> stays with you for the run.", 2600);
      afterNode();
    }));
  on("#skipReward", () => takeReward(null));
}
function takeReward(id){
  const taking = Array.isArray(id) ? id : (id ? [id] : []);
  taking.forEach(rid => {
    if (RUN.relics.includes(rid)) return;
    grantRelic(rid);
    if (RELICS[rid].onGain) RELICS[rid].onGain();
  });
  if (taking.length) applyRelicMaxHP();
  afterNode();
}

/* ONE permanent upgrade, drawn at random, to stand beside the two relics an elite
   offers. It is a THIRD option, not a second prize: three cards, one choice. */
function rollUpgradeOffer(){
  const pool = upgradeOffers();
  return pool.length ? rndOf(pool) : null;
}
function upgradeCard(o){
  const u = UPGRADES[o.id];
  return '<button class="pick" data-up="1" data-tip="upgrade" data-tip-id="' +
    o.id + (o.el ? ":" + o.el : "") + '">' +
    '<span class="ph"><span class="pi">' + u.glyph + '</span>' +
    '<span class="pn">' + u.name + (o.el ? " \u2014 " + EL[o.el].name : "") + '</span>' +
    '<span class="pmeta">PERMANENT</span></span>' +
    '<span class="pd">' + u.desc(o.el) + '</span></button>';
}


/* Rest between encounters. Without this the run is pure attrition: mana resets but
   HP does not, so the elite and boss are fought on whatever scraps remain. */
/* Healing between fights is GONE. Each act begins whole, and within it the only
   mending is a campfire, a vial, a relic, or a discipline that heals by design —
   the Necromancer's ledger, the Apothecary's draughts, the Alchemist's Quintessence.
   Without this a run gains health faster than creatures take it, and the whole
   difficulty curve is unmeasurable. */
function healBetweenEncounters(){
  const frac = CONFIG.rewards.healFraction;
  if (!frac) return 0;
  const before = RUN.hp;
  RUN.hp = Math.min(RUN.maxHP, RUN.hp + Math.round(RUN.maxHP * frac * ascHeal()));
  return RUN.hp - before;
}

function showSummary(won){
  const st = RUN.stats;
  const secs = Math.round((Date.now() - RUN.start)/1000);
  const fav = ELEMENTS.reduce((a,b) => st.useBy[a.id] >= st.useBy[b.id] ? a : b);
  const avgFirst = st.firstPerfect.length
    ? (st.firstPerfect.reduce((a,b)=>a+b,0) / st.firstPerfect.length).toFixed(1) : "—";
  /* The run is over, whichever way it went — there is nothing left to continue. */
  RUNSAVE.clear();
  /* Add this run into the lifetime tally BEFORE anything reads it, so an achievement
     earned on the last cast of a run is earned on the screen that follows it. */
  addToTally(st, won);
  SAVE.data.runs++;
  const wiz = RUN.wizard;
  SAVE.data.recordsBy = SAVE.data.recordsBy || {};
  const rec = SAVE.data.recordsBy[wiz] = SAVE.data.recordsBy[wiz] || { wins:0, runs:0, best:-1 };
  rec.runs++;
  if (won){
    SAVE.data.wins++;
    rec.wins++;
    /* A trial is earned by THIS craft, and only by carrying a run to the end at the
       tier it is standing on. */
    SAVE.data.ascensionUnlockedBy = SAVE.data.ascensionUnlockedBy || {};
    const have = ascMaxFor(wiz);
    if (RUN.ascension >= have && have < ASCENSION.length - 1)
      SAVE.data.ascensionUnlockedBy[wiz] = have + 1;
    /* The records a player actually chases: how far, how fast, how cleanly. */
    rec.best = Math.max(rec.best, RUN.ascension);
    /* An incantation IS a turn — stats.turns does not exist, and casts is the honest
       count of how many times the player had to ask. */
    const turns = st.casts || 0;
    const tk = "t" + RUN.ascension;
    rec[tk] = rec[tk] || {};
    if (!rec[tk].turns || turns < rec[tk].turns) rec[tk].turns = turns;
    if (!rec[tk].perfects || st.perfects > rec[tk].perfects) rec[tk].perfects = st.perfects;
    if (!rec[tk].taken || st.taken < rec[tk].taken) rec[tk].taken = st.taken;
  }
  SAVE.commit();

  const rows = [
    ["Encounters cleared", st.encounters],
    [TEXT.currency + " earned / spent", st.goldEarned + " / " + st.goldSpent],
    [TEXT.shop + "s visited", st.shopsVisited + (st.rerolls ? " (" + st.rerolls + " rerolls)" : "")],
    ["Elites taken / offered", st.elitesTaken + " / " + st.elitesOffered],
    ["Vials bought / used", st.potionsBought + " / " + st.potionsUsed],
    ["Incantations cast", st.casts],
    ["Shatters", st.perfects],
    ["Avg. turns to first Shatter", avgFirst],
    ["Fracture · Resonate · Resist", st.exploits + " · " + st.resonates + " · " + st.resists],
    ["Echoes revealed", st.echoes],
    ["Spells cast", st.spellsCast + (st.substitutions ? " (" + st.substitutions + " on foreign mana)" : "")],
    ["Damage dealt", st.dealt],
    ["Damage taken", st.taken],
    ["Favoured element", EL[fav.id].glyph + " " + fav.name],
    ["Relics gathered", RUN.relics.map(id => RELICS[id].glyph).join(" ")],
    ["Time", Math.floor(secs/60) + ":" + String(secs%60).padStart(2,"0")]
  ];
  const manaRows = ELEMENTS.filter(e => st.manaBy[e.id])
    .map(e => e.glyph + st.manaBy[e.id]).join("  ");
  showScreen(
    '<div class="eyebrow" style="text-align:center">' + (won ? "Run complete" : "The run ends") + '</div>' +
    '<h1 class="' + (won ? "win" : "lose") + '">' + (won ? "Archmage" : "You Fall") + '</h1>' +
    '<p class="lede">' + (won
      ? "The Dragon's core lies still, every rune read."
      : (B ? "It was " + glyphs(B.enemy.code) + ". So close." : "")) + '</p>' +
    '<div class="stats panel" style="padding:14px">' +
      rows.map(r => '<span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span>').join("") +
      '<span class="k">Mana attuned</span><span class="v">' + (manaRows || "—") + '</span>' +
    '</div>' +
    '<button class="btn" id="againBtn">Begin a new run</button>');
  $("#againBtn").addEventListener("click", showSchools);
}

/* ============================================================
   16b. ADVENTURE MAP
   ============================================================ */
function beginAct(actIndex){
  /* A run's kit is whatever the tree has bought, applied as the first act opens. */
  if (actIndex === 0 && RUN) applyTreeToRun();
  /* Each act begins whole. Deaths clustered in act 3 not because act 3 was harder —
     its creatures are no stronger than act 2's — but because a run arrived there
     already spent, with a healing budget of ~38 HP against 200+ of damage. Healing
     between acts makes each act a fair test of itself rather than of what came before. */
  if (RUN && actIndex > 0 && RUN.hp < RUN.maxHP && ascActHeal()){
    const back = RUN.maxHP - RUN.hp;
    RUN.hp = RUN.maxHP;
    RUN.stats.healedBetweenActs = (RUN.stats.healedBetweenActs || 0) + back;
  }
  RUN.act = actIndex;
  RUN.map = generateMap(actIndex);
  RUN.pos = null; RUN.rowIndex = -1;
  (actIndex === 0 ? mapOrTalents() : showMap());
}
function availableNodes(){
  if (RUN.rowIndex < 0) return RUN.map[0].map((n,i) => i);
  const cur = RUN.map[RUN.rowIndex][RUN.pos];
  return cur.to;
}
/* With fragments in hand and nothing yet chosen, the tree comes before the map:
   a run should not begin with an empty spellbook. */
function mapOrTalents(){
  if (RUN && !RUN.spells.length && fragmentsSpare(RUN.wizard) > 0){
    toast("Spend your Veilglass before you set out.", 3000);
    return showTalents("map");
  }
  showMap();
}

/* ============================================================================
   THE PATH — the map, seen over the wright's shoulder.
   The generator is untouched: still rows of nodes with `to` holding the columns
   each one reaches in the row below. What changes is only how the CURRENT choice is
   shown. Measured across 300 generated maps, a node reaches AT MOST THREE children —
   40 cases of three, never four — so a left/centre/right scene fits the graph exactly
   rather than approximating it. If that ever changes, extraChoices() below surfaces the
   rest instead of silently dropping a road.
   ============================================================================ */

/* Where a road sits, as a share of the scene. One set of anchors for every biome, so a
   new backdrop needs no new placement logic. */
/* A fallback only, for a table with no backdrops at all. */
const PATH_ANCHOR = () => ((LAYOUT.map.backdrops.forest || [])[0] || {}).anchors ||
  { 1:[{x:50,y:34}], 2:[{x:26,y:36},{x:74,y:36}],
    3:[{x:20,y:38},{x:50,y:32},{x:80,y:38}] };
const FARSEE_ANCHOR = () => LAYOUT.map.farsee;

/* Each region paints the same scene differently. The variant is chosen from run data,
   never at random, so walking back to a node shows the same forest. */
const BIOMES = {
  forest: { name:"The Wakeful Forest", art:"path-bg", variants:1 },
  cave:   { name:"The Seeping Deep",   art:"path-bg", variants:1 },
  beyond: { name:"Beyond the Portal",  art:"path-bg", variants:1 }
};
const ACT_BIOME = ["forest", "cave", "beyond"];

function biomeOf(act){ return BIOMES[ACT_BIOME[Math.min(act, ACT_BIOME.length - 1)]]; }

/* WHICH BACKDROP THE PLAYER IS STANDING IN.
   Chosen by how far along the road they are, so it changes at every node and the walk
   reads as a journey. Taken from position rather than at random, so stepping back to a
   node shows the same clearing it showed before. */
function backdropNow(){
  const sets = LAYOUT.map.backdrops || {};
  const region = ACT_BIOME[Math.min(RUN ? (RUN.act || 0) : 0, ACT_BIOME.length - 1)];
  /* a region with no art yet borrows the last one that has some, rather than showing
     nothing at all */
  let list = sets[region];
  if (!list || !list.length){
    for (let i = ACT_BIOME.indexOf(region) - 1; i >= 0; i--){
      const back = sets[ACT_BIOME[i]];
      if (back && back.length){ list = back; break; }
    }
  }
  if (!list || !list.length) return null;
  const step = RUN ? (RUN.rowIndex + 1) : 0;
  return list[step % list.length];
}
/* stable: the same act and row always pick the same variant */
function variantOf(act, row, count){
  if (count <= 1) return 0;
  let h = 2166136261;
  const key = (SAVE.data.seeded ? 1 : 0) + ":" + act + ":" + row;
  for (let i = 0; i < key.length; i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h) % count;
}

/* THE ROADS FROM HERE. Reads the graph and nothing else. */
function roadsFromHere(){
  const nextRow = RUN.rowIndex + 1;
  if (nextRow >= RUN.map.length) return [];
  if (RUN.rowIndex < 0) return RUN.map[0].map((n, c) => ({ col:c, node:n }));
  const here = RUN.map[RUN.rowIndex][RUN.pos];
  return (here.to || []).map(c => ({ col:c, node:RUN.map[nextRow][c] }))
                        .filter(r => r.node);
}
/* If the generator ever reaches beyond three, these are the roads the scene cannot
   place — surfaced rather than dropped. */
function extraChoices(roads){ return roads.length > 3 ? roads.slice(3) : []; }

/* WHAT A FAR SEE SHOWS: the children of each road, one layer only, and never
   selectable. The depth comes from run state so a relic could deepen it later. */
function farSeeDepth(){ return (RUN && RUN.farSee) || 1; }
function visionsFor(road){
  const row = RUN.rowIndex + 2;
  if (row >= RUN.map.length) return [];
  return (road.node.to || []).map(c => RUN.map[row][c]).filter(Boolean);
}

const PATH = { picked:null, seeing:false };

function showMap(){
  RUNSAVE.store();
  PATH.picked = null; PATH.seeing = false;
  drawPath();
}

/* THE BANNER NAMES ACT I AND THE WAKEFUL FOREST IN PAINT. True at the start of a run
   and false from the second act on, so the game asks whether the art still tells the
   truth and writes over the left cell when it does not. One banner per act would be the
   cleaner answer, and this holds until there is one. */
function pathBannerFits(){
  return RUN && RUN.act === 0 && biomeOf(0).name === "The Wakeful Forest";
}

function drawPath(){
  /* THE CARD'S PURPLE GRADIENT IS FOR A DIALOG, not for a place. dressStage does this
     for the title; the Path never asked. */
  { const sc = screen();
    if (sc && sc.classList) sc.classList.add("onPath"); }
  const roads = roadsFromHere();
  /* the anchors of the backdrop the player is actually standing in — `back` is
     resolved once, further down, where the art is taken from it too */
  const A = (backdropNow() && backdropNow().anchors) || PATH_ANCHOR();
  const anchors = A[Math.min(roads.length, 3)] || A[1];
  const biome = biomeOf(RUN.act);
  const back = backdropNow();
  const bg = artPath("ui", (back && back.art) || biome.art);
  const extra = extraChoices(roads);

  const seal = (r, i) => {
    const a = anchors[i] || anchors[anchors.length - 1];
    const art = artPath("ui", "node-" + r.node.type);
    const label = NODE_LABEL[r.node.type] || r.node.type;
    const chosen = PATH.picked === r.col;
    return '<button class="pSeal' + (chosen ? " on" : "") + '" data-col="' + r.col + '" ' +
      'aria-pressed="' + (chosen ? "true" : "false") + '" '  +
      'style="left:' + a.x + '%; top:' + a.y + '%" ' +
      'aria-label="' + label + '">' +
      (art ? '<img src="' + art + '" alt="">' 
           : '<span class="pGlyph">' + (NODE_ART[r.node.type] || "?") + '</span>') +
      '</button>' +
      /* the road itself, lit only when chosen */
      /* the lit road is scenery, not a control — it carried a data- attribute that made
         it look pressable to anything scanning the page, and pressing it did nothing */
      '<i class="pRoad' + (chosen ? " on" : "") + '" aria-hidden="true"' +
        ' style="left:' + a.x + '%; top:' + (a.y + 7) + '%"></i>';
  };

  const ghosts = () => {
    if (!PATH.seeing) return "";
    let out = "";
    roads.slice(0, 3).forEach((r, i) => {
      const a = anchors[i] || anchors[0];
      const kids = visionsFor(r);
      kids.forEach((k, j) => {
        const off = (j - (kids.length - 1) / 2) * FARSEE_ANCHOR().spread;
        const art = artPath("ui", "node-" + k.type);
        out += '<span class="pGhost" aria-hidden="true" style="left:' + (a.x + off) +
          '%; top:' + (a.y - FARSEE_ANCHOR().dy) + '%">' +
          (art ? '<img src="' + art + '" alt="">'
               : (NODE_ART[k.type] || "?")) + '</span>';
      });
    });
    return out;
  };

  const picked = PATH.picked != null
    ? roads.find(r => r.col === PATH.picked) : null;

  showScreen(
    '<div class="pScreen">' +
      /* THE BACKDROP, FULL BLEED. It was confined to a band in the middle with the
         card's purple gradient showing above and below it; a forest the player is
         walking through should reach the top and bottom of the screen. */
      (bg ? '<div class="pBack" aria-hidden="true" style="--sceneArt:url(' + bg +
            '); --sceneY:' + ((back && back.y != null ? back.y : 100)) + '%"></div>' : "") +

      /* ---- the fixed banner ---- */
      /* THE BANNER. Its lettering is painted in, so the game writes only the two
         values that change — beside their own icons — and nothing else.
         THE ACT AND THE REGION ARE PAINTED INTO IT TOO. That is right for Act I in the
         Wakeful Forest and wrong everywhere else, so they are written over the left
         cell ONLY when they no longer match what the art says. */
      (artPath("ui","path-banner-top")
        ? '<div class="pHud art">' +
            '<img class="pHudArt" src="' + artPath("ui","path-banner-top") + '" alt="">' +
            (pathBannerFits() ? "" :
              '<span class="pActLive">' + TEXT.act.toUpperCase() + " " + ROMAN[RUN.act + 1] +
              '<em>' + biome.name + '</em></span>') +
            '<span class="pCoin">' + RUN.gold + '</span>' +
            '<span class="pHeart">' + RUN.hp + "/" + RUN.maxHP + '</span>' +
          '</div>'
        : '<div class="pHud">' +
            '<span class="pAct">' + TEXT.act.toUpperCase() + " " + ROMAN[RUN.act + 1] +
              '<em>' + biome.name + '</em></span>' +
            '<span class="pWhere">' + TEXT.map + '</span>' +
            '<span class="pVitals">' +
              '<b>' + TEXT.currencyShort + " " + RUN.gold + '</b>' +
              '<b class="hp">' + RUN.hp + "/" + RUN.maxHP + '</b>' +
            '</span>' +
          '</div>') +

      /* ---- the scene ---- */
      '<div class="pScene">' +
        '<div class="pSky" aria-hidden="true"></div>' +
        ghosts() +
        roads.slice(0, 3).map(seal).join("") +
        (artPath("ui","path-wright")
          ? '<img class="pWright" src="' + artPath("ui","path-wright") + '" alt="">'
          : '<div class="pWright glyph">\ud83e\uddd9</div>') +

      /* ---- choose, then commit. INSIDE the scene, floating over its lower edge,
              which is where the reference puts it — and there it costs no height, so
              the scene keeps the 72% of the screen the composition wants. ---- */
      '<div class="pChoose">' +
        '<button class="pFar' + (artPath("ui","path-farsee") ? " art" : "") +
          '" id="pFar" aria-label="Far See — hold to look ahead">' +
          (artPath("ui","path-farsee")
            ? '<img src="' + artPath("ui","path-farsee") + '" alt="">' : "\u25c9") +
          '<em>Far see</em></button>' +
        '<div class="pPlaque' + (artPath("ui","path-plaque") ? " art" : "") + '">' +
          (picked
            ? '<span class="pPickIcon">' + (artPath("ui","node-" + picked.node.type)
                ? '<img src="' + artPath("ui","node-" + picked.node.type) + '" alt="">'
                : (NODE_ART[picked.node.type] || "")) + '</span>' +
              '<span class="pPickName">' + (NODE_LABEL[picked.node.type] || picked.node.type) + '</span>'
            : '<span class="pPickName none">Choose a road</span>') +
        '</div>' +
        '<button class="pGo' + (artPath("ui","path-button") ? " art" : "") + '" id="pGo"' +
          (picked ? "" : " disabled") + '>Confirm</button>' +
      '</div>' +
      '</div>' +

      (extra.length
        ? '<div class="pExtra">' + extra.length + ' further road' +
          (extra.length === 1 ? "" : "s") + ' lead from here — ' +
          extra.map(r => NODE_LABEL[r.node.type] || r.node.type).join(", ") +
          '. Tap to take one.' +
          extra.map(r => '<button class="pExtraBtn" data-col="' + r.col + '">' +
            (NODE_LABEL[r.node.type] || r.node.type) + '</button>').join("") + '</div>'
        : "") +

      /* ---- what the seals mean ---- */
      /* THE LEGEND IS PURE ART — six seals and six names, all painted. The game draws
         nothing over it; a list of labels would double every word. */
      (artPath("ui","path-legend")
        ? '<img class="pLegendArt" src="' + artPath("ui","path-legend") +
          '" alt="' + ["enemy","elite","shop","rest","treasure","boss"]
            .map(t => NODE_LABEL[t] || t).join(", ") + '">'
        : '<div class="pLegend">' +
            ["enemy","elite","shop","rest","treasure","boss"].map(t =>
              '<span><i>' + (artPath("ui","node-" + t)
                ? '<img src="' + artPath("ui","node-" + t) + '" alt="">'
                : (NODE_ART[t] || "")) + '</i>' + (NODE_LABEL[t] || t) + '</span>').join("") +
          '</div>') +

      /* ---- the four ways out ---- */
      /* THE TOOLS, at the very bottom. Their names are painted into the banner, so the
         four controls are invisible hit areas over it carrying an accessible name —
         a visible label would print each word twice. */
      (artPath("ui","path-tools")
        ? '<div class="pTools art" style="--toolArt:url(' + artPath("ui","path-tools") + ')">' +
            ["character","spells","talents","settings"].map(k =>
              '<button data-go="' + k + '" aria-label="' +
              k.charAt(0).toUpperCase() + k.slice(1) + '"></button>').join("") +
          '</div>'
        : '<div class="pTools">' +
            '<button data-go="character">Character</button>' +
            '<button data-go="spells">Spells</button>' +
            '<button data-go="talents">Talents</button>' +
            '<button data-go="settings">Settings</button>' +
          '</div>') +
    '</div>');

  /* ---- choosing does not commit ---- */
  document.querySelectorAll("[data-col]").forEach(b =>
    b.addEventListener("click", () => {
      PATH.picked = parseInt(b.dataset.col, 10);
      drawPath();
    }));
  on("#pGo", () => {
    if (PATH.picked == null || PATH.busy) return;
    PATH.busy = true;                       /* a second tap must not enter twice */
    const col = PATH.picked;
    PATH.picked = null;
    enterNode(col);
    PATH.busy = false;
  });

  /* ---- FAR SEE is HELD, not toggled ---- */
  {
    const f = $("#pFar");
    if (f){
      const open = e => { if (e) e.preventDefault(); PATH.seeing = true; drawPath(); };
      const shut = () => { if (PATH.seeing){ PATH.seeing = false; drawPath(); } };
      f.addEventListener("pointerdown", open);
      f.addEventListener("pointerup", shut);
      f.addEventListener("pointerleave", shut);
      f.addEventListener("pointercancel", shut);
      /* a keyboard cannot hold, so it toggles */
      f.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") open(e); });
      f.addEventListener("keyup", shut);
    }
  }

  document.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => {
      const w = b.dataset.go;
      if (w === "character") showCharacter("map");
      /* THE LOADOUT, NOT THE SPELLBOOK. showSpellbook is the read-only summary
         of everything the wright has ever learned — "Your accumulated magic" —
         which belonged to the title screen. showLoadout is where the player
         CHOOSES which spells they carry into the next fight, and it was
         reachable from nowhere: its only callers were its own two buttons, so
         nothing in the game opened it. From the road, mid-run, the useful
         screen is the one that changes what you are carrying. */
      else if (w === "spells") showLoadout("map");
      else if (w === "talents") showTalents("map");
      /* said plainly. It happened to work — showSettings falls back to the map whenever
         a run exists — but a screen should be told where it was opened from rather than
         inferring it from whether a run is in progress. */
      else showSettings("map");
    }));

  applyLayout("map");
}

function enterNode(col){
  RUN.rowIndex++; RUN.pos = col;
  const node = RUN.map[RUN.rowIndex][col];
  node.visited = true;
  if (node.type === "elite") RUN.stats.elitesTaken++;
  if (node.type === "shop") return openShop();
  if (node.type === "rest") return showRest();
  if (node.type === "treasure") return showTreasure();
  startEncounter(node.type);
}
function afterNode(){
  /* A halved Sanctum is halved once. */
  if (RUN.shop.halfPrice && RUN.node && RUN.node.type === "shop") RUN.shop.halfPrice = false;
  if (RUN.rowIndex >= RUN.map.length - 1){
    if (RUN.act + 1 < ACTS.length) beginAct(RUN.act + 1);
    else showSummary(true);
    return;
  }
  showMap();
}

/* Between-node reward: currency, a rest, and a relic pick on elites only —
   normal fights pay in currency so the Sanctum has something to sell against. */
function showNodeReward(gold){
  const healed = healBetweenEncounters();      // 0 unless a discipline earns it
  /* A creature sometimes leaves a vial behind. Nine ordinary fights a run gave nothing
     but coin, which is a long stretch of no surprises — and vials otherwise come only
     from the Sanctum. Not if the satchel is full: an unclaimable prize is worse than
     none. */
  let dropped = null;
  if (Math.random() < CONFIG.economy.vialDropChance &&
      RUN.potions.length < potionCapacity()){
    dropped = randomPotionId();
    grantPotion(dropped);
    renderPotions();
  }
  const isElite = RUN.currentNodeType === "elite";
  if (!isElite){
    showScreenWithStatus('<div class="eyebrow" style="text-align:center">Victory</div>' +
      '<h1 class="win">+' + gold + " " + TEXT.currencyShort + '</h1>' +
      '<p class="lede">' + (healed ? "You bind your wounds for " + healed + " HP. " : "") +
        RUN.hp + " of " + RUN.maxHP + ' HP carries onward.</p>' +
      (dropped ? '<div class="pick" style="pointer-events:none"><span class="ph">' +
        '<span class="pi">' + POTIONS[dropped].glyph + '</span>' +
        '<span class="pn">' + POTIONS[dropped].name + '</span>' +
        '<span class="pmeta">LEFT BEHIND</span></span>' +
        '<span class="pd">' + POTIONS[dropped].desc + '</span></div>' : "") +
      '<button class="btn" id="onward">Return to ' + TEXT.map.toLowerCase() + '</button>');
    on("#onward", afterNode);
    return;
  }
  showReward("rare", gold, healed);
}

/* ============================================================
   16b2. REST / TREASURE / EVENT NODES
   ============================================================ */
function showRest(){
  RUN.stats.nodesByType.rest = (RUN.stats.nodesByType.rest || 0) + 1;
  const heal = Math.round(RUN.maxHP * 0.4 * ascHeal());
  showScreenWithStatus(
    '<div class="eyebrow" style="text-align:center">A guttering fire</div>' +
    '<h1>Campfire</h1>' +
    '<p class="lede">The road is quiet here. Choose one.</p>' +
    '<button class="pick" data-rest="heal" data-tip="player"><span class="ph"><span class="pi">❤</span>' +
      '<span class="pn">Rest</span></span><span class="pd">Recover ' + heal + ' HP.</span></button>' +
    '<button class="pick" data-rest="study" data-tip="loadout"><span class="ph"><span class="pi">📖</span>' +
      '<span class="pn">Study</span></span><span class="pd">Strengthen one spell, as the Sanctum would.</span></button>' +
    '<button class="pick" data-rest="brew" data-tip="glossary" data-tip-id="Resources"><span class="ph"><span class="pi">🧪</span>' +
      '<span class="pn">Brew</span></span><span class="pd">Take two random vials.</span></button>');
  document.querySelectorAll("[data-rest]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.rest;
    if (k === "heal"){ healPlayer(heal + relicSum("restBonus")); restBrews(); afterNode(); }
    else if (k === "brew"){
      for (let i=0;i<2;i++) if (!grantPotion(randomPotionId(), {quiet:true})) break;
      restBrews();
      afterNode();
    } else {
      restBrews();
      const targets = RUN.spells.filter(id => SPELLS[id].potencyStep);
      if (!targets.length){ toast("No spell of yours can be strengthened.", 2000); return; }
      openChoice("Study", "Choose a spell to strengthen.",
        targets.map(id => ({ v:id, glyph:SPELLS[id].glyph, sub:SPELLS[id].name.toUpperCase() })),
        id => { RUN.shop.potency[id] = (RUN.shop.potency[id]||0) + 1; afterNode(); });
    }
  }));
}

/* Sediment turns a brew you have no room for into money rather than nothing. */
function brewInto(list){
  if (grantPotion(randomPotionId(), {quiet:true})) return true;
  const gold = relicSum("brewOverflowGold");
  if (gold){
    RUN.gold += gold; RUN.stats.goldEarned += gold; renderPurse();
    toast("<b>Sediment</b> — the overflow is worth " + gold + " " + TEXT.currency + ".", 2000);
  }
  return false;
}
/* Sleepless brews at a campfire whatever else was chosen there. */
function restBrews(){
  const n = relicSum("restBrews");
  let made = 0;
  for (let i = 0; i < n && RUN.potions.length < potionCapacity(); i++){
    if (!grantPotion(randomPotionId(), {quiet:true})) break; made++;
  }
  if (made) toast("<b>Sleepless</b> — " + made + " vial" + (made===1?"":"s") + " brewed by the fire.", 2200);
}
function showTreasure(){
  RUN.stats.nodesByType.treasure = (RUN.stats.nodesByType.treasure || 0) + 1;
  /* A treasure is now a DECISION rather than a handout: a relic, a purse, or two
     vials. Which one a run wants says something about how it is going. */
  const gold = 120 + Math.floor(Math.random() * 60);
  const pool = REWARD_POOL.filter(id => !RUN.relics.includes(id));
  const relic = pool.length ? weightedSample(pool, 1, relicRarity)[0] : null;
  const vials = [randomPotionId(), randomPotionId()];
  const room = potionCapacity() - RUN.potions.length;

  const card = (key, glyph, name, tag, desc, dim, tip, tipId) =>
    '<button class="pick' + (dim ? " broke" : "") + '" data-tre="' + key + '"' +
    (tip ? ' data-tip="' + tip + '" data-tip-id="' + tipId + '"' : "") + '>' +
    '<span class="ph"><span class="pi">' + glyph + '</span><span class="pn">' + name + '</span>' +
    '<span class="pmeta">' + tag + '</span></span>' +
    '<span class="pd">' + desc + '</span></button>';

  showScreenWithStatus(
    '<div class="eyebrow" style="text-align:center">Left behind</div>' +
    '<h1 class="win">\ud83c\udf81 Treasure</h1>' +
    '<p class="lede">Someone did not need this any more. Take one thing.</p>' +
    (relic ? card("relic", RELICS[relic].glyph, RELICS[relic].name,
                  relicRarity(relic).toUpperCase(), RELICS[relic].desc, false,
                  "relic", relic) : "") +
    card("gold", "\u2726", gold + " " + TEXT.currency, "COIN",
         "Enough to matter at the next Sanctum.", false, "aurels") +
    /* Both vials described in full, not merely named: this was the choice the player
       could not actually make. Each also carries its own long press. */
    card("vials", POTIONS[vials[0]].glyph + POTIONS[vials[1]].glyph,
         "Two vials", room >= 2 ? "TWO" : room === 1 ? "ONLY ROOM FOR ONE" : "SATCHEL FULL",
         '<b>' + POTIONS[vials[0]].name + '</b> — ' + POTIONS[vials[0]].desc + '<br>' +
         '<b>' + POTIONS[vials[1]].name + '</b> — ' + POTIONS[vials[1]].desc +
         (room < 2 ? '<br><i>Your satchel holds ' + potionCapacity() + '.</i>' : ""),
         room < 1, "potion", vials[0]) +
    '<button class="btn ghost" id="trGo">Leave it all</button>');

  document.querySelectorAll("[data-tre]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.tre;
    if (k === "relic" && relic){
      grantRelic(relic);
      if (RELICS[relic].onGain) RELICS[relic].onGain();
      applyRelicMaxHP();
      toast(RELICS[relic].glyph + " <b>" + RELICS[relic].name + "</b> is yours.", 2400);
    } else if (k === "gold"){
      RUN.gold += gold; RUN.stats.goldEarned += gold;
      toast("+" + gold + " " + TEXT.currency + ".", 2000);
    } else if (k === "vials"){
      if (potionCapacity() - RUN.potions.length < 1){
        toast("Your satchel has no room.", 1800); return;
      }
      let took = 0;
      vials.forEach(id => { if (grantPotion(id, {quiet:true})) took++; });
      toast("You pocket " + took + " vial" + (took === 1 ? "" : "s") + ".", 2000);
    }
    afterNode();
  }));
  on("#trGo", afterNode);
}
function openShop(){
  RUN.stats.shopsVisited++;
  RUN.shopRerolls = 0;
  RUN.soldThisShop = false; RUN.askedThisShop = false;
  RUN.asksThisShop = 0;
  RUN.boughtRelicThisShop = false;              // cleared on ARRIVING, never on rerolling
  RUN.shopStock = rollStock();
  renderShop();
}
/* Which vials mend the drinker in some way. Read from the vial itself so a new
   healing vial is understood without being named here. */
function isMender(potionId){
  const p = POTIONS[potionId];
  if (!p) return false;
  return /heal|restor|mend|health returns|to full|maximum health/i.test(p.desc || "");
}

function rollStock(){
  const weight = { common:5, uncommon:3, rare:1 };
  const drawFrom = (keys) => {
    const bag = [];
    keys.forEach(k => { const r = (SHOP_ITEMS[k] || {}).rarity || "common";
      for (let i = 0; i < weight[r]; i++) bag.push(k); });
    return bag.length ? bag[Math.floor(Math.random()*bag.length)] : null;
  };
  const stock = [];
  const take = (keys) => {
    for (let tries = 0; tries < 40; tries++){
      const pick = drawFrom(keys.filter(k => !stock.includes(k)));
      if (!pick) return false;
      stock.push(pick); return true;
    }
    return false;
  };

  const usable = Object.keys(SHOP_ITEMS).filter(k => {
    const it = SHOP_ITEMS[k];
    return true;
  });
  const vials   = usable.filter(k => SHOP_ITEMS[k].potion);
  const menders = vials.filter(k => isMender(SHOP_ITEMS[k].potion));
  const others  = usable.filter(k => !SHOP_ITEMS[k].potion);

  /* One slot is always something that mends — healing is now the scarcest thing in the
     game and the Sanctum was the only place that could not sell it. Rarity still
     decides WHICH mender, so the guarantee costs nothing in variety. */
  if (menders.length) take(menders);

  const wantVials = CONFIG.economy.shopVials + relicSum("shopExtra");   // Broker's Nod
  while (stock.length < wantVials && take(vials)) {}
  /* whatever is left of the vial slots goes to the odd non-vial item */
  while (stock.length < wantVials && take(others)) {}

  /* ---- and the relics ---- */
  const held = new Set(RUN.relics || []);
  const offer = REWARD_POOL.filter(id => !held.has(id) && !(RUN.shopRelicsSold||[]).includes(id));
  const relicBag = [];
  offer.forEach(id => { const r = RELICS[id].rarity || "common";
    for (let i = 0; i < weight[r]; i++) relicBag.push(id); });
  const relics = [];
  for (let tries = 0; tries < 60 && relics.length < CONFIG.economy.shopRelics; tries++){
    const pick = relicBag[Math.floor(Math.random()*relicBag.length)];
    if (pick && !relics.includes(pick)) relics.push(pick);
    if (relics.length >= new Set(relicBag).size) break;
  }
  RUN.shopRelicStock = relics;
  return stock;
}

/* A relic's price follows its rarity, so what you pay says what you are getting. */
function actPriceScale(){
  const t = CONFIG.economy.actPrice;
  return t[Math.min(RUN.act || 0, t.length - 1)];
}
function relicPrice(id){
  const base = CONFIG.economy.relicPrice[(RELICS[id] || {}).rarity || "common"];
  /* The Merchant's Seal says "everything in the Sanctum" and meant it — but this
     function was written when relics were not for sale, so the Alchemist's own relic
     quietly excluded the most expensive things on the shelf. */
  return Math.round(base * actPriceScale() *
                    (hasRelic("merchants_seal") ? 0.8 : 1) *
                    (RUN.shop.halfPrice ? 0.5 : 1) * ascPrice());
}
function rerollCost(){
  /* Flat: the second ask costs the same as the first, because the prize is BEING
     ALLOWED to ask again, not paying less for it. */
  return Math.round(CONFIG.economy.rerollBase * ascPrice());
}
/* A relic bought is a relic gained: the same path a reward takes, so onGain hooks and
   max-HP relics behave identically however they arrived. */
function buyRelic(id){
  const r = RELICS[id];
  if (!r || RUN.relics.includes(id)) return;
  if (RUN.boughtRelicThisShop){
    toast("The keeper parts with one relic a visit, and no more.", 2400);
    return;
  }
  const price = relicPrice(id);
  if (RUN.gold < price){ toast("Not enough " + TEXT.currency + ".", 1600); return; }
  RUN.gold -= price; RUN.stats.goldSpent += price;
  grantRelic(id);
  if (r.onGain) r.onGain();
  applyRelicMaxHP();
  RUN.boughtRelicThisShop = true;
  RUN.shopRelicsSold = (RUN.shopRelicsSold || []).concat(id);
  RUN.shopRelicStock = (RUN.shopRelicStock || []).filter(x => x !== id);
  RUN.stats.purchases[id] = (RUN.stats.purchases[id] || 0) + 1;
  playSfx("buy");
  toast(r.glyph + " <b>" + r.name + "</b> is yours.", 2400);
  renderShop();
}

function renderShop(){
  /* Wares stand in lit alcoves, the way a keeper would set them out — the glyph large,
     the name beneath it, and the price on its own plaque. What each one DOES lives
     behind a long press, so the shelf reads as a shelf. */
  const ware = (key, glyph, name, price, rarity, tipKind, afford) =>
    '<button class="ware ' + rarity + (afford ? "" : " broke") + '" data-' + key + '' +
    ' data-tip="' + tipKind + '" data-tip-id="' + key.split("=")[1].replace(/"/g,"") + '">' +
    '<span class="wareArt">' + glyph + '</span>' +
    '<span class="wareName">' + name + '</span>' +
    '<span class="warePrice">' + TEXT.currencyShort + " " + price + '</span></button>';

  const cards = RUN.shopStock.map(k => {
    const it = SHOP_ITEMS[k];
    return ware('buy="' + k + '"', it.glyph, it.name, itemPrice(it),
                it.rarity, "ware", RUN.gold >= itemPrice(it));
  }).join("");

  /* Relics, priced by rarity, none of them already yours. */
  const spent = !!RUN.boughtRelicThisShop;
  const relicCards = (RUN.shopRelicStock || []).map(id => {
    const r = RELICS[id], price = relicPrice(id);
    return ware('buyrelic="' + id + '"', icon("relic", id), r.name, price,
                r.rarity || "common", "wareRelic", RUN.gold >= price && !spent);
  }).join("");

  const askCost = rerollCost();
  const asksAllowed = 1 + relicSum("extraAsk");        // Cracked Vault
  const canAsk = (RUN.asksThisShop || 0) < asksAllowed;
  showScreenWithStatus(
    '<div class="eyebrow" style="text-align:center">' + TEXT.shopkeeper + '</div>' +
    '<h1>' + TEXT.shop + '</h1>' +
    '<div class="purse">' + TEXT.currencyShort + " " + RUN.gold + ' · ❤ ' + RUN.hp + "/" + RUN.maxHP +
      ' · ' + TEXT.potions + " " + RUN.potions.length + "/" + potionCapacity() + '</div>' +
    '<div class="stall">' +
      '<div class="stallKeeper">' +
        '<span class="keeperArt">' + TEXT.shopkeeperGlyph + '</span>' +
        '<span class="keeperLine">' + rndOf(TEXT.shopkeeperLines) + '</span>' +
      '</div>' +
      '<div class="shelfLabel">Vials</div>' +
      '<div class="shelf">' + cards + '</div>' +
      (relicCards
        ? '<div class="shelfLabel">Relics' +
          (spent ? ' <em>— one a visit, and yours is taken</em>' : '') + '</div>' +
          '<div class="shelf relics">' + relicCards + '</div>'
        : "") +
      (canAsk
        ? '<button class="askAgain" id="rerollBtn">' +
          '<span class="askTurn">\u27f3</span>' +
          '<span class="askText">Do you have anything else&hellip;?</span>' +
          '<span class="askPrice">' + TEXT.currencyShort + " " + askCost + '</span></button>'
        : '<div class="shelfNote">The keeper spreads empty hands.</div>') +
      /* A NAMED HOME FOR THE SELL BUTTON. It used to be appended to
         #rerollBtn.parentNode — but the reroll is OPTIONAL: when the keeper has
         nothing left to offer it is not rendered at all, and then the sell
         button had nowhere to go and silently did not appear. A container that
         is always present cannot do that. */
      '<div id="shopActions"></div>' +
    '</div>' +
    '<button class="btn" id="leaveShop">Leave</button>');
  document.querySelectorAll("[data-buy]").forEach(b =>
    b.addEventListener("click", () => buyItem(b.dataset.buy)));
