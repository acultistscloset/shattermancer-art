  document.querySelectorAll("[data-buyrelic]").forEach(b =>
    b.addEventListener("click", () => buyRelic(b.dataset.buyrelic)));
  const askBtn = $("#rerollBtn");
  if (askBtn) askBtn.addEventListener("click", () => {
    const c = rerollCost();
    if (RUN.gold < c){ toast("Not enough " + TEXT.currency + ".", 1600); return; }
    RUN.gold -= c; RUN.stats.goldSpent += c; RUN.stats.rerolls++;
    /* Counted, not latched: a shop you can reroll indefinitely is a search rather
       than a choice, but Cracked Vault buys one more look. */
    RUN.asksThisShop = (RUN.asksThisShop || 0) + 1;
    RUN.askedThisShop = true;
    RUN.shopRerolls++;
    RUN.shopStock = rollStock();
    renderShop();
  });
  /* Fence's Contact: a relic can be turned back into money, which is the only way
     the game lets a choice be undone. */
  const sellFor = relicMax("sellRelic");
  if (sellFor && !RUN.soldThisShop){
    const sellable = RUN.relics.filter(id => !RELICS[id].starting);
    if (sellable.length){
      const btn = document.createElement("button");
      btn.className = "btn ghost";
      btn.id = "sellRelicBtn";
      btn.textContent = "Sell a relic (" + sellFor + " " + TEXT.currency + ")";
      const host = $("#shopActions");
      if (host) host.appendChild(btn);
      btn.addEventListener("click", () => {
        openChoice("Fence's Contact", "Which relic will you part with?",
          sellable.map(id => ({ v:id, glyph:RELICS[id].glyph, sub:RELICS[id].name.toUpperCase() })),
          id => {
            RUN.relics = RUN.relics.filter(r => r !== id);
            RUN.gold += sellFor; RUN.stats.goldEarned += sellFor;
            RUN.soldThisShop = true;
            applyRelicMaxHP(); renderPurse(); renderShop();
            toast(RELICS[id].name + " is gone, and " + sellFor + " " + TEXT.currency + " is yours.", 2600);
          });
      });
    }
  }
  $("#leaveShop").addEventListener("click", afterNode);
}
/* Potency only offers spells with a number to raise; Efficiency works on anything.
   Previously the Sanctum sold Potency for spells that silently ignored it. */
function potencyTargets(k){
  if (k === "potency") return RUN.spells.filter(id => SPELLS[id].potencyStep);
  return RUN.spells.slice();
}
function defaultPickFor(k){
  const it = SHOP_ITEMS[k];
  if (it.pick === "element") return ELEMENTS[0].id;
  if (it.pick === "spell") return potencyTargets(k)[0];
  return null;
}
function itemPrice(it){
  /* Toll Draught halves everything for one visit, and is spent on leaving. */
  const toll = RUN.shop.halfPrice ? 0.5 : 1;
  return Math.round(it.cost * actPriceScale() *
                    (hasRelic("merchants_seal") ? 0.8 : 1) * ascPrice() * toll);
}
function buyItem(k){
  const it = SHOP_ITEMS[k];
  if (RUN.gold < itemPrice(it)){ toast("Not enough " + TEXT.currency + ".", 1600); return; }
  if (it.potion && RUN.potions.length >= potionCapacity()){
    toast("You can carry only " + potionCapacity() + " " + TEXT.potions.toLowerCase() + ".", 2000);
    return;
  }
  const complete = arg => {
    const price = itemPrice(it);
    RUN.gold -= price; RUN.stats.goldSpent += price;
    RUN.stats.purchases[k] = (RUN.stats.purchases[k] || 0) + 1;
    if (it.potion){ grantPotion(it.potion); RUN.stats.potionsBought++; }
    else it.buy(arg);
    RUN.shopStock = RUN.shopStock.filter(x => x !== k);
    renderShop();
    toast("Acquired <b>" + it.name + "</b>.", 1800);
  };
  if (!it.pick) return complete();
  const targets = potencyTargets(k);
  if (it.pick === "spell" && !targets.length){
    toast("None of your spells can be strengthened that way.", 2200); return;
  }
  const opts = it.pick === "element"
    ? ELEMENTS.map(e => ({ v:e.id, glyph:e.glyph, sub:e.name.toUpperCase() }))
    : targets.map(id => ({ v:id, glyph:SPELLS[id].glyph, sub:SPELLS[id].name.toUpperCase() }));
  openChoice(it.name, it.pick === "element" ? "Choose an element." : "Choose a spell.", opts, complete);
}

/* Generic chooser reusing the picker overlay. The pending callback is held in
   state rather than closure so the choice can be resolved from anywhere — which
   keeps it consistent with openPicker and makes it drivable in tests. */
let choiceState = null;
function openChoice(title, prompt, options, done){
  choiceState = { done };
  const box = $("#pickerBox");
  box.innerHTML = '<h2>' + title + '</h2><p>' + prompt + '</p><div class="opts">' +
    options.map(o => '<button class="opt" data-v="' + o.v + '">' + o.glyph +
      '<span class="sub">' + o.sub + '</span></button>').join("") +
    '</div><button class="btn ghost" id="pickCancel">Cancel</button>';
  $("#picker").classList.add("show");
  box.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => chooseValue(b.dataset.v)));
  on("#pickCancel", () => { choiceState = null; closePicker(); });
}
function chooseValue(v){
  const cb = choiceState && choiceState.done;
  choiceState = null;
  closePicker();
  if (cb) cb(v);
}

/* ============================================================
   16d. POTIONS (run-specific consumables)
   ============================================================ */
/* ============================================================================
   THE CAPS, AND WHAT HAPPENS AT THEM.  Kerry, 2026-08-25: relics cap at 8,
   vials at 6, and a full satchel asks which one to give up.

   ONE DOOR EACH. Vials were pushed at fifteen sites and relics at four, each
   with its own capacity check — and one path had none at all. A prompt is a
   CHOICE, and a choice cannot be bolted onto a push: the code that asked has
   moved on before an answer arrives. Everything routes through grantPotion and
   grantRelic; the prompt lives in one place and the rule is stated once.

   Mid-fight there is no room for a modal over the board, so a grant is HELD
   until the fight ends. The player is told. Nothing is lost.
   ============================================================================ */
const CAPS = { relics:8, potions:6 };
let PENDING_GRANTS = [];

function grantPotion(id, opts){
  if (!id) return false;
  const cap = Math.min(CAPS.potions, potionCapacity());
  if (RUN.potions.length < cap){ RUN.potions.push(id); renderPotions(); return true; }
  if (opts && opts.quiet) return false;
  askDiscard("potion", id);
  return true;
}

function grantRelic(id, opts){
  if (!id) return false;
  if (RUN.relics.length < CAPS.relics){
    RUN.relics.push(id);
    if (typeof renderRelics === "function" && $("#relicStrip")) renderRelics();
    return true;
  }
  if (opts && opts.quiet) return false;
  askDiscard("relic", id);
  return true;
}

function askDiscard(kind, incoming){
  const inFight = (typeof B === "object" && B && B.enemy && !B.over);
  const TABLE = kind === "relic" ? RELICS : POTIONS;
  const inName = (TABLE[incoming] || {}).name || incoming;
  const where = kind === "relic" ? "reliquary" : "satchel";
  if (inFight){
    PENDING_GRANTS.push([kind, incoming]);
    if (typeof toast === "function") toast(inName + " waits until the fight ends — your " + where + " is full.", 2600);
    return;
  }
  const held = kind === "relic" ? RUN.relics : RUN.potions;
  openPicker("list", "Your " + where + " is full",
    "Give one up to take " + inName + ", or decline it.",
    (i) => {
      if (i === null || i === undefined || isNaN(i)) return;   /* declined */
      held.splice(i, 1); held.push(incoming);
      if (kind === "relic" && typeof renderRelics === "function" && $("#relicStrip")) renderRelics();
      else renderPotions();
    },
    held.map(id => ({ label:(TABLE[id] || {}).name || id, glyph:(TABLE[id] || {}).glyph || "" })));
}

/* offered the moment the board is free */
function flushPendingGrants(){
  if (!PENDING_GRANTS.length) return;
  const [kind, id] = PENDING_GRANTS.shift();
  askDiscard(kind, id);
}

function renderPotions(){
  /* SOCKETS, not a tray. Six at most (Kerry, 2026-08-25 — display cap; the
     gameplay cap and its discard prompt are a separate approved task), three
     flanking each side of CAST, filled from the left. Empty sockets DRAW as
     empty sockets: a fixed frame the vials land in reads as capacity, where the
     old tray grew and shrank as you drank. Capacity below six shows fewer
     sockets rather than sockets you cannot fill. */
  const L = $("#potionsL"), R = $("#potionsR");
  if (!L || !R){
    /* the pre-castRow layout, kept alive for anything that still shows it */
    const host = $("#potionTray");
    if (!host) return;
    host.innerHTML = "";
    RUN.potions.forEach((p, i) => host.appendChild(potionButton(p, i)));
    return;
  }
  L.innerHTML = ""; R.innerHTML = "";
  /* ALWAYS 3+3 (Kerry, 2026-08-25). Capacity below six dims the far sockets
     rather than removing them — a fixed frame, filled from the left, so the
     row reads the same whoever is playing and 2-left/1-right lopsidedness
     cannot happen. Vials land in index order: L takes 0-2, R takes 3-5. */
  const cap = Math.min(6, typeof potionCapacity === "function" ? potionCapacity() : 6);
  for (let s = 0; s < 6; s++){
    const cell = document.createElement("span");
    cell.className = "psock" + (s >= cap ? " beyond" : "");
    if (s < cap && s < RUN.potions.length) cell.appendChild(potionButton(RUN.potions[s], s));
    (s < 3 ? L : R).appendChild(cell);
  }
}
function potionButton(pid, i){
  const def = POTIONS[pid];
  const b = document.createElement("button");
  b.className = "potion";
  b.dataset.tip = "potion"; b.dataset.tipId = pid;
  b.innerHTML = '<span class="pg">' + def.glyph + '</span>';
  b.title = def.name;
  b.disabled = B.busy || B.over;
  b.addEventListener("click", () => usePotion(i));
  return b;
}
function usePotion(i){
  if (B && B.flags) B.flags.vialsDrunk = (B.flags.vialsDrunk || 0) + 1;   // Miser's Flask
  /* Cork Press sometimes leaves the vial behind; Bitter Dregs thickens what it heals.
     Both are decided here, because a vial's own use() cannot know it came from a vial. */
  const keep = Math.random() < relicMax("keepChance");
  playSfx("vial");
  const key = RUN.potions[i], def = POTIONS[key];
  if (!def || B.busy || B.over) return;
  const usedThisTurn = B.perTurn.potions || 0;
  if (usedThisTurn >= CONFIG.economy.potionsPerTurn){
    toast("You can drink only " + CONFIG.economy.potionsPerTurn + " vials in a turn.", 2000);
    return;
  }
  if (def.ready && !def.ready()){ toast(def.hint || "Not now.", 1800); return; }
  const finish = arg => {
    if (!keep) RUN.potions.splice(i, 1);
    RUN.stats.potionsUsed++;
    B.perTurn.potions = (B.perTurn.potions || 0) + 1;
    const doubled = B.flags.catalysis;
    if (doubled) B.flags.catalysis = false;
    B.flags.drinkingVial = true;               // Bitter Dregs thickens the healing
    let msg = def.use(arg);
    if (doubled){ def.use(arg); msg += "<br><i>Catalysed — it takes hold twice.</i>"; }
    B.flags.drinkingVial = false;
    if (keep){
      msg += "<br><i>Cork Press — the vial holds.</i>";
      toast("<b>Cork Press</b> — the vial is not spent.", 2000);
    }
    toast("<b>" + def.glyph + " " + def.name + "</b><br>" + msg, 2800);
    renderPotions(); renderMana(); renderSlots();
  };
  if (def.target === "element")
    openChoice(def.name, "Choose an element.",
      ELEMENTS.map(e => ({ v:e.id, glyph:e.glyph, sub:e.name.toUpperCase() })), finish);
  else if (!def.target) finish();
  else if (!promptFor(def.target, def.name, finish)){
    console.error("no prompt for vial target: " + def.target);
    toast("<b>" + def.name + "</b> cannot be aimed right now.", 2400);
  }
}

/* ============================================================
   16e. BOSS REWARD — Arcane Mastery (permanent progression)
   ============================================================ */
function bossDefeated(gold){
  SAVE.data.bossesDefeated++;
  awardShards(CONFIG.souls.bossFragments * CONFIG.souls.shardsPerFragment);
  SAVE.data.actsCleared++;
  SAVE.commit();
  /* Felling a boss ends an act — the player starts the next one whole. */
  const mended = ascBossHeal() ? RUN.maxHP - RUN.hp : 0;
  if (ascBossHeal()) RUN.hp = RUN.maxHP;
  const unlocked = checkUnlocks();
  /* Spells are no longer taught here. A boss pays in coin and in soul — what that
     soul buys is decided in the talent tree, between fights. */
  let html = '<div class="eyebrow" style="text-align:center">' + TEXT.act + " " + (RUN.act + 1) +
      ' cleared</div>' +
    '<h1 class="win">A Boss Falls</h1>' +
    '<p class="lede">+' + gold + " " + TEXT.currencyShort +
    (mended ? " · fully mended (+" + mended + " HP)" : " · unwounded") + '.</p>' +
    '<div class="pick rare"><span class="ph"><span class="pi">◆</span>' +
      '<span class="pn">A Veilglass</span>' +
      '<span class="pmeta">' + fragmentsSpare(RUN.wizard) + ' TO SPEND</span></span>' +
      '<span class="pd">Whole, not in shards. Spend it in your talents — from the ' +
      TEXT.map.toLowerCase() + ' at any time.</span></div>';
  if (unlocked.length)
    html += '<div class="pick rare"><span class="ph"><span class="pi">✦</span>' +
      '<span class="pn">New discipline</span></span><span class="pd">' +
      unlocked.map(u => u.note).join(" ") + '</span></div>';
  html += '<button class="btn" id="toTree">✦ Spend it now</button>' +
          '<button class="btn ghost" id="onwardAct">Press on</button>';
  showScreen(html);
  on("#toTree", () => showTalents("boss"));
  on("#onwardAct", advanceAct);
}
function advanceAct(){
  if (RUN.act + 1 < ACTS.length) beginAct(RUN.act + 1);
  else showSummary(true);
}

/* ============================================================
   16e2. TALENTS — where Veilglass are spent
   ============================================================ */
/* WHAT A TREE WILL SHOW YOU.
   Taken nodes, and the tier you could spend on RIGHT NOW. Everything deeper is a "?"
   until your spending reaches it. A craft you have not unlocked shows its FIRST TIER
   only — enough to tell what it is for, not enough to plan a run you cannot start. */
function talentVisible(wiz, node, previewOnly){
  if (isTaken(wiz, node.id)) return true;
  if (previewOnly) return node.tier === 1;
  const gate = treeOf(wiz).gates[node.tier - 1] || 0;
  return spentIn(wiz) >= gate;
}

function showTalents(back, forWiz){
  /* forWiz lets the Disciplines screen show a tree for a craft the player has not
     started — looking before committing is the whole point of that button. */
  const wiz = forWiz || (RUN ? RUN.wizard : (SAVE.data.lastWizard || WIZARDS[0].id));
  /* Looking at a craft you have not earned: the first tier, and nothing beyond it. */
  const preview = !!forWiz && !wizardUnlocked(wiz);
  const tree = treeOf(wiz);
  const spare = fragmentsSpare(wiz), spent = spentIn(wiz);
  const tiers = {};
  tree.nodes.forEach(n => { (tiers[n.tier] = tiers[n.tier] || []).push(n); });
  const tierList = Object.keys(tiers).map(Number).sort((a,b) => a-b);
  const width = Math.max(...tree.nodes.map(n => n.col));

  /* A grid of icons, one row per tier, in the shape of an old talent tree:
     the arrows carry the prerequisites and the tiles carry everything else. */
  /* Three columns, always. Tiers stack downward and a tier holds as many rows of
     three as it needs, so the panel scrolls in one direction only. */
  let grid = '<div class="ttGrid">';
  Object.keys(tiers).map(Number).sort((a,b) => a-b).forEach(ti => {
    const gate = tree.gates[ti-1] || 0;
    const open = spent >= gate;
    grid += '<div class="ttTier' + (open ? "" : " shut") + '">' +
      '<div class="ttBand"><b>Tier ' + ti + '</b>' +
      (gate ? '<i>' + (open ? gate + " ◆ spent" : "spend " + gate + " to open") + '</i>'
            : '<i>open from the start</i>') + '</div>';

    /* group this tier's nodes by row, then by column within the row */
    const rows = {};
    tiers[ti].forEach(n => {
      const r = n.row || 1;
      (rows[r] = rows[r] || {});
      (rows[r][n.col] = rows[r][n.col] || []).push(n);
    });
    Object.keys(rows).map(Number).sort((a,b) => a-b).forEach(r => {
      grid += '<div class="ttRow3">';
      for (let col = 1; col <= 3; col++){
        const group = rows[r][col];
        if (!group){
          grid += '<div class="ttCell empty" data-cell="' + ti + ':' + r + ':' + col + '"></div>';
          continue;
        }
        const choice = group.length > 1;
        grid += '<div class="ttCell' + (choice ? " choice" : "") +
          '" data-cell="' + ti + ':' + r + ':' + col + '">' +
          (choice ? '<u class="ttPick">choose one</u>' : "");
        group.forEach(n => {
          const taken = isTaken(wiz, n.id);
          /* Hidden nodes keep their SHAPE — same size, same place, same links — so the
             tree still reads as a tree and the player can see how far it goes. */
          if (!talentVisible(wiz, n, preview)){
            grid += '<button class="ttNode veiled" data-take="' + n.id +
              '" title="Not yet">' +
              '<span class="ttIcon">?</span>' +
              '<span class="ttName">\u2014</span>' +
              '<span class="ttRank"></span></button>';
            return;
          }
          const why = blockedBecause(wiz, n);
          const state = taken ? "taken" : (why ? "shut" : "open");
          grid += '<button class="ttNode ' + state + ' k-' + n.kind + '" data-take="' + n.id +
            '" title="' + talentName(wiz, n).replace(/"/g,"&quot;") + '">' +
            '<span class="ttIcon">' + talentGlyph(wiz, n) + '</span>' +
            '<span class="ttName">' + talentName(wiz, n) + '</span>' +
            '<span class="ttRank">' + (taken ? "1/1" : "0/1") + '</span>' +
            '</button>';
        });
        grid += '</div>';
      }
      grid += '</div>';
    });
    grid += '</div>';
  });
  grid += '<svg id="ttLines"></svg></div>';

  showScreen(
    '<div class="ttFrame">' +
      '<div class="ttTitle">' + WIZ[wiz].glyph + ' ' + disciplineName(wiz) + ' — Talents' +
        (preview ? '<em class="ttPreview">sealed \u00b7 first tier only</em>' : "") + '</div>' +
      '<div class="ttScroll">' + grid + '</div>' +
      '<div class="ttDetail" id="ttDetail"><i>Tap a talent to read it.</i></div>' +
      '<div class="ttFoot">' +
        '<span>' + disciplineName(wiz) + ' Talents: <b>' + spent + '</b></span>' +
        '<span>Unspent: <b class="' + (spare ? "hot" : "") + '">' + spare + '</b></span>' +
      '</div>' +
    '</div>' +
    (spent ? '<button class="btn ghost" id="respec">↺ Unlearn everything' +
        (RUN && RUN.act != null && back !== "schools"
          ? " · " + CONFIG.souls.respecCost + " " + TEXT.currencyShort : " · free") + '</button>' : "") +
    '<button class="btn" id="tBack">Back</button>');

  /* Selecting a tile fills the detail strip; a second tap on the same tile
     commits the fragment, so nothing is spent by a stray touch. */
  let armed = null;
  const detail = document.getElementById("ttDetail");
  document.querySelectorAll("[data-take]").forEach(b => b.addEventListener("click", () => {
    if (b.classList.contains("veiled")){
      toast(preview
        ? "Open this discipline to see further into its tree."
        : "Spend deeper into the tree and this will show itself.", 2600);
      return;
    }
    const id = b.dataset.take, n = nodeById(wiz, id);
    const taken = isTaken(wiz, id), why = blockedBecause(wiz, n);
    if (armed === id && !taken && !why){
      if (takeTalent(wiz, id)) showTalents(back);
      return;
    }
    armed = id;
    document.querySelectorAll(".ttNode.sel").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    detail.innerHTML = '<b>' + talentName(wiz, n) + '</b>' +
      '<span class="ttKind">' + n.kind + '</span>' +
      '<span class="ttText">' + talentDesc(wiz, n) + '</span>' +
      (taken ? '<span class="ttWhy ok">Learned.</span>'
             : why ? '<span class="ttWhy">' + why + '</span>'
                   : '<span class="ttWhy go">Tap again to spend 1 ◆</span>');
  }));

  const cost = CONFIG.souls.respecCost;
  on("#respec", () => {
    const midRun = RUN && RUN.act != null && back !== "schools";
    if (midRun && RUN.gold < cost){ toast("You need " + cost + " " + TEXT.currency + " to unlearn.", 2400); return; }
    confirmAction({
      title:"Unlearn everything?",
      body:"Every Veilglass comes back, and the tree empties. " +
        (midRun ? "This costs " + cost + " " + TEXT.currency + " mid-run." : "Free before a run begins."),
      confirmLabel:midRun ? "Unlearn for " + cost : "Unlearn everything",
      onConfirm(){
        if (midRun){ RUN.gold -= cost; renderPurse(); }
        respecTree(wiz);
        showTalents(back);
      }
    });
  });
  on("#tBack", () => {
    if (back === "schools") showSchools();
    else if (back === "boss") advanceAct();
    else showMap();
  });
  requestAnimationFrame(() => drawTalentLines(wiz));
}

/* Prerequisite arrows, drawn between tiles rather than stored as positions. */
function drawTalentLines(wiz){
  const svg = document.getElementById("ttLines");
  const grid = svg && svg.parentElement;
  if (!svg || !grid) return;
  const box = grid.getBoundingClientRect();
  svg.setAttribute("width", box.width);
  svg.setAttribute("height", box.height);

  /* Several links can run between the same two slots — Fireball, Inferno, Catalyst
     and Echoing Flame all point at Fireball Potency. Those are ONE relationship on
     screen, so arrows are collapsed per slot pair and drawn cell to cell. */
  const tree = treeOf(wiz);
  const cellOf = {};
  tree.nodes.forEach(n => { cellOf[n.id] = n.tier + ":" + (n.row || 1) + ":" + n.col; });
  const pairs = {};
  tree.links.forEach(([from, to]) => {
    const a = cellOf[from], b = cellOf[to];
    if (!a || !b || a === b) return;
    const key = a + ">" + b;
    if (!pairs[key]) pairs[key] = { a, b, from:[], to:[] };
    pairs[key].from.push(from); pairs[key].to.push(to);
  });

  let out = "";
  Object.values(pairs).forEach(p => {
    const ea = grid.querySelector('[data-cell="' + p.a + '"]');
    const eb = grid.querySelector('[data-cell="' + p.b + '"]');
    if (!ea || !eb) return;
    const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
    /* Lit once ANY parent in the source slot is taken — the options are
       alternatives, so one of them satisfies the path. */
    const lit = p.from.some(id => isTaken(wiz, id));
    const col = lit ? "#8fe0a8" : "#4a3f6a";
    const x1 = ra.left + ra.width/2 - box.left, y1 = ra.bottom - box.top;
    const x2 = rb.left + rb.width/2 - box.left, y2 = rb.top - box.top;
    if (Math.abs(x1 - x2) < 3){
      out += '<path d="M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2 + '" stroke="' + col +
        '" stroke-width="2.5" fill="none" opacity="' + (lit ? 1 : .6) + '"/>';
    } else {
      /* Step down, across, then down again — the elbow sits in the gutter between
         rows so it never crosses a tile. */
      const mid = y1 + Math.max(6, (y2 - y1) / 2);
      out += '<path d="M' + x1 + ',' + y1 + ' L' + x1 + ',' + mid + ' L' + x2 + ',' + mid +
        ' L' + x2 + ',' + y2 + '" stroke="' + col + '" stroke-width="2.5" fill="none" ' +
        'stroke-linejoin="round" opacity="' + (lit ? 1 : .6) + '"/>';
    }
    out += '<path d="M' + (x2-4) + ',' + (y2-5) + ' L' + x2 + ',' + y2 + ' L' + (x2+4) + ',' + (y2-5) +
      '" stroke="' + col + '" stroke-width="2.5" fill="none" stroke-linejoin="round" ' +
      'opacity="' + (lit ? 1 : .6) + '"/>';
  });
  svg.innerHTML = out;
}

/* Named here so the spell tip can say which two pools pay for a spell. */
function nativeElementsOf(id){
  const base = spellBase(id), alt = alsoPays(id);
  return alt ? [base.element, alt] : [base.element];
}
function talentGlyph(wiz, n){
  if (n.kind === "passive") return "◈";
  if (n.kind === "mastery") return "✦";
  if (n.kind === "potency") return "⚜";
  if (n.kind === "efficiency") return "⌬";
  if (n.kind === "bespoke") return "✧";
  return (SPELLS[n.ref] || {}).glyph || "✦";
}

/* Unlearning returns every fragment; the tree is rebuilt from nothing. */
function respecTree(wiz){
  SAVE.data.trees = SAVE.data.trees || {};
  SAVE.data.trees[wiz] = [];
  SAVE.data.masteries = {};
  SAVE.commit();
  if (RUN && RUN.wizard === wiz){
    RUN.talents = { taken:{}, potency:{}, efficiency:{} };
    applyTreeToRun();
  }
  toast("Every Veilglass returns to you.", 2400);
}

/* ============================================================
   16f3. DEVELOPER SANDBOX
   Pick a discipline, pick any creature, fight it immediately with whatever
   loadout you want. Never touches saved progression.
   ============================================================ */
const SANDBOX = { wizard:"pyromancer", enemy:"slime", maxed:true, ascension:0, vials:[], spells:[] };
/* Chosen vials override the satchel entirely; an empty selection falls back to
   random ones so the default "fully kitted" behaviour is unchanged. */
function sandboxVialCount(v){ return SANDBOX.vials.filter(x => x === v).length; }

function sandboxLoadout(){
  const w = WIZ[SANDBOX.wizard];
  newRun(SANDBOX.wizard);
  RUN.sandbox = true;
  RUN.ascension = SANDBOX.ascension;
  if (SANDBOX.maxed){
    RUN.spells = SPELL_POOLS[SANDBOX.wizard].slice(0, MAX_EQUIPPED);
    RUN.relics = Object.keys(RELICS).filter(id => !RELICS[id].starting).slice(0, 8);
    RUN.relics.unshift(w.relic);
    RUN.relics.forEach(id => { if (RELICS[id].onGain) RELICS[id].onGain(); });
    RUN.gold = 999;
    RUN.spells.forEach(id => {
      if (SPELLS[id].potencyStep) RUN.talents.potency[id] = CONFIG.talents.potencyMax;
      RUN.talents.efficiency[id] = CONFIG.talents.efficiencyMax;
    });

  }
  /* An explicit spell choice overrides whichever loadout was picked, so a single
     spell can be tested in isolation. Ignores the normal carry cap. */
  if (SANDBOX.spells.length){
    RUN.spells = SANDBOX.spells.slice();
    RUN.sandboxSpellCap = RUN.spells.length;
  }
  /* Vials last so they survive whichever loadout was chosen — you can test a single
     vial against a boss without also granting the full kit. */
  RUN.potions = [];
  if (SANDBOX.vials.length) RUN.potions = SANDBOX.vials.slice();
  else if (SANDBOX.maxed) for (let i = 0; i < potionCapacity(); i++) grantPotion(randomPotionId(), {quiet:true});
  RUN.sandboxCapacity = Math.max(potionCapacity(), RUN.potions.length);
  RUN.map = generateMap(0); RUN.rowIndex = 0; RUN.pos = 0;
}

/* Grants every discipline, every spell including the sealed ones, and a mastery
   branch on every spell that has a tree. Writes to the save deliberately — it is
   offered only in developer mode and only from Settings. */
function unlockEverything(){
  WIZARDS.forEach(w => SAVE.unlockWizard(w.id));
  Object.keys(SPELL_POOLS).forEach(w =>
    SPELL_POOLS[w].forEach(id => SAVE.learnSpell(w, id)));
  Object.keys(MASTERIES).forEach(sid => SAVE.setMastery(sid, MASTERIES[sid][0].id));
  SAVE.data.ascensionUnlocked = ASCENSION.length - 1;
  SAVE.commit();
}

/* The Trials ladder, stated in full. Each tier lists exactly what it changes, and
   the ones currently in force are marked — difficulty the player cannot read is
   difficulty they cannot plan around. */
/* THE TRIALS.
   One ladder per discipline, because mastery of Fire says nothing about Divination —
   a single save-wide number meant the strongest craft set the floor for the weakest.
   A craft may attempt trials only once it has carried a run to the end.
   This is also where a player's records live: how far each craft has climbed, and its
   best run at each tier. There is no server behind Shattermancer and there will not be,
   so these are personal bests rather than a league — which is the honest version and,
   for a game about beating your own deduction, the more interesting one. */
function showTrials(back){
  const rows = WIZARDS.filter(w => SAVE.data.wizards.includes(w.id));
  const open = rows.filter(w => trialsOpenFor(w.id));

  let html = '<div class="eyebrow" style="text-align:center">The long road</div>' +
    '<h1>\ud83c\udf02 Trials</h1>';

  if (!open.length){
    html += '<p class="lede">A craft may take the trials once it has carried a run to ' +
      'the end. None have yet.</p>';
  } else {
    html += '<p class="lede">Each craft climbs its own ladder. A tier is earned by ' +
      'winning on the one below it.</p>';
  }

  open.forEach(w => {
    const cur = ascFor(w.id), max = ascMaxFor(w.id);
    const rec = (SAVE.data.recordsBy || {})[w.id] || {};
    const at = rec["t" + cur] || {};
    html += '<div class="trialCraft">' +
      '<div class="tcHead">' +
        '<span class="tcGlyph">' + (w.glyph || "\u2726") + '</span>' +
        '<span class="tcName">' + disciplineName(w.id) + '</span>' +
        '<span class="tcTier">Trial ' + cur + '<em> of ' + max + ' earned</em></span>' +
      '</div>' +
      '<div class="tcLadder">' +
        ASCENSION.map(t => '<span class="tcPip' + (t.t <= cur ? " on" : "") +
          (t.t > max ? " off" : "") + '" data-tier="' + w.id + ':' + t.t + '"' +
          ' title="' + t.note.replace(/"/g,"&quot;") + '">' + (t.t || "\u2014") + '</span>').join("") +
      '</div>' +
      '<div class="tcNote">' + ASCENSION[cur].note + '</div>' +
      '<div class="tcRecords">' +
        '<span><b>' + (rec.wins || 0) + '</b> cleared</span>' +
        '<span><b>' + (rec.best >= 0 ? rec.best : "\u2014") + '</b> highest</span>' +
        '<span><b>' + (at.turns || "\u2014") + '</b> fewest casts</span>' +
        '<span><b>' + (at.taken || "\u2014") + '</b> least hurt</span>' +
        '<span><b>' + (at.perfects || "\u2014") + '</b> most solved</span>' +
      '</div>' +
    '</div>';
  });

  /* What each tier does, once, rather than repeated under every craft. */
  html += '<div class="shelfLabel">What each tier changes</div>';
  ASCENSION.filter(t => t.t > 0).forEach(t => {
    html += '<div class="trialRow"><span class="tn">' + t.t + '</span>' +
      '<span class="tt">' + t.note + '</span></div>';
  });
  html += '<p class="lede" style="font-size:12px">Every tier keeps the changes below it.</p>' +
          '<button class="btn" id="trBack">Back</button>';
  showScreen(html);

  /* Tap a pip to stand on that tier — you may drop to any you have earned. */
  document.querySelectorAll("[data-tier]").forEach(b => b.addEventListener("click", () => {
    const [wiz, tier] = b.dataset.tier.split(":");
    const t = parseInt(tier, 10);
    if (t > ascMaxFor(wiz)){
      toast("Win on trial " + ascMaxFor(wiz) + " to earn that one.", 2400);
      return;
    }
    SAVE.data.ascensionBy = SAVE.data.ascensionBy || {};
    SAVE.data.ascensionBy[wiz] = t;
    SAVE.commit();
    showTrials(back);
  }));
  on("#trBack", () => back === "title" ? showTitle() : showMap());
}

/* THE CHARACTER SCREEN — a placeholder, deliberately.

/* ============================================================================
   THE LAYOUT PROBE — because a screenshot without numbers cost a week.
   Chromium and WebKitGTK both passed while the iPhone rendered differently,
   and every round trip was Kerry pushing a build to discover the same fault.
   With the probe on, HIS screenshot carries the diagnosis: the real viewport,
   how dvh resolves, the safe insets, every band's true height, and the exact
   gap under the spell rack — measured by the only renderer that matters.
   Toggled from Settings. Draws over everything, touches nothing.
   ============================================================================ */
/* ---- THE ON-DEVICE CONSOLE. eruda is a full inspector that runs INSIDE the
   page — elements, computed styles, console, network — which matters because
   Kerry develops iPhone-only and Safari's remote inspector needs a Mac he
   rightly will not plug a personal phone into. Loaded on demand from its own
   file (half a megabyte has no business in every player's first load), and only
   ever by this toggle. ---- */
let ERUDA_LOADED = false;
function toggleConsole(){
  if (!document.head || !document.body) return;
  if (ERUDA_LOADED && window.eruda){
    (eruda._isInit ? eruda.destroy() : eruda.init()); return;
  }
  const s = document.createElement("script");
  s.src = "eruda.js";
  s.onload = () => { ERUDA_LOADED = true; eruda.init(); };
  s.onerror = () => toast("eruda.js is not in the repo beside index.html", 3200);
  document.head.appendChild(s);
}

let PROBE = null;
/* ============================================================================
   MEASURESHELL — how much of the phone the app actually gets.

   Added to the Home Screen, this game can run in one of two shells. With
   viewport-fit=cover honoured, the web view covers the whole screen and
   env(safe-area-inset-*) tells us where the Dynamic Island and home indicator
   are, so we pad by them. But if the shell was cached before those meta tags
   existed — or iOS simply declines — the web view is handed a viewport that
   ALREADY EXCLUDES the status bar, while env() keeps reporting 62px anyway.
   Pad by it then and the screen is spent twice: 62px of dead space at the
   bottom that no CSS inside the page can reach, because the page ends there.

   Kerry measured exactly that: inner 440x894 on a 956px screen, and 105px of
   dark below the spell rack that four rebuilds could not shift. In Safari, with
   no shell at all, the same build filled the screen correctly — which is the
   proof that the layout was never the fault.

   So: compare the screen to the viewport. If the difference is about the top
   inset, iOS has already taken it and we must not take it again.
   ============================================================================ */
function measureShell(){
  const root = document.documentElement;
  if (!root || !root.style) return;
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;" +
    "height:env(safe-area-inset-top,0px)";
  document.body.appendChild(probe);
  const declaredTop = probe.getBoundingClientRect().height;
  probe.style.height = "env(safe-area-inset-bottom,0px)";
  const declaredBot = probe.getBoundingClientRect().height;
  probe.remove();

  const outside = (window.screen && window.screen.height ? window.screen.height : 0) -
                  window.innerHeight;
  /* "about the top inset" — not exact, because the two are measured differently
     and a few pixels either way is normal. 20px of slop, no more. */
  const alreadyInset = outside >= Math.max(20, declaredTop - 12);
  root.style.setProperty("--shellTop", alreadyInset ? "4px" :
                         "max(4px, " + declaredTop + "px)");
  root.style.setProperty("--shellBot", alreadyInset ? "8px" :
                         "max(10px, " + declaredBot + "px)");
  root.dataset.shell = alreadyInset ? "inset" : "cover";
}
/* GUARDED: the suites evaluate this file with no window, and a bare
   addEventListener at top level throws before a single assertion runs. Third
   time this shape has bitten — dev plumbing must never break the harness. */
if (typeof window !== "undefined" && window.addEventListener){
  window.addEventListener("resize", measureShell);
  window.addEventListener("orientationchange", () => setTimeout(measureShell, 120));
}

/* ============================================================================
   DEV UNLOCK — REMOVE BEFORE RELEASE.

   Opens every discipline, banks Veilglass for each, and fills the purse. Written
   as ONE function so removing the feature is deleting three marked blocks and
   nothing else.

   It writes through the SAME paths the game uses — SAVE.data.wizards, shardsBy,
   RUN.gold — rather than inventing its own, so a save it touches is a save the
   game would have produced on its own. A cheat that writes a shape the game
   cannot make is a bug generator, and this one exists to make testing cheaper,
   not to add a new class of fault.

   Aurels are RUN state: they live and die with a run. Outside a fight there is
   no purse to fill, and the function says so instead of silently doing nothing.
   ============================================================================ */
const DEV_KEYS = ["wizards","shardsBy","bossesDefeated","spells"];
function devIsOn(){ return !!SAVE.data.__devBackup; }

function devUnlockAll(){
  /* ---- REVERT. The backup is a deep copy of exactly the fields granting
     touches, taken BEFORE the first grant and kept in the save so it survives a
     reload. Restoring puts each field back verbatim — not to a default, which
     would quietly discard real progress a player had before switching dev on.
     TREES ARE NOT TOUCHED either way: talent nodes are spent by hand, and
     wiping them on revert would delete choices dev mode never made. */
  if (devIsOn()){
    const b = SAVE.data.__devBackup;
    DEV_KEYS.forEach(k => { SAVE.data[k] = JSON.parse(JSON.stringify(b[k])); });
    delete SAVE.data.__devBackup;
    SAVE.commit();
    if (typeof RUN === "object" && RUN && b.gold != null){
      RUN.gold = b.gold;
      if (typeof renderPurse === "function") { try { renderPurse(); } catch(e){} }
    }
    return "Dev off — everything is back as it was.";
  }

  /* ---- GRANT ---- */
  const all = ["pyromancer","cryomancer","warlock","apothecary",
               "alchemist","hexweaver","diviner"];
  const backup = {};
  DEV_KEYS.forEach(k => { backup[k] = JSON.parse(JSON.stringify(SAVE.data[k] ?? null)); });
  backup.gold = (typeof RUN === "object" && RUN) ? RUN.gold : null;
  SAVE.data.__devBackup = backup;

  SAVE.data.wizards = all.slice();

  /* Veilglass is banked PER DISCIPLINE — shardsOf() reads shardsBy[wiz] — so a
     single total would be a shape the game never writes. And VEILGLASS IS THE
     TALENT CURRENCY: fragmentsOf() divides shards, and a node costs fragments,
     so granting shards IS granting talent points. There is no separate pool. */
  SAVE.data.shardsBy = SAVE.data.shardsBy || {};
  all.forEach(w => { SAVE.data.shardsBy[w] = Math.max(999, SAVE.data.shardsBy[w] || 0); });

  /* every spell each discipline can learn, including the ones its tree gates —
     relics deliberately NOT granted, per Kerry */
  SAVE.data.spells = SAVE.data.spells || {};
  Object.keys(SPELL_POOLS).forEach(w => {
    SAVE.data.spells[w] = SPELL_POOLS[w].slice();
  });

  /* the ladder is counted in bosses felled, and several screens read it directly
     rather than asking wizardUnlocked — leaving it at 0 would show seven open
     disciplines above a line saying none were earned */
  const most = UNLOCKS.reduce((n, u) => Math.max(n, u.bosses), 0);
  SAVE.data.bossesDefeated = Math.max(SAVE.data.bossesDefeated || 0, most);

  SAVE.commit();

  let purse = "no run, so no Aurels";
  if (typeof RUN === "object" && RUN){
    RUN.gold = 999;
    if (typeof renderPurse === "function") { try { renderPurse(); } catch(e){} }
    purse = "999 Aurels";
  }
  return "Dev on — 7 disciplines, all spells, 999 Veilglass each, " + purse + ".";
}
/* ===== END DEV UNLOCK ====================================================== */

function toggleProbe(){
  /* GUARDED, like showScreen. The suites press every control on every screen in
     a headless shim where document.body can be absent, and appendChild on
     undefined throws — buttontest reported two broken controls the moment these
     toggles existed. A dev tool must never be the thing that breaks a sweep. */
  /* the shim has a body but no real style engine, and documentElement.style is
     undefined there — the probe reads computed values, so it needs BOTH */
  if (!document.body || !document.documentElement ||
      !document.documentElement.style || typeof getComputedStyle !== "function") return;
  if (PROBE){ clearInterval(PROBE.t); PROBE.el.remove(); PROBE = null; return; }
  const el = document.createElement("div");
  el.id = "layoutProbe";
  el.style.cssText = "position:fixed;left:4px;bottom:4px;z-index:99999;" +
    "font:10px/1.45 monospace;color:#7dffb2;background:rgba(0,0,0,.78);" +
    "padding:6px 8px;pointer-events:none;white-space:pre;border:1px solid #2a5;";
  document.body.appendChild(el);
  const probe = () => {
    const r = s => { const e = document.querySelector(s);
      return e ? e.getBoundingClientRect() : null; };
    const dvh = document.createElement("div");
    dvh.style.cssText = "position:fixed;top:0;left:0;width:1px;height:100dvh;visibility:hidden";
    document.body.appendChild(dvh);
    const dvhPx = dvh.getBoundingClientRect().height; dvh.remove();
    const cs = getComputedStyle(document.documentElement);
    const sceneR = r("#scene"), bookR = r("#book"), castR = r("#castArea"),
          kitR = r("#kit"), draftR = r("#draftArea");
    const line = (n, x) => n + ": " + (x ? Math.round(x.height) + "px  y" +
      Math.round(x.y) + "-" + Math.round(x.bottom) : "missing");
    el.textContent = [
      "inner " + innerWidth + "x" + innerHeight + "  dvh=" + Math.round(dvhPx) +
        "  dpr=" + devicePixelRatio,
      /* THE LINE THAT MATTERS. If screen is TALLER than the viewport, the web
         view does not reach the bottom of the phone and no CSS can make it —
         the shell was cached by "Add to Home Screen" before viewport-fit=cover
         existed. Kerry measured 105px of dead space this way. */
      (function(){
        var s = (typeof screen === "object" && screen && screen.height) ? screen : null;
        if (!s) return "screen unavailable";
        return "screen " + s.width + "x" + s.height +
          (s.height - innerHeight > 20
            ? "   <-- " + (s.height - innerHeight) + "px OUTSIDE THE APP"
            : "   (full height)");
      })(),
      "standalone: " + (navigator.standalone === true ? "yes" :
                        navigator.standalone === false ? "NO — Safari tab" : "?") +
        "   shell=" + (document.documentElement.dataset.shell || "?"),
      "safe T " + cs.getPropertyValue("--probeT") + " B " + cs.getPropertyValue("--probeB"),
      line("scene", sceneR), line("book ", bookR), line("cast ", castR),
      line("kit  ", kitR),
      "kit gap to floor: " + (kitR ? Math.round(innerHeight - kitR.bottom) : "?") + "px",
      draftR ? "draft " + Math.round(draftR.width) + "x" + Math.round(draftR.height) : "draft missing",
    ].join("\n");
  };
  /* the safe insets, surfaced where JS can read them back */
  document.documentElement.style.setProperty("--probeT", "env(safe-area-inset-top)");
  document.documentElement.style.setProperty("--probeB", "env(safe-area-inset-bottom)");
  probe();
  PROBE = { el, t: setInterval(probe, 800) };
}

/* ---- WHEN SOMETHING THROWS, SAY SO ----------------------------------------
   Kerry hit an unresponsive screen mid-battle and nothing in the suites reproduces it:
   the logic runs clean through full battles and whole careers in the harness. That
   points at something only a browser does — a CSS fault, a failed image decode, or
   memory pressure — and a silent failure gives us nothing to work with.
   An uncaught error stops the rest of a function dead, which is exactly what "the
   screen stopped responding and the old elements are showing" looks like: the half of
   showBattle after the throw never ran.
   This catches it, shows what it was and where, and lets the run continue. */
(function(){
  let shown = 0;
  function report(what, where){
    if (shown++ > 2) return;                 /* never bury the game in its own errors */
    try {
      const bar = document.createElement("div");
      bar.setAttribute("role", "alert");
      bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;" +
        "background:#3a0f12;color:#ffd9d0;font:11px/1.4 ui-monospace,monospace;" +
        "padding:8px 10px calc(8px + env(safe-area-inset-bottom));" +
        "border-top:2px solid #a33;white-space:pre-wrap;max-height:38vh;overflow:auto";
      bar.textContent = "Something went wrong — please send this to Claude:\n\n" +
        what + "\n" + (where || "");
      const close = document.createElement("button");
      close.textContent = "Dismiss";
      close.style.cssText = "margin-top:6px;padding:8px 12px;background:#5a1a1e;" +
        "color:#ffd9d0;border:1px solid #a33;border-radius:6px;font-size:12px";
      close.addEventListener("click", () => bar.remove());
      bar.appendChild(close);
      document.body.appendChild(bar);
    } catch(e){}
  }
  /* GUARDED. The test harnesses supply a bare window with no addEventListener, and a
     reporter that breaks the thing it reports on would be worse than none. */
  if (typeof window === "undefined" || !window.addEventListener) return;
  window.addEventListener("error", e => {
    report((e.message || "error"),
      (e.filename ? "" : "") + "line " + (e.lineno || "?") +
      (e.error && e.error.stack ? "\n" + String(e.error.stack).split("\n").slice(0,4).join("\n") : ""));
  });
  window.addEventListener("unhandledrejection", e =>
    report("A background task failed: " + (e.reason && e.reason.message || e.reason), ""));
})();

/* THE ART IS FETCHED BEFORE THE FIRST SCREEN IS DRAWN.
   It used to be present the instant the script parsed, because it was IN the script.
   Now it arrives over the network, so the title has to wait for it — otherwise the
   first thing the player sees is the unpainted fallback, which then repaints a
   moment later. One await costs a few hundred milliseconds and removes that flash.
   If the fetch fails the game still starts, unpainted rather than not at all. */
(async function start(){
  await loadAssets();
  dressUI();        // hand the art pack to CSS before anything is drawn
  buildRunes();
  buildMana();
  showTitle();
})();
document.addEventListener("gesturestart", e => e.preventDefault());
</script>
</body>
</html>
