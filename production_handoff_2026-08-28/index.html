  position:absolute; left:5%; right:24%; top:9.9%; height:14.1%;
  display:flex; align-items:center; justify-content:flex-start;
  margin:0; padding:0; white-space:nowrap; overflow:visible;
  line-height:1; font-size:clamp(8px, 2.3vw, 11px);
}
.inBattle.hasUIArt #playerPanel #playerName,
.inBattle.hasUIArt #enemyPanel #enemyName{ margin:0 }

/* 2. THE SHIELD VALUE, ON THE RECESS'S OPTICAL CENTRE. Centring it in its DOM
   box was not enough: the painted recess is not centred in that box. Measured
   from the art, the dark field sits at 58.1%/53.0% of the player badge and
   49.4%/42.0% of the enemy's. The glyph is placed on those points and
   translated by half itself, so the result holds for "0" and for "12" alike —
   it is the BOX that is positioned, not a nudged character. */
.inBattle.hasUIArt #playerBlock,
.inBattle.hasUIArt #enemyBlock{
  display:block; padding:0; line-height:1; overflow:visible;
}
.inBattle.hasUIArt #playerBlock > b{
  position:absolute; left:58.1%; top:53%; transform:translate(-50%,-50%);
  display:block; margin:0; padding:0; line-height:1; text-align:center;
  white-space:nowrap;
}
.inBattle.hasUIArt #enemyBlock > b{
  position:absolute; left:49.4%; top:42%; transform:translate(-50%,-50%);
  display:block; margin:0; padding:0; line-height:1; text-align:center;
  white-space:nowrap;
}

/* 4. THE VIAL CONTENTS, INSIDE THE TUNED RECESS. potionSlot.png is 70x64
   delivered, 35x32 drawn. Its opaque recess is inset from the frame, so the
   runtime icon is given that inner box with contain sizing — one box for all
   six, none of them hand-placed. */
.inBattle.hasUIArt #castArea #castRow .ptray > .psock{ position:relative }
.inBattle.hasUIArt #castArea #castRow .ptray > .psock > *{
  position:absolute; left:16%; top:14%; width:68%; height:66%;
  margin:0; padding:0;
  display:flex; align-items:center; justify-content:center;
  background-size:contain; background-position:center; background-repeat:no-repeat;
  object-fit:contain; font-size:13px; line-height:1;
}

/* THE LABEL LIVES IN #playerBar, position:static — so the BAR must occupy the
   painted recess, not the text inside it. Setting the text's own box did
   nothing, which is why it still measured 9.5%. The bar takes the recess and
   the label centres within it. */
.inBattle.hasUIArt #playerPanel > #playerBar{
  position:absolute; left:5%; right:24%; top:9.9%; height:14.1%;
  display:flex; align-items:center; justify-content:flex-start;
  margin:0; padding:0;
}
.inBattle.hasUIArt #playerPanel > #playerBar > #playerName{
  position:static; margin:0; padding:0; line-height:1;
  font-size:clamp(8px, 2.3vw, 11px); white-space:nowrap;
}
</style>
</head>
<body>

<div id="app">
  <div id="topBar">
    <!-- The row-dot track and act number are Path information; Kerry dropped
         them from battle (2026-08-25). The div stays for renderTrack and the
         suites; CSS hides it here. -->
    <div id="track"></div>
    <div id="purseBar" data-tip="aurels"></div>
    <!-- Settings from a fight, Kerry's call. The caller string is LOAD-BEARING:
         showSettings once got no argument and returned to the map only by
         accident. "battle" has its own branch below. -->
      <!-- REMOVED 2026-08-28: battleSettings — a second, older settings control; settingsBtn is the one Kerry drew. -->
  </div>

  <!-- ===== SCENE: over-the-shoulder, player foreground left, creature upper right ===== -->
  <section id="scene">
    <div id="sceneArt" aria-hidden="true">
      <div id="playerFig">🧙</div>
      <div id="enemySprite" data-tip="enemy">🟢</div>
    </div>

    <div id="enemyPanel" data-tip="enemy">
      <h2 id="enemyName"></h2>
      <!-- THE SHIELD BADGE BELONGS TO THE HEALTH ROW. It sat in the chipRow with
           the wards, and the player's sat in the name row — so across three
           redesigns it was moved by coordinates over and over and always came
           back odd, because it was never in the wrong PLACE, it was in the wrong
           PARENT. Beside the bar by structure now: no rule can put it anywhere
           else, because there is nowhere else for it to be. -->
      <div class="hpRow">
        <!-- id ADDED 2026-08-27: he drew the health bars as boxes in his
             wireframe, and an unnamed .bar cannot be placed to his numbers or
             checked against them. -->
        <div class="bar" id="enemyHP"><i id="enemyHPFill" style="width:100%"></i></div>
        <span class="hpNum" id="enemyHPNum"></span>
      </div>
      <!-- THE BADGE MOVED OUT OF THE HEALTH ROW, 2026-08-27. I put it there in
           August so it would sit beside its bar — the fix for it wandering across
           three redesigns. Kerry has now given it its OWN box on the rail, so it
           belongs to the rail: inside the row it could only ever be placed
           relative to the row. His drawing is the specification, and this is
           what it asks for. -->
      <span class="blockChip zero" id="enemyBlock" data-tip="block" data-tip-id="enemy"><b>0</b></span>
      <!-- THE WARDS STAY. They fell out of his latest export by accident, not by
           choice — he confirmed he wants them. Named so they can be placed and
           checked like everything else. -->
      <div class="chipRow" id="enemyWards">
        <div id="resistTray"></div>
      </div>
    </div>

    <div id="threat">
      <div id="abilityTag" data-tip="intent"></div>
      <div id="intent" data-tip="intent"><span class="intentText">Attack</span></div>
    </div>

    <div id="playerPanel">
      <div id="playerBar" data-tip="player">
        <span class="who" id="playerName"></span>
      </div>
      <div class="hpRow">
        <div class="bar" id="playerHP"><i id="playerHPFill" style="width:100%"></i></div>
        <span class="hpNum" id="playerHPNum"></span>
      </div>
      <!-- on the rail, not in the row — same reasoning as the enemy's -->
      <span class="blockChip zero" id="playerBlock" data-tip="block" data-tip-id="player"><b>0</b></span>
      <div id="relicStrip"></div>
    </div>
  </section>

  <!-- ===== GRIMOIRE: split book. Guesses left, feedback right, draft written in ===== -->
  <!-- ===== GRIMOIRE. The book art is the FRAME; #bookPage is the paper, placed
       once at the art's measured page rectangle. Everything else sits inside
       that rectangle at the concept's own percentages instead of being pushed
       around by flex flow — which is what five rounds of "still wrong" were.
       Every id below is unchanged: the game reaches for all of them by name. ===== -->
  <section id="book">
    <!-- ON THE BOOK, NOT THE PAGE. Kerry put it at x82.5 y3.9 of the BOOK,
         which in page terms is left 97.9% and top -18.9% — above the paper and
         past its right edge, out on the cover. A child of the page can never
         reach there, so it is a child of the book. -->
    <button id="legendBtn" data-tip="markers"
            aria-label="What the markers mean"></button>
    <div id="bookPage">
      <!-- REMOVED 2026-08-28: bookTitle — printed "The Grimoire" while book.png declares baked_text "GRIM; OIRE". -->
      <!-- THE LEGEND BUTTON MOVED OUT of the headings row, 2026-08-27. Kerry
           gave it its own box on the BOOK at x82.5, and inside a span inside the
           row it could only ever sit beside the word "Insight". A direct child
           of the page can take his coordinates. Its handler is bound by id, so
           moving it changes nothing about what it does. -->
      <!-- REMOVED 2026-08-28: bookHeads — printed INCANTATION and INSIGHT, both
           declared as baked text in book.png. Its two SCROLL ARROWS were live
           controls with handlers and were lost with their wrapper, which the
           suites caught: a LEGITIMATE failure, not a stale test. They are
           children of the page now. -->
      <!-- bookUp / bookDown REMOVED 2026-08-28. Obsolete legacy: #grimoire is
           overflow-y:auto with data-scroll, a touch drag moves the history while
           the battle screen stays put, and scrollTo reaches the newest entry
           exactly. They were never commissioned — Gate 3 delivers no art for
           them — so they rendered as plain white browser buttons over the book. -->
      <div id="grimoire" data-scroll></div>
      <div id="draftArea">
        <!-- Decoration only: no words, no state. A screen reader gaining a "wax
             seal" node would be noise, so it is hidden from one entirely. -->
        <span id="waxSeal" aria-hidden="true"></span>
        <!-- FLATTENED 2026-08-27. #slots was two wrappers deep — inside .pgL
             inside .draftEntry — and three attempts to place it against the
             STRIP from CSS all failed: removing the wrappers from the box tree
             sent the absolutely positioned row onto the page, and leaving them
             in flow left the row where they put it.
             The wrappers existed to make the draft look like a grimoire ROW,
             back when it rendered as one. It is a strip of its own now, so they
             buy nothing and cost the row its positioning context.

             THE ORDER NO LONGER MATTERS. Every slot carries data-slot with its
             own index and is found by that, so this row may hold anything else
             in any order — a spacer, a decoration, the clear button — and the
             right slot still lights. That was the last place in the game where
             an element was addressed by its POSITION among siblings. -->
        <!-- the hint is GONE. Not in Kerry's wireframe, therefore not on this
             screen. I placed it below the row instead of deleting it, which is
             the same mistake I made with draftTurn: his export is the complete
             specification, and an element absent from it is absent on purpose. -->
        <div id="slots"></div>
      </div>
    </div>
    <!-- THE LEGEND MOVED TO A TOOLTIP (Kerry, 2026-08-25): four labelled pips
         across the foot of the book was the single busiest strip on the screen,
         and it repeated on every turn what a player learns once. The button
         beside "Insight" opens the same text on demand. Kept in the DOM and
         hidden, because #legendBar is named by the layout table and two suites. -->
    <div id="legendBar" data-tip="markers" hidden>
      <span><i class="pip exploit"></i>Fracture</span>
      <span><i class="pip resonate"></i>Resonate</span>
      <span><i class="pip resist"></i>Resist</span>
      <span><i class="pip exploit echo"></i>Echo</span>
    </div>
  </section>

  <!-- ===== INPUT: candle-lit rune arc, mana, cast ===== -->
  <section id="castArea">
    <div id="runeArc">
      <div id="runes"></div>
    </div>
    <!-- Kept, empty and hidden. The pools are drawn inside the buttons now, but
         #manaRow is named by the layout table, the studio and three suites, and
         deleting it would break all of them to remove one empty div. -->
    <div id="manaRow" hidden></div>
    <div id="castRow">
      <div id="potionsL" class="ptray"></div>
      <button id="cast" data-tip="cast" aria-label="Cast" disabled>Cast</button>
      <div id="potionsR" class="ptray"></div>
    </div>

    <!-- ONE SURFACE, 2026-08-27. Kerry drew a single background here holding the
         element buttons, CAST, the vials AND the four spell cards, and gave
         every child a share of IT. Two sibling sections could not express that:
         his cards start at 105px while the casting section ended at 123, so they
         cross a boundary that only exists in the code.
         #kit moves INSIDE #castArea, which becomes the surface. #kit keeps its
         id — the layout table, the studio and four suites name it — but it is a
         region of the surface now, not a band beside it. -->
    <div id="kit">
      <div id="spellTray"></div>
      <div id="relicActions"></div>
      <!-- Kept empty and hidden, same reasoning as #manaRow: the id is known to
           renderPotions' fallback, the table and the suites. Vials draw in the
           castRow sockets now. -->
      <div id="potionTray" hidden></div>
    </div>
  </section>

  <section class="panel" id="debug">
    <div>SECRET <span class="code" id="dbgCode"></span></div>
    <div class="btns">
      <button data-dbg="mana">+5 mana</button>
      <button data-dbg="heal">Heal</button>
      <button data-dbg="hurtEnemy">Enemy −25</button>
      <button data-dbg="reroll">Reroll</button>
      <button data-dbg="skip">Skip fight</button>
      <button data-dbg="reset">Reset run</button>
      <button data-dbg="gold">+200 ✦</button>
      <button data-dbg="map">Map</button>
      <button data-dbg="wipe">Wipe save</button>
    </div>
  </section>
</div>

<!-- THE "?" IS GONE (Kerry, 2026-08-27). Settings already carries a Glossary
     entry, so this was a second door to the same room — and it cost a permanent
     30x30 control in the corner of every screen, under the 44x44 a finger
     needs, which collide.py had been warning about. One route, in the place
     people look for help. -->
<div id="tipLayer"><div id="tipCard"></div></div>
<div id="fx"></div>
<div id="banner"></div>
<div id="toast"></div>
<div class="screen" id="screen"><div class="inner" id="screenInner"></div></div>
<div id="picker"><div class="box panel" id="pickerBox"></div></div>
<script>
/* ============================================================
   RUNEWRIGHT — DATA
   Pure content: no behaviour, no calls into the engine. Kept in its own block so a
   content change cannot reach the engine by accident, and so a tool can read the
   tables without parsing the whole game. Everything declared here is visible to the
   engine block below, because this block runs first.
   ============================================================ */

const CONFIG = {
  version:"0.4.1",
  damage:  { perExploit:8, perfectMultiplier:1.5, minExploit:1 },
  /* Tuning multipliers applied to the enemy table and starting HP. The design doc's
     raw numbers are the 1.0 baseline; these exist so difficulty can be moved without
     editing seven enemy definitions. See the balance note in ENEMIES. */
  tuning:  { enemyHP:0.8, enemyDamage:0.41, eliteHP:0.85, eliteDamage:1.35, playerHPBonus:14,
             /* Per-act escalation. Difficulty comes from the content ahead, not
                from damage carried forward — bosses fully heal, so each act must
                stand on its own. Index = act number. */
             /* Measured over 158 runs: acts cost 9.7 / 9.5 / 14.0 HP a fight, so act 2 was
     easier than act 1. The creatures escalate correctly on paper; roughly 70% of
     that survives contact with a run that is also gaining relics, vials and talents,
     so the multipliers carry the rest.
     ACT 3 CARRIES MORE THAN THE OTHERS because the player arrives with twice the
     relics, a full satchel and a finished tree — measured, act 3 was CLEARING BEST
     at 85% once healing between fights was removed. The creatures have to outpace
     the build, not merely keep up with it. */
                /* Derived rather than guessed. Across three measured builds, each extra
                   HP an act drains costs it about 1.3% of its clear rate, and a 50%
                   run needs the acts to multiply to 0.50 — so 85/80/73 rather than a
                   flat 79 each, because the difficulty should RISE.
                   Act 3 carries the SMALLEST multiplier of the three because its
                   creatures are already the biggest; the multiplier only has to
                   finish what the roster starts. */
                actScaling:[ {hp:1.00, dmg:0.94},
                          {hp:0.95, dmg:1.55},   // act 2: sharper, not bigger
                          /* act 2 and 3 sharper rather than bigger: less health, more
                             damage. Act 2's creatures were 62 HP hitting for 3.9 —
                             fourteen blows to kill anyone — so its fights were long
                             rather than dangerous. Lethality comes from a blow a hurt
                             run cannot absorb, not from grinding. */
                          {hp:1.10, dmg:1.70} ] },
  mana:    { max:10, perExploit:2, perResonate:1, perfectBonus:1, substituteMultiplier:2 },
  resist:  { perResist:1, damageReductionPerLevel:1 },
  hints:   { echoMarkers:true },
  /* No element may fill more than this many slots, in the hidden sequence or in
     the player's incantation. Caps degenerate codes (🔥🔥🔥🔥🔥 occurs naturally
     about once in 1400) and blocks the all-one-element probe, which would let a
     player enumerate the sequence without deducing anything. */
  maxRepeat: 3,
  /* Curse gnaws slowly but detonates on a solve, so the Hexweaver's power comes
     from cracking the sequence rather than from refusing to. */
  /* Curse is a stockpile. It trickles while it sits, and is spent either cheaply
     and flatly (Rupture) or automatically and amplified (a Perfect). Rupture keeps
     the class from being locked out when solves are slow; the Perfect bonus keeps
     solving worth more. */
  /* A Resist no longer always becomes Curse. Most of the time it raises a ward
     like anyone else's would, so a stockpile has to be built deliberately. */
  curse:   { resistChance:0.60, tickPerStack:0.32, burstPerStack:2.4,
             perfectBonusPerStack:0.03, perfectBonusCap:0.8,
             wardResistPerLevel:0.12, maxWardResist:0.5 },
  /* Three shards make a Veilglass. An elite yields one shard, a boss a whole
     Veilglass, so three elites are worth one boss. */
  souls:   { shardsPerFragment:3, eliteShards:1, bossFragments:1, respecCost:60,
             openingFragments:3 },   // granted the first time a discipline is played
  /* Efficiency never takes a spell below this — at roughly 3.6 mana a turn, a
     2-cost spell is already castable most turns. */
  spells:  { cooldownTurns:1, slots:4 },   // a spell rests a turn; the harness has four sockets
  talents: { efficiencyFloor:2, efficiencyMax:2, potencyMax:3 },
  necromancy: { desperateBelow:0.25,   // share of max HP under which Shadow is cheap
                desperateCost:1,      // what a Shadow spell costs down there
                perfectHeal:0,     // share of max HP returned by a Shatter
                thrallShare:0.5,      // fraction of normal Fracture damage the thrall deals
                witherPerWard:2 },    // damage per ward level Wither strips
  /* What a vial is worth when it is thrown rather than drunk. Offensive draughts
     hit hardest; utility ones still break for something. */
  shatterflask: { base:6, heft:{
    searing:20, spite:18, might:16, voiding:12, echoing:12, symmetry:12,
    bulwark:10, restorative:10, nullify:10, time:14, mana:8, reveal:8,
    flowing:10, prospector:8 } },
  ashfall: { perCast:3, pyreMultiplier:3 },
  frostNew: { thawRate:2, hailPerEffect:4, permafrostTurns:3, permafrostCap:1 },
  divNew:   { convergencePerRune:4, certaintyDamage:15, sealTurns:4 },
  necroNew: { pactMana:10, pactHP:12, rotTurns:3, rotDamage:6, executeDamage:11 },
  alchNew:  { assayCost:30, leadenCost:40, quintPer:100, quintHeal:3, vitriolDivisor:10 },
  apothNew: { tasteCost:3, readingDelay:1 },
  hexNew2:  { titheCurse:5, titheMana:4 },
  hexNew:   { illOmenMultiplier:3 },
  poultice: { perVial:4 },
  /* Blood is not a cost — it is EXPOSURE. Every point spent comes back when the
     creature falls, so the price of a spell is the risk of dying before you
     collect. A run's healing budget is about 38 HP against 211 of enemy damage;
     unrepaid health costs of any size simply cannot be paid out of that. */
  blood: { repayOnKill:1.0, tapHP:6, tapMana:6 },
  carrionDebt: { hpCost:8, damage:24 },
  gravecall:   { perHealth:10, maxRunes:3 },
  hemorrhage:  { perHealth:2 },
  debasement: { aurelsPerWard:12 },
  whiteout: { turns:3 },
  fire:    { wallDamage:6, wallTurns:3,
             meteorBase:20, meteorPerExploit:4, meteorTurns:2 },
  /* A frozen slot pays out by what it catches: a right rune in the right place
     hardest, a right rune in the wrong place less, a wrong rune least. */
  frost:   { prisonTurns:4, coneDamage:13, armourCap:20,
             prison:{ exploit:8, resonate:5, resist:2 },
             prisonHard:{ exploit:12, resonate:8, resist:3 },
             armourDecay:0.5 },
  hex:     { maledictionCurse:2, maledictionTurns:1,
             evilEyeCurse:9, effigyShare:0.5, effigyTurns:3 },
  /* Solving already takes half the creature. The cost is getting there: six casts a
     solve, under fire the whole time. So a Perfect pays toward the NEXT solve — it
     leaves more of the new sequence glimpsed, and funds the questions that find it. */
  divination: { prophecyBonus:10, prophecyPerExploit:6, prophecyMana:1,
                perfectKeeps:2, perfectMana:2 },
  /* Rarity governs how often a thing is SEEN, not merely what it costs. A flat
     draw across a large pool makes the strong forgettable and the weak unavoidable. */
  /* Art and sound are OPTIONAL. Every asset falls back to what the game already
     does — an emoji, a flat colour, silence — so the game runs identically with no
     assets registered at all. Registering one asset changes one thing. */
  media: { musicVolume:0.5, sfxVolume:0.7, crossfadeMs:1200, enabled:true },
  rarity: { weights:{ common:60, uncommon:30, rare:10 },
            twinUncommonChance:0.35 },
  rewards: { choices:3, eliteChoices:2, healFraction:0 },   // no free mending between fights
  /* Economy. Conservative starting values, tuned against the measured
     combat baseline (see BALANCE note) and adjusted only via telemetry. */
  economy: {
    goldEnemy:[22,30], goldElite:[55,70], goldBoss:[80,100],
    rerollBase:15, rerollStep:10,
    potionCapacity:3, potionsPerTurn:3, goldPerMana:9,
    shopVials:4, shopRelics:3,
    relicPrice:{ common:75, uncommon:90, rare:120 },
    /* How dearly mana buys what Aurels buys cheaply. Above 1.0 the purse is always the
       better route, which is the point — this is a way out of an empty turn, not a
       second currency. */
    leadRate:1.6,
    /* The keeper knows what you have been through. Prices climb act by act, so the
       first Sanctum stays affordable and the last one asks you to choose. */
    actPrice:[1.00, 1.45, 1.95],
    vialDropChance:0.25          // a creature leaves a vial about one fight in four
  },
  map: { rows:8, minWidth:2, maxWidth:4, eliteFromRow:2, eliteRow:3, secondEliteRow:6, shopRows:[2,6], restRow:5, lanes:5, paths:6 },
  timing:  { runeFlight:440, reveal:120, beforeEnemy:620, enemyAct:520 },
  /* The incantation is spoken as one thing, so the runes gather, wind together and
     travel as a single fused spell rather than as separate darts. */
  /* THE CAST, SLOWED WHERE IT MATTERS (Kerry, 2026-08-26). The travel to the
     meeting point keeps its old pace — that part was never unclear. What was too
     fast to read is the COMBINING, so it now has three stages of its own:
       condense  the clouds pull in tight from their gathered size
       shake     the packed knot trembles as it takes the strain
       launch    it goes
     gather 320 unchanged; the middle was 360ms for the whole thing and is now
     760 across condense+shake; launch 420 -> 520 so the flight can be followed. */
  /* THE CADENCE (Kerry, 2026-08-26): the runes rise to the staff, CIRCLE THERE
     — large and slow, and this is the longest beat of the cast — then contract
     briefly and shoot. No longer overall than before: 1540ms against 1600, with
     the weight moved onto the swirl.
       gather   240  up to the staff, brisk
       swirl    700  the slow part, wide and turning
       contract 200  a quick tightening, the wind-up
       launch   400  and away
     spinTurns drops to 1: two full turns inside 700ms read as a blur rather
     than as circling. */
  cast:    { gatherMs:240, swirlMs:700, contractMs:200, launchMs:400, spinTurns:1 },
  /* the page turn. Long enough to have weight, short enough that choosing four
     crafts in a row does not become a wait. */
  pageTurnMs: 780
};

const TEXT = {
  currency:"Aurels", currencyShort:"✦", currencyIcon:"🪎",
  map:"The Path", act:"Act", shop:"Sanctum", shopkeeper:"The Curator",
  /* The keeper has a face and a few things to say, so the Sanctum reads as a person
     rather than a list. */
  shopkeeperGlyph:"\ud83e\uddd9",
  shopkeeperLines:[
    "Everything here was carried by someone who no longer needs it.",
    "Take your time. The road will not.",
    "I do not haggle. I have seen what haggling costs.",
    "Prices climb the deeper you go. So does everything else.",
    "One relic a visit. I have my reasons and you have your coin."
  ],
  elite:"Elite", boss:"Boss", enemy:"Creature",
  reroll:"Reroll stock", potions:"Vials", spellbook:"Spellbook",
  mastery:"Arcane Mastery", learnSpell:"Learn a new spell",
  masterSpell:"Master a spell you know",
  disciplines:{ pyromancer:"Fire", cryomancer:"Frost", warlock:"Necromancy",
                apothecary:"Apothecary", alchemist:"Alchemy",
                hexweaver:"Hexweaving", diviner:"Divination" }
};

const ELEMENTS = [
  { id:"fire",      name:"Fire",      glyph:"🔥", color:"#ff6a3d" },
  { id:"water",     name:"Water",     glyph:"💧", color:"#3fa4e6" },
  { id:"nature",    name:"Nature",    glyph:"🌿", color:"#57c46b" },
  { id:"lightning", name:"Lightning", glyph:"⚡", color:"#f4d64a" },
  { id:"ice",       name:"Ice",       glyph:"❄️", color:"#7fdbe8" },
  { id:"shadow",    name:"Shadow",    glyph:"🌑", color:"#a86bdf" }
];

/* THE UNLOCK LADDER.
   It used to run 1/3/5/7/9/11, which measured out at 27 minutes between disciplines —
   and Necromancy and the Apothecary arrived in the SAME RUN. A player finished one run
   holding four disciplines and had learned none of them.
   The gates now grow steeply rather than evenly, because the rate of felling bosses
   RISES as more disciplines open: Frost and Necromancy fell them nearly as fast as
   Fire, so a linear ladder would close faster the further along it went. Measured
   against real play these give roughly one discipline's worth of practice between
   unlocks — about an hour early, two to three hours later — with all seven open at
   around 9 1/2 hours, against 26 1/2 to fill every tree.
   A LOSING RUN STILL COUNTS: Fire fells 0.89 bosses even when it dies, so no run is
   wasted progress, which is what stops a longer ladder feeling like a wall. */

   A passive says what the rule is; this says what the run FEELS like, which is what a
   player choosing between seven of them actually needs. */

</script>
<script>
"use strict";
/* ============================================================
   1. CONFIG — every balance number lives here.
   ============================================================ */
/* ============================================================
   1b. TEXT — every player-facing string for the new systems lives here.
   Swap this table to change terminology/lore without touching logic.
   (Combat strings are still inline from earlier milestones; extracting
   them is a mechanical follow-up pass.)
   ============================================================ */
/* ============================================================
   2. CONTENT — elements
   ============================================================ */
const EL = Object.fromEntries(ELEMENTS.map(e => [e.id, e]));
const glyphs = ids => ids.map(id => EL[id].glyph).join(" ");
/* Falls back to the wizard's own name, so a missing TEXT entry can never render
   as "undefined" on the selection screen again. */
const disciplineName = id => TEXT.disciplines[id] || (WIZ[id] && WIZ[id].name) || id;

/* ============================================================
   3. CONTENT — spells
   target: null | "position" | "element" | "twoPositions"
   cast() returns a message string. Spells never consume the turn.
   ============================================================ */
const SPELLS = {
  fireball: { name:"Fireball", glyph:"🔥", cost:{fire:4}, element:"fire", target:null, potencyStep:"+4 damage",
    desc:"Deal 12 direct damage.",
    cast(){
      let dmg = 12 + 4 * potency("fireball");
      const m = masteryOf("fireball");
      if (m && m.bonus) dmg += m.bonus();
      if (m && m.multiplier) dmg *= m.multiplier();
      damageEnemy(dmg, { spell:true });
      if (m && m.apply) m.apply();
      return "Fireball sears for " + dmg + (m ? " · " + m.name : "") + ".";
    } },

  combustion: { name:"Combustion", glyph:"💥", cost:{fire:5}, element:"fire", target:null, potencyStep:"+3 damage",
    /* Unconditional: heat that lands whatever the sequence says. Fire had no
       reliable damage below tier 3, and a conditional multiplier is worth nothing
       on a turn you guess badly — which is the turn you needed it. */
    desc:"Your next incantation deals +10 damage, however it lands.",
    ready(){ return !B.flags.combustion; },
    cast(){ B.flags.combustion = true;
      B.flags.combustionBonus = 10 + 3 * potency("combustion");
      return "Heat gathers. Your next incantation strikes for +" + B.flags.combustionBonus + "."; } },

  scrying_pool: { name:"Scrying Pool", glyph:"🔮", cost:{water:3}, element:"water", target:"position",
    desc:"Name a position. Learn whether the rune you have placed there would Fracture.",
    ready(){ return draftFull(); },
    hint:"Fill every slot first.",
    cast(pos){
      const hit = B.draft[pos] === B.enemy.code[pos];
      markKnown(pos, hit);
      noteInsight(EL[B.draft[pos]].glyph + (hit ? " belongs in slot " : " does NOT belong in slot ") + (pos+1), "🔮");
      return "Position " + (pos+1) + ": " + EL[B.draft[pos]].glyph +
             (hit ? " <b class='k-exploit'>would Fracture</b>." : " <b class='k-resist'>would not</b>.");
    } },

  flow: { name:"Flow", glyph:"🌊", cost:{water:4}, element:"water", target:"twoPositions",
    desc:"Reload your last incantation with two positions swapped.",
    ready(){ return !!lastIncantation(); },
    hint:"Cast something first.",
    cast(pair){
      const prev = lastIncantation();
      if (!prev) return "Nothing to reshape yet.";
      const last = prev.guess.slice();
      const [a,b] = pair;
      [last[a], last[b]] = [last[b], last[a]];
      B.draft = last; renderSlots();
      return "The current carries your runes into a new order.";
    } },

  regrowth: { name:"Regrowth", glyph:"🌱", cost:{nature:5}, element:"nature", target:null, potencyStep:"+3 HP",
    desc:"Heal 8 HP.",
    ready(){ return RUN.hp < RUN.maxHP; },
    hint:"Already at full health.",
    cast(){
      const m = masteryOf("regrowth");
      let amt = 8 + 3 * potency("regrowth");
      if (m && m.multiplier) amt = Math.round(amt * m.multiplier());
      if (m && m.apply) m.apply();
      const h = healPlayer(amt);
      return "Green light knits you together. +" + h + " HP" + (m ? " · " + m.name : "") + ".";
    } },

  bloom: { name:"Bloom", glyph:"🌸", cost:{nature:6}, element:"nature", target:null,
    desc:"Your next incantation generates double mana from Resonates.",
    ready(){ return !B.flags.bloom; },
    cast(){ B.flags.bloom = true; return "Resonances will bloom twofold."; } },

  spark: { name:"Spark", glyph:"✨", cost:{lightning:3}, element:"lightning", target:"element",
    desc:"Name an element. Learn whether it appears anywhere in the sequence.",
    cast(el){
      const present = B.enemy.code.includes(el);
      B.known.absent = B.known.absent || {};
      if (!present) B.known.absent[el] = true;
      noteInsight(EL[el].glyph + (present ? " appears somewhere" : " appears nowhere"), "⚡");
      return EL[el].glyph + " " + EL[el].name + " is <b class='" +
             (present ? "k-exploit'>PRESENT" : "k-resist'>ABSENT") + "</b>.";
    } },

  overcharge: { name:"Overcharge", glyph:"⚡", cost:{ice:6}, alt:"water", element:"ice", target:null,
    desc:"The enemy skips its next action.",
    ready(){ return !B.flags.skipEnemy; },
    cast(){ B.flags.skipEnemy = true; renderIntent(); return "Arcs of current lock the creature in place."; } },

  frost_armor: { name:"Frost Armor", glyph:"🛡", cost:{ice:4}, element:"ice", target:null, potencyStep:"+4 Block",
    desc:"Gain 10 Block. It soaks the blow and deals back whatever breaks through — and rather than melting away, half of it carries into the next turn.",
    cast(){
      /* Shatterplate is what Frost Armor IS now — armour that answers back —
         rather than one branch of a choice. */
      B.flags.blockReflects = true;
      let amt = 10 + (hasRelic("ice_crown") ? 5 : 0) + 4 * potency("frost_armor");
      /* Capped. Frost was casting this four times a fight because each layer
         compounded on the last; past the cap another casting does nothing. */
      const cap = CONFIG.frost.armourCap + 4 * potency("frost_armor");
      const before = B.block;
      B.block = Math.min(cap, B.block + amt);
      B.flags.frostArmour = true;      // this armour thins instead of vanishing
      renderHP();
      amt = B.block - before;
      return amt > 0 ? "Rime sheathes you. +" + amt + " Block."
                     : "The rime is already as thick as it will hold.";
    } },

  freeze: { name:"Freeze", glyph:"❄️", cost:{ice:7}, element:"ice", target:null,
    desc:"Your next incantation grants the enemy no Resistance.",
    ready(){ return !B.flags.freeze; },
    cast(){ B.flags.freeze = true; return "The creature's ward is frozen solid."; } },

  dark_bargain: { name:"Dark Bargain", glyph:"🕯", cost:{shadow:7}, hpCost:19, element:"shadow", target:null,
    desc:"Pay 19 health, once per encounter. The dark lays bare one slot of the sequence — and it chooses which.",
    /* You do not pick the slot: that is what makes it a bargain rather than a
       purchase, and it is why the spell weakens as you learn more. */
    ready(){ return RUN.hp > 20 && !B.once.darkBargain; },
    hint(){ return B.once.darkBargain ? "The dark has answered once already." : "Not enough life left to bargain with."; },
    cast(){
      B.once.darkBargain = true;
      const hidden = [];
      for (let i = 0; i < B.enemy.codeLength; i++)
        if (B.known.revealed[i] === undefined) hidden.push(i);
      const pos = hidden.length ? rndOf(hidden) : Math.floor(Math.random() * B.enemy.codeLength);
      const id = B.enemy.code[pos];
      B.known.revealed[pos] = id;
      renderSlots();
      noteInsight(EL[id].glyph + " goes in slot " + (pos+1), "🕯");
      return "The dark chooses slot <b>" + (pos+1) + "</b> — it holds <b>" +
             EL[id].glyph + " " + EL[id].name + "</b>.";
    } },

  /* --- Apothecary --- */
  decoction: { name:"Decoction", glyph:"⚗️", cost:{nature:3}, element:"nature", target:null,
    desc:"Brew a random vial on the spot.",
    ready(){ return RUN.potions.length < potionCapacity(); },
    hint:"Your satchel is full.",
    cast(){
      /* Double Batch: every second brew of a turn comes out doubled. */
      B.flags.brewCount = (B.flags.brewCount || 0) + 1;
      const twin = has("DOUBLE_BATCH") && B.flags.brewCount % 2 === 0;
      const take = id => {
        grantPotion(id);
        return POTIONS[id].glyph + " " + POTIONS[id].name;
      };
      if (has("SELECTIVE")){
        /* Selective: two are drawn, you keep one. */
        const a = randomPotionId();
        let b = randomPotionId();
        for (let i = 0; i < 6 && b === a; i++) b = randomPotionId();
        openChoice("Which draught settles?", "The other is poured away.",
          [a,b].map(id => ({ v:id, glyph:POTIONS[id].glyph, sub:POTIONS[id].name })),
          id => {
            const got = take(id);
            if (twin) take(randomPotionId());
            toast("You keep <b>" + got + "</b>.", 2200);
          });
        return "Two draughts settle. Choose one.";
      }
      const first = take(randomPotionId());
      const second = twin ? take(randomPotionId()) : null;
      return second ? "A double batch — <b>" + first + "</b> and <b>" + second + "</b>."
                    : "You brew <b>" + first + "</b>.";
    } },

  catalysis: { name:"Catalysis", glyph:"🜂", cost:{water:6}, element:"water", target:null,
    desc:"The next vial you drink this turn takes effect twice.",
    ready(){ return !B.flags.catalysis; }, hint:"Already catalysed.",
    cast(){ B.flags.catalysis = true; return "The next draught will work twice over."; } },

  /* --- Alchemist --- */
  transmute: { name:"Transmute", glyph:"⚱️", cost:{water:4}, element:"water", target:"element", potencyStep:"+1 mana",
    /* Transmutation costs something. Four of one element becomes three of another,
       and only a practised hand gets the whole of it back. */
    desc:"Convert 4 mana of your fullest pool into 3 of a chosen element. Some is always lost in the change.",
    cast(el){
      const from = ELEMENTS.filter(e => e.id !== el && B.mana[e.id] >= 4)
                           .sort((a,b) => B.mana[b.id] - B.mana[a.id])[0];
      if (!from) return "No pool holds enough to transmute.";
      const amt = 3 + potency("transmute");
      B.mana[from.id] -= 4; addMana(el, amt, true);
      return "4 " + from.glyph + " becomes " + amt + " " + EL[el].glyph +
             (amt < 4 ? " — the rest is lost." : ".");
    } },

  distil: { name:"Distil", glyph:"⚗", cost:{water:4}, element:"water", target:null, noGold:true, potencyStep:"+10 Aurels",
    desc:"Render 4 mana into 30 Aurels. Must be paid in mana — Aurels cannot buy Aurels.",
    cast(){
      const m = masteryOf("distil");
      let gain = 30 + 10 * potency("distil");
      if (m && m.multiplier) gain = Math.round(gain * m.multiplier());
      if (m && m.extra) m.extra();
      RUN.gold += gain; RUN.stats.goldEarned += gain; renderPurse();
      return "Mana thickens into <b>" + gain + " " + TEXT.currencyShort + "</b>.";
    } },

  gold_shard: { name:"Gold Shard", glyph:"💰", cost:{gold:55}, element:"gold", target:null, potencyStep:"+6 damage",
    desc:"Hurl your own wealth. Deals 22 damage and spends the Aurels for good.",
    cast(){
      const dmg = 22 + 6 * potency("gold_shard");
      const spent = paymentOptions("gold_shard")[0].cost;
      const before = B.enemy.hp;
      damageEnemy(dmg, { spell:true });
      let extra = "";
      if (has("SHRAPNEL")){
        let stripped = 0;
        ELEMENTS.forEach(e => {
          if (B.enemy.resist[e.id] > 0) stripped += stripWard(e.id, 1);
        });
        if (stripped){ renderResist(); extra += " Shrapnel scores " + stripped + " ward level(s) away."; }
      }
      if (has("RECOVERED") && before > 0 && B.enemy.hp <= 0){
        const back = addAurels(Math.round(spent / 2));
        extra += " <b>" + back + " " + TEXT.currency + "</b> is prised back off the corpse.";
      }
      return "Your wealth strikes for <b>" + dmg + "</b>." + extra;
    } },

  /* --- Apothecary --- */
  corrosive: { name:"Corrosive Flask", glyph:"🧫", cost:{ice:5}, element:"ice", target:null, potencyStep:"+3 damage",
    desc:"Deal 8 damage and strip one level from every ward. The stripping is the point; the damage is a courtesy.",
    cast(){
      const dmg = 8 + 3 * potency("corrosive");

      return "The flask eats through its defences — " + dmg + " damage.";
    } },

  /* --- late-unlock spells, one per discipline --- */
  spellstorm: { name:"Spellstorm", glyph:"🌩", cost:{lightning:5}, element:"lightning", target:null,

  symmetry_ward: { name:"Symmetry Ward", glyph:"🔷", cost:{water:6}, element:"water", target:null,

  panacea: { name:"Panacea", glyph:"🧴", cost:{nature:7}, element:"nature", target:null,

  midas_touch: { name:"Midas Touch", glyph:"👑", cost:{gold:50}, element:"gold", target:null,

  doom_mark: { name:"Doom Mark", glyph:"☠", cost:{shadow:6}, element:"shadow", target:null,

  wall_of_flame: { name:"Wall of Flame", glyph:"🔥", cost:{fire:5}, element:"fire", target:null,

  scorch_mark: { name:"Scorch Mark", glyph:"♨️", cost:{lightning:3}, element:"lightning", target:"position",

  gravecall: { name:"Gravecall", glyph:"💀", cost:{shadow:5}, alt:"ice",

  /* ---------- APOTHECARY: the compounding satchel ---------- */
  alkahest: { name:"Alkahest", glyph:"🧪", cost:{water:6}, element:"water", target:"element",
    desc:"Name an element. Its ward dissolves entirely, and the creature can never ward that element again this fight.",
    potencyStep:"+2 damage per level dissolved",
    cast(el){
      B.flags.noWard = B.flags.noWard || {};
      let dissolved = 0, names = [];
      const eat = id => {
        dissolved += B.enemy.resist[id] || 0;
        B.enemy.resist[id] = 0;
        B.flags.noWard[id] = true;
        names.push(EL[id].glyph + " " + EL[id].name);
      };
      eat(el);
      /* Universal Solvent: the acid does not stop at one element. */
      if (has("SOLVENT")){
        const rest = ELEMENTS.map(e => e.id).filter(id => id !== el && !B.flags.noWard[id]);
        if (rest.length){
          const second = rest.reduce((a,b) =>
            (B.enemy.resist[a]||0) >= (B.enemy.resist[b]||0) ? a : b);
          eat(second);
        }
      }
      renderResist();
      names.forEach(n => noteInsight(n + " can no longer be warded", "🧪"));
      let extra = "";
      /* Etchant: what it eats, it burns for. */
      if (has("ETCHANT") && dissolved){
        const dmg = dissolved * 4;
        damageEnemy(dmg, { spell:true });
        extra += " The acid burns for <b>" + dmg + "</b>.";
      }
      /* Slow Acid: the rest of its guard keeps corroding. */
      if (has("SLOW_ACID")){
        B.flags.slowAcid = true;
        extra += " What remains of its guard will keep corroding.";
      }
      return names.join(" and ") + " <b>dissolved</b>" +
             (dissolved ? " (" + dissolved + " levels)" : "") + "." + extra;
    } },

   one; the rest arrive through boss victories (design principle 14). */
/* A discipline's POOL is everything it can ever draw on. Most of it is available
   from the very first run — the player just does not start EQUIPPED with it.
   Only `LOCKED_SPELLS` are gated behind boss victories, so progression injects new
   possibilities into an already-full game rather than assembling a game from nothing. */
/* Assignments authored in the spell tool and imported verbatim.
   POOL — everything a discipline can ever learn. */

   content edit, not an engine change. Fireball is the worked template. */
const MASTERIES = {
  regrowth: [
    { id:"verdant", name:"Regrowth: Verdant", glyph:"🌳",

  ],

    { id:"virulent", name:"Hex: Virulent", glyph:"🕷",

    { id:"lingering", name:"Hex: Lingering", glyph:"🌒",

  ],

  ],

      bonusReveal(){ return B.once.reformed ? 1 : 0; } },
    { id:"premonition", name:"Foresight: Premonition", glyph:"🔮",
      desc:"Also grants 4 Block — you see the blow coming.",
      apply(){ gainBlock(4); renderHP(); } }
  ],
  fireball: [
    { id:"inferno", name:"Fireball: Inferno", glyph:"🔥",
      desc:"Fireball also burns: the creature takes 4 more damage at the end of each of its turns.",
      apply(){ B.flags.burn = (B.flags.burn || 0) + 4; } },
    { id:"catalyst", name:"Fireball: Catalyst", glyph:"☄️",
      desc:"Fireball deals 5 extra damage for every Fire Fracture in your last incantation.",
      bonus(){
        const last = lastIncantation();
        if (!last) return 0;
        return 5 * last.results.filter((r,i) => r === "exploit" && last.guess[i] === "fire").length;
      } },
    { id:"echoing", name:"Fireball: Echoing Flame", glyph:"🎆",
      desc:"If the sequence holds more than one Fire, Fireball strikes twice.",
      multiplier(){ return B.enemy.code.filter(x => x === "fire").length > 1 ? 2 : 1; } }
  ]
};
function masteryOf(spellId){
  const m = SAVE.data.masteries[spellId];
  return m ? (MASTERIES[spellId] || []).find(x => x.id === m) : null;
}

/* PERMANENT RUN UPGRADES — the prize for an elite, alongside a relic. Once sold in the
   Sanctum, where they sat awkwardly beside consumables; the fight is the price now.
   Attunement and Focus name an element, so each has six faces and the offer is drawn
   from all of them, which is why four choices can be shown from four upgrades. */
const UPGRADES = {
  attunement: { name:"Attunement", glyph:"◈", element:true,
    desc(el){ return "Every Fracture generates 1 extra " + EL[el].glyph + " " + EL[el].name +
                     " mana, for the rest of the run."; },
    take(el){ RUN.shop.attune[el] = (RUN.shop.attune[el] || 0) + 1; } },

  focus: { name:"Focus", glyph:"◎", element:true,
    desc(el){ return "The first " + EL[el].glyph + " " + EL[el].name + " mana of each encounter brings 2 more."; },
    take(el){ RUN.shop.focus[el] = (RUN.shop.focus[el] || 0) + 1; } },

  vitality: { name:"Vitality", glyph:"❤",
    /* Necromancy pays for its spells as a share of maximum life, so more of it would
       simply raise its own prices. Withheld rather than weakened. */
    hidden(){ return RUN.wizard === "warlock"; },
    desc(){ return "Max HP +6, and mend 18 now."; },
    take(){ RUN.maxHP += 6; RUN.hp = Math.min(RUN.maxHP, RUN.hp + 18); renderHP(); } },

  prismatic: { name:"Prismatic Infusion", glyph:"🌈", max:2,
    desc(){ const lv = RUN ? (RUN.shop.prismatic || 0) : 0;
            return "Foreign mana costs " + subMultiplier(lv + 1).toFixed(2).replace(/0$/,"") +
                   "\u00d7 instead of " + subMultiplier(lv).toFixed(2).replace(/0$/,"") + "\u00d7."; },
    take(){ RUN.shop.prismatic = (RUN.shop.prismatic || 0) + 1; } }
};

/* Every face an upgrade can wear, so four distinct choices can be drawn. */
function upgradeOffers(){
  const out = [];
  Object.entries(UPGRADES).forEach(([id, u]) => {
    if (u.hidden && u.hidden()) return;
    if (u.max && (RUN.shop[id] || 0) >= u.max) return;
    if (u.element) ELEMENTS.forEach(e => out.push({ id, el:e.id }));
    else out.push({ id, el:null });
  });
  return out;
}

/* ---------- ACTS ----------
   Each act draws its own creature pool and ends in a boss that breaks a
   different Codebreaker assumption. */
/* ---------- MAP GENERATION ----------
   Slay-the-Spire-shaped: rows of nodes, edges only to adjacent columns in the
   next row, so paths branch and reconnect but never run backward. */
/* THE MAP IS BUILT SO THAT CROSSINGS CANNOT EXIST.
   The original generator drew each row's width independently and let every node pick
   its own targets, which produced three visible faults measured over 4000 acts: 30% of
   adjacent rows changed width by two or more, so nodes appeared from nowhere; 0.55
   pairs of edges CROSSED each other per row gap, which is what read as a knot; and 5%
   of edges travelled the full width to reach something visually unrelated.
   Walking travellers up the map fixed only half of it — two travellers can SWAP lanes,
   and that is a real crossing. So the rule is stronger here: each node's children are a
   CONTIGUOUS RANGE, and those ranges never decrease from left to right. Lines may fan
   apart or converge; they can never trade places. Width takes a step of at most one per
   row, so nothing ever materialises out of nowhere. */
function generateMap(actIndex){
  const M = CONFIG.map;
  const lo = M.minWidth, hi = M.maxWidth;

  /* WHERE THE CAMPFIRES STAND. Fixed at one row, a camp became a landmark you could
     set your watch by; scattered at random, a run could pass none at all. So the
     ROW is random and the COUNT is guaranteed: one after the elite in acts 1 and 2,
     and in act 3 one on each side of it, because act 3 drains more than a full pool. */
  const after = [];
  for (let r = M.eliteRow + 1; r < M.rows - 1; r++) after.push(r);
  const before = [];
  for (let r = 1; r < M.eliteRow; r++) before.push(r);
  const camps = new Set([ rndOf(after) ]);
  if (actIndex >= 2 && before.length) camps.add(rndOf(before));
  M.campRows = camps;

  /* Widths take a random walk rather than being drawn independently. */
  const W = new Array(M.rows);
  W[0] = 1;
  W[M.rows-1] = 1;
  /* The walk is biased into an arc: opening out through the first half and drawing in
     through the second. An unbiased walk spent most of its rows at the minimum, which
     left the player with two choices for most of an act — smooth, but not interesting. */
  const mid = (M.rows - 1) / 2;
  for (let r = 1; r < M.rows - 1; r++){
    const prev = W[r-1] || lo;
    const opening = r <= mid;
    const roll = Math.random();
    const step = opening ? (roll < 0.55 ? 1 : roll < 0.85 ? 0 : -1)
                         : (roll < 0.45 ? -1 : roll < 0.8 ? 0 : 1);
    let w = prev + step;
    if (w < lo) w = lo;
    if (w > hi) w = hi;
    W[r] = w;
  }
  /* Both ends funnel to a single node, so the rows beside them stay at the minimum.
     Clamping only the last one left a 4-wide row dropping straight to 2, so the map
     is EASED down from the end backwards: each row may be at most one wider than the
     one after it. */
  W[1] = lo;
  W[M.rows-2] = lo;
  for (let r = M.rows - 3; r >= 1; r--)
    W[r] = Math.min(W[r], W[r+1] + 1);

  const map = [];
  for (let r = 0; r < M.rows; r++){
    const row = [];
    for (let c = 0; c < W[r]; c++)
      row.push({ r, c, type:nodeType(r, c, M), visited:false, id:r + "-" + c, to:[] });
    map.push(row);
  }

  for (let r = 0; r < M.rows - 1; r++){
    const a = map[r], b = map[r+1];
    /* Where each node sits in the row below, proportionally. Non-decreasing by
       construction, which is what makes everything below safe. */
    const target = a.map((_, i) =>
      a.length === 1 ? 0 : Math.round(i / (a.length - 1) * (b.length - 1)));

    /* THE INVARIANT: node i's children are the contiguous range [lo, hi], and
       hi(i-1) <= lo(i) for every i. Two edges cross exactly when a left node reaches
       further right than a right node reaches left, so forbidding that one comparison
       forbids every crossing. Walked left to right, since each range depends on the
       one before it. */
    let prevHi = -1;
    const lo = [], hi = [];
    a.forEach((n, i) => {
      let l = target[i], h = target[i];
      const nextTarget = i + 1 < a.length ? target[i+1] : b.length - 1;
      /* reach one left, but never back past where the previous node already reaches */
      if (Math.random() < 0.35 && l - 1 >= 0 && l - 1 >= prevHi) l -= 1;
      /* reach one right, but never past where the next node begins */
      if (Math.random() < 0.55 && h + 1 < b.length && h + 1 <= nextTarget) h += 1;
      lo[i] = l; hi[i] = h; prevHi = h;
    });

    /* Any node below that nobody reaches is taken up by the range nearest to it, which
       cannot break the ordering because the ranges are already ordered. */
    for (let j = 0; j < b.length; j++){
      if (lo.some((l, i) => j >= l && j <= hi[i])) continue;
      let best = 0, gap = Infinity;
      for (let i = 0; i < a.length; i++){
        const d = j < lo[i] ? lo[i] - j : j - hi[i];
        if (d < gap){ gap = d; best = i; }
      }
      if (j < lo[best]) lo[best] = j; else hi[best] = j;
    }

    a.forEach((n, i) => {
      n.to = [];
      for (let j = lo[i]; j <= hi[i]; j++) n.to.push(j);
    });
  }
  return map;
}

function nodeType(r, c, M){
  if (r === M.rows - 1) return "boss";
  if (r === 0) return "enemy";
  /* Guaranteed: whichever way you go, one campfire per act. Mid-act rather than
     before the boss, so the boss is still fought with what the act left you. */
  /* An elite mid-act, and campfires wherever this act placed them. */
  if (r === M.eliteRow) return "elite";
  /* Trial 5: a second elite, late, where a worn run meets it. */
  if (asc() >= 5 && r === M.secondEliteRow) return "elite";
  if (M.campRows && M.campRows.has(r)) return "rest";
  if (M.shopRows.includes(r) && Math.random() < 0.55) return "shop";
  if (r >= M.eliteFromRow && Math.random() < 0.20) return "elite";
  const roll = Math.random();
  if (roll < 0.10) return "rest";
  if (roll < 0.20) return "treasure";     // was 0.18-0.24; the event slot came here
  if (roll < 0.32) return "shop";
  return "enemy";
}

const POTION_IDS = Object.keys(POTIONS);
/* One weighted draw, used for vials and relics alike. Anything without a stated
   rarity counts as common, so older content keeps working unchanged. */
function rarityWeight(rarity){
  return CONFIG.rarity.weights[rarity || "common"] || CONFIG.rarity.weights.common;
}
function weightedPick(ids, rarityOf){
  if (!ids.length) return null;
  const total = ids.reduce((n, id) => n + rarityWeight(rarityOf(id)), 0);
  let roll = Math.random() * total;
  for (const id of ids){
    roll -= rarityWeight(rarityOf(id));
    if (roll <= 0) return id;
  }
  return ids[ids.length - 1];
}
/* Draw several distinct ids, each drawn by weight rather than flatly. */
function weightedSample(ids, n, rarityOf){
  const left = ids.slice(), out = [];
  while (out.length < n && left.length){
    const id = weightedPick(left, rarityOf);
    out.push(id);
    left.splice(left.indexOf(id), 1);
  }
  return out;
}
const potionRarity = id => (POTIONS[id] || {}).rarity;
const relicRarity  = id => (RELICS[id]  || {}).rarity || ((RELICS[id]||{}).rare ? "rare" : "common");

function randomPotionId(){ return weightedPick(POTION_IDS, potionRarity) || POTION_IDS[0]; }

/* Vials are sold from the POTIONS table itself — one source of truth, so any new
   vial appears in the Sanctum automatically. */

});

/* ============================================================
   7. CODEBREAKER — the fundamental functions.
   ============================================================ */
function evaluateGuess(guess, code){
  if (guess.length !== code.length) throw new Error("length mismatch");
  const n = code.length;
  const result = new Array(n).fill(null);
  const codeTaken = new Array(n).fill(false);
  for (let i = 0; i < n; i++)
    if (guess[i] === code[i]){ result[i] = "exploit"; codeTaken[i] = true; }
  for (let i = 0; i < n; i++){
    if (result[i]) continue;
    for (let j = 0; j < n; j++){
      if (codeTaken[j] || guess[i] !== code[j]) continue;
      result[i] = "resonate"; codeTaken[j] = true; break;
    }
  }
  for (let i = 0; i < n; i++) if (!result[i]) result[i] = "resist";
  return result;
}
/* Echo: a matched rune whose element fills more slots than the player committed. */
function detectEchoes(guess, code, result){
  const inCode = {}, inGuess = {};
  code.forEach(id => inCode[id] = (inCode[id]||0) + 1);
  guess.forEach(id => inGuess[id] = (inGuess[id]||0) + 1);
  return result.map((r,i) => r === "resist" ? false : (inCode[guess[i]]||0) > (inGuess[guess[i]]||0));
}

(function selfTest(){
  const cases = [
    { code:["fire","fire","water","nature"], guess:["fire","water","water","lightning"], want:{exploit:2,resonate:0,resist:2} },
    { code:["fire","nature","lightning"], guess:["fire","nature","lightning"], want:{exploit:3,resonate:0,resist:0} },
    { code:["fire","water","water"], guess:["water","water","fire"], want:{exploit:1,resonate:2,resist:0} },
    { code:["ice","ice","ice"], guess:["ice","fire","fire"], want:{exploit:1,resonate:0,resist:2} },
    { code:["fire","water","nature"], guess:["shadow","shadow","shadow"], want:{exploit:0,resonate:0,resist:3} },
    { code:["fire","water","nature"], guess:["nature","fire","water"], want:{exploit:0,resonate:3,resist:0} }
  ];
  let p = 0;
  cases.forEach((c,i) => {
    const got = { exploit:0, resonate:0, resist:0 };
    evaluateGuess(c.guess, c.code).forEach(r => got[r]++);
    if (["exploit","resonate","resist"].every(k => got[k] === c.want[k])) p++;
    else console.error("codebreaker test " + i + " FAILED", c, got);
  });
  const echoCases = [
    { code:["fire","fire","water"], guess:["fire","water","nature"], want:[true,false,false] },
    { code:["fire","fire","water"], guess:["fire","fire","nature"], want:[false,false,false] },
    { code:["fire","fire","water"], guess:["ice","ice","ice"],       want:[false,false,false] },
    { code:["ice","ice","ice"],     guess:["ice","fire","fire"],     want:[true,false,false] }
  ];
  let e = 0;
  echoCases.forEach((c,i) => {
    const got = detectEchoes(c.guess, c.code, evaluateGuess(c.guess, c.code));
    if (got.every((v,k) => v === c.want[k])) e++;
    else console.error("echo test " + i + " FAILED", c, got);
  });
  console.log("self-test — codebreaker " + p + "/" + cases.length + ", echo " + e + "/" + echoCases.length);
  window.evaluateGuess = evaluateGuess;
  window.detectEchoes = detectEchoes;
})();

/* ============================================================
   7b. PERSISTENCE — the PERMANENT half of progression.
   Survives death, new runs and refresh. Never holds run-specific state.
   ============================================================ */
/* Veilglass shards are permanent progression, banked per discipline — a Fire clear
   funds Fire's tree, not everyone's. */
function shardsOf(wiz){ return (SAVE.data.shardsBy && SAVE.data.shardsBy[wiz]) || 0; }
/* A discipline is handed its opening fragments once, the first time it is played,
   so its first three talents are chosen rather than assumed. */
function seedDiscipline(wiz){
  SAVE.data.seeded = SAVE.data.seeded || {};
  if (SAVE.data.seeded[wiz]) return false;
  SAVE.data.seeded[wiz] = true;
  SAVE.data.shardsBy = SAVE.data.shardsBy || {};
  SAVE.data.shardsBy[wiz] = shardsOf(wiz) +
    CONFIG.souls.openingFragments * CONFIG.souls.shardsPerFragment;
  SAVE.commit();
  return true;
}
function fragmentsOf(wiz){ return Math.floor(shardsOf(wiz) / CONFIG.souls.shardsPerFragment); }
function shardRemainder(wiz){ return shardsOf(wiz) % CONFIG.souls.shardsPerFragment; }
function awardShards(n, why){
  const w = RUN.wizard;
  SAVE.data.shardsBy = SAVE.data.shardsBy || {};
  const before = fragmentsOf(w);
  SAVE.data.shardsBy[w] = shardsOf(w) + n;
  SAVE.commit();
  const after = fragmentsOf(w);
  RUN.stats.shards = (RUN.stats.shards || 0) + n;
  if (after > before)
    toast("<b>A Veilglass forms.</b> " + (after - before) + " to spend in your tree.", 3200);
  else
    toast("<b>" + n + " Veilglass shard</b> — " + shardRemainder(w) + " of " +
          CONFIG.souls.shardsPerFragment + " toward a whole one.", 2600);
  renderPurse();
}

/* A RUN IN PROGRESS, kept between sittings.
   Saved only at the MAP, which is the one place the game is genuinely between things:
   no battle half-resolved, no reward unchosen, no picker waiting on an answer. A run
   abandoned mid-fight resumes at the map it left, which costs the player that fight's
   progress and nothing else. */
const RUNSAVE = {
  KEY:"rw_run_v1",
  store(){
    if (!RUN || RUN.sandbox || RUN.tutorial) return;
    try { localStorage.setItem(this.KEY, JSON.stringify(RUN)); } catch(e){}
  },
  peek(){
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return null;
      const r = JSON.parse(raw);
      /* A run with no map or no discipline is not a run — it is a half-written save
         from a version that no longer exists. */
      if (!r || !r.wizard || !Array.isArray(r.map) || !r.map.length) return null;
      return r;
    } catch(e){ return null; }
  },
  resume(){
    const r = this.peek();
    if (!r) return false;
    RUN = r;
    applyRelicMaxHP();
    showMap();
    return true;
  },
  clear(){ try { localStorage.removeItem(this.KEY); } catch(e){} }
};

const SAVE = {
  KEY:"rw_save_v1",
  defaults(){
    return {
      wizards:["pyromancer"],                       // Fire unlocked first
      spells:Object.fromEntries(Object.keys(SPELL_POOLS).map(w =>
        [w, SPELL_POOLS[w].filter(id => !LOCKED_SPELLS[w].includes(id))])),
      masteries:{},                                  // spellId -> masteryId
      bossesDefeated:0, runs:0, wins:0, actsCleared:0,
      shardsBy:{},          // Veilglass shards banked per discipline
      trees:{},             // talent nodes taken, per discipline
      seeded:{},            // disciplines that have had their opening fragments
      /* Per DISCIPLINE, not per save: mastery of Fire says nothing about Divination. */
      tally:{},                // everything you have ever done, added up
      earned:{},               // achievement id -> when it was first earned
      ascensionBy:{},          // wizard -> the tier they are set to attempt
      ascensionUnlockedBy:{},  // wizard -> the highest tier they have earned
      recordsBy:{},            // wizard -> their best run at each tier
      ascension:0, ascensionUnlocked:0
    };
  },
  data:null,
  load(){
    try { this.data = Object.assign(this.defaults(), JSON.parse(localStorage.getItem(this.KEY) || "{}")); }
    catch(e){ this.data = this.defaults(); }
    // A save written before a discipline existed has no entry for it — backfill the
    // starting spell so old saves keep working when new content ships.
    const d = this.defaults().spells;
    Object.keys(d).forEach(w => { if (!this.data.spells[w]) this.data.spells[w] = d[w].slice(); });
    return this.data;
  },
  commit(){ localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
  /* A save outlives the content it names. Spells are retired between versions —
     Soul Tithe, Bone Ward and Charnel Pact all were — and a save that still lists
     one must not be allowed to reach code that assumes it exists. Filtering here
     covers every reader at once. */
  unlockedSpells(wiz){
    return (this.data.spells[wiz] || []).filter(id => SPELLS[id] && (SPELL_POOLS[wiz]||[]).includes(id));
  },
  learnSpell(wiz, id){
    const list = this.data.spells[wiz] || (this.data.spells[wiz] = []);
    if (!list.includes(id)) list.push(id);
    this.commit();
  },
  setMastery(spellId, masteryId){ this.data.masteries[spellId] = masteryId; this.commit(); },
  /* Called once on load: drop anything the current version no longer knows about,
     so a stale save degrades quietly instead of breaking a screen. */
  pruneRetired(){
    let dropped = 0;
    Object.keys(this.data.spells || {}).forEach(wiz => {
      const before = this.data.spells[wiz].length;
      this.data.spells[wiz] = this.data.spells[wiz]
        .filter(id => SPELLS[id] && (SPELL_POOLS[wiz]||[]).includes(id));
      dropped += before - this.data.spells[wiz].length;
    });
    Object.keys(this.data.masteries || {}).forEach(id => {
      if (!SPELLS[id]) { delete this.data.masteries[id]; dropped++; }
    });
    if (this.data.talents){
      Object.keys(this.data.talents).forEach(wiz => {
        const tree = (TREES[wiz] || {}).nodes || [];
        const live = new Set(tree.map(n => n.id));
        const before = (this.data.talents[wiz] || []).length;
        this.data.talents[wiz] = (this.data.talents[wiz] || []).filter(id => live.has(id));
        dropped += before - this.data.talents[wiz].length;
      });
    }
    if (dropped) this.commit();
    return dropped;
  },
  unlockWizard(id){ if (!this.data.wizards.includes(id)) this.data.wizards.push(id); this.commit(); },
  reset(){
    this.data = this.defaults(); this.commit();
    /* Wiping progression wipes the lesson too: a player starting over is a new player
       again, and the menu goes back to saying "New game". */
    try { localStorage.removeItem("rw_lesson_done"); localStorage.removeItem("rw_tut"); } catch(e){}
  }
};
SAVE.load();
/* Run once, immediately after loading: a save from an earlier version may name
   spells, masteries or talents this build no longer has. */
SAVE.pruneRetired();

/* Developer mode removed at Kerry's call — the disciplines are earned now, and a
   switch that skipped that was a hole in the ladder sitting on the title screen. */
const wizardUnlocked = id => SAVE.data.wizards.includes(id);

/* ASCENSION — a difficulty ladder unlocked by winning. Each tier is a small,
   legible turn of the screw rather than a stat wall. */
function asc(){ return (RUN && RUN.ascension) || 0; }
/* A discipline's own ladder. RUN.ascension is fixed when the run begins, so a trial
   cannot change under a run that is already underway. */
function ascFor(wiz){ return (SAVE.data.ascensionBy || {})[wiz] || 0; }
function ascMaxFor(wiz){ return (SAVE.data.ascensionUnlockedBy || {})[wiz] || 0; }
/* A craft may attempt trials only once it has carried a run to the end. */
function trialsOpenFor(wiz){ return ((SAVE.data.recordsBy || {})[wiz] || {}).wins > 0; }
function anyTrialsOpen(){ return WIZARDS.some(w => trialsOpenFor(w.id)); }

function ascHP(){ const a = asc(); return 1 + (a>=1?0.1:0) + (a>=6?0.1:0) + (a>=10?0.1:0); }
function ascDmg(){ const a = asc(); return 1 + (a>=2?0.1:0) + (a>=8?0.15:0) + (a>=10?0.1:0); }
function ascPrice(){ return asc() >= 3 ? 1.25 : 1; }
/* Tier 4 used to halve "between-fight mending", which is now zero — halving it did
   nothing and the tier was free. It bites the campfire instead, which is where all
   the mending went. */
function ascHeal(){ return asc() >= 4 ? 0.5 : 1; }
function ascWard(){ return asc() >= 7 ? 2 : 1; }
/* Tier 9 used to say "bosses no longer fully heal you" — but a boss never healed you;
   the ACT did, when it began. Now it means what it says: at tier 9 an act starts on
   whatever the last one left you. */
function ascActHeal(){ return asc() < 9; }
function ascBossHeal(){ return ascActHeal(); }

/* EVERYTHING YOU HAVE EVER DONE, added up. Achievements read this and nothing else,
   so a new one can be written without touching the game that produces the numbers. */
function addToTally(st, won){
  const t = SAVE.data.tally = SAVE.data.tally || {};
  const add = (k, v) => { if (typeof v === "number" && v) t[k] = (t[k] || 0) + v; };
  add("casts", st.casts);        add("shatters", st.perfects);
  add("exploits", st.exploits);  add("resonates", st.resonates);
  add("resists", st.resists);    add("echoes", st.echoes);
  add("spells", st.spellsCast);  add("subs", st.substitutions);
  add("dealt", st.dealt);        add("taken", st.taken);
  add("gold", st.goldEarned);    add("spent", st.goldSpent);
  add("vials", st.potionsUsed);  add("elites", st.elitesTaken);
  add("fights", st.encounters);  add("runs", 1);
  if (won) add("wins", 1);
  /* The cleanest fight of a career is worth remembering. */
  if (won && !st.taken) add("flawlessRuns", 1);
  SAVE.commit();
}

    got:(t) => t.dealt >= 50000 }
];

/* Checked wherever a screen wants them; newly earned ones are stamped with the day
   they happened so the list can say when. */
function checkAchievements(){
  const t = SAVE.data.tally || {}, got = SAVE.data.earned = SAVE.data.earned || {};
  const fresh = [];
  ACHIEVEMENTS.forEach(a => {
    if (got[a.id]) return;
    let ok = false;
    try { ok = !!a.got(t, SAVE.data); } catch(e){ ok = false; }
    if (ok){ got[a.id] = Date.now(); fresh.push(a); }
  });
  if (fresh.length) SAVE.commit();
  return fresh;
}

/* THE MOTIONS a piece may be given. Each keyframe carries --ax/--ay, which hold the
   piece's own anchoring translate — so a spin can never drop the centring the way a
   bare `rotate(360deg)` does, having replaced the whole transform. */
const LAYOUT_FX = ["none", "spinCW", "spinCCW", "hover", "pulse"];

/* WRITTEN AS INLINE STYLES, which beat every rule in the sheet — that is the whole
   point. Called after a screen is drawn; anything the table does not mention is left
   exactly as the stylesheet has it. */
function applyLayout(screenName){
  const page = LAYOUT[screenName];
  if (!page) return;
  const pct = v => v + "%";

  /* A screen that declares itself locked says so HERE, as it draws — and showScreen has
     already cleared whatever the last screen asked for, so this can never be inherited
     by a Settings page or a glossary that genuinely needs to scroll. */
  {
    const sc = screen();
    if (sc && sc.style && page.scroll === "locked") sc.style.overflowY = "hidden";
  }


  /* THE BANDS were in the table but the stylesheet still hardcoded them, so changing
     one here would have exported and done nothing — the worst kind of control. The
     floors stay: a band may be given a smaller share but never fall below the size a
     thumb and an eye need. */
  if (page.bands){
    const root = document.documentElement;
    if (root && root.style){
      /* THE FLOORS AND CEILINGS COME FROM THE TABLE TOO. They were written into
         this line as constants, so raising --hCast in the stylesheet did
         nothing: applyLayout overwrote it at runtime with a 150px ceiling and
         the band never grew. A value set in two places is set in the later one,
         and this one is always later.
         Each band may state its own floor and ceiling; the old numbers remain
         the defaults, so nothing that does not state them changes. */
      const fl = page.bandFloors || {}, ce = page.bandCeils || {};
      const band = (name, dFloor, dCeil) =>
        "clamp(" + (fl[name] || dFloor) + "px, " + page.bands[name] + "dvh, " +
        (ce[name] || dCeil) + "px)";
      root.style.setProperty("--hBook", band("book", 140, 260));
      root.style.setProperty("--hCast", band("cast",  96, 150));
      root.style.setProperty("--hKit",  band("kit",   72, 148));
    }
  }
  Object.keys(page.el).forEach(key => {
    let e = page.el[key];
    /* FASTENED. `of` was in the table, offered by the studio, and implemented NOWHERE —
       so the eye overlay claimed to be fastened to the wizard and would have drawn at
       its own coordinates, drifting from the hood the moment he was moved. Nothing
       caught it because no eye art is registered yet.
       Fastening means: take the parent's box exactly. These overlays are drawn on the
       SAME CANVAS as the figure they sit on, so sharing its box is what lines them up
       without anyone measuring. A nudge inside that box is what fitX/fitY are for. */
    if (e.of && page.el[e.of]){
      const p = page.el[e.of];
      e = Object.assign({}, e, {
        left:p.left, right:p.right, top:p.top, bottom:p.bottom,
        width:p.width, height:p.height, heightPx:p.heightPx, anchor:p.anchor
      });
    }
    let nodes = [];
    try { nodes = Array.from(document.querySelectorAll(e.sel)); } catch(err){ return; }
    nodes.forEach(n => {
      const st = n.style;
      if (e.z != null) st.zIndex = e.z;
      if (e.top      != null) st.top    = pct(e.top);
      if (e.bottom   != null) st.bottom = pct(e.bottom);
      if (e.left     != null) st.left   = pct(e.left);
      if (e.right    != null) st.right  = pct(e.right);
      if (e.topPx    != null) st.top    = e.topPx + "px";
      if (e.bottomPx != null) st.bottom = e.bottomPx + "px";
      if (e.leftPx   != null) st.left   = e.leftPx + "px";
      if (e.rightPx  != null) st.right  = e.rightPx + "px";
      if (e.width    != null) st.width  = pct(e.width);
      if (e.height   != null) st.height = pct(e.height);
      if (e.heightPx != null){
        /* A FIXED PIXEL HEIGHT MUST STILL YIELD ON A SHORT SCREEN. Written inline it
           beat the stylesheet's short-screen rule, so a 600px phone kept the tall orbit
           and the grimoire ran off the bottom. Capped against the viewport instead: the
           value is what it asks for, never more than the room there is. */
        st.height = "min(" + e.heightPx + "px, calc(100dvh - " +
          (page.reserve || 0) + "px))";
      }
      if (e.gap      != null) st.gap    = pct(e.gap);
      /* ROW ORDER. The three action rows flow inside the stack and cannot be moved
         freely, but their ORDER can change — and a control that exported and did
         nothing would be worse than no control. */
      if (e.order    != null) st.order  = e.order;
      /* A PIECE THAT FLOWS — a row in the menu's stack, or a control in the Path's
         choose row — is not positioned, and a static element IGNORES top and left
         entirely. `inRow` says so plainly rather than being inferred from `order`. */
      if (e.inRow && (e.top != null || e.left != null ||
                      e.bottom != null || e.right != null))
        st.position = "relative";

      /* A ROW IN THE STACK is a flex child, and a static element IGNORES top and left
         entirely — so Kerry's nudge on the settings row would have applied cleanly in
         the studio and done nothing in the game. position:relative makes them an
         OFFSET from where the row already sits, so it shifts without escaping the
         stack or disturbing the rows around it. */
      if (e.order != null && (e.top != null || e.left != null ||
                              e.bottom != null || e.right != null))
        st.position = "relative";

      /* THE ANCHOR, held in variables so a MOTION can carry it. An animation replaces
         the whole transform, so a keyframe that says only rotate() throws a centred
         piece off-axis for every frame it plays — which is exactly what the astrolabe
         did before this. */
      const bx = e.bleedX || 0, by = e.bleedY || 0;
      let ax = bx + "%", ay = by + "%";
      if (e.anchor === "centre"){ ax = "-50%"; ay = "-50%"; }
      else if (e.anchor === "top"){ ax = "-50%"; ay = by + "%"; }
      st.setProperty("--ax", ax);
      st.setProperty("--ay", ay);
      st.transform = "translate(" + ax + "," + ay + ")";

      /* FIT: nudging or zooming the ART INSIDE its box without moving the box. Trimming
         on import handles almost every replacement; this is for the rest. Applied to
         the child image so it cannot fight the piece's own transform. */
      if (e.fitScale != null || e.fitX != null || e.fitY != null){
        const kid = n.querySelector("img");
        if (kid) kid.style.transform =
          "translate(" + (e.fitX || 0) + "%," + (e.fitY || 0) + "%) scale(" +
          ((e.fitScale != null ? e.fitScale : 100) / 100) + ")";
      }

      const fx = e.fx && e.fx !== "none" ? e.fx : null;
      /* how far it moves, or how far it shrinks — adjustable, because a fixed share of
         the element is invisible on a small piece and heavy-handed on a large one */
      const amt = e.fxAmount != null ? e.fxAmount : (fx === "pulse" ? 6 : 14);
      st.setProperty("--fxAmt", amt + "%");
      st.setProperty("--fxScale", (1 - amt / 100).toFixed(3));
      /* THE DRIFT RESUMES, IT DOES NOT RESTART.
         These animations begin at frame zero every time applyLayout runs — and
         it runs on every screen draw — so choosing a discipline made the wright
         twitch back to his starting pose. A NEGATIVE DELAY of however long the
         page has been open starts each animation part-way through its own
         cycle, at the point it would have reached had it never stopped. The
         wright therefore appears to drift continuously across redraws, because
         from the player's side he is doing exactly that.
         Cheaper and far more robust than trying to carry Animation objects
         across a DOM move: it needs nothing preserved and works however the
         screen is rebuilt. */
      const dur = e.fxSpeed || (fx && fx.indexOf("spin") === 0 ? 90 : 14);
      st.animation = fx
        ? "fx" + fx + " " + dur + "s " +
          (fx.indexOf("spin") === 0 ? "linear" : "ease-in-out") + " infinite"
        : "none";
      st.animationDelay = fx
        ? "-" + (((Date.now() - FX_EPOCH) / 1000) % dur).toFixed(2) + "s"
        : "";
    });
  });
}

/* Wizard unlock milestones — options, not raw power (design principle 34). */
function checkUnlocks(){
  const out = [];
  UNLOCKS.forEach(u => {
    if (SAVE.data.bossesDefeated >= u.bosses && !SAVE.data.wizards.includes(u.wizard)){
      SAVE.unlockWizard(u.wizard); out.push(u);
    }
  });
  return out;
}

/* ============================================================
   8. STATE
   RUN persists across encounters. B is a single battle.
   ============================================================ */
let RUN = null, B = null;

function newRun(wizardId){
  seedDiscipline(wizardId);        // first time out, this hands over three fragments
  const w = WIZ[wizardId];
  const hp = w.maxHP + CONFIG.tuning.playerHPBonus;
  RUN = {
    wizard:w.id, maxHP:hp, hp:hp,
    /* RUN-SPECIFIC — all of this dies with the run (design principle 35). */
    /* Empty. Everything a run carries comes from the talent tree — there is no
       other route in. */
    spells:[],
    acquired:[],
    /* Talents taken in the discipline's tree, resolved into the two generic
       effects the engine understands. Bespoke talents are read by id. */
    talents:{ taken:{}, potency:{}, efficiency:{} },
    relics:[w.relic],
    gold:0, potions:[],
    shop:{ attune:{}, potency:{}, efficiency:{}, focus:{}, prismatic:0 },
    act:0, map:null, pos:null, rowIndex:-1,
    ascension:ascFor(wizardId),        // this craft's ladder, not the save's
    start:Date.now(),
    stats:{ casts:0, perfects:0, exploits:0, resonates:0, resists:0, echoes:0,
            spellsCast:0, substitutions:0, dealt:0, taken:0, encounters:0,
            goldEarned:0, goldSpent:0, shopsVisited:0, purchases:{}, rerolls:0,
            potionsBought:0, potionsUsed:0, elitesTaken:0, elitesOffered:0,
            shopsSkipped:0, nodesByType:{}, substitutedFrom:{},
            hpEnteringNode:[], bossTurns:[],
            firstPerfect:[], guessesThisFight:0,
            manaBy:Object.fromEntries(ELEMENTS.map(e=>[e.id,0])),
            useBy:Object.fromEntries(ELEMENTS.map(e=>[e.id,0])) }
  };
  const v = RELICS[w.relic];
  if (v.onGain) v.onGain();
}

function startEncounter(nodeType, forceId){
  /* Set after B exists, at the end of this function. */
  const act = ACTS[RUN.act];
  let pool, elite = false, boss = false;
  if (nodeType === "boss"){ pool = Array.isArray(act.boss) ? act.boss : [act.boss]; boss = true; }
  else if (nodeType === "elite"){ pool = act.elites; elite = true; }
  else pool = act.enemies;
  const def = forceId ? ENEMIES[forceId] : ENEMIES[pool[Math.floor(Math.random()*pool.length)]];
  if (forceId){ elite = def.tier === "Elite"; boss = def.tier === "Boss"; }
  /* Elite Quarry makes elites richer and correspondingly harder. */
  /* An elite is a THREAT, not a wall. Measured at 1.15x health it killed 1 run in 44;
     the target is 1 in 10. Bulk traded for bite, the same trade act 2 needed.
     eliteDamage is a PRECISION knob: 1.35 gave 3% lethality and 1.55 gave 14%, so the
     tier is far more sensitive to damage than bosses are — an elite is met mid-act on
     a worn run, where a slightly bigger blow crosses the line a run cannot absorb.
     1.42 gave 6% when a run met ONE elite. The guaranteed elite row means it now meets
     THREE, drawn from all three acts rather than mostly the first, and the same setting
     measured 12%. Back to 1.35, because the tier is met three times as often. */
  const eliteScale = elite ? CONFIG.tuning.eliteHP *
                     (relicAny("eliteExtraRelic") ? relicMax("eliteHPScale") : 1) : 1;
  const eliteBite  = elite ? CONFIG.tuning.eliteDamage : 1;
  const A = CONFIG.tuning.actScaling[RUN.act] || CONFIG.tuning.actScaling[CONFIG.tuning.actScaling.length-1];
  const maxHP  = Math.round(def.maxHP  * CONFIG.tuning.enemyHP     * eliteScale * A.hp * ascHP());
  const damage = Math.round(def.damage * CONFIG.tuning.enemyDamage * eliteBite * A.dmg * ascDmg());
  RUN.currentNodeType = nodeType;
  RUN.stats.hpEnteringNode.push(RUN.hp);
  RUN.stats.nodesByType[nodeType] = (RUN.stats.nodesByType[nodeType] || 0) + 1;
  B = {
    enemy:{ ...def, maxHP, damage, hp:maxHP, block:0,
            resist:{ ...(def.startResist||{}) },
            code:randomCode(def.codeLength, def.duplicateHeavy) },
    mana:Object.fromEntries(ELEMENTS.map(e=>[e.id,0])),
    block:0, curse:0, draft:emptyDraft(def.codeLength), target:null, cursor:-1,
    wardsRecent:{},
    history:[], turn:1, busy:false, over:false,
    flags:{}, once:{}, perTurn:{}, counters:{}, known:{ revealed:{}, slots:{}, absent:{} },
    useCount:Object.fromEntries(ELEMENTS.map(e=>[e.id,0])),
    chaosElement:null, spellsUsed:0, guesses:0,
    isElite:elite, isBoss:boss      // relics and hooks can ask what they are facing
  };
