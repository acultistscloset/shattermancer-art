/* a spell gathering itself again after being cast */
.spell.resting{ opacity:.42 }
.spell.resting .sn::after{ content:" \00b7 resting"; font-family:var(--font-data);
  font-size:8px; letter-spacing:.1em; color:var(--vellum-dim) }/* geometry moved to the one block at the end: /* ---- the wright, painted -------------------------------- */
, which — being later in the sheet —
   OVERRODE the position:absolute that puts the panel in its corner, moving the panel.
   I then hung the portrait inside a container styled #stage, which no element in the
   page actually uses: dead CSS I matched against without checking.
   And the slot I was building ALREADY EXISTED. #playerFig has stood in the lower left
   of the scene since the day it was written, holding an emoji. It did not want a new
   slot beside it; it wanted dressing. */
/* The sizing lives with the layout contract further down; this only kills the emoji's
   line-height when an image replaces it. */
#playerFig.hasArt{ font-size:0 }

/* THE GRIMOIRE'S PAGE, as a nine-slice.
   A cover background would crop the frame away to fit a 1.5:1 spread into a slot
   nearly 4:1 — which is exactly what the band crop did. border-image paints the four
   corners and edges at their OWN size and stretches only the middle, so the leather
   survives whatever shape the book takes. The `fill` keyword is what keeps the
   parchment: without it the middle is left empty and the gradient shows through. */
/* THE SAME FAULT AS THE DISCIPLINES SHEET, and worse here: rendered both ways at the
   real box size, the nine-slice ERASES THE SPINE — the middle is stretched from a thin
   central strip, so the two pages become one. A book without a spine is not a book.
   Drawn whole instead; it is wider than its natural 1.6:1 and reads as a wide book. */
#book.hasPage{
  border:0;
  background:var(--pageArt) center/100% 100% no-repeat;
}
#book.hasPage #grimoire{ color:#33260f }
/* a taller book can afford a heavier frame */
/* the heavier frame on a tall screen belonged to the nine-slice; with the book drawn
   whole there is no border to thicken, and leaving it would have been a rule for a
   technique that is gone */

/* ============================================================================
   THE BATTLE SCREEN'S HEIGHT CONTRACT
   Both #scene and #book were flex:1 1 auto — they COMPETED for the leftover space,
   which is why neither ever held a proportion and the whole thing drifted with the
   screen. The contract now, top to bottom:

     scene    ~48dvh   the picture. THE ONLY SECTION THAT GIVES WAY.
     book     ~25dvh   priority: it is read every single turn
     cast     ~13dvh   priority: it is touched every single turn
     kit      ~14dvh   priority: the spells

   The grimoire and the controls take FIXED shares with pixel floors, so they never
   shrink below the size a thumb and an eye need. The scene takes whatever is left,
   which means a short screen eats the picture from the bottom edge upward and never
   touches the parts of the game the player is actually using.
   Nothing scrolls: #app is clipped, every section is clipped, and the only scrolling
   region in the game is the grimoire's own rows, which is deliberate.
   ============================================================================ */
:root{
  /* RAISED for the painted book. Its pages are only ~62% of its height — the
     covers are thick — so the same band gave the history far less room than the
     flat panel did. 30dvh restores it and then some. */
  /* SHARES MEASURED OFF THE REFERENCE, not chosen. The concept gives the stage
     36.6% and the casting band only 12.1%; this build had 25.6 and 16.5, which
     is exactly the "wasted space" Kerry saw — the bench was eating the scene. */
  /* KERRY'S MEASURED BANDS, 2026-08-27. He placed every piece over his target
     screenshot in battle-layout.html and exported the numbers; these are the
     heights that fell out of it, not a guess at his intent. The floors stay —
     a short phone may shrink a band, never below what a thumb and an eye need.
     book 25.5dvh, casting 12.8, rack 10.7, and the scene takes the rest, which
     lands the book at 48.1% exactly as he asked. */
  --hBook: clamp(140px, 28.5dvh, 290px);
  /* THE MERGE FREED NOTHING — it MOVED. The pools left their own row and went
     inside the buttons, so the buttons are taller by exactly what the row was.
     The band keeps its share; what changed is that the player reads one thing
     instead of two. Raised from 13 to 15dvh because a button now stacks glyph,
     name and pool where it stacked glyph and name. */
  /* THE ELEMENT BUTTONS ARE THE GAME'S MAIN INPUT and were being CLIPPED, not
     drawn small: each button measured 78px tall inside a 50px container. Six of
     them are how every incantation is built, so they get room before anything
     else does.
     Raised 12.8 -> 15.5dvh. The extra comes out of the SCENE, which is the only
     band that flexes and the one with slack to give — the backdrop simply shows
     a little less of itself, which costs the player nothing. */
  /* 132 and 180 MATCH THE TABLE'S bandFloors/bandCeils. The stylesheet value is
     only the default before applyLayout runs; if the two disagree the band jumps
     on the first paint, which layouttest is right to refuse. */
  --hCast: clamp(190px, 26dvh, 300px);   /* the WHOLE lower surface now */
  /* the painted book's pages start 17% down (below the baked "GRIMOIRE") and end
     20.4% up. These track --hBook term by term rather than multiplying it. */
  --bookPadT: clamp(24px, 4.59dvh, 44px);
  /* lower: the strip is cropped art and can sit further down the page */
  --bookPadB: clamp(20px, 3.9dvh, 38px);
  /* named so the parchment can cancel them and run the full page width */
  --bookPadL: 12%;
  --bookPadR: 17%;
}
#app{
  /* 100vh first as the fallback, then 100dvh where it is understood — on iOS the two
     differ by the height of Safari's chrome, and dvh is the one that follows it. */
  height:100vh; height:100dvh; max-height:100dvh; overflow:hidden;
  /* the Dynamic Island above, the home indicator below */
  padding-top:var(--shellTop, max(4px, env(safe-area-inset-top)));
  padding-bottom:var(--shellBot, max(6px, env(safe-area-inset-bottom)));
}
/* THE RACK REACHES THE BOTTOM OF THE GLASS, in battle only (Kerry, 2026-08-27).
   His layout runs content to 100.1% of the screen, which is 3.9 points more than
   the 62px island and 34px indicator leave — and 3.9 points IS the bottom
   reserve. He chose to let the rack sit under the home indicator rather than
   compress the screen, so the reserve is dropped HERE and nowhere else.

   The cards keep a small margin so the indicator does not land on the middle of
   a card, and the rack is the right band to do this with: a spell card is large
   and its whole face is the target, so losing a few points off the bottom edge
   costs no reachable area. Every other screen keeps its full inset. */
.inBattle #app{
  padding-bottom:4px;
  /* NO SIDE PADDING IN BATTLE (Kerry, 2026-08-27). #app insets everything by
     9px each side, which is 4.1% of a 440 screen — and his tree draws the
     backdrop, the book and the lower surface at 0 to 100. That 9px was the
     entire remaining difference between his layout and the built one. */
  padding-left:0; padding-right:0;
  /* NO GAP BETWEEN THE BANDS IN BATTLE. #app carries a 4px flex gap, which is
     right on screens made of separate cards and wrong here: Kerry drew the
     grimoire ending at 74.0 and the lower surface beginning at 74.0, touching.
     The gap put 4px of page background between them, and 6px more came from the
     casting bench's own top padding — a 10px seam he could see and I had to
     measure to explain. His tree has no gaps in it, so neither does this. */
  gap:0;
}
.inBattle #castArea{               }
#topBar{ flex:0 0 auto }

/* THE PICTURE — everything else is fixed, so this absorbs every reduction. */
#scene{
  flex:1 1 auto;
  min-height:120px;          /* below this the fight stops reading as a fight */
  max-height:none;           /* was capped at 340px, which wasted a tall screen */
  overflow:hidden;                  ;
}
/* the environment, filling the container and cropped inside it */
#sceneArt{ overflow:hidden }
#sceneArt.hasScene{ background-size:cover; background-position:center top;
  background-repeat:no-repeat }
#sceneArt > img.bg{ position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center top }

/* THE WRIGHT — anchored to the bottom edge, so he RIDES the boundary upward as the
   scene shrinks, and only gets smaller because his height is a share of it. */
/* THE FIGURES, LOCKED TO THEIR CORNERS.
   Two things were letting them drift away from the edges as the screen shrank, and
   both are worth remembering because neither is obvious:

   THE BOX WAS NOT THE IMAGE. Sizing it width x height made a box whose SHAPE changed
   with the screen, while the art's shape is fixed — so object-fit:contain left empty
   space inside the box, and how much, and on which side, moved as the screen did. The
   figure looked like it was drifting because the PICTURE was sliding around inside a
   box that was still in the corner.

   AND THE BLEED WAS MEASURED AGAINST THE WRONG THING. A percentage margin-bottom
   resolves against the containing block's WIDTH — CSS does that for vertical margins
   too, which surprises everyone — so the downward overhang was a share of the scene's
   WIDTH and did not follow the figure as it scaled.

   So: the HEIGHT alone is set and the width follows the art, which means the box IS
   the image and contain can never leave a gap. The overhang uses translate(), whose
   percentages resolve against THE ELEMENT ITSELF, so it stays proportional however
   small the figure becomes. Anchored in the corner, it can only move upward, and then
   shrink. */
.sceneFig{ position:absolute; z-index:1; display:block; width:auto }
.sceneFig img{ display:block; height:100%; width:auto; object-fit:contain }

/* the wright: bottom-left, bleeding off both */
/* THE WRIGHT SITS IN THE BOTTOM LEFT OF HIS BOX (Kerry, 2026-08-27), so that
   whatever is cut off is cut off at the two edges nothing looks at — the floor
   and the screen's left side. Anything anchored anywhere else crops him through
   the middle of the figure when the box changes shape.
   THE BOX IS PLACED BY THE LAYOUT TABLE now, so the old corner pinning and the
   -7%/9% nudge both fought it: two positions for one thing, which is how the
   shield badges wandered for three redesigns. The box is positioned; the ART is
   anchored INSIDE it. */
#playerFig{ z-index:1; overflow:hidden; display:flex; align-items:flex-end; justify-content:flex-start }/* geometry moved to the one block at the end: #playerFig.hasArt */

#playerFig .figArt{
  height:100%; width:auto; max-width:none; display:block;
  object-fit:contain; object-position:left bottom;
  filter:drop-shadow(0 6px 26px rgba(255,107,53,.32)) }

/* THE CREATURE IS CENTRED IN ITS BOX (Kerry, 2026-08-27). The box is SPACE, not
   a size: a boss may fill it and an ordinary creature will use a fraction, and
   48 different silhouettes cannot all be anchored to one corner sensibly.
   Centred, each one sits in the middle of the room it has, whatever its shape.
   contain, not cover — a creature must never be cropped to fill a box. */
#enemySprite{ z-index:1; overflow:hidden; display:flex; align-items:center; justify-content:center }/* geometry moved to the one block at the end: #enemySprite.hasArt */

#enemySprite .figArt{
  max-height:100%; max-width:100%; height:auto; width:auto; display:block;
  object-fit:contain; object-position:center;
  filter:drop-shadow(0 6px 22px rgba(0,0,0,.5)) }
#enemySprite:not(.hasArt){ font-size:min(52px, 42%) }

/* The HUDs. Boss top-left, the blow it is winding up near the creature, the wright's
   own panel bottom-right — and that panel must never reach the grimoire, so it is
   pinned inside the scene's own padding. */
#enemyPanel{ z-index:3; max-width:min(66%, 300px) }
#threat{ z-index:3 }
#playerPanel{ z-index:3 }

/* THE GRIMOIRE — fixed share, floored, read every turn. */
#book{ flex:0 0 var(--hBook);                    ; min-height:0; overflow:hidden }
#grimoire{ flex:1 1 auto;            ; min-height:0; overflow-y:auto }

/* THE CONTROLS — fixed shares, floored, touched every turn. */
/* PINNED, not floored. min-height alone let the casting bench grow past its
   band — measured 17.3% against the 12.8 it was given — and every point it took
   came out of the SCENE above it, which is the band that absorbs slack. That is
   why the middle of the screen kept sitting high however the bands were set. */
#castArea{ flex:0 0 var(--hCast);                    ; min-height:0; overflow:hidden }
/* THE BENCH DIVIDES ITS BAND, it does not overflow it. The element row and the
   CAST row wanted 128px inside 96px of usable band, so CAST hung 3.3 points
   below where Kerry placed it — and past the band's own edge. His numbers give
   the row 7.8% of the screen and CAST 4.9%, which of a 12.8% band is 61% and 38%.
   Stated as shares, so the split holds at any phone height rather than being two
   pixel heights that happen to add up on one. */
.inBattle #castArea{
               ;                 ;
  display:flex; flex-direction:column; justify-content:flex-start;
}
/* THE SHARE GOES ON THE DIRECT CHILD. #runes lives inside #runeArc, so putting
   flex on #runes styled a GRANDCHILD of the flex container and did nothing at
   all — the row got no share and the split was worse than before. #runeArc is
   the child; #runes fills it. */
/* 63/35: a 64pt circle plus its mana bar needs about 88px of the band, and CAST
   needs 44 — the Apple minimum for a tap target, which CAST is also at. */
.inBattle #castArea > #runeArc{ flex:0 0 63%;           ; min-height:0;          }
/* #runes is a GRID, and a grid does not stretch to its parent unless told to.
   It measured 67px inside an 87px runeArc while the buttons needed 78, so they
   overflowed by 11 — the buttons were never small, they were housed too tightly.
   The row fills its share and each button fills the row. */
.inBattle #castArea > #runeArc{          ; align-items:stretch }
.inBattle #castArea > #runeArc > #runes{
             ;         ; align-content:stretch;
}
/* THE BUTTON DISTRIBUTES ITS OWN CONTENTS. Giving it height:100% made the BOX
   the right size and left its contents to overflow: the mana bar sits inside the
   button, ran 7px past its bottom edge and landed on the CAST row. A fixed
   height with free-flowing contents is not a layout, it is a coincidence.
   Column, space-between, and a clip: glyph and name at the top, meter at the
   bottom, nothing outside. */
.inBattle #castArea > #runeArc > #runes > .rune{
             ; min-height:0;                  ;
  display:flex; flex-direction:column; align-items:center;
  justify-content:space-between; overflow:hidden;
}
/* THE PARTS TAKE SHARES OF THE BUTTON, none of them a fixed pixel height. The
   glyph was 34px, the name and the meter their own sizes, and together they
   came to more than the button — so the meter was pushed past the bottom edge
   and onto the CAST row. Fixed heights inside a fixed box only fit by luck, and
   they stop fitting the moment any of the four numbers changes.
   The meter and the name get what they need; the GLYPH takes the rest and
   shrinks if there is less. Nothing can overflow because nothing is rigid. */
/* NO aspect-ratio HERE — compattest forbids it in battle rules and is right to:
   older iOS Safari resolves it inconsistently inside a flex item, which is
   exactly what this is. The glyph is square because its width follows its
   height, and the element art inside it is contain-scaled either way. */
.inBattle #castArea > #runeArc > #runes > .rune > .glyph{
  flex:1 1 auto; height:auto; min-height:0; width:100%;
  align-self:center;
  /* TWO LAYERS, TWO SIZES. Line 351 paints the element mark AND the button
     plate on this one element — 'background-size:58% auto, contain'. Writing a
     single 'contain' here overwrote BOTH, so the plate was scaled to the mark
     and vanished. Their Gate 3 plate did not appear and the art looked missing
     when the wiring was at fault. */
  background-size:58% auto, contain;
  background-position:center, center;
  background-repeat:no-repeat, no-repeat;
}
.inBattle #castArea > #runeArc > #runes > .rune > .nm{
  flex:0 0 auto; line-height:1.1;
}
.inBattle #castArea > #runeArc > #runes > .rune > .mana{
  margin-top:0; flex:0 0 auto; width:100%;
}
.inBattle #castArea > #castRow{ flex:0 0 35%;           ; min-height:0;         ;
  display:flex; align-items:center }
.inBattle #castArea > #manaRow{ display:none }
/* #kit IS NO LONGER A BAND. It lives inside #castArea as a region of the one
   lower surface Kerry drew, placed by the geometry block at the end of the

/* ============================================================================
   THE BATTLE UI PACK, WORN
   Every rule here is scoped to .hasUIArt, which only appears once assets are
   registered — so the painted fallback is what a build without art still shows,
   and nothing below is load-bearing.
   The pack's own rule: no baked text, numbers or fills. Every value stays an
   HTML layer over the art, which is what lets one track serve any health total.
   ============================================================================ */

/* ---- the two stat panels: 9-sliced, so a long boss name cannot distort a frame ---- */
/* RETIRED 2026-08-25. These nine-sliced the OLD pack's boss-panel and
   player-panel as border-images. The new frames are backgrounds, and a
   background does not clear a border — so BOTH were drawing and every HUD
   panel wore two frames, one inside the other. Nothing said so; the panels
   just looked heavy and cramped.
   Left as an explicit reset rather than deleted, because the new rules set
   only `border:0` and a stale border-image-source would come back the moment
   anyone reordered the sheet. */
.hasUIArt #enemyPanel,
.hasUIArt #playerPanel{
  background:none; border:0; border-image:none; box-shadow:none;
}

/* ---- health: an empty track with a fill clipped inside it by width ---- */
.hasUIArt .hpRow .bar{
  background:var(--ui-health-track) center/100% 100% no-repeat;
  border:0; box-shadow:none; overflow:hidden; height:13px; border-radius:0;
}
/* THE ID IS WHAT MAKES THIS WORK. #enemyHPFill and #playerHPFill each paint a
   gradient, and an ID selector (100) beats .hasUIArt .hpRow .bar > i (30) — so the
   painted bars were winning and the pack's fill never appeared. Matching the ids is
   what wins it back. Same fault as the mana meter's inline colour, in a different
   costume.
   THE FILL IS REVEALED, NOT SCALED: the game sets this element's WIDTH, and the art
   inside keeps its own size, so a half-full bar shows the left half of the fill rather
   than the whole fill squashed into half the space. */
.hasUIArt #enemyHPFill,
.hasUIArt #playerHPFill{
  border-radius:0; box-shadow:none;
  background:var(--ui-health-fill) left center no-repeat;
  background-size:auto 100%;
}
/* The hue-rotate existed because the old pack shipped ONE health fill for both
   bars. The new pack authors them separately, so the filter was tinting art
   that is already the right colour. An authored file beats a filter. */
.hasUIArt #playerHPFill{ filter:none }

/* ---- mana: the same pattern. The element is .mana with a .meter inside it — I first
        wrote .manaChip .track, which exists nowhere in this game, and the rules would
        have done nothing at all while looking perfectly reasonable. ---- */
.hasUIArt .mana .meter{
  background:var(--ui-mana-track) center/100% 100% no-repeat;
  border:0; overflow:hidden; border-radius:0;
}
.hasUIArt .mana .meter > i{
  background:var(--ui-mana-fill) left center/auto 100% no-repeat;
  border-radius:0;
  /* WAS: one red fill hue-rotated six ways, when the pack shipped one file.
     The 2026-08 pack authors a fill PER ELEMENT, so the tint now recolours art
     that is already correct — cancelled for the dressed screen below. */
  filter:var(--manaTint, none);
}
.hasUIArt #mana-fire      .meter > i{ --manaTint:none }
.hasUIArt #mana-water     .meter > i{ --manaTint:hue-rotate(190deg) saturate(1.2) }
.hasUIArt #mana-nature    .meter > i{ --manaTint:hue-rotate(95deg)  saturate(.95) }
.hasUIArt #mana-lightning .meter > i{ --manaTint:hue-rotate(35deg)  saturate(1.15) brightness(1.1) }
.hasUIArt #mana-ice       .meter > i{ --manaTint:hue-rotate(165deg) saturate(.9)  brightness(1.15) }
.hasUIArt #mana-shadow    .meter > i{ --manaTint:hue-rotate(255deg) saturate(1.1) }

/* ============================================================================
   THE BIG PASS — every remaining battle piece dressed from the pack.
   Verified in Chromium 141 and WebKitGTK 2.52 on the iPhone 16 Pro Max profile
   (440x956 @3x, safe areas 59/34) before it ever reached a device.
   ============================================================================ */

/* ---- THE STAGE, DARK -------------------------------------------------------
   The pack was composed on near-black (its preview ground is rgb(17,15,14)),
   and the game's violet radials showed through every gap between the new
   panels — gutters, band corners, and the scene band itself, WHICH HAS NO
   BATTLE BACKDROP ART YET (still on the remaining-art list; when Kerry paints
   per-act battle backgrounds they land here). Until then the scene keeps a
   whisper of depth, not a purple wall. */
/* THE CONCEPT'S GROUND IS WARM NEAR-BLACK, not cold violet. Kerry's reference
   sits on rgb(17,15,14) and every panel was painted against it. #131019 was
   still a purple, just a darker one, and it read as leak — because it was.
   The page texture goes entirely: it is a violet weave, and half-strength
   violet is violet. */
body.inBattle.hasUIArt{ background:#141110 }
body.inBattle.hasUIArt::after{ display:none }
/* the backdrop sits behind the figures, dimmed so the panels stay readable —
   it is a lit place seen through gloom, not a picture competing with the HUD */
.hasUIArt #sceneArt.hasBattleBg{
  background-image:var(--battleBg);
  background-size:cover; background-position:center bottom;
}
.hasUIArt #sceneArt.hasBattleBg::after{ content:""; pointer-events:none; /* lighter, per Kerry — the stage was reading closer to night than gloom */
  background:linear-gradient(180deg, rgba(12,10,14,.10), rgba(12,10,14,.34)) }
.inBattle.hasUIArt #scene{
  border:0; border-radius:0; box-shadow:none;
  /* NO GRADIENT AT ALL. The scene is where the per-act battle backdrop will
     hang; until that art exists it must be the same ground as everything else,
     not a purple wash pretending to be depth. */
  background:transparent;
}
/* the bands square off and close ranks — their own art is the surface now */
.inBattle.hasUIArt #book,
.inBattle.hasUIArt #kit{ border-radius:0; border:0; box-shadow:none }  /* margin lives in the geometry block */
/* THE GAP AT THE BOTTOM. #scene is capped at 340px, so on a tall phone the
   bands stopped short and the slack pooled under the spell rack. In battle the
   stage takes the remainder instead — the rack sits ON the floor. */
/* THE BOTTOM GAP, PROPERLY. Two hard-coded caps were fighting the bands:
   #scene's max-height:340px stopped the stage absorbing the slack, so on a tall
   phone the whole stack finished ~10% short and the rack floated. Chromium hid
   it because its own numbers happened to sum; the device did not.
   Belt AND braces, because summing bands is a promise this cannot keep on every
   viewport: the cap goes, AND the rack is pinned to the floor with margin-top,
   so any leftover opens ABOVE it instead of beneath it. */
.hasUIArt #scene{ max-height:none }
.hasUIArt #kit{                ;                 }
/* NOT #castArea: its bench IS its border — a border-image with fill — so
   border:0 erased the whole panel while looking like tidying. Only the radius
   and margin square off; the border stays exactly as the art needs it. */
.inBattle.hasUIArt #castArea{ border-radius:0; box-shadow:none }  /* margin lives in the geometry block */

/* [hidden] LOSES TO display:flex. The attribute's display:none comes from the
   UA sheet, and any authored display beats it — so the "hidden" mana row still
   painted 8px of harness art. Stated explicitly, it cannot. */
#manaRow[hidden], #potionTray[hidden]{ display:none }

/* THE TOP BAR IS NOT A BAND. In the concept the purse and cog sit at the very
   top RIGHT while the enemy panel begins at the same height on the LEFT — they
   share the row. As a band it stole 26px from the stage and pushed the enemy
   panel down past its mark. Floated, the scene starts at the safe area. */
.inBattle.hasUIArt #topBar{

                                                                          
                                                                              
                                                                                
                                                                          
                                                                              
                                                                                
                                                                               
                                                                               
                                                                        
                              
                                                                                
                                                                            
                                                                                
                                          
                   ;                                                        ;
          ;           ;           ;
  /* THE 40px RESERVE IS GONE WITH THE BUTTON IT AVOIDED. The "?" floated at
     this corner and sat exactly on the cog, so a hit-test at the cog's centre
     returned helpBtn; 40px of right padding held it clear. The "?" has been
     removed — Settings already carries the Glossary — so the reserve is dead
     weight pushing the purse and cog left for no reason. */
  /* left:auto REMOVED — it sat five lines below left:76% in the SAME rule and
     silently won, which is the duplicate-declaration fault happening inside one
     block rather than across two. */
  z-index:6;          ; min-height:0;
}
/* and the stage starts below the bar, not under it */
.inBattle.hasUIArt #scene{                 }
.inBattle.hasUIArt #app{ position:relative }
.inBattle.hasUIArt #scene{              }

/* ---- top bar: the purse on its plate, the cog, the track gone -------------- */
.hasUIArt #battle-root #track,
body.hasUIArt #track{ display:none }
.hasUIArt #topBar{ justify-content:flex-end; gap:6px; border:0; background:none }
.hasUIArt #purseBar{
  background:var(--ui-purse-plate) center/100% 100% no-repeat;
  border:0; padding:2px 14px 2px 30px; min-height:24px; position:relative;
}
.hasUIArt #purseBar .aeIcon{ display:none }
/* VEILGLASS IS META-PROGRESSION, not battle information — it is earned and
   spent between runs. Aurels stay: the Alchemist SPENDS THEM TO CAST, which
   makes the purse a live combat readout for one discipline. Hidden here only;
   renderPurse still writes it for every other screen. */
.inBattle #purseBar .soulChip{ display:none }
.hasUIArt #purseBar::before{
  content:""; position:absolute; left:6px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; background:var(--ui-aurel-coin) center/contain no-repeat;
}

/* The first panel-internals block lived here and was superseded 2026-08-25 by
   the one below, which places every child in the slot its frame actually paints.
   Both were in the sheet at once and fought at equal specificity: the wards took
   the health row's position and the two printed over each other. Deleted rather
   than commented, because a rule that only sometimes loses is worse than one
   that is gone. */

/* ============================================================================
   THE PANEL INTERNALS, PLACED IN THE ART'S OWN SLOTS.

   Both frames are painted with recessed rows, and the children were flowing
   past them — the HP fill sat over the metal, the wards bunched with no room
   for their numbers, and the block badge landed outside its row entirely.
   Measured off the art:
     enemy-frame  660x235 : name 8-33%, health 38-63%, wards 65-88%, x 5-95%
     player-frame 620x240 : name 7-29%, health 33-62% (x to 78%),
                            relics 68-86%, and A SHIELD PAINTED IN at x 80-96%
   That last one matters: the wright's shield is part of the frame, so the game
   must print its NUMBER over the painting rather than supply a second shield.
   ============================================================================ */
/* NOT position:relative — the layout table places both panels with
   position:absolute inside #scene, and overriding it would drop them back into
   flow and out of their corners. An absolutely positioned box is ALREADY a
   containing block for its own absolute children, so the children below work
   without touching the parent at all. arttest caught this immediately, which is
   exactly what it was written for. */
.hasUIArt #enemyPanel > *, .hasUIArt #playerPanel > *{ position:absolute; margin:0 }

/* --- the enemy --- */
.hasUIArt #enemyPanel #enemyName{
  left:6%; right:6%; top:9%; height:23%;
  display:flex; align-items:center; justify-content:center;
  background:none; border:0; padding:0; font-size:12px; line-height:1;
}
.hasUIArt #enemyPanel .hpRow{
  left:5%; right:5%; top:39%; height:23%;
  display:flex; align-items:center; gap:0; padding:0;
}
/* IT IS .chipRow THAT IS THE THIRD ROW. #resistTray and the block badge both
   live INSIDE it, so styling them as children of the panel positioned two
   elements that are not there and left the row itself at the top, printing over
   the name. Measured in the page: chipRow at top:10px, exactly over enemyName. */
.hasUIArt #enemyPanel .chipRow{
  /* NO PLATE. ward-row-plate drew a second frame inside the one the panel art
     already paints. And the row is the wards ALONE now — the block badge moved
     to the right of the health bar, matching the wright's shield, which frees
     the whole width for six wards and their numbers. The shadow was hanging off
     the edge because the badge was eating the first column. */
  left:4%; right:4%; top:64%; height:24%;
  display:flex; align-items:center; gap:0; margin:0; padding:0; flex-wrap:nowrap;
  background:none !important;
}
.hasUIArt #enemyPanel .chipRow #resistTray{
  position:static; flex:1 1 auto; min-width:0; height:100%;
  display:flex; align-items:center; margin:0; padding:0; background:none;
}
/* the enemy's shield sits to the RIGHT of its health bar, as the wright's does */
/* ===== RETIRED, 2026-08-27 ==================================================
   TWO rules pinned this badge by percentage — this one and another 950 lines
   below, each written in a different redesign, each absolutely positioning it
   against a frame whose proportions had since changed. Kerry moved it three
   times and it came back odd every time, because a coordinate cannot survive
   the art it was measured against being replaced.
   It is placed BY ITS ROW now: last child of the health row, at the end, centred
   on the bar. There is nowhere else for it to go.
   ============================================================================ */
.hasUIArt .hpRow{ display:flex; align-items:center; gap:5px }
.hasUIArt .hpRow > .bar{ flex:1 1 auto; min-width:0 }
.hasUIArt .hpRow > .blockChip{
  flex:0 0 auto; position:static; margin:0; inset:auto;
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:100%; padding:0 3px; font-size:9px; z-index:2;
  background:var(--ui-shield-plate) center/contain no-repeat;
  border:0; box-shadow:none;
}/* folded into the later declaration of .hasUIArt #enemyPanel .hpRow */


/* --- the wright --- */
/* #playerName lives INSIDE #playerBar, so the bar is the name row and the name
   is not a sibling to place. Positioning both as absolute children of the panel
   put the name behind the health track. */
.hasUIArt #playerPanel #playerBar{ /* geometry now set by the tuning block */
  left:5%; right:5%; top:8%; height:20%;
  display:flex; align-items:center; justify-content:center;
  background:none; border:0; padding:0;
}/* folded into the later declaration of .hasUIArt #playerPanel #playerName */
/* folded into the later declaration of .hasUIArt #playerPanel .hpRow */

/* THE NUMBER ON THE PAINTED SHIELD. The frame draws the shield itself at
   x 80-96%; supplying another one stacked two shields. */
/* retired with its enemy twin — placed by the health row, not pinned */
/* GEOMETRY REMOVED — the authoritative block states the layout mode. This set
   display:grid with eight 1fr tracks and a 2px gap, which BEAT the block's
   display:flex, and in a grid a flex-basis means nothing: eight sockets sized
   0 0 11.7% collapsed to 2.4px each. The rule was not wrong about wanting eight
   even tracks; it was wrong to be a second place where the layout is decided. */
.hasUIArt #playerPanel #relicStrip{ background:none }
/* GEOMETRY REMOVED — the authoritative block sizes the socket. width:auto with
   flex:none on an EMPTY socket collapses it to nothing, which is why eight
   sockets measured 1.4% of the strip instead of his 11.7. Two ids beat the
   block's one id and a class, so this won silently. */

/* ---- THE INSIGHT MARKERS, on the supplied art ----------------------------
   Five faces: fracture, resonate, resist, and the two echoes. The pip was a CSS
   circle with a border and a ring; the art carries all of it, so every painted
   property has to go or it prints under the picture. */
.hasUIArt .pip{
  background:none !important; border:0 !important; box-shadow:none !important;
  color:transparent !important; border-radius:0 !important;
  background-size:contain !important; background-repeat:no-repeat !important;
  background-position:center !important;
  width:15px; height:15px; display:inline-block; vertical-align:middle;
}
.hasUIArt .pip.exploit           { background-image:var(--ui-insight-fracture) !important }
.hasUIArt .pip.resonate          { background-image:var(--ui-insight-resonate) !important }
.hasUIArt .pip.resist            { background-image:var(--ui-insight-resist) !important }
.hasUIArt .pip.exploit.echo      { background-image:var(--ui-insight-fracture-echo) !important }
.hasUIArt .pip.resonate.echo     { background-image:var(--ui-insight-resonate-echo) !important }
/* the CSS ring that used to mark an echo is part of the art now */
.hasUIArt .pip.echo::after, .hasUIArt .pip::before{ display:none !important }
/* CENTRED ON THE PAGE, not shoved against the spine — the markers began at the
   right page's left edge, which is where the fold is. */
.hasUIArt #book.hasPage .pips{
  display:flex; gap:4px; align-items:center; flex-wrap:wrap; justify-content:center;
}
.hasUIArt #book.hasPage .entry .pgR{ display:flex; justify-content:center }
/* both columns read larger: these are the two things the player studies */
.hasUIArt #book.hasPage .pip{ width:17px; height:17px }
.hasUIArt #book.hasPage .entry .pgL .runeArt,
.hasUIArt #book.hasPage .entry .pgL img{ width:17px; height:17px }
/* A DISC BEHIND EACH CAST RUNE. The element icons are painted for a dark plate
   and the grimoire's page is mottled parchment — against it they read as smudges
   whatever their size. element-btn-down is the pressed plate, which is exactly
   the right value here: dark enough to lift the icon, quiet enough not to
   compete with the writing. */
/* ONE SELECTOR, NOT TWO. `.runeArt` and `> span > span` matched the SAME
   element, so the disc was painted twice — one on the art, one on its wrapper,
   offset by the padding. That is the duplication Kerry saw. */
/* THE DISC IS GONE (Kerry, 2026-08-28). It painted --ui-element-btn-down —
   which resolves to rune.webp, the LOWER ELEMENT CONTROL — as a 50% circle
   behind every history mark. Gate 3 assigns rune.png to the six casting
   controls with repeat_count 6, and the approved battle_full.png shows no such
   frame in the history. There was never a commissioned history frame, so none
   is invented here: the element mark stands on the parchment as the preview
   shows it. */
.hasUIArt #book.hasPage .entry .pgL .runeArt{ padding:0 }
.hasUIArt #book.hasPage .entry .pgL{ gap:4px; align-items:center }

/* the button that opens the legend, beside the Insight heading */
/* #bookHeads button{ opacity:.22 } — the page-scroll arrows fade until needed,
   and #legendBtn is a button inside #bookHeads, so it inherited the fade. It is
   not a scroll arrow; it is always available. */
#legendBtn{ display:none }
.hasUIArt #legendBtn{
  /* bigger, and its own colour cleared: at 14px it read as a pale smudge beside
     the heading rather than a control worth pressing. */
  display:inline-block;           ;            ;                ;          ;
  border:0; background-color:transparent !important; cursor:pointer; vertical-align:-4px;
  -webkit-appearance:none; appearance:none;
  background-image:var(--ui-insight-legend-btn);
  background-size:contain; background-repeat:no-repeat; background-position:center;
}
#legendBar[hidden]{ display:none }

/* THE PANELS WERE DRAWING THEIR OLD SELVES UNDERNEATH. Every one of these
   carried a border, a backdrop or a pill from the undressed screen, and with the
   frame art behind them the result read as boxes inside boxes: a plate behind
   the name, a second track around the health bar, a rounded chip behind each
   relic socket, dividers between them. The art supplies all of that. Cleared in
   one place rather than fought one at a time. */
.hasUIArt #enemyPanel .who,
.hasUIArt #playerPanel .who,
.hasUIArt #enemyPanel #enemyName,
.hasUIArt #playerPanel #playerName,
.hasUIArt #enemyPanel .chipRow,
.hasUIArt #playerPanel #relicStrip,
.hasUIArt #enemyPanel #resistTray,
.hasUIArt #enemyPanel .hpRow,
.hasUIArt #playerPanel .hpRow,
.hasUIArt #enemyPanel .blockChip,
.hasUIArt #playerPanel .blockChip{
  background:none; border:0; box-shadow:none; border-radius:0; backdrop-filter:none;
}
/* the relic sockets keep THEIR art; nothing else behind them */
.hasUIArt #playerPanel .rsock{ box-shadow:none; border:0; border-radius:0 }
.hasUIArt #playerPanel .rsock.empty{ background-image:var(--ui-relic-socket) }
/* NOTHING BEHIND THE HEALTH BUT THE FRAME AND THE RED. Kerry: "it should just
   be the frame of the health bar and the red bar itself". The row carried a
   painted track, a CSS track, an inset shadow, a gloss layer and a rounded pill,
   all stacked. The frame art draws the recess; the fill draws the blood. */
.hasUIArt #enemyPanel .hpRow *, .hasUIArt #playerPanel .hpRow *{
  box-shadow:none !important; border-radius:0 !important; backdrop-filter:none !important;
}
.hasUIArt #enemyPanel .bar, .hasUIArt #playerPanel .bar{
  background:var(--ui-enemy-hp-track) center/100% 100% no-repeat !important;
  border:0 !important;
}
.hasUIArt #playerPanel .bar{ background-image:var(--ui-player-hp-track) !important }/* folded into the later declaration of .hasUIArt #enemyPanel .bar > i, .hasUIArt #playerPanel .bar  */

.hasUIArt #playerPanel .bar > i{ background-image:var(--ui-player-hp-fill) !important }

/* the health TRACK is the art; the CSS track and its inner highlight are not */
.hasUIArt #enemyPanel .bar, .hasUIArt #playerPanel .bar{
  border:0; box-shadow:none; border-radius:0; overflow:hidden;
}/* folded into the later declaration of .hasUIArt #enemyPanel .bar::before, .hasUIArt #playerPanel . */


/* the tracks fill their rows exactly */
.hasUIArt #enemyPanel .bar, .hasUIArt #playerPanel .bar{
  flex:1 1 auto; height:100%; min-width:0;
}/* folded into the later declaration of .hasUIArt #enemyPanel .hpNum, .hasUIArt #playerPanel .hpNum */


/* --- THE WARDS: six columns, icon over its count, with room for both --- */
.hasUIArt #enemyPanel .wardRow{
  display:grid; grid-template-columns:repeat(6,1fr); gap:3px;
  width:100%; height:100%; align-items:center;
}
.hasUIArt #enemyPanel .ward{
  display:flex; flex-direction:row; align-items:center; justify-content:center;
  gap:2px;            ;
}
/* the glyph fills the mark Kerry sized, rather than pinning it to 13px — a
   hard pixel size inside a percentage box is the legacy pattern this migration
   exists to remove. */
/* NO aspect-ratio — compattest forbids it in battle rules and is right to:
   older iOS Safari resolves it inconsistently inside a flex item, which is
   exactly what this is. A square glyph is achieved by giving width and height
   the same basis instead. */
.hasUIArt #enemyPanel .ward .wg{ width:1em; height:1em; font-size:inherit; flex:0 0 auto; min-width:0 }
.hasUIArt #enemyPanel .ward .wn{
  font-size:9px; line-height:1; min-width:8px; text-align:left;
  background:none; color:#f0dcb0;
}
.hasUIArt #enemyPanel .ward:not(.lit){ opacity:.4 }

/* ---- the HUD panels on their frames ---------------------------------------
   The frames carry their own borders and corner-work, so the CSS border,
   backdrop and shadow would print twice. Padding keeps the bars off the
   painted metalwork; numbers measured off the frame art. */
.hasUIArt #enemyPanel{
  background:var(--ui-enemy-frame) center/100% 100% no-repeat;
  border:0; box-shadow:none; border-radius:0; backdrop-filter:none;
                             ;
}
.hasUIArt #playerPanel{
  background:var(--ui-player-frame) center/100% 100% no-repeat;
  border:0; box-shadow:none; border-radius:0; backdrop-filter:none;
                             ;
}
/* the shield sits ON the plate; its own chip styling would double the metal */
.hasUIArt .blockChip{
  background:var(--ui-shield-plate) center/contain no-repeat;
  border:0; box-shadow:none;
}

/* ---- the threat banners ---------------------------------------------------- */
.hasUIArt #intent{
  /* the sword rode the text baseline and the label sat low in the ribbon;
     both are centred on the banner's own middle now */
  background:var(--ui-damage-banner) center/100% 100% no-repeat;
  border:0; box-shadow:none;                  ;
  min-height:26px;                      ;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.hasUIArt #intent::before{
  content:"";                  ;         ;        ;                           ;
            ;            ; background:var(--ui-damage-sword) center/contain no-repeat;
}
/* THE BANNERS, from the 2026-08 pack, stated last so nothing later can win. */
/* SCOPED THROUGH #threat, because the base rule is `#threat #intent` — two ids,
   which outranks one id and a class no matter how late it appears. Specificity
   is not order, and !important on the background alone left the BORDER behind. */
.hasUIArt #threat #intent{
  background:var(--ui-damage-banner) center/100% 100% no-repeat;
  border:0; border-radius:0; box-shadow:none;                  ;
  min-height:30px;                  ;
  display:flex; align-items:center; justify-content:center; line-height:1;
  color:#f6ded8;
}
/* THE SWORD IN ITS RING. Measured off the art: the medallion is centred at 9.5%
   of the banner's width and stands 66% of its height. The sword was 17x22px
   pinned 9px from the left — a fixed size against a banner that scales, sitting
   beside the ring rather than in it. Percentages put it in the middle of the
   medallion at every width. */
/* MEASURED, not estimated. damage-banner is 340x76. Scanning the art: at x=10%
   of the width the bright ring runs y 1.3%-22.4%, and at y=50% it runs x
   0.6%-7.1% — so the RING'S CENTRE is x 3.9%, y 11.8% is its top edge and the
   disc is about 6.5% of the width across. The sword was at left 9.5% / top 50%,
   which is off the disc entirely and half the banner's height.
   Sized to 62% of the ring so it sits inside the metal rather than covering it,
   per Kerry: "slightly smaller in comparison". */
/* THE SWORD IS PAINTED INTO THE RIBBON NOW, so the game must not draw its own
   over the top — Kerry spotted two of them in the Gate 2 fit test. Their
   manifest says it plainly: "a fixed sword mark and an empty runtime value
   field", which is exactly the doubling the commission warns about for text and
   which applies just as much to a MARK.
   The ABILITY banner keeps its ::before, because that icon VARIES by ability and
   cannot be painted in. One is fixed and belongs to the art; one changes and
   belongs to the game. */
.hasUIArt #threat #intent::before{ content:none }
/* the rule that used to undo those tints goes with them — there is nothing left
   to undo, and two rules fighting over one background is the fault the audit
   exists to remove */
.hasUIArt #threat #abilityTag:not(:empty){
  background:var(--ui-ability-banner) center/100% 100% no-repeat;
  border:0; border-radius:0; box-shadow:none;                  ;
  min-height:26px;                   ;
  display:flex; align-items:center; justify-content:center; line-height:1;
  color:#e6d9f7;
}
.hasUIArt #threat #abilityTag:not(:empty)::before{
  content:"";                  ;          ;        ;
                                 ;
            ;           ;
  background:var(--ui-ability-icon) center/contain no-repeat;
}

/* ---- relics: eight sockets on the tray ------------------------------------- */
.hasUIArt #relicStrip{
  background:var(--ui-relic-tray) center/100% 100% no-repeat;
                 ;  flex-wrap:nowrap; justify-content:center;
}
/* GEOMETRY REMOVED — a hard 20px basis inside a percentage row. The
   authoritative block sizes the socket at Kerry's 11.7%; this fixed basis is
   the legacy pattern the migration removes. Only the dressing stays. */
.hasUIArt .rsock{

/* ---- the casting bench ----------------------------------------------------- */
#castRow{ display:flex; align-items:center; justify-content:center; gap:8px }
.ptray{ display:flex; gap:5px }
.hasUIArt .psock{
            ;            ; flex:0 0 30px; display:inline-flex;
  align-items:center; justify-content:center;
  background:var(--ui-potion-socket) center/contain no-repeat;
}
.hasUIArt .psock:active{ background-image:var(--ui-potion-socket-down) }

/* ---- the meters, on the pack's own track and fills ------------------------
   The concept draws a framed bar under each button, filled in that element's
   colour. mana-meter is the empty track; mana-fill-<id> is that element's
   liquid. The old single red fill hue-rotated six ways is retired — these are
   authored per element and an authored file beats a filter. */
.hasUIArt .rune .mana .meter{
  background:var(--ui-mana-meter) center/100% 100% no-repeat;
  border-radius:0;
}
.hasUIArt .rune .mana .meter > i{
  background:center/100% 100% no-repeat;
  filter:none;              /* cancels --manaTint: these fills are authored */
}
.hasUIArt .rune[data-el="fire"]      .meter > i{ background-image:var(--ui-mana-fill-fire) }
.hasUIArt .rune[data-el="water"]     .meter > i{ background-image:var(--ui-mana-fill-water) }
.hasUIArt .rune[data-el="nature"]    .meter > i{ background-image:var(--ui-mana-fill-nature) }
.hasUIArt .rune[data-el="lightning"] .meter > i{ background-image:var(--ui-mana-fill-lightning) }
.hasUIArt .rune[data-el="ice"]       .meter > i{ background-image:var(--ui-mana-fill-ice) }
.hasUIArt .rune[data-el="shadow"]    .meter > i{ background-image:var(--ui-mana-fill-shadow) }
/* THE PLATE BELONGS TO THE ICON, NOT THE BUTTON. On the button it stretched
   behind the name AND the meter, so the bar sat ON the circle instead of
   nestling under it. Moved to the glyph: a true circle around the icon, with
   the name and the meter clear beneath it. */
.hasUIArt #runes .rune{ background:none;           }
.hasUIArt #runes .rune .glyph{
  width:46px; height:46px; padding:0; box-sizing:border-box;
}
.hasUIArt #runes .rune:active .glyph{ background-image:var(--ui-element-btn-down) }
/* the icon rides on the plate rather than replacing it */

/* a socket past capacity is present but asleep — desaturated from its own art,
   the Start Anew treatment, rather than replaced or removed */
.hasUIArt .psock.beyond{ opacity:.32; filter:grayscale(.5); pointer-events:none }
.hasUIArt .psock .potion{
  width:24px; height:24px; border:0; background:none; padding:0; font-size:14px;
}
/* CAST no longer spans the row — the sockets flank it, per the preview */
.hasUIArt #castRow #cast{
  /* THE WORD IS A PICTURE. cast-label is drawn lettering; typing "Cast" over the
     plate printed it twice in two different faces. The text stays in the DOM for
     a screen reader and is hidden from the eye — the same treatment the menu
     buttons needed. */
  display:flex; align-items:center; justify-content:center;
           ; line-height:1; min-height:44px; font-size:0; color:transparent;
                   ;
  flex:0 1 210px; min-width:150px;
  background:var(--ui-cast-btn) center/100% 100% no-repeat;
  border:0; box-shadow:none;
}
/* REMOVED 2026-08-28: a separate CAST label. cast.png declares baked_text "CAST", so the word is in the art */
.hasUIArt #castRow #cast:active:not(:disabled){ background-image:var(--ui-cast-btn-down) }
.hasUIArt #castRow #cast:disabled{ background-image:var(--ui-cast-btn-off) }

/* ---- the spell rack -------------------------------------------------------- */
.hasUIArt .spell{
  background:var(--ui-spell-slot) center/100% 100% no-repeat;
  border:0; box-shadow:none; border-radius:0;                  ;
}
/* STATE OVERLAYS on ::after — they contain only what changes, per the pack, so
   they layer over the slot rather than replacing it. */
.hasUIArt .spell::after{
  content:"";                  ;        ; pointer-events:none;
  background:center/100% 100% no-repeat;
}
/* NO LOCKED OVERLAY ART. Gate 3 delivers ONE spell frame, repeat_count 4, and
   declares no locked variant. I had registered spell-slot-locked to the SAME
   file, so the overlay repainted the frame over itself — four cards, eight
   paints. The locked STATE is still shown, by the dimming below; only the
   duplicate art is gone. Asking ChatGPT for a locked variant is a commission
   decision, not something to fake by drawing the frame twice. */
/* AN EMPTY SLOT IS A LOCKED ONE. Kerry: any slot without a spell shows the
   locked art — the rack then reads as capacity you have yet to earn rather than
   as four holes. */
.hasUIArt .spell.empty::after{ background-image:var(--ui-spell-slot-locked) }/* folded into the later declaration of .hasUIArt .spell.empty */

.hasUIArt .spell.resting::after{ background-image:var(--ui-spell-slot-off) }
.hasUIArt .spell:active:not(:disabled)::after{ background-image:var(--ui-spell-slot-down) }
.hasUIArt .spell.ready::after{ background-image:var(--ui-spell-slot-sel) }

/* ============================================================================
   THE MAIN MENU AND DISCIPLINES, 2026-08 pack.
   The pack's placement notes give everything in screen percentages against
   440x956 — which is the language the layout table already speaks. So POSITIONS
   live in the table, where Kerry can drag them, and only APPEARANCE lives here.
   ============================================================================ */
/* THE WRIGHT DRIFTING RIGHT. He is placed at left:52% and centred with
   translate(-50%) — but a percentage translate resolves against the ELEMENT'S
   OWN WIDTH, and an <img> with height set and width auto has NO width until its
   file decodes. So on a cold load the translate is -50% of zero, he sits with
   his left edge on the 52% line, and navigating away and back "fixes" it only
   because by then the image is in cache and decodes before layout.
   Giving the box its natural ratio means the width is known immediately.
   Measured: menu-wizard is 760x1597. */
.hasUIArt .mmWizard{ aspect-ratio:760 / 1597 }
.hasUIArt .mmLogo{ aspect-ratio:840 / 245 }

.mmManifest, .mmLight, .mmGroundShadow{
  position:absolute; pointer-events:none; user-select:none;
  display:block;
}
/* the table gives these a HEIGHT, so the width must follow the art rather than
   being stretched to whatever the box happens to be */
.mmManifest{ width:auto; height:auto; object-fit:contain }
.mmLight, .mmGroundShadow{ height:auto }
/* THE FROST SITS BACK. It is the brightest and highest-contrast of the seven —
   a white swirl against a dark set — so at equal opacity it pulled the eye off
   the wright. 15% off, per Kerry, which lets it read as one of the ring rather
   than the subject of the screen. */
.mmManifest.mf-cryomancer{ opacity:.85 }

/* atmosphere, and it must never intercept a tap */
.mmLight{ mix-blend-mode:screen; opacity:.85 }
/* THE ASTROLABE IS SUPERSEDED. It was the ring the old title spun behind the
   wright; the 2026-08 composition has the manifestations there instead, and
   both drawn at once reads as two competing designs. Hidden rather than
   unregistered so a build without the new pack still has its title. */
.hasUIArt .mmManifest ~ .mmAstro,
.hasUIArt .mmArt:has(.mmManifest) .mmAstro{ display:none }
/* and on the disciplines stage, where the seven SELECTORS now ring the wright —
   the painted ring behind them was the old composition's, and both at once is
   two rings around one figure */
.hasUIArt .dOrbit:has(.packOrb) .mmAstro{ display:none }
/* the seals likewise */
.hasUIArt .mmArt:has(.mmManifest) .mmSeal{ display:none }
.mmGroundShadow{ opacity:.9 }

/* ---- the menu buttons: a plate, drawn lettering, state overlays -----------
   The pack paints NEW GAME / CONTINUE / START ANEW / SETTINGS as PIXELS, and it
   declares them in the manifest under baked_text. So the game must not type them
   as well — doing that printed every menu label twice on the last pack and Kerry
   caught it. The word stays in the DOM for a screen reader and is hidden from
   the eye. */
.hasUIArt .mmBtn{
  background:var(--ui-menu-button-primary) center/100% 100% no-repeat;
  background-color:transparent;
  border:0; box-shadow:none; border-radius:0; position:relative;
}
/* EVERY typed label inside a dressed button is hidden — .mmLabel, .mmSub, and
   the bare text some builders write straight into the element. "SETTINGS"
   printed twice because second() emits its word as a text node with no span
   around it, so hiding spans alone could not reach it. font-size:0 on the
   button reaches everything; the ::after label is given its own size back. */
.hasUIArt .mmBtn{ font-size:0; color:transparent }
.hasUIArt .mmBtn .mmLabel,
.hasUIArt .mmBtn .mmSub{ visibility:hidden; font-size:0 }
.hasUIArt .mmBtn::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:center/auto 44% no-repeat;
}
.hasUIArt #mmNew::after      { background-image:var(--ui-label-new-game) }
.hasUIArt #mmContinue::after { background-image:var(--ui-label-continue) }
.hasUIArt #mmAnew::after     { background-image:var(--ui-label-start-anew) }
.hasUIArt #mmSettings::after { background-image:var(--ui-label-settings) }
/* pressed and disabled are OVERLAYS on the shared canvas, as the pack ships them */
.hasUIArt .mmBtn:active:not(:disabled){
  background-image:var(--ui-menu-button-down), var(--ui-menu-button-primary);
  background-size:100% 100%, 100% 100%;
}
.hasUIArt .mmBtn:disabled, .hasUIArt .mmBtn.off{
  background-image:var(--ui-menu-button-off), var(--ui-menu-button-primary);
  background-size:100% 100%, 100% 100%;
  opacity:1;                    /* the overlay IS the disabled look, not a fade */
}

/* ---- the disciplines screen ---------------------------------------------- */
/* PLACED LIKE .sealArt, because that is what the percentage positions were
   written for. The base .dOrb still uses the old degree transform —
   rotate(--a) translate(128px) — which is right for a build with no art, and
   which flung five of the seven selectors clean off a 440px screen the moment
   they were given --x/--y instead. The frame class has to bring the placement
   with it, not just the picture. */
.hasUIArt .dOrb.packOrb{
  position:absolute;
  width:clamp(52px, 15.5vw, 88px); height:auto; aspect-ratio:1;
  left:var(--x); top:var(--y); right:auto; bottom:auto;
  transform:translate(-50%, -50%);
  background:var(--ui-selector) center/contain no-repeat;
  background-color:transparent;
  border:0; box-shadow:none; padding:0; z-index:3;
}
.hasUIArt .dOrb.packOrb:active{ transform:translate(-50%, -50%) scale(.93) }
.hasUIArt .dOrb.packOrb:active{
  background-image:var(--ui-selector-down), var(--ui-selector);
  background-size:contain, contain;
}
/* selected: the pack puts the aura BEHIND the frame, so it is a ::before with a
   negative z, not another background layer */
.hasUIArt .dOrb.packOrb.on{
  background-image:var(--ui-selector-sel), var(--ui-selector);
  background-size:contain, contain;
  box-shadow:none;
}
.hasUIArt .dOrb.packOrb.on::before{
  content:""; position:absolute; inset:-20%; z-index:-1; pointer-events:none;
  background:center/contain no-repeat;
}
.hasUIArt .dOrb.packOrb.locked{
  background-image:var(--ui-selector-locked), var(--ui-selector);
  background-size:contain, contain;
}
/* the medallion, with the discipline still readable underneath */
.hasUIArt .dOrb.packOrb.locked::after{
  content:""; position:absolute; right:-6%; bottom:-6%; width:40%; height:40%;
  background:var(--ui-menu-lock-badge) center/contain no-repeat; pointer-events:none;
}
.hasUIArt .dOrb.packOrb .dOrbIcon{
  position:absolute; inset:19%;
  background:center/contain no-repeat; pointer-events:none;
}
/* the wright wears the chosen craft's light */
.dWrightLight{
  position:absolute; pointer-events:none; opacity:0;
  transition:opacity .45s ease;
}
.dWrightLight.on{ opacity:1 }


/* ---- THE SPREAD: two pages, dark ink, and the icon on the paper -----------
   Three faults at once on the painted spread, all from the sheet being treated
   as one column of text laid over a picture of a book:
     the icon hung off the left edge instead of sitting on the page,
     the ink was set for a dark panel and vanished into parchment,
     and the description ran under the two controls instead of continuing to the
     facing page, which is what a book does.
   ---------------------------------------------------------------------------- */
/* ===== SUPERSEDED, 2026-08-26 ==============================================
   This block styled the spread when it was one panel with a margin: it set
   .dPage to a flex column, gave .dSheetHead and .dSheetIcon a layout that no
   longer exists in the markup, and re-declared .dName and .dBlurb at the SAME
   specificity as the rules that now own them. Two rules writing one property
   from two places is the fault that has cost this project five separate rounds,
   and this file had three such pairs on one element.
   The ink colours below are kept — they are the only part still true. */
.hasUIArt .dSheet.onPanel .dBlurb b{ color:#241703 }
.hasUIArt .dSheet.onPanel .dSealed{ color:#5b431c; border-color:rgba(90,66,28,.45) }

/* ===== THE COLUMN BUG, FOUND 2026-08-26 =====================================
   `columns:2` lived here, from the round where I first tried to make the spread
   read as two pages. Kerry asked for the columns to be dropped and I removed the
   OTHER attempt — the grid split — and left this one behind.

   It is the reason the description wrapped at 68px inside a 157px box across
   three rounds of "fixed". CSS multicolumn narrows the LINE BOXES and leaves the
   element's width alone, so every measurement I took came back innocent:
   display block, no padding, no max-width, normal wrap, normal font. I was
   measuring the container, and the container was never wrong.

   Proved with the Range API — element box 157px, line boxes 68px, columnCount 2
   — rather than by reading CSS, which is what four rounds of reading had missed.
   LESSON: when a box measures right and its CONTENT does not, the property is
   one that reshapes content without resizing the box. Instrument the line boxes.
   ============================================================================ */
.hasUIArt .dSheet.onPanel .dActs{ padding:0 2% }

/* ---- THE PAGE TURN ------------------------------------------------------
   A single leaf rotating on its spine. front and back share one canvas, per the
   pack, so they must be two faces of the SAME box rather than two images. The
   content swap happens at the midpoint, hidden by the edge-on leaf. */
.dSheet{ position:relative }
/* THE LEAF IS THE RIGHT PAGE, carried left. No 3D: the pack DREW the three
   stages, so the job is to show them in order and move the sheet across, not to
   simulate a rotation and hope it matches. Flat transforms also behave the same
   in every engine, which the parchment taught us the hard way. */
.dLeaf{
  position:absolute; top:0; bottom:0; left:50%; right:0;
  z-index:5; pointer-events:none; transform-origin:left center;
}
.dLeafFrame{
  position:absolute; inset:0; opacity:0;
  background-position:center; background-size:100% 100%; background-repeat:no-repeat;
}
/* FIRST HALF — the right page lifts and starts across. */
.dLeaf.go{ animation:leafCarry .45s ease-in forwards }
.dLeaf.go .f1{ animation:leafF1 .45s linear forwards }
.dLeaf.go .f2{ animation:leafF2 .45s linear forwards }
@keyframes leafCarry{
  from{ transform:translateX(0)     scaleX(1)   ; filter:brightness(1) }
  to  { transform:translateX(-46%)  scaleX(.12) ; filter:brightness(.8) }
}
@keyframes leafF1{ 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
@keyframes leafF2{ 0%{opacity:0} 70%{opacity:0} 100%{opacity:1} }
/* SECOND HALF — it lands over the left page, which already shows the new craft. */
.dLeaf.go.half{ animation:leafLay .45s ease-out forwards }
.dLeaf.go.half .f1{ animation:none; opacity:0 }
.dLeaf.go.half .f2{ animation:leafF2b .45s linear forwards }
.dLeaf.go.half .f3{ animation:leafF3 .45s linear forwards }
@keyframes leafLay{
  from{ transform:translateX(-46%) scaleX(.12); filter:brightness(.8) }
  to  { transform:translateX(-100%) scaleX(1) ; filter:brightness(1); opacity:0 }
}
@keyframes leafF2b{ 0%{opacity:1} 45%{opacity:1} 100%{opacity:0} }
@keyframes leafF3 { 0%{opacity:0} 45%{opacity:0} 90%{opacity:1} 100%{opacity:.9} }
/* the light the pack paints over the chosen spread */
.hasUIArt .dSheet.onPanel::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:var(--ui-disc-page-light) center/100% 100% no-repeat;
  mix-blend-mode:screen; opacity:.7;
}
/* the book's cast shadow seats it on the floor */
.hasUIArt .dSheet.onPanel{
  background:var(--ui-menu-grimoire-panel) center/100% 100% no-repeat;
  border:0; box-shadow:none;
}
/* ---- THE PAGE, READ AS A BOOK -------------------------------------------
   Three faults together, and one cause: the spread was treated as a single
   panel with a margin rather than as TWO PAGES.
     * the icon sat over the left edge, half on the cover
     * the ink was --vellum-dim, chosen for a dark panel, and this is parchment
     * the blurb ran on under the two controls instead of stopping
   The gutter is the middle of the art, so text that reaches it belongs on the
   RIGHT page — which is what a book does. The left page holds the name and the
   description; the right holds the controls; neither runs into the other. */
/* LEFT PAGE, RIGHT PAGE. .dActs is a SIBLING of .dPage, so the two columns
   belong on the SHEET. The left page carries the icon, the craft's name and its
   description as ONE running column — a book, not a newspaper. The right page
   carries the two controls. Nothing crosses the gutter. */
/* THE BOOK IS A FIXED OBJECT. Measured across all seven crafts, it was swinging
   between 174px and 190px and its top edge moving 8px, because the sheet took
   its height from whichever description happened to be longest — so choosing a
   different craft resized the book and shifted the whole screen under it.
   A book does not change size when you turn its page.

   Locked to the taller of the two measured heights, 190px, expressed as a share
   of the screen so it still scales with the phone. The description fits inside
   it and scrolls if a future craft ever needs more, rather than pushing the
   covers apart. */
.hasUIArt .dSheet.onPanel{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:4%;
  padding:9% 10% 13% 10%;      /* inward, off the painted cover and the gutter */
  align-items:start;
  height:clamp(168px, 21.5dvh, 214px);
  box-sizing:border-box;
  overflow:hidden;             /* the covers are the edge; nothing spills past */
}
/* the page fills the fixed book, and the description takes what is left after
   the title — so a long craft scrolls a little instead of resizing the object */
.hasUIArt .dSheet.onPanel .dPage{
  height:100%; display:flex; flex-direction:column; min-height:0;
}
.hasUIArt .dSheet.onPanel .dBlurb{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
/* BLOCK, not the flex it inherits. .dPage is a flex COLUMN in the base sheet,
   so .dLine became a flex item and shrank to its own content — 70px inside a
   157px page, which is why the description wrapped after one word however wide
   the column got. A page is a block; text fills it. */
.hasUIArt .dSheet.onPanel .dPage{
  grid-column:1; padding:0; min-width:0; display:block;
}
.hasUIArt .dSheet.onPanel .dLine{ width:auto; display:block }
.hasUIArt .dSheet.onPanel .dActs{
  grid-column:2; align-self:center;
  display:flex; flex-direction:column; gap:10%; margin:0; padding:0;
  /* min-width:0 HERE TOO. `1fr 1fr` is a MINIMUM of auto, so the buttons' own
     minimum width pushed the right column wider and squeezed the left page to
     about 75px — which is why the description wrapped after one word. A grid
     column only splits evenly if neither side can refuse to shrink. */
  min-width:0;
}
.hasUIArt .dSheet.onPanel #dTree,
.hasUIArt .dSheet.onPanel #dGo{ min-width:0; width:100% }
/* THE TITLE, across the top of the left page and never past its edge. */
.hasUIArt .dSheet.onPanel .dName{
  display:block; margin:0 0 4px; padding:0;
  font-size:clamp(13px, 3.6vw, 18px); line-height:1.1;
  overflow-wrap:anywhere;      /* a long craft wraps rather than crossing the fold */
  color:#241806;
}
/* THE TITLE ROW: the craft's mark, then its name. No float — the emblem is part
   of the heading now, so it belongs in the same line box rather than being
   something the paragraph flows around. */
.hasUIArt .dSheet.onPanel .dTitleRow{
  display:flex; align-items:center; gap:7px; margin:0 0 5px; min-width:0;
}
.hasUIArt .dSheet.onPanel .dTitleRow .dName{ margin:0; min-width:0 }
/* THE SAME PLATE THE SELECTORS WEAR. selector.webp under the craft's own icon,
   two layers on one box — the identical treatment used on the orbit above, so
   the mark on the page and the mark in the ring are recognisably one thing. */
.hasUIArt .dSheet.onPanel .dCap{
  flex:0 0 auto; width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; line-height:1;
  background:var(--ui-selector) center/contain no-repeat;
}
.hasUIArt .dSheet.onPanel .dCap img{
  width:62%; height:62%; object-fit:contain;   /* inside the plate, not over it */
}
/* the pill is gone: the padlock above and the dimmed controls beside already
   say it, and it was eating a line of a small page */
.hasUIArt .dSheet.onPanel .dSealed{ display:none }
/* the ink: parchment is light, so the text must be DARK to be read on it —
   these colours were picked for the old dark panel */
.hasUIArt .dSheet.onPanel .dName{ color:#241806 }
.hasUIArt .dSheet.onPanel .dClass,
.hasUIArt .dSheet.onPanel .dEyebrow{ color:#5b431c }
.hasUIArt .dSheet.onPanel .dBlurb{
  /* BOLDER, so it reads on parchment — Kerry's note. And it simply flows down
     the left page; the earlier two-column split was a bad idea and is gone. */
  color:#33240c; font-size:11.5px; line-height:1.42; font-weight:600;
  margin:0; max-height:none; overflow:visible;
}
/* .dLine forced every line onto ONE row with an ellipsis — right when the sheet
   was a wide panel, wrong now that the description has a half-page. A book
   wraps; that is the whole point of the second page. */
.hasUIArt .dSheet.onPanel .dLine{
  display:block; white-space:normal; overflow:visible; text-overflow:clip;
}
.hasUIArt .dSheet.onPanel .dBlurb b{ color:#241806 }
.hasUIArt .dSheet.onPanel .dSealed{ color:#5b431c; border-color:rgba(91,67,28,.45) }

/* the socket the chosen craft's icon sits in, upper-left of the spread */
.hasUIArt .dSheetIcon{
  background:var(--ui-disc-icon-socket) center/contain no-repeat;
  display:inline-flex; align-items:center; justify-content:center;
  /* INWARD. It hung over the book's left edge, half on the painted cover. The
     socket belongs on the paper. */
  margin-left:0; flex:0 0 auto;
}
/* THE TWO BOOK CONTROLS, on inlaid leather. The 2026-08-26 kit gives them
   SEPARATE plates so they are not identical twins: Venture Forth is the richer,
   more used hide — it is the committing action — and View Talent Tree is the
   same leather, flatter and drier. book-button remains as the neutral fallback
   for any build that has one plate and not the pair. */
.hasUIArt #dTree, .hasUIArt #dGo{
  background:var(--ui-book-button) center/100% 100% no-repeat;
  background-color:transparent; border:0; box-shadow:none; border-radius:0;
  position:relative; font-size:0; color:transparent; min-height:34px;
}
.hasUIArt #dGo  { background-image:var(--ui-book-button-primary) }
.hasUIArt #dTree{ background-image:var(--ui-book-button-secondary) }
/* every typed label inside a dressed book control is hidden: the pack paints
   VIEW TALENT TREE and VENTURE FORTH as pixels and declares them baked_text, so
   the game must not set them too — the same double-print the menu had. */
.hasUIArt #dTree > *, .hasUIArt #dGo > *{ visibility:hidden }
.hasUIArt #dTree::after, .hasUIArt #dGo::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  /* CONTAIN, not `auto 42%`. Sizing the lettering by HEIGHT let it overflow a
     column half as wide as the spread — "VIEW TALENT TREE" ran off both ends.
     contain fits whichever dimension binds. */
  background:center/contain no-repeat;
  background-size:88% auto;
}
.hasUIArt #dTree::after{ background-image:var(--ui-label-talent-tree) }
.hasUIArt #dGo::after  { background-image:var(--ui-label-venture-forth) }
/* the states are CHANGES-ONLY overlays on the same canvas, so each lays over
   its OWN plate rather than over a shared one — otherwise pressing Venture
   Forth would show the neutral hide underneath its own. */
.hasUIArt #dTree:active{
  background-image:var(--ui-book-button-down), var(--ui-book-button-secondary);
  background-size:100% 100%, 100% 100%;
}
.hasUIArt #dGo:active:not(:disabled){
  background-image:var(--ui-book-button-down), var(--ui-book-button-primary);
  background-size:100% 100%, 100% 100%;
}
/* disabled: the leather has dried out. The overlay IS the disabled look, so the
   button is not additionally faded — a fade on top would make it vanish against
   the parchment rather than read as lifeless. */
.hasUIArt #dGo:disabled{
  background-image:var(--ui-book-button-off), var(--ui-book-button-primary);
  background-size:100% 100%, 100% 100%; opacity:1;
}
.hasUIArt #dTree:disabled{
  background-image:var(--ui-book-button-off), var(--ui-book-button-secondary);
  background-size:100% 100%, 100% 100%; opacity:1;
}
/* the back control */
.hasUIArt .dBack.art{
  background:var(--ui-menu-button-back) center/contain no-repeat;
  background-color:transparent; border:0; position:relative;
}
.hasUIArt .dBack.art::after{
  content:""; position:absolute; inset:22%;
  background:var(--ui-menu-back-arrow) center/contain no-repeat;
}
.hasUIArt .dBack.art:active{
  background-image:var(--ui-menu-back-down), var(--ui-menu-button-back);
  background-size:contain, contain;
}
/* the disciplines heading */
.hasUIArt .dLogo{ display:block }


/* ---- DRAWN NUMERALS ------------------------------------------------------
   Each glyph is a box masked to the numeral's shape and filled with
   currentColor, so the existing state colours — .cost.cut green, .short red,
   .alt dimmed — tint the drawn glyph exactly as they tinted the typed one.
   That is the whole reason the set was commissioned white. */
.nums{ display:inline-flex; align-items:center; gap:.5px; vertical-align:-1px }
.num{
  display:inline-block; width:.72em; height:.9em;
  background-color:currentColor;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center;  mask-position:center;
  -webkit-mask-size:contain;     mask-size:contain;
  font-style:normal;
}
/* the element beside a cost, at the numerals' own height */
.spell .sc .costEl,
.spell .sc .costEl img{ width:.95em; height:.95em; vertical-align:-2px }
.spell .sc .cost{ display:inline-flex; align-items:center; gap:1.5px }

/* the spell card's icon, now that all 78 are registered */
.hasUIArt #kit .spell .sg{ display:block; width:40px; height:40px; margin:0 auto }/* folded into the later declaration of .hasUIArt #kit .spell .sg img */



/* ---- THE CAST: STRAIN AND IMPACT ----------------------------------------
   The knot trembles while it is packed, and the creature flashes when the
   incantation arrives. Both are short and both are additive — nothing here
   changes where anything sits. */
/* the tremble is gone: the cadence is now circle, contract, shoot, and a shake
   between them was a fourth beat competing with the swirl for attention. Its
   keyframes are removed rather than left orphaned — a rule nothing applies is a
   rule someone later has to work out the status of. */
/* THE FLASH. A filter, not a background: the creature may be a photograph, an
   emoji or nothing at all, and only a filter treats all three the same. */
#enemySprite.struck{ animation:struckFlash .3s ease-out }
@keyframes struckFlash{
  0%   { filter:brightness(2.6) saturate(.35) drop-shadow(0 0 14px rgba(255,255,255,.9)) }
  35%  { filter:brightness(1.7) saturate(.7)  drop-shadow(0 0 8px rgba(255,255,255,.5)) }
  100% { filter:none }
}
/* reduced motion keeps the flash — it is information, not decoration */


/* ---- THE PAGE TURN, IN THREE DIMENSIONS ----------------------------------
   A leaf on the right half rotates about the spine. Its faces carry the real
   pages, so what turns is the page you were reading. See turnPageTo(). */
.hasUIArt .dSheet.onPanel{ perspective:1600px; perspective-origin:50% 45% }

.dLeaf3{
  position:absolute; top:0; bottom:0; left:50%; right:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transform:rotateY(0deg);
  z-index:6; pointer-events:none;
}
.dLeaf3.go{ animation:leafTurn var(--turnMs, 780ms) cubic-bezier(.42,0,.36,1) forwards }
@keyframes leafTurn{
  from{ transform:rotateY(0deg) }
  to  { transform:rotateY(-180deg) }
}
.leafFace{
  position:absolute; inset:0; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  /* THE FLICKER WAS Z-FIGHTING. Two faces sharing a plane leave the compositor
     to break the tie, and it breaks it differently frame to frame. Half a pixel
     of separation is invisible and settles it for good. */
  transform:translateZ(0.5px);
  will-change:transform;
}
.leafFace.back{ transform:rotateY(180deg) translateZ(0.5px) }
/* the cloned controls must not light up under a finger that is not on them */
.leafHolder button{ pointer-events:none }
/* the clone is laid in at the FULL spread's width and slid, so each face shows
   the half it should — the front the old right page, the back the new left */
.leafHolder{ position:absolute; top:0; bottom:0 }
.leafHolder .dSheet{
  position:absolute; inset:0; width:100%; height:100%;
  margin:0; animation:none; transform:none;
}
/* the leaf's own clones must not re-run anything, or seven auras start turning
   inside a page that is being thrown away */
.leafHolder *{ animation:none !important; transition:none !important }

/* THE PAGE BENEATH THE LIFTING LEAF is in its shadow and comes up to full light
   as it is uncovered — the whole half, parchment and all, not just what is
   printed on it. Timed against the leaf's own rotation, so nothing appears:
   everything was there all along, just unlit.
   Peak .44, softened from .55 — Kerry found it a touch too dark, and a page in
   shadow is still a page you can read. */
.leafUnderShade{
  position:absolute; top:0; bottom:0; left:50%; right:0;
  z-index:3; pointer-events:none; opacity:0;
  background:linear-gradient(100deg, rgba(14,9,3,.62), rgba(14,9,3,.34) 62%, rgba(14,9,3,.22));
}
.leafUnderShade.go{ animation:pageUncover var(--turnMs, 780ms) ease-out forwards }
@keyframes pageUncover{
  0%   { opacity:.44 }
  34%  { opacity:.40 }
  66%  { opacity:.16 }
  100% { opacity:0 }
}
@media (prefers-reduced-motion: reduce){
  .leafUnderShade{ display:none }
}

/* the old left page, held on top of the new one until the leaf covers it.
   It FADES rather than being removed: a removal at any single instant is a cut,
   and the one instant the leaf covers nothing is exactly halfway — which is
   where the removal used to be. */
.leafUnder{
  position:absolute; top:0; bottom:0; left:0; width:50%;
  overflow:hidden; z-index:4; pointer-events:none;
}
.leafUnder.fading{ animation:heldPageFade var(--turnMs, 780ms) linear forwards }
@keyframes heldPageFade{
  0%   { opacity:1 }
  46%  { opacity:1 }
  72%  { opacity:0 }
  100% { opacity:0 }
}
/* SHADING — each face loses light as it approaches edge-on. Without this the
   leaf reads as a decal sliding over the book rather than as paper. */
.leafShade{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, rgba(18,12,4,.42), rgba(18,12,4,0) 55%);
  opacity:0;
}
.dLeaf3.go .front .leafShade{ animation:leafShadeF var(--turnMs, 780ms) linear forwards }
.dLeaf3.go .back  .leafShade{ animation:leafShadeB var(--turnMs, 780ms) linear forwards }
@keyframes leafShadeF{ 0%{opacity:0} 100%{opacity:.85} }
@keyframes leafShadeB{ 0%{opacity:.85} 100%{opacity:0} }

/* CAST SHADOW — sweeps across the page beneath as the leaf passes over, then
   leaves. This is what puts the leaf ABOVE the book instead of inside it. */
/* THE CAST SHADOW LIVES ON THE PAGE, not on the cover. At left:6% it began
   inside the sheet's padding — which is the painted binding, outside the paper —
   so a soft dark gradient sat over the book's edge and read as a glow floating
   beside the page rather than as a shadow falling on it. Held inside the page
   area, and eased at both ends so it has no hard boundary of its own. */
.leafCast{
  position:absolute; top:8%; bottom:12%; left:11%; width:38%;
  z-index:5; pointer-events:none; opacity:0;
  background:radial-gradient(115% 85% at 100% 50%,
             rgba(10,6,2,.5), rgba(10,6,2,.18) 58%, rgba(10,6,2,0) 78%);
}
.leafCast.go{ animation:leafCastSweep var(--turnMs, 780ms) ease-in-out forwards }
@keyframes leafCastSweep{
  0%   { opacity:0;   transform:translateX(38%) }
  35%  { opacity:.9;  transform:translateX(10%) }
  70%  { opacity:.55; transform:translateX(-12%) }
  100% { opacity:0;   transform:translateX(-26%) }
}
@media (prefers-reduced-motion: reduce){
  .dLeaf3, .leafCast{ display:none }
}




/* ============================================================================
   THE 2026-08 BATTLE PACK, PLACED IN ITS OWN DECLARED SLOTS.

   Every rectangle below is copied from docs/assets_manifest.json, where the
   artist stated where each value belongs inside each frame. That is the single
