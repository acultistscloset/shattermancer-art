   most valuable thing this pack does: the last kit had me measuring art pixel by
   pixel and guessing, which is where boxes-inside-boxes and the sword outside
   its ring both came from.
   ============================================================================ */

/* ---- the two status rails ------------------------------------------------
   The frames are plain rails now, with no internal boxes painted in — so every
   child must be a bare value on the rail, not a plate of its own. */
.hasUIArt #enemyPanel > *, .hasUIArt #playerPanel > *{ position:absolute; margin:0 }

.hasUIArt #enemyPanel #enemyName{
  left:6%; right:22%; top:8%; height:16%;
  display:flex; align-items:center; justify-content:flex-start;
  background:none; border:0; padding:0; font-size:11px; line-height:1;
}
.hasUIArt #enemyPanel .hpRow{
  left:6%; right:5%; top:29%; height:19%;
  display:flex; align-items:center; padding:0; background:none;
}
/* the second of the two pinning rules — see the note above */
.hasUIArt #enemyPanel .chipRow{
  left:6%; right:6%; top:55%; height:24%;
  display:flex; align-items:center; gap:0; margin:0; padding:0;
  flex-wrap:nowrap; background:none !important;
}

.hasUIArt #playerPanel #playerBar{ /* geometry now set by the tuning block */
  left:7%; right:24%; top:8%; height:15%;
  display:flex; align-items:center; justify-content:flex-start;
  background:none; border:0; padding:0;
}
.hasUIArt #playerPanel #playerName{ position:static; font-size:11px; line-height:1 }
.hasUIArt #playerPanel .hpRow{
  left:7%; right:5%; top:27%; height:21%;
  display:flex; align-items:center; padding:0; background:none;
}
/* the fourth and last pinning rule — see the note at the first. Four separate
   declarations across three redesigns, all positioning two badges by percentage
   against art that kept changing underneath them. */
/* GEOMETRY REMOVED — the SECOND of two identical grid rules on this selector,
   950 lines from the first. Two ids beat the authoritative block's one id and a
   class, so display:grid won and every flex property on .rsock was inert: eight
   sockets sized 0 0 11.7% collapsed to 2.4px each. I removed the first and
   assumed that was the cause. It was not; this was. */
.hasUIArt #playerPanel #relicStrip{ background:none }

/* THE HEALTH BAR IS ART, not CSS. The pack supplies a frame and a fill and says
   plainly not to redraw them with primitives — which is exactly the fault I
   committed on the last kit. The frame stays whole; the fill is clipped by
   width underneath it. */
.hasUIArt #enemyPanel .bar, .hasUIArt #playerPanel .bar{
  background:var(--ui-hp-track) center/100% 100% no-repeat !important;
  border:0 !important; box-shadow:none !important; border-radius:0 !important;
  height:100%; overflow:hidden; position:relative;
}
.hasUIArt #enemyPanel .bar > i, .hasUIArt #playerPanel .bar > i{
  background:var(--ui-hp-fill) left center/auto 100% no-repeat !important;
  border:0 !important; filter:none !important; border-radius:0 !important;
}
.hasUIArt #enemyPanel .bar::before, .hasUIArt #playerPanel .bar::before,
.hasUIArt #enemyPanel .bar::after,  .hasUIArt #playerPanel .bar::after{ display:none }
.hasUIArt #enemyPanel .hpNum, .hasUIArt #playerPanel .hpNum{
  position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  min-width:0; text-align:center; font-size:9px; color:#f3e2bd;
  text-shadow:0 1px 2px rgba(0,0,0,.9); pointer-events:none; z-index:2;
}

/* ---- the grimoire, against the BOOK itself -------------------------------
   The pack states these coordinates directly, so the page box becomes the whole
   book and each piece takes them as given. Measuring them a second time through
   an intermediate box is how the headings drifted onto the painted title.
     incantation history  x 11-44   y 24-68
     insight history      x 59-88   y 25-68
     parchment strip      x 14-86   y 70.5-98
     legend control       x 90-96.5 y 16-27  */
.hasUIArt #book.hasPage #bookPage{       ;        ;      ;          }
.hasUIArt #book.hasPage #grimoire{         ;          ;        ;            }
/* GEOMETRY FOLDED into the block at the end. This set the strip to 14%/14%,
   where Kerry drew it at 7.7% to 91.2% — 49px narrower than his tree, which is
   why the checker showed the strip 11.6 points off while everything ON it
   measured exact. A parent placed wrong makes its children look right and be
   wrong. *//* folded into the later declaration of .hasUIArt #book.hasPage #draftArea::before */

.hasUIArt #book.hasPage #waxSeal{        ;          ;          ;                    }

/* ---- the element buttons: one mark, centred on a 76% medallion ----------- */
.hasUIArt #runes .rune .glyph{
  background-image:var(--ui-element-btn);
  background-size:contain; background-position:center; background-repeat:no-repeat;
}
.hasUIArt #runes .rune .glyph .runeArt,
.hasUIArt #runes .rune .glyph img{
  width:76%; height:76%; margin:12%; object-fit:contain; display:block;
}
.hasUIArt #runes .rune.on .glyph{
  background-image:var(--ui-element-btn-sel), var(--ui-element-btn);
  background-size:contain, contain;
}
.hasUIArt #runes .rune:disabled .glyph, .hasUIArt #runes .rune.off .glyph{
  background-image:var(--ui-element-btn-off), var(--ui-element-btn);
  background-size:contain, contain;
}

/* ---- CAST: the label is smaller than its plate and must stay clear ------- */
/* REMOVED 2026-08-28: and its size rule, for a pseudo-element that no longer exists */
.hasUIArt #castRow #cast.ready:not(:disabled){
  background-image:var(--ui-cast-ready), var(--ui-cast-btn);
  background-size:100% 100%, 100% 100%;
}

/* ---- the spell card's own slots ----------------------------------------- */
.hasUIArt #kit .spell .sg{
  position:absolute; left:4%; right:4%; top:3%; height:72%;
  display:flex; align-items:center; justify-content:center; margin:0;
}
.hasUIArt #kit .spell .sg img{ width:auto; height:100%; max-width:100%; object-fit:contain }
.hasUIArt #kit .spell .sn{
  position:absolute; left:7%; right:7%; top:76%; height:15%;
  display:flex; align-items:center; justify-content:center;
  font-size:9.5px; line-height:1;
}
.hasUIArt #kit .spell .sc{
  position:absolute; left:3%; right:3%; top:90%; height:10%;
  display:flex; align-items:center; justify-content:center; font-size:9px;
}
.hasUIArt #kit .spell{                  ; display:block;           }

/* ---- the lower interface stands on its own backdrop ---------------------- */
.inBattle.hasUIArt #castArea, .inBattle.hasUIArt #kit{
  background-image:none;      /* the foundation behind them carries it */
}
.inBattle.hasUIArt #app::before{
  content:""; position:absolute; left:0; right:0; bottom:0; height:32%;
  background:var(--ui-lower-ui-backdrop) center bottom/100% 100% no-repeat;
  z-index:0; pointer-events:none;
}

/* ---- SPRITE SHEET PLAYBACK ------------------------------------------------
   One element per effect. The image is a grid; two stepped animations walk it,
   X across each row and Y down the rows, so every cell is visited in order.
   steps() is run by the compositor, so this costs the main thread nothing.
   --fxW/--fxH are the SCALED sheet size, set per effect, because the sheet is
   drawn at the size the screen wants rather than at its native cell size. */
.fxSprite{
  position:absolute; pointer-events:none; z-index:70;
  background-repeat:no-repeat;
  background-position:0 0;
  will-change:background-position;
}
/* NAMED sheet*, NOT fx*. The fx prefix belongs to the layout table's ambient
   motions, every one of which must carry var(--ax/--ay) so a drift cannot undo
   a placement — layouttabletest enforces exactly that. These walk a sprite
   sheet's background and place nothing, so the rule does not apply; sharing the
   prefix put them in front of a check written for something else. SECOND time
   this session, so it is worth stating plainly: fx* means "placed by the
   layout table". */
@keyframes sheetRow{
  from{ background-position-x:0 }
  to  { background-position-x:calc(var(--fxW) * -1) }
}
@keyframes sheetCol{
  from{ background-position-y:0 }
  to  { background-position-y:calc(var(--fxH) * -1) }
}
/* REMOVED — this was the orange rectangle. background-color under a multiply
   blend fills every TRANSPARENT pixel of a sprite sheet with solid colour, and a
   sheet is mostly transparent, so the whole cell became a coloured block over
   the creature. Tinting is a drop-shadow glow in playFx now: it draws only where
   the art already is and cannot fill anything. */

/* ---- THE SCREEN'S REACTION TO A CAST ---
   NAMED cast*, NOT fx*. The fx prefix belongs to the LAYOUT TABLE's ambient
   motions — fxhover, fxspinCW — every one of which must carry var(--ax/--ay) so
   a drift cannot undo the placement it was given. These are screen-wide
   reactions on #app, which is placed by nothing, so that rule does not apply to
   them. Sharing the prefix put them in front of a check written for something
   else, and the check was right to ask. --------------------------------------
   Four outcomes, four treatments. All on #app, all short, none of them touching
   layout — a transform and a filter cannot reflow anything, so none of this can
   disturb the board however often it fires. --shake is set per cast from how
   much landed. */
@keyframes castShakeHard{
  0%,100%{ transform:translate3d(0,0,0) }
  10%{ transform:translate3d(calc(var(--shake,1) * -7px), calc(var(--shake,1) * 3px),0) }
  25%{ transform:translate3d(calc(var(--shake,1) * 6px),  calc(var(--shake,1) * -4px),0) }
  40%{ transform:translate3d(calc(var(--shake,1) * -5px), calc(var(--shake,1) * -2px),0) }
  58%{ transform:translate3d(calc(var(--shake,1) * 4px),  calc(var(--shake,1) * 3px),0) }
  76%{ transform:translate3d(calc(var(--shake,1) * -2px), 0,0) }
}
@keyframes castShakeSoft{
  0%,100%{ transform:translate3d(0,0,0) }
  30%{ transform:translate3d(-2px,1px,0) }
  60%{ transform:translate3d(2px,-1px,0) }
}
/* FRACTURE — it bit. A firm shake and a brief lift in contrast. */
#app.castFracture{ animation:castShakeHard .34s cubic-bezier(.36,.07,.19,.97) }
#app.castFracture::after{
  content:""; position:fixed; inset:0; z-index:80; pointer-events:none;
  background:radial-gradient(60% 45% at 72% 26%, rgba(255,236,200,.30), transparent 70%);
  animation:castBloom .34s ease-out forwards;
}
/* SHATTER — the rarest thing in the game. Harder shake, a real bloom, and a
   white edge that closes in from the frame. */
#app.castShatter{ animation:castShakeHard .5s cubic-bezier(.36,.07,.19,.97) }
#app.castShatter::after{
  content:""; position:fixed; inset:0; z-index:80; pointer-events:none;
  background:radial-gradient(75% 55% at 72% 26%, rgba(255,246,222,.62), transparent 72%),
             linear-gradient(0deg, rgba(255,240,205,.16), rgba(255,240,205,.16));
  animation:castBloom .62s ease-out forwards;
}
/* RESONATE — contact without bite. A nudge, nothing more. */
#app.castResonate{ animation:castShakeSoft .26s ease-out }
/* FIZZLE — nothing landed. NO shake and NO flash: the colour simply drains and
   comes back. The absence is the feedback. */
#app.castFizzle{ animation:castDrain .62s ease-out }
@keyframes castBloom{ 0%{opacity:0} 18%{opacity:1} 100%{opacity:0} }
@keyframes castDrain{
  0%   { filter:none }
  22%  { filter:saturate(.28) brightness(.9) }
  55%  { filter:saturate(.42) brightness(.95) }
  100% { filter:none }
}
/* a player who has asked for less motion still gets the INFORMATION — the drain
   and the bloom say what happened — but not the shaking, which is only force */
@media (prefers-reduced-motion: reduce){
  #app.castFracture, #app.castShatter, #app.castResonate{ animation:none }
}

/* ============================================================================
   THE GRIMOIRE, REBUILT FROM THE CONCEPT (2026-08-25).

   What was here before: the book art as a background, the section padded inward
   so its five flex children would land on the pages, and every subsequent fix
   adjusting that padding or a child's margin. Five rounds of "still wrong" were
   one cause — the layout came from FLOW, and flow does not know where the
   painted pages are.

   What is here now: the art is the frame, #bookPage is the paper placed once at
   the art's measured page rectangle, and each piece sits inside it at the
   concept's own percentage. Nothing is sized by its content; nothing pushes
   anything else. A wrong number moves one piece instead of the whole column.

   MEASURED, not chosen. Book art 780x499; painted pages occupy x 9.9-84.4%,
   y 5.6-79.6%, with "GRIMOIRE" baked in between 9% and 15% of the height.
   Concept 853x1844: the strip is ~16% of the book, seated at its foot.
   ============================================================================ */
.hasUIArt #book.hasPage{
  background:var(--ui-grimoire-book) center/100% 100% no-repeat;
  border:0; box-shadow:none; border-radius:0;
           ;                                                                    
                   ;
  display:block;                /* was a flex column — that was the whole fault */
  overflow:hidden;
}
.hasUIArt #book.hasPage::after{ display:none }   /* the art has its own shadow */

/* THE PAPER. One rectangle, matching the painted pages, with a little clearance
   from the curved gutter. Everything lives inside it. */
.hasUIArt #book.hasPage #bookPage{
                   ;
          ;          ;
         ;                                                                      
            ;                    /* clears the painted bottom cover */
}

/* THE RECORD takes everything between the heads and the strip. It is the only
   piece that scrolls, and it can no longer squeeze the strip or be squeezed. */
.hasUIArt #book.hasPage #grimoire{
                                                                                 
                                                                               
                                                                              
                                                                             
                   ;       ;        ;        ;           ;
             ; min-height:0; overflow-y:auto;
  color:#2a1c06;
}
.hasUIArt #book.hasPage #grimoire .empty{ color:#4a3410 }
.hasUIArt #book.hasPage .entry .turn{ color:#4a3410 }

/* THE STRIP, at the foot of the pages, running past them to the page edges.
   Its own box carries the size; the paint is a layer beneath it. Nothing here
   is sized by content — that is what made it 83px tall when 45 was asked for. */
.hasUIArt #book.hasPage #draftArea{
                                                                             
                                                                           
                                                                            
                                                                   
                                                                                 
                                                
                                                                                
                                                                               
                                                                               
                                                                           
                                                                               
                                                                                 
                                                                                 
                                                                                 
                   ;       ;        ;         ;           ;
  min-height:0;         ;          ;
  display:flex; align-items:center; flex-wrap:nowrap; overflow:visible;
  background:none; border:0;
}
.hasUIArt #book.hasPage #draftArea::before{
  content:"";                  ; z-index:-1;
                                                                           
                                                                                 
                                                                                
                                                                                 
                                                                             
                                                                   
                                                                                 
                                                                                 
                                                                                 
                                                
       ;        ;         ;       ;
  box-sizing:border-box;
  background:var(--ui-parchment-strip) center/100% 100% no-repeat;
}
/* THE SPLIT WAS TWO COPIES. ::before drew the strip anchored right and ::after
   drew it again anchored left — at a row wider than the art, that is a strip at
   each end with a seam of bare page between them, which is exactly what Kerry
   saw. One layer, stretched to fill. */
.hasUIArt #book.hasPage #draftArea .entry{ min-height:0; width:100%; align-items:center }
.hasUIArt #book.hasPage #draftArea .pgL,
.hasUIArt #book.hasPage #draftArea .pgR{ min-width:0; min-height:0 }
/* the seal overlaps the strip's left end, as the concept draws it */
/* MEASURED OFF THE MOCKUP, not placed by eye. In mock up.png the book occupies
   x 9.3-90.6%, y 46.5-70.4% of the frame — 694x442px — and the wax seal within
   it runs x 1.9-17.1% of the book's width and y 76-99% of its height. So the
   seal is 15.2% of the book wide, seated at its bottom-left, its base level
   with the foot of the pages.
   The ASSET was re-cut too: the source PNG carried 18px of transparent margin,
   so every size set before this was really "the wax plus whatever padding the
   file happened to have". Trimmed to the wax and re-encoded at 200px.
   Placed against #book, not the strip, because the mockup measures it against
   the BOOK — and the strip's height has now changed four times. */
.hasUIArt #book.hasPage #waxSeal{
                   ;          ;          ;         ;               ;
             ;         ;                   ;   /* % padding resolves on WIDTH */
  pointer-events:none; z-index:4;
  background:var(--ui-wax-seal) center/contain no-repeat;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));
}
#waxSeal{ display:none }
.hasUIArt #waxSeal{ display:block }

/* the legend sits BELOW the book, on the dark ground — in the old column it
   fought the strip for the last band of paper */
.hasUIArt #book.hasPage #legendBar{
  position:absolute; left:0; right:0; bottom:2%;
  color:#6b5836; text-shadow:0 1px 0 rgba(255,247,225,.35);
}

/* ---- the shield: art with the number over its centre, never baked in ---- */
.hasUIArt .blockChip{
  background:var(--ui-shield-icon) center/contain no-repeat;
  border:0; box-shadow:none; min-width:22px; min-height:24px;
  display:inline-flex; align-items:center; justify-content:center;
  padding:2px 0 0; font-size:10px; text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.hasUIArt .blockChip.zero{ opacity:.35 }

/* ---- the blow it is winding up ----
   RETIRED: this drew the 2026-07 pack's attack-ribbon and attack-sword, and it
   sits LATER in the sheet than the new rules, so it won every time. Kerry saw
   the old banner and reported it as wrong art; the new art was there and losing.
   The damage-banner / damage-sword rules live above; this is now only a reset so
   a stale background cannot come back. */
/* THE RESET WAS THE BUG. Written to stop a stale background creeping back, it
   sits LATER in the sheet than the rules that paint the new banner — so it
   erased them, and #threat #intent's own gradient and 1px border showed through.
   That is the "old art border". Deleted; the rules below own the element. */

/* ---- the runes you press: the plate belongs to the glyph now, not the button ---- */
.hasUIArt .rune{ background:none; border:0; box-shadow:none }
/* ---- the arc they are placed into ---- */
.hasUIArt #runeArc{
  /* element-harness, was entry-harness: the 2026-08 pack's bench replaced the
     old one. Edited HERE rather than adding an earlier rule, because two rules
     writing one property from two places is the cascade fault this stylesheet
     keeps re-teaching — the later one wins silently. */
  /* THE CONCEPT SHOWS NO HARNESS. The pack ships one, and its own preview drew
     it small and centred behind two buttons — which is what "some pieces look
     off" meant. Registered, unused, one line from returning. */
  background:none;
                      ;
}
/* ---- the casting bench and the spell rack ---- */
/* THE OLD BENCH IS GONE. casting-harness was the 2026-07 pack's frame and it
   was STILL PAINTING under the new buttons — the arched plate Kerry saw and
   correctly called old art. The concept has NO plate here: six buttons stand
   on the bare ground with their meters beneath them. */
.hasUIArt #castArea{ background:none; border:0; border-image:none;                       }
.hasUIArt #kit{
  /* DRAWN WHOLE, was nine-sliced. The old spell-harness-4 was a frame with a
     plain middle, where a nine-slice is right. The new harness paints its four
     socket arches INTO the art — slicing it would stretch the middle and turn
     four sockets into smeared ones, the same way the nine-slice erased the
     battle book's spine. */
  /* Four slots on the ground, as the concept has them — the outer harness put a
     frame around frames and doubled every edge. */
  background:none;
  /* HEIGHT, not just min/max: #spellTray asks for height:100%, and a percentage
     height resolves against nothing when its parent has only min-height and
     max-height. The cards sized to their content and left the band part empty. */
  border:0;                    ;
                    ;
}
/* ---- CAST: a backplate under a button, both from the pack ---- */
.hasUIArt #cast{
  background:var(--ui-cast-button) center/100% 100% no-repeat;
  border:0; box-shadow:none; color:#f6e3b4;
  text-shadow:0 1px 2px rgba(0,0,0,.7);
}
.hasUIArt #cast:disabled{ filter:grayscale(.6) brightness(.65) }
.hasUIArt #castArea{                   }
.hasUIArt #cast{                  ; z-index:1 }

/* The mana meter's fill used to carry its colour INLINE, which no stylesheet can
   override — the art pack's fill could never have shown. The colour is a custom
   property now: this rule paints it when there is no art, and the .hasUIArt rule
   above wins when there is. */
.mana .meter > i{ background:var(--elCol, var(--gold)) }

/* an empty socket in the spell harness — present so the carried spells line up with
   the four the art draws, and quiet enough to read as empty rather than broken */
.spell.empty{ pointer-events:none; background:none; border-style:dashed;
  border-color:rgba(255,255,255,.07) }
/* AN EMPTY SLOT IS STILL A SLOT. With the outer harness gone, the frames Kerry
   could see were the HARNESS's painted arches — remove it and the rack went
   black. blank_spell_slot is the pack's answer: the socket draws itself, empty
   or full, and only the contents differ. `background:none` on .spell.empty was
   written for the undressed screen and quietly beat the dressed one. */
/* FOUR EQUAL CARDS FILLING THE BAND. A slot with nothing in flow has height
   zero — the same fault that collapsed the top banner to 0x0 — so the empties
   drew as hairlines once the harness stopped propping them up. The grid gives
   every socket the band's height whether or not it holds a spell. */
/* GEOMETRY FOLDED into the one block at the end of the sheet. This set
   height:100% on the tray, which fought the top/bottom insets placing it from
   Kerry's tree and left it 2px past its band — the fourth rule this session to
   quietly win against a newer one. Nothing here places anything now. */
.hasUIArt #kit .spell{
             ; min-height:0;           ;
  /* the contents were pinned top-left inside a tall card */
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px;                ; text-align:center;
}
.hasUIArt #kit .spell .sn{ font-size:10.5px; line-height:1.15; font-weight:600 }
.hasUIArt #kit .spell .sc{ font-size:10px }
.hasUIArt #kit .spell .sg{ font-size:24px; line-height:1 }
.hasUIArt .spell.empty{
  border:0;
  background:var(--ui-spell-slot) center/100% 100% no-repeat;
  opacity:.72;
}

/* ---- runes, wherever they appear -----------------------------------------
   One class for the art and one for the emoji, so every surface that draws a
   rune — the buttons, the slots, the grimoire, the wards, the mana meters —
   sizes it the same way and none of them has to know which it got. */
.runeArt{ display:inline-block; height:1em; width:auto; vertical-align:-0.14em;
  object-fit:contain }
.runeGlyph{ display:inline-block; line-height:1 }/* folded into the later declaration of .rune .glyph .runeArt */

.mana .g .runeArt{ height:15px }/* folded into the later declaration of .slot .runeArt */

.slot .lock .runeArt{ height:13px }
#grimoire .runeArt{ height:15px }
.wardRow .wg .runeArt{ height:14px }
@media (max-height:700px){
  .rune .glyph .runeArt{ height:22px }
  .slot .runeArt{ height:19px }
}

/* ---- the shield carries ONE number and no emoji --------------------------
   The chip's text was "🛡 0" — an emoji AND a value — so dressing it with the
   pack's shield left the old glyph sitting on top of the new art. It carries
   the number alone now, centred over whichever shield is drawn. */
.blockChip b{ font-weight:600; font-family:var(--font-data); font-size:11px;
  line-height:1; display:inline-block }
.hasUIArt .blockChip{
  width:26px; height:29px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
}
.hasUIArt .blockChip b{ font-size:10.5px; transform:translateY(1px);
  text-shadow:0 1px 2px rgba(0,0,0,.85) }
/* without the pack it keeps a shield of its own, or the number floats alone */
.blockChip:not(.hasUIArt *)::before{ content:"\1F6E1"; margin-right:3px; font-size:10px }

/* ---- the attack ribbon and the veiled badge ------------------------------
   The reference shows a ribbon reading "8 INCOMING" with the sword as its own
   painted layer, and VEILED as a separate badge. renderIntent rewrites
   #intent's className every turn, so nothing here may depend on a class
   surviving on that element — it is all on the id or on children. */
.hasUIArt #intent{
  min-width:118px; text-align:center;
  font-family:var(--font-display); font-size:12.5px; letter-spacing:.12em;
  text-transform:uppercase; color:#f4dfae;
}
.hasUIArt #intent .intentText{ position:relative; z-index:1 }
.hasUIArt #intent::before{ z-index:0 }
/* guard and hex tint the same ribbon rather than needing art of their own */
.hasUIArt #intent.guard{ filter:hue-rotate(160deg) saturate(.85) }
.hasUIArt #intent.hex{ filter:hue-rotate(255deg) saturate(1.1) }

.hasUIArt #abilityTag.veiledBadge{
  background:var(--ui-veiled-badge) center/100% 100% no-repeat;
  color:#e6d6ff; font-family:var(--font-data); font-size:9px; letter-spacing:.2em;
  text-transform:uppercase;                     ; border:0; box-shadow:none;
  display:inline-block;
}

/* ============================================================================
   THE MAIN MENU AND DISCIPLINES KIT, WORN
   One stage serves both screens: the astrolabe behind, the wright in front, the
   seals in orbit around him. Every rule falls back — a build with no kit keeps
   the drawn rings and the emoji figure, and nothing here is load-bearing.
   ============================================================================ */
/* ONE AUTHORITATIVE POSITION EACH, by share of the stage. No bottom anchor, no
   margins, no translateY, and nothing that reads the button stack. */
.mmAstro{ position:absolute; left:50%; top:43%; transform:translate(-50%, -50%);
  width:min(96%, 400px); height:auto; opacity:.8; z-index:1; pointer-events:none;
  animation:mmTurn 90s linear infinite }
.mmWizard{ position:absolute; left:50%; top:26%; transform:translateX(-50%);
  height:34%; width:auto; max-width:76%; object-fit:contain; object-position:center top;
  z-index:2; pointer-events:none;
  filter:drop-shadow(0 6px 30px rgba(157,123,255,.32)) }

/* the seals drifting on the title screen — atmospheric, never pressable */
.mmSeal{ position:absolute; width:clamp(34px, 11%, 58px); height:auto; opacity:.7;
  z-index:3; pointer-events:none; animation:mmDrift 14s ease-in-out infinite }
/* ALL PLACED BY TOP, none by bottom, and none below 47% — the art's own region. A
   seal anchored to the BOTTOM lands in the button stack, which is exactly what put two
   of them on top of Start Anew. */
.mmSeal.s0{ top:33%; left:6% }
.mmSeal.s1{ top:24%; left:20%; animation-delay:-2s }
.mmSeal.s2{ top:24%; right:20%; animation-delay:-4s }
.mmSeal.s3{ top:33%; right:6%; animation-delay:-6s }
.mmSeal.s4{ top:41%; right:3%; animation-delay:-8s }
.mmSeal.s5{ top:41%; left:3%;  animation-delay:-10s }
.mmSeal.s6{ top:47%; left:50%; margin-left:-5.5%; animation-delay:-12s }
/* the seals are placed by top/left, not by transform, so a bare translateY here is
   safe — but it is written explicitly so nobody later adds a translateX beside it */
@keyframes mmDrift{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }

/* THE LOGO IS THE TITLE. No pseudo-element behind it, no ornament, no second copy —
   the ::before that used to draw the ornament is deleted rather than hidden, because a
   retired layer with a live rule is how the arcs would come back. */
.mmTitle.isLogo{ padding:0; gap:0 }
.mmLogo{ display:block; width:min(78%, 560px); max-width:560px; height:auto;
  object-fit:contain; margin:0 auto; pointer-events:none;
  filter:drop-shadow(0 3px 18px rgba(0,0,0,.55)) }
@media (max-height:700px){ .mmLogo{ width:min(78%, 520px) } }

/* THE BUTTONS. Each names its OWN picture — none inherits from a catch-all.
   IT USED TO: `.mmBtn:not(.mmPrimary)` is (0,3,0) because the :not() ARGUMENT counts
   toward specificity, and `.mmAnew` is only (0,2,0). So Start Anew lost, and drew
   whatever the generic rule pointed at — which is how it ended up wearing the CONTINUE
   picture. Settings survived by accident, on the strength of its ID.
   The words are painted into every one of these, so the game writes none of them. */
.hasUIArt .mmBtn{ border:0; box-shadow:none; color:#ead9b2 }
/* RETIRED with the rest of the 2026-07 menu block. That pack gave each control
   its own plate with its own words baked in and its own aspect ratio; the
   2026-08 pack gives ONE plate and separate lettering, so the label can change
   without a new plate. Kept as a colour reset only. */
.hasUIArt .mmPrimary{ color:transparent }
/* RETIRED. menu-button-settings was the 2026-07 pack's own settings plate, with
   the word painted into it — so the new plate drew underneath and the old art's
   "SETTINGS" showed through beside the new label. Fourth time an old dressing
   rule sitting later in the sheet has beaten a new one. */
.hasUIArt #mmSettings .mmGlyph{ display:none }

/* ---- the disciplines stage ---- */
/* A STACKING CONTEXT, so a piece inside the orbit cannot climb over the grimoire.
   Without a z-index .dOrbit makes no context, and the wizard's z:11 competed directly
   with the sheet's z:6 and won — he stood ON the book. The studio's orbit box has
   always carried z-index:1, so the preview showed him behind it and the game would not
   have. The z values in the table are LOCAL to the orbit now, which is also what
   dragging inside a box ought to mean. */
.dOrbit{ z-index:1 }
.dOrbit.hasStage{ height:340px }
.dOrbit.hasStage .mmAstro{ top:50%; width:min(96%, 340px); opacity:.8 }
/* The Disciplines stage is its own box, not the title's, so the figure is stated in
   full here rather than half-overridden — a rule that sets only the width fights one
   that sizes by height. */
.dOrbit.hasStage .mmWizard{ top:6%; height:82%; width:auto; max-width:52% }

/* a seal in the kit's own orbit — percentage placed, not on a rigid ring */
.dOrb.sealArt{ width:clamp(56px, 17vw, 96px); height:auto; aspect-ratio:1;
  left:var(--x); top:var(--y); right:auto; bottom:auto;
  transform:translate(-50%, -50%); background:none; border:0; padding:0; z-index:3 }
.dOrb.sealArt:active{ transform:translate(-50%, -50%) scale(.93) }
.dSeal{ width:100%; height:100%; object-fit:contain; display:block }
.dOrb.sealArt.sealed .dSeal{ filter:grayscale(.72) brightness(.55); opacity:.72 }
.dOrb.sealArt.on .dSeal{ transform:scale(1.08);
  filter:drop-shadow(0 0 8px var(--c)) drop-shadow(0 0 18px var(--c)) }
.dOrb.sealArt.on{ box-shadow:none }
.dLockArt{ position:absolute; width:34%; right:-3%; bottom:-2%; pointer-events:none }

/* the grimoire panel under the class sheet */
/* A PLAIN STRETCH, NOT A NINE-SLICE.
   I nine-sliced this because that is right for a FRAME — corners held, middle filler
   stretched. But this asset is an ILLUSTRATION OF A BOOK: a spine down the centre,
   curved page edges, ornaments that belong to the drawing. A nine-slice assumes the
   middle is filler, and here the middle holds the SPINE — so slicing put seams through
   the book and duplicated the page curl.
   Rendered both ways at the real box size and compared: the plain stretch is visibly
   better at every height, and the book tolerates being 40% taller than its natural
   1.66:1 without looking wrong. It simply reads as a thicker book. */
.dSheet.onPanel{
  border:0;
  background:var(--ui-menu-grimoire-panel) center/100% 100% no-repeat;
  color:#3a2c14 }
.dSheet.onPanel .dName{ color:#2c2010 }
.dSheet.onPanel .dClass, .dSheet.onPanel .dBlurb{ color:#54402090 }
.dSheet.onPanel .dBlurb{ color:#4a3720 }
.dSheet.onPanel .dBlurb b{ color:#2c2010 }
.dSheet.onPanel .dTree{ background:rgba(30,20,8,.12); border-color:rgba(60,42,18,.4);
  color:#3a2c14 }

.dBack.art{ background:var(--ui-menu-button-back) center/contain no-repeat;
  border:0; width:42px; height:42px; font-size:0 }

@media (prefers-reduced-motion:reduce){
  .mmAstro, .mmSeal{ animation:none }
}
@media (max-height:700px){
  .dOrbit.hasStage{ height:270px }
  /* A SHORTER SCREEN SHRINKS THE FIGURE AND KEEPS THE ANCHOR. It must never be solved
     by moving him up into the title, which is the fault this whole pass removed. */
  .mmWizard{ top:25%; height:29% }
  .mmLogo{ width:min(72%, 460px) }
  .mmActions{ top:53%; width:min(78%, 440px) }
}

/* ---- the observatory: one ground under the title and the Disciplines -----
   On the screen host, so both stand on the same floor and it is not rebuilt
   when the player moves between them. Everything else — astrolabe, wright,
   seals, grimoire, controls — stays a separate overlay above it. */
/* .screen already carries a radial gradient and a backdrop blur of its own; both must
   go, or the observatory is seen through a purple wash. It is position:fixed, which is
   what lets the ::before below cover it. */
#screen.onStage{
  background:var(--stageArt) center bottom/cover no-repeat, #080706;
  backdrop-filter:none;
}
#screen.onStage::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  /* the buttons sit low and the title high, so the ground is darkened at both
     ends and left alone through the middle where the wright stands */
  background:linear-gradient(180deg, rgba(8,7,6,.72) 0%, rgba(8,7,6,.12) 26%,
                                     rgba(8,7,6,.10) 58%, rgba(8,7,6,.78) 100%);
}
#screen.onStage > *{ position:relative; z-index:1 }
/* the painted gradient underneath is no longer needed when the art is there */
#screen.onStage .mmScreen{ background:none }
/* the card's 420px cap suits a dialog, not a stage the wright stands on */
#screen.onStage .inner{ max-width:520px; padding:0 }

/* ---- the settings button keeps its own shape ----------------------------
   It was being forced into the same box as the primary and secondary art,
   which are 540x171 and 540x146 — its own is 554x175. Given an aspect-ratio
   and auto height it can never be squashed, whatever the row around it does. */
/* Only the RATIO and the art here; the height comes from the band, and stating a
   width as well would fight it. */
/* the 2026-08 pack gives every menu control ONE plate, so Settings no longer
   needs its own ratio or its own art — .mmBtn covers it */
.hasUIArt #mmSettings{ min-height:0 }

/* the primary and secondary keep theirs too, for the same reason */
/* SIZED BY HEIGHT, WIDTH FOLLOWING. Each keeps its own ratio — the primary's 540/171,
   Start Anew's 2125/570, the settings art's 554/175 — and none is forced into another's
   box. Giving the HEIGHT is what lets the band above constrain all three at once. */
/* ONE RATIO NOW. Every control shares menu-button-default (1068x250), so the
   three no longer need separate ratios — and aspect-ratio is banned in battle
   rules for good reason, so height is given and width follows the band. */
.hasUIArt .mmPrimary, .hasUIArt .mmAnew, .hasUIArt #mmSettings{
  width:100%; max-width:100%; margin:0 auto; min-height:0; aspect-ratio:auto;
  display:flex; align-items:center; justify-content:center;
}

/* Trials sits APART from the two-row stack, so earning it never changes the
   stack's height and shifts the composition above it */
.mmTrialsTab{ display:block; margin:10px auto 0; padding:7px 18px;
  font-family:var(--font-data); font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--vellum-dim);
  background:none; border:1px solid rgba(217,164,65,.3); border-radius:20px }
.mmTrialsTab:active{ border-color:var(--gold); color:var(--gold2,#e8c87f) }

/* ---- Start Anew --------------------------------------------------------
   Its art is 2125/570, narrower than the primary's 540/171 and the settings
   art's 554/175, so it carries its own ratio rather than being forced into
   either. The emblem is painted at the left, so the label clears it. */
.hasUIArt .mmAnew{
  /* was menu-button-anew, the 2026-07 plate with START ANEW painted in */
  border:0; box-shadow:none; color:transparent;
  /* The HEIGHT comes from the action band above, not from here — this rule predates
     that band and its height:auto was quietly winning, so Start Anew alone ignored its
     share and sized itself from its own art. */
  aspect-ratio:2125 / 570; min-height:0;
  padding:0 8% 0 20%;
}
.mmAnew .mmLabel{ font-size:13px }
/* without the art it is still plainly the harsher of the two secondary rows */
.mmAnew{ border-color:rgba(150,60,60,.45) }

/* the confirmation's destructive answer: distinct, but not a modern red alert */
.anewGo{ border-color:rgba(150,60,60,.55); color:#e8b7b7 }
.anewGo:active{ border-color:rgba(190,80,80,.85); background:rgba(120,40,40,.18) }

/* ---- the wright's eyes ---------------------------------------------------
   A sibling of .mmWizard at the SAME anchor and the same height, so an overlay
   registered under eyes:<wizardId> lands on the hood without anyone measuring
   it — and it swaps with the craft on the Disciplines screen. Nothing draws
   until art exists for that craft. */
.mmEyes{ position:absolute; left:50%; top:26%; transform:translateX(-50%);
  height:34%; width:auto; max-width:76%; object-fit:contain; object-position:center top;
  z-index:3; pointer-events:none; transition:opacity .25s }
.dOrbit.hasStage .mmEyes{ top:6%; height:82%; max-width:52% }
@media (max-height:700px){ .mmEyes{ top:25%; height:29% } }

/* ---- the motions a piece may be given -----------------------------------
   Every keyframe carries --ax/--ay, the piece's own anchoring translate, so
   the centring survives the animation. A keyframe of bare rotate() replaces
   the whole transform and throws a centred piece off-axis. */
@keyframes fxspinCW  { from{ transform:translate(var(--ax,0),var(--ay,0)) rotate(0deg) }
                       to  { transform:translate(var(--ax,0),var(--ay,0)) rotate(360deg) } }
@keyframes fxspinCCW { from{ transform:translate(var(--ax,0),var(--ay,0)) rotate(0deg) }
                       to  { transform:translate(var(--ax,0),var(--ay,0)) rotate(-360deg) } }
/* HOVER: rises, then settles back where it began. The distance was 3.5% — but a
   percentage translate is a share of THE ELEMENT, so on a 36px seal that was 1.3px and
   looked like nothing at all, while the astrolabe moved 11px and appeared to work.
   --fxAmt makes it adjustable per piece, and the default is visible on anything. */
@keyframes fxhover   { 0%,100%{ transform:translate(var(--ax,0),var(--ay,0)) translateY(0) }
                       50%   { transform:translate(var(--ax,0),var(--ay,0))
                                         translateY(calc(-1 * var(--fxAmt, 14%))) } }
/* PULSE: shrinks slightly, then returns to its own size. It used to fade the opacity
   AND scale UP, which is neither of the two things asked for. */
@keyframes fxpulse   { 0%,100%{ transform:translate(var(--ax,0),var(--ay,0)) scale(1) }
                       50%   { transform:translate(var(--ax,0),var(--ay,0))
                                         scale(var(--fxScale, .94)) } }
@media (prefers-reduced-motion:reduce){
  .mmAstro, .mmSeal, .dOrb, .mmWizard{ animation:none !important }
}

/* THE SAME TRAP, DEFUSED IN THE GAME.
   #playerFig and #enemySprite are DIVs sized by height with width:auto, so they fall
   back to shrink-to-fit — whose available space is (container - left). Today they sit
   at left:0 and right:0, which masks it entirely; the fault appears the moment either
   is moved inward, which the layout studio can now do. Making the child image carry a
   definite width removes the dependency on the offset for good. */
#playerFig.hasArt > img, #enemySprite.hasArt > img{
  height:100%; width:auto; max-width:none; display:block;
}
#playerFig.hasArt, #enemySprite.hasArt{ min-width:0 }

/* ============================================================================
   THE PATH
   One locked viewport: a banner that never moves, a scene that absorbs every
   reduction, and the choosing and the tools pinned below it. The scene is the
   only part that gives way on a short screen — the same contract the battle
   screen holds.
   ============================================================================ */
.pScreen{ position:absolute; inset:0; display:flex; flex-direction:column;
  overflow:hidden; padding:0 }

/* ---- the banner ---- */
.pHud{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 10px;
  border-radius:var(--r-s); border:1px solid rgba(217,164,65,.3);
  background:linear-gradient(180deg,rgba(24,19,14,.94),rgba(14,11,8,.96)) }
.pHud.art{ border:0; background:var(--ui-path-hud) center/100% 100% no-repeat }
.pAct{ flex:0 0 auto; display:flex; flex-direction:column; line-height:1.1;
  font-family:var(--font-display); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--vellum) }
.pAct em{ font-style:normal; font-size:8px; letter-spacing:.1em; color:var(--vellum-dim) }
.pWhere{ flex:1; text-align:center; font-family:var(--font-display); font-size:15px;
  letter-spacing:.22em; text-transform:uppercase; color:var(--gold2,#e8c87f) }
.pVitals{ flex:0 0 auto; display:flex; gap:8px; font-family:var(--font-data);
  font-size:10.5px; color:var(--vellum) }
.pVitals .hp{ color:#e0918a }

/* ---- the scene: the only part that gives way ---- */
/* THE PROPORTIONS OF THE REFERENCE, measured off it: banner 6%, scene 72%, legend 9%,
   tools 6.5%. The scene is the only part that gives way, and with the choosing floated
   over it there is room for all of it. */
.pScene{ flex:1 1 auto; position:relative; min-height:130px; overflow:hidden;
  border-radius:var(--r-s); margin:5px 0;
  /* --sceneY decides WHICH SLICE of a tall backdrop shows: 100% rests it on its lower
     edge, 0% on its upper one. The forest is far taller than the scene, so this is a
     real choice rather than a detail. */
  background:var(--sceneArt) center var(--sceneY, 100%)/cover no-repeat, #0b0a08 }
.pSky{ position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(8,7,6,.55), transparent 22%,
                                     transparent 62%, rgba(8,7,6,.55)) }

/* the wright, over whose shoulder the road is seen */
.pWright{ position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
  height:50%; width:auto; max-width:74%; object-fit:contain; object-position:bottom center;
  pointer-events:none; z-index:4 }
.pWright.glyph{ font-size:56px; height:auto; bottom:4% }

/* an available road: a seal on the path */
.pSeal{ position:absolute; transform:translate(-50%,-50%); z-index:3;
  width:clamp(52px, 17%, 82px); aspect-ratio:1; padding:0; border:0; background:none;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.6)) }
.pSeal img{ width:100%; height:100%; object-fit:contain; display:block }
.pSeal:active{ transform:translate(-50%,-50%) scale(.94) }
.pGlyph{ font-size:30px }
/* CHOSEN — a warm halo, plainly different from a press */
.pSeal.on{ filter:drop-shadow(0 0 10px rgba(255,206,120,.95))
  drop-shadow(0 0 26px rgba(217,164,65,.55)) }
.pSeal.on::after{ content:""; position:absolute; inset:-9%; border-radius:50%;
  border:2px solid rgba(255,214,140,.85); animation:pPulse 2.4s ease-in-out infinite }
@keyframes pPulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }

/* the road below a seal, lit only when chosen */
.pRoad{ position:absolute; transform:translateX(-50%); z-index:2; width:3px; height:22%;
  pointer-events:none; opacity:0; transition:opacity .25s;
  background:linear-gradient(180deg, rgba(255,214,140,.85), transparent) }
.pRoad.on{ opacity:1 }

/* a Far See vision: smaller, hazed, and never pressable */
.pGhost{ position:absolute; transform:translate(-50%,-50%); z-index:1;
  width:clamp(30px, 10%, 46px); aspect-ratio:1; pointer-events:none;
  opacity:.5; filter:saturate(.4) blur(.4px) drop-shadow(0 0 8px rgba(180,210,255,.5)) }
.pGhost img{ width:100%; height:100%; object-fit:contain; display:block }

/* ---- choosing ---- */
/* FLOATING OVER THE SCENE'S LOWER EDGE, as the reference has it. Stacked below, it
   took 60px from a scene the composition wants to be 72% of the screen — which is
   exactly what was being cut off. Here it costs nothing. */
.pChoose{ position:absolute; left:6px; right:6px; bottom:6px; z-index:6;
  display:flex; align-items:center; gap:7px }
/* the three share the row by the widths the table gives them, so the studio can change
   how it divides — flex:0 0 auto lets each take exactly what it is told */
.pChoose > .pFar, .pChoose > .pPlaque, .pChoose > .pGo{ flex:0 0 auto }
.pFar{ flex:0 0 auto; width:60px; height:60px; padding:0; border:0; background:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--vellum-dim); position:relative }
.pFar.art img{ width:100%; height:100%; object-fit:contain; display:block }
.pFar em{ position:absolute; bottom:6px; font-style:normal; font-family:var(--font-data);
  font-size:7px; letter-spacing:.12em; text-transform:uppercase; color:#cfe4ff;
  text-shadow:0 1px 3px rgba(0,0,0,.9) }
.pFar:active{ filter:brightness(1.35) }

.pPlaque{ flex:1; min-width:0; height:52px; display:flex; align-items:center;
  justify-content:center; gap:7px; border-radius:var(--r-s);
  border:1px solid rgba(217,164,65,.3); background:rgba(20,16,10,.9) }
.pPlaque.art{ border:0; background:var(--ui-path-plaque) center/100% 100% no-repeat }
.pPickIcon img{ width:26px; height:26px; object-fit:contain; display:block }
.pPickName{ font-family:var(--font-display); font-size:14px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--vellum) }
.pPickName.none{ font-size:10px; letter-spacing:.14em; color:var(--vellum-dim) }

.pGo{ flex:0 0 auto; min-width:104px; height:52px; padding:0 12px; border-radius:var(--r-s);
  border:1px solid var(--gold); background:linear-gradient(180deg,#f0d493,#d9a441 52%,#b5842f);
  color:#2a1c06; font-family:var(--font-display); font-size:14px; letter-spacing:.18em;
  text-transform:uppercase }
.pGo.art{ border:0; color:#f6e3b4; text-shadow:0 1px 3px rgba(0,0,0,.8);
  background:var(--ui-path-button) center/100% 100% no-repeat }
.pGo:disabled{ filter:grayscale(.7) brightness(.55); opacity:.6 }

/* a road the scene could not place — surfaced, never dropped */
.pExtra{ flex:0 0 auto; font-size:10px; color:#ffcf9a; padding:5px 8px; margin-bottom:5px;
  border:1px solid rgba(217,164,65,.4); border-radius:var(--r-s) }
.pExtraBtn{ margin:4px 4px 0 0; padding:5px 9px; font-size:10px; border-radius:6px;
  border:1px solid var(--gold); background:rgba(217,164,65,.14); color:var(--vellum) }

/* ---- what the seals mean ---- */
.pLegend{ flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:1px 6px;
  padding:4px 7px; margin-bottom:4px; border-radius:var(--r-s);
  border:1px solid var(--ink-3); background:rgba(14,11,8,.75) }
.pLegend span{ display:flex; align-items:center; gap:5px; font-family:var(--font-data);
  font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--vellum-dim) }
.pLegend i{ flex:0 0 auto; width:18px; height:18px; font-style:normal; font-size:12px }
.pLegend i img{ width:100%; height:100%; object-fit:contain; display:block }

/* ---- the four ways out ---- */
.pTools{ flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:5px;
  padding-bottom:max(4px, env(safe-area-inset-bottom)) }
.pTools button{ padding:8px 2px; border-radius:var(--r-s); border:1px solid var(--ink-3);
  background:linear-gradient(180deg,rgba(30,24,16,.9),rgba(16,13,9,.95));
  color:var(--vellum); font-family:var(--font-data); font-size:8.5px;
  letter-spacing:.12em; text-transform:uppercase }
.pTools button:active{ border-color:var(--gold); color:var(--gold2,#e8c87f) }

@media (prefers-reduced-motion:reduce){ .pSeal.on::after{ animation:none } }
@media (max-height:700px){
  .pScene{ min-height:120px }
  .pWright{ height:46% }
  .pPlaque,.pGo,.pFar{ height:46px }
  .pFar{ width:52px }
  .pLegend{ font-size:8px }
}

/* ============================================================================
   THE GRIMOIRE ON THE DISCIPLINES SCREEN
   Only the book changed. The scene above it — the wright, the astrolabe, the
   seals — is untouched: nothing here alters its size or position, and the book
   is still sized by what it holds rather than pushing anything upward.
   ============================================================================ */

/* the title, as supplied. Deliberately subtler than the main logo. */
.dLogo{ display:block; width:min(52%, 430px); height:auto; object-fit:contain;
  margin:0 auto; pointer-events:none }
@media (max-height:700px){ .dLogo{ width:min(46%, 360px) } }

/* ---- the parchment's own copy ------------------------------------------
   Cinzel for the labels, Cormorant Garamond for the name and the description.
   The display face used elsewhere is a narrow blackletter, which is wrong on
   a page meant to be read. */
.dSheet.onPanel .dPage{ padding:2% 5% 0 }
.dSheet .dEyebrow{
  font-family:"Cinzel","Trajan Pro","Times New Roman",serif; font-weight:600;
  font-size:clamp(11px, 1.7vw, 16px); letter-spacing:.20em; text-transform:uppercase;
  color:#62422b }
.dSheet .dName{
  font-family:"Cormorant Garamond",Garamond,Georgia,serif; font-weight:600;
  font-size:clamp(30px, 5.6vw, 62px); line-height:.95; color:#2b2118 }
.dSheet .dClass{
  font-family:"Cinzel","Trajan Pro","Times New Roman",serif; font-weight:500;
  font-size:clamp(12px, 1.8vw, 18px); letter-spacing:.22em; text-transform:uppercase;
  color:#62422b }
.dSheet .dBlurb{
  font-family:"Cormorant Garamond",Garamond,Georgia,serif; font-weight:500;
  font-size:clamp(15px, 2.65vw, 30px); line-height:1.22; letter-spacing:.01em;
  color:#2b2118; margin:2% 0 0; opacity:1 }
/* each line is its own row, so the copy cannot wrap into four */
.dSheet .dLine{ display:block; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis }
.dSheet .dBlurb.req{ font-style:italic }
.dSheet .dBlurb b{ color:#2b2118; font-weight:600 }

/* the seal, overlapping the left margin as the reference has it */
.dSheet .dSheetIcon{ width:clamp(38px, 12%, 62px); height:auto; aspect-ratio:1;
  flex:0 0 auto; border:0; background:none; box-shadow:none; margin-left:-3%;
  display:flex; align-items:center; justify-content:center }
.dSheet .dSheetIcon img{ width:100%; height:100%; object-fit:contain; display:block }
.dSheet .dSheetHead{ align-items:center; gap:3.5%; margin-bottom:0 }
.dSheet .dSealed{ color:#6b4a2e; border-color:rgba(107,74,46,.5) }

/* ---- the two actions --------------------------------------------------
   Both carry their lettering in the art, so nothing is retyped over them.
   THEY ARE DIFFERENT SHAPES — 5.95:1 and 4.83:1 — so each keeps its own
   ratio rather than being forced into a shared box, which would stretch one. */
.dActs{ display:flex; flex-direction:column; align-items:center;
  gap:clamp(6px, 1.2vh, 16px); margin-top:auto; padding:3% 0 5% }
.dActs button{ width:min(82%, 420px); padding:0; border:0; background:none;
  display:block; line-height:0;
  /* a compact picture inside a target a thumb can find */
  min-height:44px; display:flex; align-items:center; justify-content:center }
.dActs button img{ width:100%; height:auto; object-fit:contain; display:block }
.dActs button:active img{ filter:brightness(1.12) }
.dGo.art.off img{ filter:grayscale(.75) brightness(.55); }
.dGo.art.off{ cursor:default }
.dActs button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px;
  border-radius:6px }
/* with the art present neither button needs a frame of its own */
.dSheet .dTree.art, .dSheet .dGo.art{ background:none; border:0; box-shadow:none;
  aspect-ratio:auto; height:auto; margin:0 auto }

@media (max-height:700px){
  .dActs{ gap:6px; padding:2% 0 4% }
  .dActs button{ width:min(86%, 380px) }
}

/* ---- the Path's backdrop, filling the screen -----------------------------
   It was confined to a band in the middle, with the card's purple gradient
   showing above and below it. A forest the player walks through should reach
   the top and bottom of the screen, and a dialog's wash has no business over it. */
#screen.onPath{ background:#08070a; backdrop-filter:none; padding:0 }
#screen.onPath .inner{ max-width:520px; padding:0; min-height:100%;
  justify-content:flex-start }
.pBack{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:var(--sceneArt) center var(--sceneY, 100%)/cover no-repeat, #0b0a08 }
.pScreen > *:not(.pBack){ position:relative; z-index:1 }
/* the scene is a WINDOW onto that backdrop now, not a picture of its own */
.pScene{ background:none; border-radius:0 }

/* ---- the Path's banners, worn -------------------------------------------
   All three carry their lettering painted in, so nothing here retypes a word.
   Measured off the top banner: the coin sits at 63% across and the heart at
   78%, so the two live values are placed just to the right of each. */
.pHud.art{ position:relative; padding:0; border:0; background:none; display:block;
  aspect-ratio:620 / 108;
  /* NOT width:auto — this box's image is absolutely positioned, so it has nothing in
     flow to size from and auto would be ZERO. The width comes from the height cap and
     the art's own ratio. */
  width:min(100%, calc(9vh * 620 / 108));
  margin:0 auto; flex:0 0 auto }
.pHudArt{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill;
  display:block; pointer-events:none }
.pHud.art .pCoin, .pHud.art .pHeart{ position:absolute; top:50%;
  transform:translateY(-50%); font-family:var(--font-data);
  font-size:clamp(9px, 2.1vw, 15px); color:#e8dcc0;
  text-shadow:0 1px 3px rgba(0,0,0,.9); pointer-events:none; white-space:nowrap }
/* AURELS is painted after the coin, so its number sits clear of that word */
.pHud.art .pCoin{ left:80.5%; transform:translate(-50%,-50%) }
.pHud.art .pHeart{ left:92%; transform:translate(-50%,-50%); color:#f0b9b2 }
/* written only when the painted act no longer tells the truth */
.pHud.art .pActLive{ position:absolute; left:3%; top:50%; transform:translateY(-50%);
  width:28%; text-align:center; display:flex; flex-direction:column; line-height:1.1;
  font-family:var(--font-display); font-size:clamp(9px, 2vw, 14px); letter-spacing:.12em;
  text-transform:uppercase; color:var(--vellum);
  background:linear-gradient(90deg, rgba(12,10,8,0), rgba(12,10,8,.96) 12%,
                                    rgba(12,10,8,.96) 88%, rgba(12,10,8,0)) }
.pHud.art .pActLive em{ font-style:normal; font-size:.62em; letter-spacing:.06em;
  color:var(--vellum-dim) }

/* the legend: art, and only art.
   CAPPED IN HEIGHT. The banners are chunkier than the reference's own bands — at full
   width they take 22% of the screen between them where the mockup gives 15.5%, and the
   scene is what pays for it. Capped, they shrink and centre rather than eating it. */
.pLegendArt{ display:block; height:auto; object-fit:contain;
  /* an img HAS an intrinsic size, so this one survived — stated the same way for
     consistency rather than relying on that */
  width:min(100%, calc(10.5vh * 620 / 137));
  margin:0 auto 4px; flex:0 0 auto }

/* the tools: four invisible controls over their own banner, at the very bottom */
.pTools.art{ position:relative; display:grid; grid-template-columns:repeat(4,1fr);
  gap:0; aspect-ratio:620 / 136; padding:0;
  /* its buttons are font-size:0, so there is nothing in flow here either */
  width:min(100%, calc(10.5vh * 620 / 136));
  margin:0 auto max(2px, env(safe-area-inset-bottom));
  flex:0 0 auto;
  background:var(--toolArt) center/100% 100% no-repeat }
.pTools.art button{ background:none; border:0; padding:0; font-size:0; color:transparent;
  border-radius:6px }
.pTools.art button:active{ background:rgba(255,214,140,.16) }
.pTools.art button:focus-visible{ outline:2px solid var(--gold); outline-offset:-3px }

@media (max-height:700px){
  .pHud.art .pCoin, .pHud.art .pHeart{ font-size:9px }
}

/* Start Anew with nothing to abandon: dimmed and desaturated from its own art rather
   than replaced by a plain rectangle, and unpressable rather than merely faded. */
.mmBtn.mmAnew.off{ filter:grayscale(.8) brightness(.5); opacity:.65; cursor:default }
.mmBtn.mmAnew.off:active{ filter:grayscale(.8) brightness(.5) }


/* ============================================================================
   THE BATTLE SCENE, REBUILT FROM KERRY'S 2026-08-28 WIREFRAME EXPORT.

   THIS BLOCK IS THE ONLY PLACE BATTLE GEOMETRY IS SET. 211 legacy geometry
   declarations were removed from 104 rules across six earlier strata rather
   than being outranked — the previous attempt added 36 rules on top of 463 and
   called it a replacement, which is what let a pseudo-element paint the
   parchment 496px wide inside a 368px box for months.

   Every number below is his, unmodified. Children are a share of their PARENT,
   so the tree scales as one thing and a child cannot drift from its container.
   ============================================================================ */

/* ---- the stage ---------------------------------------------------------- */
.inBattle.hasUIArt #scene{ position:relative }
.inBattle.hasUIArt #sceneArt{ position:absolute; inset:0; margin:0 }
.inBattle.hasUIArt #enemyPanel{
  position:absolute; left:0.7%; top:2.6%; width:48.9%; height:19.6%;
  right:auto; bottom:auto; margin:0; padding:0;
}
.inBattle.hasUIArt #playerPanel{
  position:absolute; left:54.8%; top:79.7%; width:44.2%; height:19.9%;
  right:auto; bottom:auto; margin:0; padding:0;
}
.inBattle.hasUIArt #enemySprite{
  position:absolute; left:50.6%; top:8.2%; width:48.6%; height:56.1%;
  right:auto; bottom:auto; margin:0;
}
/* KERRY PLACES THE BAR AGAINST THE STAGE, but #topBar is a child of #app, so a
   percentage height resolved against 795 rather than the stage's 355 — his 6.6%
   became 52.5px where he wants 23.4. The bar is not moved in the DOM, because
   its id is read by the suites and its position over the stage is deliberate;
   instead every value is expressed against the SCREEN, which is what #app is.
     stage = 0.2% to 45.5% of the screen, so 45.3 tall
     his x76.2 of the stage  -> 76.2% of the screen (the stage is full width)
     his y0.9  of the stage  -> 0.2 + 0.9%  x 45.3 = 0.61% of the screen
     his h6.6  of the stage  -> 6.6% x 45.3 = 2.99% of the screen
   The RENDERED geometry is identical to his drawing; only the basis differs,
   because the element genuinely lives in a different box. */
.inBattle.hasUIArt #topBar{
  position:absolute; left:76.2%; top:0.61%; width:22.5%; height:2.99%;
  right:auto; bottom:auto; margin:0; min-height:0;
  display:flex; align-items:center; justify-content:flex-end; flex-wrap:nowrap;
}
.inBattle.hasUIArt #playerFig{
  position:absolute; left:-1.5%; top:18.5%; width:37.4%; height:28%;
  right:auto; bottom:auto; margin:0;
  overflow:hidden; display:flex; align-items:flex-end; justify-content:flex-start;
}

/* ---- inside the rails --------------------------------------------------- */

/* .hpRow AND .chipRow ARE PRESERVED CONTAINERS. Kerry places the health bar and
   the ward row against the RAIL, so the wrappers between must not impose a size
   of their own — they had one from the legacy strata and it went with the rest.
   display:contents would remove them from the box tree and take their children
   with them, so they are made transparent by SIZE instead. */
/* #enemyWards IS the chipRow — a wireframe component, not a wrapper. Naming
   .chipRow here reset the very element the block below places. */
.inBattle.hasUIArt #enemyPanel .hpRow,
.inBattle.hasUIArt #playerPanel .hpRow{
  position:static; display:block; width:auto; height:auto; margin:0; padding:0;
}
.inBattle.hasUIArt #enemyBlock{
  position:absolute; left:80.8%; top:9%; width:15.5%; height:46.1%;
  right:auto; bottom:auto; margin:0;
}
.inBattle.hasUIArt #enemyHP{
