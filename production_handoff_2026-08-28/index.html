<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- Saved to the Home Screen this runs without Safari's chrome, which is the only way
     to see the layout as a player will. black-translucent lets the scene run under the
     Dynamic Island; the safe-area padding on #app keeps anything readable out from
     under it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Shattermancer" />
<meta name="theme-color" content="#0a0812" />
<title>Shattermancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cinzel and Cormorant Garamond are for the grimoire's own copy: the display face
     used everywhere else is a narrow blackletter, which is wrong on parchment. -->
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RUNEWRIGHT — Elemental Codebreaker Roguelike
   Milestone 2: full run — 3 schools, 12 spells, 15 relics,
   7 enemies, rewards, boss, run summary.
   Single file so it runs from file:// on mobile Safari.
   ============================================================ */
:root{
  --ink:#14102a; --ink-2:#1e1840; --ink-3:#2b2356;
  --vellum:#ead9b6; --vellum-dim:#b6a583;
  --gold:#d9a441; --gold-soft:#f0cd85; --glow:#9d7bff;
  --fire:#ff6a3d; --water:#3fa4e6; --nature:#57c46b;
  --lightning:#f4d64a; --ice:#7fdbe8; --shadow:#a86bdf;
  --exploit:#62e08a; --resonate:#f4d64a; --resist:#6b6480;
  --hp:#e0574f; --block:#7fb6e8;
  --r-s:6px; --r-m:12px;
  --font-display:"Grenze Gotisch","Palatino Linotype",serif;
  --font-body:"Spectral",Georgia,serif;
  --font-data:"IBM Plex Mono",ui-monospace,monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* THE ROOT, LOCKED.
   height:100% is not enough on iOS — the visual viewport shrinks and grows with the
   browser's own chrome, and 100dvh follows it where 100% does not. overscroll-behavior
   stops the rubber-band bounce that makes a fixed screen look like it is scrolling.
   THE SAFE AREA IS PADDED IN EXACTLY ONE PLACE — on #app. Adding it here as well would
   inset the screen TWICE and push the bottom controls off, which is the usual way this
   goes wrong. */
html,body{
  margin:0; padding:0;
  width:100%; height:100%; height:100dvh;
  overflow:hidden; overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
body{ position:fixed; inset:0; }
body{
  background:radial-gradient(120% 60% at 50% -10%,#2c2260 0%,transparent 60%),
             radial-gradient(90% 50% at 50% 110%,#241b4d 0%,transparent 55%),var(--ink);
  color:var(--vellum); font-family:var(--font-body); font-size:16px;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(2px 2px at 12% 22%,rgba(240,205,133,.3),transparent),
    radial-gradient(1.5px 1.5px at 78% 14%,rgba(157,123,255,.3),transparent),
    radial-gradient(2px 2px at 62% 71%,rgba(240,205,133,.2),transparent),
    radial-gradient(1.5px 1.5px at 28% 84%,rgba(157,123,255,.25),transparent);
  animation:drift 18s ease-in-out infinite alternate;
}
/* --- the fused incantation --- */
.castRing{ position:fixed; width:0; height:0; z-index:60; pointer-events:none;
  transform-origin:center; will-change:transform }
.castRing.winding{ filter:drop-shadow(0 0 10px rgba(217,164,65,.6)) }
.castRing .mote{ position:absolute; left:-13px; top:-13px; width:26px; height:26px;
  display:grid; place-items:center; font-size:19px; line-height:1;
  will-change:transform; filter:drop-shadow(0 0 6px currentColor) }
.castRing .mote img{ width:26px; height:26px; object-fit:contain }
/* ---- AURA MOTES ----------------------------------------------------------
   The disciplines' aura art in place of flat rune icons. Three differences, and
   each is what makes them read as swirling together rather than as six stickers
   orbiting a point:
     BIGGER — 58px against 26, so neighbours genuinely overlap.
     SCREEN BLENDED — where two clouds cross, their light ADDS, which is what
       mixing looks like. Normal compositing would just stack one over another.
     NO DROP SHADOW — these already carry their own glow; the shadow that helped
       a flat icon read against the board only muddies them. */
/* THE MOTES ARE RUNES IN FLIGHT. This styling was written for the disciplines'
   soft aura clouds: 58px wide, screen-blended so they added light where they
   crossed, and churning. The marks are the canonical element PAINTINGS now —
   opaque, crisp, and the same size the player sees on the strip they left — so
   screen blending washes them out and 58px makes them enormous. They fly at the
   size they were read at. */
.castRing .mote.aura{ left:-17px; top:-17px; width:34px; height:34px }
.castRing .mote.aura img{
  width:34px; height:34px;
  opacity:.96;
  filter:drop-shadow(0 0 5px rgba(0,0,0,.55));
}
.castRing .mote.aura{ filter:none }
/* nothing sits at the centre: every aura in the knot is a rune the player cast */
/* each cloud turns at its own rate while the ring itself winds — so the knot
   churns instead of rotating as one rigid piece */
/* a slow drift rather than a churn: a rune should read as ITSELF while it
   travels, and a spinning snowflake stops being a snowflake */
.castRing .mote.aura img{ animation:auraChurn 6s ease-in-out infinite }
.castRing .mote.aura:nth-child(2n) img{ animation-duration:7.5s; animation-direction:reverse }
@keyframes auraChurn{ 0%,100%{ transform:rotate(-7deg) } 50%{ transform:rotate(7deg) } }
.castRing .mote.el-fire{ color:#e0703f } .castRing .mote.el-ice{ color:#7fc4e0 }
.castRing .mote.el-water{ color:#6f86d6 } .castRing .mote.el-nature{ color:#7fe0a2 }
.castRing .mote.el-lightning{ color:#e8c87f } .castRing .mote.el-shadow{ color:#a86bdf }

/* --- creatures that will not hold still --- */
.mo-float{ animation:moFloat 3.4s ease-in-out infinite }
.mo-sway{ animation:moSway 4.2s ease-in-out infinite }
.mo-breathe{ animation:moBreathe 3.8s ease-in-out infinite }
.mo-pulse{ animation:moPulse 2.6s ease-in-out infinite }
.mo-menace{ animation:moMenace 5s ease-in-out infinite }
@keyframes moFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
@keyframes moSway{ 0%,100%{transform:rotate(-2.2deg)} 50%{transform:rotate(2.2deg)} }
@keyframes moBreathe{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
@keyframes moPulse{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.25)} }
@keyframes moMenace{ 0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-5px) rotate(-1.5deg)} 65%{transform:translateY(3px) rotate(1.5deg)} }
/* a hit or a death must read through the idle motion */
.hit.mo-float,.hit.mo-sway,.hit.mo-breathe,.hit.mo-pulse,.hit.mo-menace{ animation:hit .32s }

/* --- frame animation, when the art arrives as a strip --- */
.spriteSheet{ background-repeat:no-repeat; background-size:auto 100%;
  width:var(--frameW); animation:spriteWalk var(--spriteDur) steps(var(--frames)) infinite }
@keyframes spriteWalk{ to{ background-position:calc(-1 * var(--frameW) * var(--frames)) 0 } }
@media (prefers-reduced-motion:reduce){
  .mo-float,.mo-sway,.mo-breathe,.mo-pulse,.mo-menace,.spriteSheet{ animation:none }
}

@keyframes drift{ from{transform:translateY(0)} to{transform:translateY(-14px)} }

#app{
  position:relative; z-index:1; height:100dvh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  /* The bottom inset reserves room for the home indicator. When the web view
     already stops short of it — the cached-shell case — that reserve is spent on nothing and the rack floats. 10px keeps the cards off the indicator
     when the view IS full height, without spending 34px when it is not. */
  /* THE INSETS COME FROM A VARIABLE, because on some shells iOS has ALREADY
     applied them and reporting them again costs the screen twice. See
     measureShell(). Defaults are the honest full-bleed case. */
  padding:var(--shellTop, max(4px,env(safe-area-inset-top))) 9px
          var(--shellBot, max(10px,env(safe-area-inset-bottom)));
  gap:4px;
}
#app.shake{ animation:shake .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake{
  10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(4px,-2px)}
  30%,50%,70%{transform:translate(-7px,2px)} 40%,60%{transform:translate(7px,-1px)}
}
.panel{
  background:linear-gradient(180deg,rgba(43,35,86,.85),rgba(30,24,64,.85));
  border:1px solid var(--ink-3); border-radius:var(--r-m);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.35);
}
.statusStrip{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:0 0 14px;
  padding:8px 9px; border:1px solid rgba(217,164,65,.3); border-radius:10px;
  background:linear-gradient(180deg,rgba(217,164,65,.09),rgba(0,0,0,.15)) }
.statusStrip .ss{ position:relative; padding:3px 2px; min-width:0 }
.statusStrip .ss.wide{ grid-column:span 2 }
.statusStrip .ss b{ display:block; font-family:var(--font-display); font-size:15px;
  color:var(--vellum); line-height:1.1 }
.statusStrip .ss b span{ font-size:11px; color:var(--vellum-dim) }
.statusStrip .ss u{ display:block; text-decoration:none; font-family:var(--font-data);
  font-size:7.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--vellum-dim);
  margin-top:2px }
.statusStrip .ss.hp b{ color:#8fdca6 }
.statusStrip .ss.hp.worn b{ color:var(--gold-soft) }
.statusStrip .ss.hp.low b{ color:#e0808f }
.statusStrip .ss.hp em{ display:block; position:absolute; left:2px; bottom:-1px; height:2px;
  background:currentColor; opacity:.5; border-radius:2px }
.statusStrip .toks{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; min-height:20px }
.ico{ display:inline-block; line-height:1 }
img.ico{ width:1em; height:1em; object-fit:contain; vertical-align:-0.12em }
img.ico-spell, img.ico-relic, img.ico-potion{ width:1.15em; height:1.15em }
/* A registered scene sits behind the panel; without one the gradient shows as before. */
.hasScene{ background-size:cover; background-position:center }
/* 30%, NOT 72% (Kerry, 2026-08-28). At 72 this scrim and the battle gradient
   together left only 18-25% of a commissioned backdrop visible — the stage read
   as dark texture rather than as the painting he paid for, and it accounted for
   the entire 43.6% stage difference against ChatGPT's preview. Measured at 25,
   30 and 35: at 30 the backdrop is 78% of its raw brightness and the stage diff
   falls to 6.5%.
   IT ALSO READS BETTER. Contrast between the enemy rail and the backdrop behind
   it goes from 1 to 21 — at 72 the rail and the art were the same darkness, so
   the frame had nothing to stand against. The scrim was hurting the readability
   it existed to protect. The battle gradient is unchanged. */
/* .30, NOT .72 (Kerry, 2026-08-28). This scrim was tuned when the backdrop was
   a placeholder gradient. Over a commissioned painting it and the battle
   gradient together left only 18-25% of the art visible: the deterministic
   harness measured the stage 43.6% different from ChatGPT own preview, and
   suppressing the scrim entirely dropped that to 2.7% — proving the ART was
   identical all along and only our dimming differed.
   Swept at .25 / .30 / .35 against the reference: 3.7%, 6.5%, 11.0%. .30 keeps
   the forest reading as a painting, keeps the rails legible over it, and stays
   plainly darker than the raw art. The battle gradient is UNCHANGED — local
   readability under the rails was never the problem. */
.hasScene::before{ content:""; position:absolute; inset:0; background:rgba(12,10,24,.30);
  pointer-events:none; z-index:0 }
.hasScene > *{ position:relative; z-index:1 }
.statusStrip .tok{ font-style:normal; font-size:15px; line-height:1;
  padding:2px 3px; border-radius:5px; background:rgba(255,255,255,.05); cursor:help }
.statusStrip .tok.none{ font-family:var(--font-data); font-size:8px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--vellum-dim); background:none; padding:2px 0; cursor:default }
.eyebrow{ font-family:var(--font-data); font-size:9px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--vellum-dim); }

/* ---------- run track ---------- */
#track{ display:flex; align-items:center; justify-content:center; gap:5px;
  font-family:var(--font-data); font-size:9px; letter-spacing:.14em;
  color:var(--vellum-dim); padding:1px 0 0; }
#track i{ width:6px; height:6px; border-radius:50%; background:var(--ink-3); display:inline-block; }
#track i.done{ background:var(--gold); }
#track i.now{ background:var(--glow); box-shadow:0 0 8px var(--glow); }

/* ---------- enemy stage ---------- */
#stage{ position:relative; flex:0 0 auto; padding:5px 11px 6px; text-align:center; overflow:hidden; }
#stage::before{
  content:""; position:absolute; left:50%; top:50%; width:120px; height:120px;
  margin:-60px 0 0 -60px; border-radius:50%; pointer-events:none;
  border:1px solid rgba(157,123,255,.22);
  box-shadow:inset 0 0 0 12px rgba(157,123,255,.05),inset 0 0 40px rgba(157,123,255,.12);
  animation:spin 34s linear infinite;
}
@keyframes spin{ to{transform:rotate(360deg)} }
#enemyName{ font-family:var(--font-display); font-size:17px; font-weight:600; margin:0;
  letter-spacing:.04em; display:inline-block; vertical-align:middle; text-align:left; line-height:1.05 }
#enemyName .tier{ font-family:var(--font-data); font-size:7.5px; letter-spacing:.2em;
  color:var(--gold); display:block; }
#stage .topRow{ display:flex; align-items:center; justify-content:center; gap:0 }
#enemySprite{ font-size:34px; line-height:1; display:inline-block; vertical-align:middle }/* folded into the later declaration of #enemySprite.hit */
/* folded into the later declaration of #enemySprite.lunge */
/* folded into the later declaration of #enemySprite.dying */

@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px) scale(1.05)}75%{transform:translateX(9px)}}
@keyframes lunge{0%,100%{transform:translateY(0)}40%{transform:translateY(14px) scale(1.1)}}
@keyframes dissolve{ to{opacity:0;transform:translateY(-18px) scale(.7);filter:blur(6px)} }
.bar{ height:11px; border-radius:99px; background:rgba(0,0,0,.55); overflow:hidden;
  border:1px solid rgba(0,0,0,.6); box-shadow:inset 0 1px 2px rgba(0,0,0,.5); position:relative; }
.bar>i{ display:block; height:100%; border-radius:99px; transition:width .45s cubic-bezier(.2,.8,.3,1); }
#enemyHPFill{ background:linear-gradient(90deg,#8e2b2b,#e0574f 70%,#ff7a70); }
#playerHPFill{ background:linear-gradient(90deg,#7a2a55,#e0574f 70%,#ff8a80); }
.bar > i.low{ background:linear-gradient(90deg,#b02a1f,#ff5a4a 70%,#ff9a8f);
  animation:hpWarn 1.6s ease-in-out infinite }
@keyframes hpWarn{ 50%{ filter:brightness(1.35) } }
.bar > i::after{                      /* a highlight so the fill reads as a solid bar */
  content:""; position:absolute; inset:0 0 55% 0; border-radius:99px;
  background:linear-gradient(180deg, rgba(255,255,255,.28), transparent);
}
/* the numbers sit ON the bar, as in the reference */
.hpRow .hpNum{ font-family:var(--font-data); font-size:10.5px; min-width:auto; }
/* A .bar has no intrinsic width, so it MUST be told to grow inside a flex row —
   otherwise it collapses to zero and silently disappears. */
.hpRow{ display:flex; align-items:center; gap:6px; margin-top:3px; }
.hpRow > .bar{ flex:1 1 auto; min-width:40px; }
/* min-width:58px reserved a column for the number when it sat BESIDE the bar.
   It sits ON the bar now, so the reserve only squeezed the track. */
.hpNum{ font-family:var(--font-data); font-size:11px; color:var(--vellum-dim); min-width:58px; text-align:right; }
.hasUIArt #enemyPanel .hpNum,
.hasUIArt #playerPanel .hpNum{ min-width:0 }
.blockChip{ font-family:var(--font-data); font-size:10px; color:var(--block);
  border:1px solid rgba(127,182,232,.5); background:rgba(127,182,232,.12);
  border-radius:99px; padding:1px 6px; white-space:nowrap; }
.blockChip.zero{ display:none; }
#intent{ display:inline-flex; align-items:center; gap:5px;               ;                 ;
  border-radius:99px; background:rgba(224,87,79,.12); border:1px solid rgba(224,87,79,.4);
  font-family:var(--font-data); font-size:11px; letter-spacing:.05em; color:#ffb9b3; }
#intent.guard{ background:rgba(127,182,232,.12); border-color:rgba(127,182,232,.45); color:#bcdcf7; }
#intent.hex{ background:rgba(168,107,223,.14); border-color:rgba(168,107,223,.5); color:#dcc0f7; }
#resistTray{ display:flex; gap:4px; justify-content:center; margin-top:4px; flex-wrap:wrap; }
#resistTray:empty{ display:none }
.resistChip{ font-family:var(--font-data); font-size:10px; padding:1px 7px; border-radius:99px;
  background:rgba(0,0,0,.35); border:1px solid var(--ink-3); color:var(--vellum-dim); }
.curseChip{ border-color:rgba(168,107,223,.6); color:#dcc0f7; background:rgba(168,107,223,.15) }
.stolenChip{ border-color:rgba(224,87,79,.6); color:#ff9a92; background:rgba(224,87,79,.14) }

/* ---------- legend + grimoire ---------- */
#legendBar{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
  padding:0 6px; font-family:var(--font-data); font-size:7.5px; letter-spacing:.07em;
  color:var(--vellum-dim); text-transform:uppercase; }
#legendBar span{ display:inline-flex; align-items:center; gap:3px; }
#legendBar .pip{ width:11px; height:11px; font-size:6px; }
#legendBar .echoTag{ display:inline-flex; align-items:center; gap:1px; margin-left:5px;
  font-size:10px; line-height:1; color:var(--gold-soft); cursor:help;
  padding:1px 3px; border-radius:5px; background:rgba(217,164,65,.16) }
.pip.echo{ box-shadow:0 0 0 1.5px var(--ink),0 0 0 3px var(--ring); }
#legendBar .pip.exploit{ background:var(--exploit); --ring:var(--exploit) }
#legendBar .pip.resonate{ border-color:var(--resonate); color:var(--resonate); background:transparent; --ring:var(--resonate) }
#legendBar .pip.resist{ background:rgba(0,0,0,.45); border-color:var(--resist); color:var(--resist); --ring:var(--resist) }
/* The record IS the deduction, so it takes the flexible space — and it is the one
   surface rendered as a physical object: weathered vellum, dark ink, foxed edges. */
#book{ flex:1 1 auto; min-height:132px; display:flex; flex-direction:column;
  border-radius:var(--r-m); overflow:hidden;                  ; border:1px solid #6b5836;
  box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12);
  background:
    radial-gradient(120% 80% at 12% 0%, rgba(139,106,54,.22), transparent 55%),
    radial-gradient(90% 70% at 88% 100%, rgba(120,88,44,.26), transparent 55%),
    radial-gradient(40% 30% at 68% 34%, rgba(150,116,62,.16), transparent 70%),
    linear-gradient(172deg, #e9dcbb 0%, #e2d2ac 42%, #d9c69c 100%);
}
/* REMOVED 2026-08-28: procedural FOXING. book.webp's page has a standard deviation of 6.0, so it carries its own tonal variation */
#grimoire{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
                     ;                  ; z-index:1; color:#3a2c14; }
#grimoire .empty{ font-style:italic; color:#5f4d24; font-size:12.5px; text-align:center; padding:10px 4px; }
.entry{ display:flex; align-items:center; gap:6px; padding:2px 2px;
  border-bottom:1px dashed rgba(107,88,54,.30); animation:inkIn .35s ease both; }
.entry:last-child{ border-bottom:0 }
@keyframes inkIn{ from{opacity:0;transform:translateX(-6px)} }/* folded into the later declaration of .entry .turn */
/* folded into the later declaration of .entry .seq */

.entry .arrow{ color:#6f5828; font-size:12px; }/* folded into the later declaration of .entry .pips */

.noteRow{ gap:6px; padding:4px 2px; border-bottom:0;
  border-top:1px dashed rgba(88,58,140,.55); border-bottom:1px dashed rgba(88,58,140,.55);
  background:rgba(112,80,170,.14); margin:3px 0; border-radius:4px }
.pendingMark{ font-family:var(--font-data); font-size:9px; letter-spacing:.1em;
  color:#5b3f96; text-transform:uppercase }
.insightRow{ border-color:rgba(34,110,60,.55); background:rgba(60,150,90,.16) }
.insightRow .noteText{ color:#15542e }
.noteIcon{ font-size:14px; padding-left:4px }
.noteText{ font-family:var(--font-data); font-size:9.5px; letter-spacing:.05em;
  color:#4a2f7a; line-height:1.35; text-transform:uppercase }
.pip{ width:15px; height:15px; border-radius:50%; position:relative; display:grid;
  place-items:center; font-size:9px; font-family:var(--font-data); flex:0 0 auto; }
.pip.exploit{ --ring:#2f8f52; background:#3da864; color:#0d2f1a; box-shadow:0 0 6px rgba(47,143,82,.45); }
.pip.exploit::after{ content:"●" }
.pip.resonate{ --ring:#b8860b; border:2px solid #b8860b; color:#b8860b; background:rgba(255,255,255,.35); }
.pip.resist{ --ring:#5a4f3a; background:rgba(58,44,20,.55); border:1px solid #5a4f3a; color:#e6dcc4; }
.pip.resist::after{ content:"╱" }
.pip.unknown{ --ring:#6a4bb5; background:rgba(106,75,181,.14); border:1px dashed #6a4bb5; color:#4b3480; }
.pip.unknown::after{ content:"?" }
.pip.echo{ box-shadow:0 0 0 2px #e2d2ac,0 0 0 3.5px var(--ring),0 0 6px var(--ring); margin:0 3px; }

/* ---------- incantation ---------- */
/* THE PACK'S ELEMENT ICONS — #runes ONLY.
   Scoped to #runes .rune so the six painted icons appear on the casting buttons
   and NOWHERE else: the grimoire rows, the enemy wards, the incantation slots,
   the Path and the Disciplines all keep the icons they have. rune() is untouched
   — this paints OVER what it drew rather than changing what it draws, so the
   swap is one block to reverse and cannot leak to another screen. */
#runes .rune .glyph{ position:relative }
.hasUIArt #runes .rune .glyph{
  display:block; width:34px; height:34px; font-size:0; line-height:0;
  background:center/contain no-repeat;
}
/* whatever rune() put inside is hidden, not deleted — turning the block off
   restores it with no other change */
.hasUIArt #runes .rune .glyph > *{ display:none }
/* TWO LAYERS: the element over its plate. These rules set background-IMAGE, and
   a single image REPLACES the plate rather than sitting on it — which is why the
   circles vanished the moment the plate moved onto the glyph. The icon is layer
   one, the plate layer two, sized and centred together. */
.hasUIArt #runes .rune .glyph{
  background-size:58% auto, contain;
  background-position:center, center;
  background-repeat:no-repeat, no-repeat;
}
.hasUIArt #runes .rune[data-el="fire"]      .glyph{ background-image:var(--ui-element-icon-fire),      var(--ui-element-btn) }
.hasUIArt #runes .rune[data-el="water"]     .glyph{ background-image:var(--ui-element-icon-water),     var(--ui-element-btn) }
.hasUIArt #runes .rune[data-el="nature"]    .glyph{ background-image:var(--ui-element-icon-nature),    var(--ui-element-btn) }
.hasUIArt #runes .rune[data-el="lightning"] .glyph{ background-image:var(--ui-element-icon-lightning), var(--ui-element-btn) }
.hasUIArt #runes .rune[data-el="ice"]       .glyph{ background-image:var(--ui-element-icon-ice),       var(--ui-element-btn) }
.hasUIArt #runes .rune[data-el="shadow"]    .glyph{ background-image:var(--ui-element-icon-shadow),    var(--ui-element-btn) }

/* THE MERGED CONTROL — a rune button with its own pool beneath it.
   The button is a column: glyph, name, then the pool. The pool's numbers and
   meter are the SAME markup they were in the old #manaRow, so renderMana keeps
   working; only their parent changed.
   The meter is given a definite width rather than left to shrink-to-fit: a box
   sized by height with width:auto takes its width from container-minus-left, so
   it would have changed size as the row justified itself. That fault cost a
   round trip on the top banner and is not worth repeating. */
.rune{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start }
.rune .mana{ display:flex; flex-direction:column; align-items:center; width:100%;
  margin-top:2px; pointer-events:none }
/* THE CONCEPT PUTS THE COUNT ON THE BAR, not above it: icon, name, then the
   meter, with the number small and out of the way. */
.rune .mana .v{ font-size:8px; line-height:1; opacity:.8; white-space:nowrap }
.rune .mana .meter{ display:block; width:100%; height:9px; margin-top:3px;
  border-radius:2px; overflow:hidden; background:rgba(0,0,0,.45) }
.rune .mana .meter > i{ display:block; height:100%; width:0;
  background:var(--elCol, #fff); transition:width .18s ease }
/* dimmed when the pool cannot pay — read at a glance, not counted */
.rune.broke{ opacity:.5 }

#castArea{ flex:0 0 auto;                      ;                  ; overflow:hidden;
  border-color:rgba(217,164,65,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.06),
    0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(217,164,65,.08); }
#castArea::before{ content:"";                  ;         ;         ;            ;             ;
                    ; border-radius:50%; border:1px dashed rgba(157,123,255,.18);
  opacity:0; transition:opacity .5s; animation:spin 26s linear infinite reverse; pointer-events:none; }
#castArea.armed::before{ opacity:1 }
#slots,#runes,#cast{                  ; z-index:2; }
#slots{ display:flex; justify-content:center; gap:7px;               ; }
.slot{           ;            ; border-radius:var(--r-s);
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15));
  border:1px solid var(--ink-3); display:grid; place-items:center; font-size:27px;
                   ; transition:transform .15s,box-shadow .25s,border-color .25s; }
.slot.filled{ border-color:var(--gold); box-shadow:0 0 14px rgba(217,164,65,.28),inset 0 0 12px rgba(217,164,65,.12); }
.slot.next{ border-color:rgba(157,123,255,.6); animation:pulse 1.6s ease-in-out infinite; }
.slot.known{ border-color:var(--exploit); box-shadow:0 0 12px rgba(98,224,138,.35); }
.slot.pick{ border-color:var(--glow); box-shadow:0 0 16px var(--glow); }
.slot.aimed{ border-color:var(--glow); box-shadow:0 0 18px var(--glow), inset 0 0 14px rgba(157,123,255,.25); }
.slot.aimed::before{ content:"▾";                  ;          ;         ;                           ;
  color:var(--glow); font-size:11px; line-height:1 }
@keyframes pulse{ 50%{box-shadow:0 0 16px rgba(157,123,255,.35)} }
.slot .idx{ position:absolute; top:1px; left:4px; font-family:var(--font-data); font-size:8px; color:var(--vellum-dim); }
.slot .lock{ position:absolute; bottom:0; right:3px; font-size:8px; color:var(--exploit); }
.slot.pop{ animation:pop .2s ease }
.clearRow{           ;            ; align-self:center;                ; border-radius:50%;
  border:1px solid var(--ink-3); background:rgba(0,0,0,.3); color:var(--vellum-dim);
  font-size:15px; line-height:1;          ; display:grid; place-items:center; flex:0 0 auto;
  transition:opacity .2s, border-color .2s, transform .1s }
.clearRow:active{                    ; border-color:var(--hp); color:#ff9a92 }
.clearRow.empty{ opacity:.25 }
.clearRow:disabled{ opacity:.2 }
@keyframes pop{ 50%{transform:scale(1.14)} }
#runes{ display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
.rune{ appearance:none; border:1px solid var(--ink-3); border-radius:var(--r-s);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25));
  color:var(--vellum);                  ; font:inherit;
  display:flex; flex-direction:column; align-items:center; gap:1px; transition:transform .12s; }
.rune .glyph{ font-size:25px; line-height:1 }
.rune .nm{ font-family:var(--font-data); font-size:7.5px; letter-spacing:.05em; color:var(--vellum-dim) }/* folded into the later declaration of .rune:active */

.rune.tapped{ animation:runeFlash .35s ease }
@keyframes runeFlash{ 0%{box-shadow:0 0 0 0 currentColor} 40%{box-shadow:0 0 16px 2px currentColor} 100%{box-shadow:0 0 0 0 currentColor} }
.rune[data-el=fire]{color:var(--fire)} .rune[data-el=water]{color:var(--water)}
.rune[data-el=nature]{color:var(--nature)} .rune[data-el=lightning]{color:var(--lightning)}
.rune[data-el=ice]{color:var(--ice)} .rune[data-el=shadow]{color:var(--shadow)}
#cast{           ;               ;             ; border-radius:var(--r-s);
  font-family:var(--font-display); font-size:19px; letter-spacing:.14em; text-transform:uppercase;
  border:1px solid var(--gold); color:#241b0a;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  box-shadow:0 4px 0 #8a6420,0 8px 22px rgba(217,164,65,.28); transition:transform .1s,opacity .2s; }
/* .70, NOT .35 (Kerry, 2026-08-28). The .35 was a LEGACY GENERIC disabled
   style from the original pre-art stratum, never an approved CAST treatment —
   it predates cast.webp existing. Over the commissioned plate it suppressed
   most of the lettering and border. .70 keeps the control clearly present while
   staying visibly subordinate to the enabled state. Chosen from four
   deterministic captures at 1.0 / .35 / .60 / .70. */
#cast:disabled{ opacity:.70; color:var(--vellum-dim); background:rgba(0,0,0,.3); border-color:var(--ink-3); box-shadow:none; }
#cast:not(:disabled):active{                          ; box-shadow:0 0 0 #8a6420 }

/* ---------- mana + spells ---------- */
#manaRow{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; padding:5px 8px 3px; }
.mana{ text-align:center; position:relative }
.mana .g{ font-size:13px; line-height:1 }
.mana .v{ font-family:var(--font-data); font-size:9px; color:var(--vellum-dim); line-height:1.2 }
.mana .meter{ height:3px; border-radius:99px; background:rgba(0,0,0,.45); margin-top:2px; overflow:hidden }
.mana .meter i{ display:block; height:100%; width:0; transition:width .45s ease }
.mana.gain{ animation:manaPop .5s ease }
@keyframes manaPop{ 40%{transform:translateY(-5px) scale(1.12)} }
.mana .float{ position:absolute; left:50%; top:-6px; transform:translateX(-50%);
  font-family:var(--font-data); font-size:11px; font-weight:600;
  animation:floatUp .9s ease-out forwards; pointer-events:none }
@keyframes floatUp{ to{opacity:0;transform:translate(-50%,-20px)} }
/* Five equipped spells must fit one row on a 390px screen: the tray is a flex row
   with equal, shrinkable cells rather than a fixed 3-column grid. */
#spellTray{ display:flex; gap:4px;                   }
.spell{ flex:1 1 0; min-width:0; border:1px solid var(--ink-3); border-radius:var(--r-s);
                     ; text-align:center; background:rgba(0,0,0,.28); color:var(--vellum-dim);
  display:flex; flex-direction:column; align-items:center; gap:0; transition:transform .1s; }
.spell .sg{ font-size:15px; line-height:1.05 }
.spell .sn{ font-family:var(--font-display); font-size:10px; letter-spacing:.01em; line-height:1.05;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.spell .sc{ font-family:var(--font-data); font-size:7.5px;
  display:flex; gap:4px; justify-content:center; flex-wrap:wrap; line-height:1.2 }
.spell .sc .cost{ font-style:normal; white-space:nowrap }
/* a price a talent has brought down should read as a bargain, not an error */
.spell .sc .cost.cut{ color:#7fe0a2 }
.spell .sc .cost.short{ color:#e0808f }
.spell .sc .cost.alt{ opacity:.5 }
.spell.ready{ color:var(--vellum); border-color:var(--gold); background:rgba(217,164,65,.1);
  box-shadow:0 0 10px rgba(217,164,65,.15) }
.spell.ready:active{                           }
.spell.spent{ opacity:.4 }
.spell.sealed{ opacity:.45; border-color:#7a4a8a; background:rgba(122,74,138,.18) }
.spell.sealed::after{ content:"🔒";                  ;        ;          ; font-size:9px }
.spell{                   }
.rune.locked{ opacity:.28; filter:grayscale(1) }
.rune.locked::after{ content:"🔒";                  ;        ;          ; font-size:8px }
.rune{                   }
#relicActions{ display:flex; gap:5px; padding:0 8px 5px; flex-wrap:wrap }
#relicActions:empty{ display:none }
.relicAct{ flex:1; border:1px solid var(--glow); border-radius:var(--r-s); padding:5px 6px;
  background:rgba(157,123,255,.12); color:var(--vellum); font-family:var(--font-data);
  font-size:9px; letter-spacing:.08em; }
.relicAct:disabled{ opacity:.35; border-color:var(--ink-3); background:rgba(0,0,0,.3) }

/* ---------- player bar ---------- */
#playerBar{ flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:5px 10px }
#playerBar .who{ font-family:var(--font-display); font-size:14px; white-space:nowrap }
#playerBar .bar{ flex:1 }
#playerBar.hurt{ animation:hurtFlash .5s ease }
@keyframes hurtFlash{ 0%,100%{background:transparent} 30%{background:rgba(224,87,79,.35)} }
#relicStrip{ display:flex; gap:3px; font-size:12px; flex-wrap:wrap; justify-content:center;
                    ; min-height:0 }
#relicStrip:empty{ display:none }
#relicStrip span{ opacity:.9 }

/* ---------- fx ---------- */
#fx{ position:fixed; inset:0; pointer-events:none; z-index:50 }
.dmg{ position:absolute; font-family:var(--font-display); font-weight:800; font-size:30px;
  color:var(--gold-soft); text-shadow:0 0 14px rgba(217,164,65,.9),0 2px 0 #000;
  animation:dmgUp 1s ease-out forwards }
.dmg.small{ font-size:21px } .dmg.pain{ color:#ff9a92; text-shadow:0 0 14px rgba(224,87,79,.8),0 2px 0 #000 }
.dmg.blocked{ color:var(--block); text-shadow:0 0 14px rgba(127,182,232,.8),0 2px 0 #000 }
.dmg.good{ color:var(--exploit); text-shadow:0 0 14px rgba(98,224,138,.8),0 2px 0 #000 }
@keyframes dmgUp{ 0%{opacity:0;transform:translate(-50%,0) scale(.6)}
  22%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-58px) scale(1)} }
.flyRune{ position:fixed; font-size:24px; z-index:51; pointer-events:none }
.burst{ position:fixed; width:8px; height:8px; border-radius:50%; z-index:50;
  pointer-events:none; animation:burst .7s ease-out forwards }
@keyframes burst{ to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)} }
#banner{ position:fixed; left:0; right:0; top:36%; z-index:60; text-align:center; pointer-events:none;
  font-family:var(--font-display); font-size:32px; letter-spacing:.05em; color:var(--gold-soft);
  text-shadow:0 0 24px rgba(217,164,65,.85),0 3px 0 #000; opacity:0; padding:0 20px }
#banner.show{ animation:bannerIn 1.6s ease forwards }
#banner.dire{ color:#e9b6ff; text-shadow:0 0 24px rgba(168,107,223,.9),0 3px 0 #000 }
@keyframes bannerIn{ 0%{opacity:0;transform:scale(.6) rotate(-4deg)} 18%{opacity:1;transform:scale(1.08)}
  30%{transform:scale(1)} 75%{opacity:1} 100%{opacity:0;transform:scale(1.05) translateY(-16px)} }
#toast{ position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 10px);
  z-index:58; max-width:350px; width:calc(100% - 32px); pointer-events:none;
  background:rgba(20,16,42,.96); border:1px solid var(--gold); border-radius:var(--r-m);
  padding:10px 13px; font-size:13.5px; line-height:1.35; text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5); display:none }
#toast.show{ display:block; animation:toastIn .3s ease }
#toast .tap{ display:block; margin-top:5px; font-family:var(--font-data); font-size:8.5px;
  letter-spacing:.16em; color:var(--vellum-dim) }
@keyframes toastIn{ from{opacity:0;transform:translate(-50%,-10px)} }

/* ---------- overlays ---------- */
.screen{ position:fixed; inset:0; z-index:70; display:none; overflow-y:auto;
  /* momentum on iOS, and a scroll that does not drag the page behind it */
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  background:radial-gradient(80% 50% at 50% 35%,rgba(44,34,96,.96),rgba(10,8,22,.98));
  backdrop-filter:blur(3px);
  padding:20px 16px calc(20px + env(safe-area-inset-bottom)) }
.screen.show{ display:block }
/* SAFE CENTRING. A flex column with justify-content:center and min-height:100% centres
   its content — and when the content is TALLER than the screen it overflows EQUALLY in
   both directions, so the part above the top CANNOT BE SCROLLED TO. A scroll container
   only scrolls toward its end, never back past its start, so a long Settings page loses
   its first rows however the overflow is set.
   `safe center` centres while it fits and falls back to the top when it does not. */
.screen .inner{ max-width:420px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column; gap:10px;
  justify-content:center; justify-content:safe center;
  padding:14px 0; animation:cardIn .4s cubic-bezier(.2,.9,.3,1.2) both }
@keyframes cardIn{ from{opacity:0;transform:translateY(18px) scale(.97)} }
.screen h1{ font-family:var(--font-display); font-size:32px; margin:0; text-align:center; letter-spacing:.03em }
.screen h1.win{ color:var(--gold-soft); text-shadow:0 0 22px rgba(217,164,65,.6) }
.screen h1.lose{ color:#ff9a92 }
.screen .lede{ font-size:13.5px; color:var(--vellum-dim); text-align:center; font-style:italic; margin:0 0 4px }
/* <button> does not inherit the page colour — every button surface must set it
   explicitly or it falls back to system black. */
.pick{ color:var(--vellum); text-align:left; padding:12px 14px; border-radius:var(--r-m); border:1px solid var(--ink-3);
  background:linear-gradient(180deg,rgba(43,35,86,.9),rgba(30,24,64,.9)); transition:transform .12s,border-color .2s }
.pick:active{ transform:scale(.98); border-color:var(--gold) }
.pick .ph{ display:flex; align-items:center; gap:9px }
.pick .pi{ font-size:26px } .pick .pn{ font-family:var(--font-display); font-size:19px }
.pick .pmeta{ font-family:var(--font-data); font-size:9px; color:var(--gold); letter-spacing:.14em; margin-left:auto }
.pick .pd{ font-size:12.5px; color:var(--vellum-dim); margin-top:5px; line-height:1.45 }
.pick .pd b{ color:var(--vellum); font-weight:600 }
.pick.rare{ border-color:rgba(168,107,223,.6); box-shadow:0 0 18px rgba(168,107,223,.18) }
.btn{ width:100%; padding:12px; border-radius:var(--r-s); font-family:var(--font-display);
  font-size:18px; letter-spacing:.12em; text-transform:uppercase; border:1px solid var(--gold);
  color:#241b0a; background:linear-gradient(180deg,var(--gold-soft),var(--gold)); box-shadow:0 4px 0 #8a6420 }
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a6420 }
.btn.ghost{ background:transparent; color:var(--vellum-dim); border-color:var(--ink-3);
  box-shadow:none; font-size:14px }
.stats{ display:grid; grid-template-columns:1fr auto; gap:5px 10px; text-align:left; font-size:13px }
.stats .k{ color:var(--vellum-dim) } .stats .v{ font-family:var(--font-data); text-align:right }
.legend{ font-size:12.5px; line-height:1.6; text-align:left }
.legend b{ font-weight:600 }
.k-exploit{color:var(--exploit)} .k-resonate{color:var(--resonate)} .k-resist{color:#9a92b5}
.spellList{ font-size:11.5px; color:var(--vellum-dim); line-height:1.5; margin-top:6px }
.spellList b{ color:var(--vellum) }

/* target picker */
#picker{ position:fixed; inset:0; z-index:75; display:none; place-items:center; padding:20px;
  background:rgba(10,8,22,.86); backdrop-filter:blur(2px) }
#picker.show{ display:grid }
#picker .box{ width:100%; max-width:380px; text-align:center; padding:18px 16px }
#picker h2{ font-family:var(--font-display); font-size:22px; margin:2px 0 3px }
#picker p{ font-size:12.5px; color:var(--vellum-dim); margin:0 0 14px }

#picker .opt{ min-width:56px; padding:11px 8px; border-radius:var(--r-s); border:1px solid var(--ink-3);
  background:rgba(0,0,0,.3); color:var(--vellum); font-size:22px }
#picker .opt .sub{ display:block; font-family:var(--font-data); font-size:8px; color:var(--vellum-dim) }
#picker .opt.sel{ border-color:var(--gold); box-shadow:0 0 14px rgba(217,164,65,.35) }
#picker .opt.native{ border-color:var(--gold); background:rgba(217,164,65,.12) }
#picker .opt.goldpay{ border-color:#c9a227; background:rgba(201,162,39,.1) }
#picker .opt.native .sub{ color:var(--gold-soft) }
#picker .opt:disabled{ opacity:.3 }

/* ---------- map / shop / potions ---------- */
.purse{ text-align:center; font-family:var(--font-data); font-size:11px; letter-spacing:.1em;
  color:var(--gold-soft); margin:-4px 0 6px }
/* Aurels reads top-right, clear of the glossary button. */
#topBar{ display:flex; align-items:center; gap:8px;                   ; min-height:18px }
#topBar #track{ flex:1 1 auto; justify-content:flex-start }
#purseBar{ font-family:var(--font-data); font-size:12px; letter-spacing:.08em;
  color:var(--gold-soft); white-space:nowrap; display:flex; align-items:center; gap:4px;
  padding:2px 9px; border-radius:99px; border:1px solid rgba(217,164,65,.45);
  background:linear-gradient(180deg, rgba(217,164,65,.16), rgba(217,164,65,.06));
  box-shadow:0 2px 8px rgba(0,0,0,.4) }

#purseBar .aeIcon{ font-size:13px; line-height:1 }
.soulChip{ margin-left:7px; padding-left:7px; border-left:1px solid rgba(217,164,65,.35);
  color:#c9b5ff; display:inline-flex; align-items:center; gap:2px }
.soulChip i{ font-style:normal; font-size:9px; opacity:.75 }
.mapWrap{ position:relative; width:100%; margin:2px 0 8px }
.mapEdges{ position:absolute; inset:0; pointer-events:none }
.mapNode{ position:absolute; transform:translateX(-50%); width:44px; height:44px; border-radius:50%;

.mapNode.t-rest{ color:#ffb08a }

.rarityTag{ font-family:var(--font-data); font-size:8px; letter-spacing:.16em; opacity:.6 }

  background:rgba(157,123,255,.14); font-size:16px; display:grid; place-items:center }

/* the "?" button's rules are gone with the button. Left as a note only because
   the next block still explains a padding reserve that existed FOR it. */

/* ============================================================
   COMBAT LAYOUT v2 — scene / book / arc
   Overrides the earlier stacked-panel layout. Rules here are last
   in the sheet, so they win at equal specificity.
   ============================================================ */
/* THROUGH THE VARIABLE, like the base rule. Three separate places re-declared
   this padding from env() directly, so measureShell's correction was overridden
   the moment any of them applied — the fix computed correctly and changed
   nothing. One source of truth for the shell's insets. */
#app{ gap:5px; padding:var(--shellTop, max(4px,env(safe-area-inset-top))) 8px
                       var(--shellBot, max(6px,env(safe-area-inset-bottom))); }

/* ---------- SCENE ---------- */
/* The book is a fixed five lines and the input rows are fixed, so the battlefield
   takes all remaining space — with a floor so it is never squeezed. */
#scene{
                   ; flex:1 1 auto; min-height:224px; max-height:340px;
  border-radius:var(--r-m); overflow:hidden; border:1px solid var(--ink-3);
  background:
    radial-gradient(80% 60% at 78% 18%, rgba(168,107,223,.20), transparent 60%),
    radial-gradient(70% 55% at 18% 92%, rgba(217,164,65,.16), transparent 62%),
    linear-gradient(178deg, #1b1638 0%, #221a44 45%, #120e28 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.55);
}
#scene::before{                     /* stage haze + far architecture */
  content:"";                  ;        ; pointer-events:none;
  background:
    radial-gradient(50% 34% at 50% 74%, rgba(217,164,65,.10), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 26px);
}/* geometry moved to the one block at the end: #sceneArt */

                   ; font-size:74px; line-height:1; filter:drop-shadow(0 0 22px rgba(217,164,65,.35)) brightness(.62) saturate(.7) }

/* One line, anchored right: the ability grows leftward from the attack chip so a
   long name pushes into open space instead of being clipped by the panel edge. */
#threat{ a stylesheet
     `left` turns those into a full-width stretch and the banners drift to the
     wrong side — the table said right:1.6 width:43.3 and the CSS quietly won.
     COLUMN, not row: two banners side by side overflowed their width and rode
     over the wright's panel. Stacked, as the concept draws them. */
  /* 34%: at 42% the two stacked banners reached the wright's panel, which hangs
     from the floor of the stage. */
  position:absolute; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:3px; pointer-events:none }
#threat > *{ pointer-events:auto }

          ; font-size:11.5px;                 ; border-radius:99px 4px 4px 99px;
  flex:0 0 auto;
  background:linear-gradient(90deg, rgba(224,87,79,.28), rgba(224,87,79,.14));
  border:1px solid rgba(224,87,79,.55); color:#ffcfca; white-space:nowrap;
  box-shadow:0 3px 12px rgba(0,0,0,.45);
}
/* THE STATE TINTS ARE GONE (Kerry, 2026-08-27). A Guard or a Hex intent used to
   wash the whole banner blue or purple, and once the ribbon became real painted
   art the wash went over the ART — their gold sword on deep red rendered as a
   pink sword on purple, which read as a different banner entirely.
   A colour wash was the right mechanism when the banner was a coloured div. It
   is the wrong one over a painting: the equivalent of tinting someone's canvas
   to indicate a state. If these states need to look different, that is banner
   VARIANTS from the artist, not a filter of ours.
   The TEXT still changes — "Correction 6" reads differently from "Attack 3" —
   which is what actually tells the player what is coming. */
/* REMOVED 2026-08-28: the purple gradient was the PRE-ART fallback.
   abilityTag.webp is applied by the dressing layer now, and a gradient beneath
   it can only show through where their art does not reach. #abilityTag:empty

  background:none;
  border-radius:4px 99px 99px 4px;                 ; white-space:nowrap;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 3px 12px rgba(0,0,0,.45);
}
#abilityTag:empty{ display:none }

/* ---------- GRIMOIRE as a split book ---------- */
/* Exactly five lines: four of record, then the line you are writing. */
:root{ --bookRow:26px; }
#book{ flex:0 0 auto; min-height:0; }
#grimoire{                                ; flex:0 0 auto;
  touch-action:pan-y; overscroll-behavior:contain; scroll-behavior:smooth; }
/* FOUR ROWS WAS A FIXED HEIGHT, so a taller band gave the history nothing — the
   extra space went to the page margins instead. On the painted book it takes
   whatever the page has left, which means growing --hBook now buys ROWS. */
.hasUIArt #book.hasPage #grimoire{
             ; flex:1 1 auto; min-height:calc(var(--bookRow) * 3);
}
/* the painted parchment is mottled and darker than the flat gradient it
   replaced, so the ink needs help: a touch more weight and a light backing
   behind each glyph, the same trick #book.hasPage already uses on the title. */
.hasUIArt #book.hasPage #grimoire{ color:#2a1d08 }
.hasUIArt #book.hasPage .entry .turn,
.hasUIArt #book.hasPage #grimoire .empty,
.hasUIArt #book.hasPage .noteText{ color:#4a3410; text-shadow:0 1px 0 rgba(255,247,225,.55) }
#bookUp{ top:-1px } #bookDown{ right:26px; top:-1px }
#grimoire{                   }
/* REMOVED 2026-08-28: the procedural SPINE. book.webp measures luminance 39 at its centre column against 95 for the adjacent page — 56 points darker, so the spine is painted into the art and this drew a second over it */
.entry{ display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:0;
  min-height:var(--bookRow); padding:0; border-bottom:1px dashed rgba(107,88,54,.28) }
.entry .pgL{ display:flex; align-items:center; gap:5px; padding-right:12px }
.entry .pgR{ display:flex; align-items:center; gap:5px; padding-left:12px; justify-content:flex-start }
.entry .turn{ font-family:var(--font-display); font-size:12px; color:#6f5828; width:16px;
  text-align:center; flex:0 0 auto }
.entry .seq{ display:flex; gap:3px; font-size:14px }
.entry .pips{ display:flex; gap:4px; margin-left:0; align-items:center }
.entry .arrow{ display:none }
.noteRow{ grid-column:1 / -1; display:flex }          /* notes span both pages */

/* The line being written: same shape as a history row, so the record reads as one
   continuous list rather than a log plus a separate input panel. */
/* ============================================================================
   THE PARCHMENT AND THE SEAL — where the incantation is built before it is cast.

   The strip is a background on #draftArea rather than an <img>, for the reason
   the whole layout table exists: a background cannot be beaten by a later rule
   in a 950-rule stylesheet the way a positioned image's geometry can.

   PADDING MAKES ROOM FOR THE SEAL rather than the seal being absolutely placed
   over the text. Absolute placement would have put a 120px seal on top of the
   slots the moment the band shrank, and it would have looked deliberate.

   SUSPICIOUS-STYLE CLASSIFICATION — every instance in this block, justified.
   Nothing here is present by habit; each is required by Kerry's export or by a
   fault it prevents.

   NEG INSET x2 — REQUIRED. #playerFig left:-1.5 and #waxSeal top:-1.7 are HIS
     NUMBERS. He drew the wright bleeding off the screen edge and the seal
     overhanging its strip; both are deliberate and stated in his export.
   % PADDING x2 — REQUIRED. #enemyWards and #relicStrip take a LEFT inset only,
     which is his first mark's offset. Percentage padding resolves against
     WIDTH, and these are horizontal, so it means what it says. The vertical
     equivalents were removed after they were found to mean something else.
   MIN/MAX x1 — REQUIRED. max-height on #cast stops the button floating on its
     own text height and outgrowing the row he drew.
   OVERFLOW:HIDDEN x6 — REQUIRED. #book, #castArea and #runes clip children to
     the band, which layouttest asserts and which stops a child escaping its
     surface. #playerFig clips the wright so a crop falls on the floor and the
     screen edge. Both banners clip so a long ability name cannot stretch the
     ribbon past the box he drew.
   PSEUDO x2 — REQUIRED. #draftArea::before paints the parchment at inset:0,
     which is the fix for the 496px-in-a-368px-box fault. #purseBar::after is
     the invisible 44x44 hit area, which paints nothing.
   TRANSFORM x1 — REQUIRED. It centres that hit area and affects no visible box.
   GRID/FLEX x10 — REQUIRED. Every repeated row he drew is a grid or flex line:
     the six element buttons, six slots, six wards, eight relics, six vials,
     four cards. A row of repeats is what these declarations are for.
   ============================================================================ */
#draftArea{                  ; z-index:1;                  ;
  border-top:1px solid rgba(107,88,54,.35); background:rgba(255,255,255,.12) }
.draftEntry{ border-bottom:0; min-height:var(--bookRow) }
.draftEntry .pgL{ gap:5px }
#draftArea #slots{         ; gap:3px; justify-content:flex-start }
/* +20%, per Kerry: the slots, the clear control and the runes inside them.
   20 -> 24px, with the glyph scaled to match so the rune fills the disc as it
   did before rather than rattling around in a bigger one. */
#draftArea .slot{
            ;            ; font-size:15px; border-radius:50%;          ;
  background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.5), rgba(214,196,152,.55));
  border:1px solid rgba(107,88,54,.5); box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
}
#draftArea .slot .idx{ display:none }
#draftArea .slot.filled{ border-color:#a8862f; box-shadow:0 0 10px rgba(168,134,47,.4),
  inset 0 1px 0 rgba(255,255,255,.55) }
#draftArea .slot.next{ border-color:#6a4bb5; animation:pulseInk 1.7s ease-in-out infinite }
#draftArea .slot.aimed{ border-color:#6a4bb5; box-shadow:0 0 12px rgba(106,75,181,.5) }
#draftArea .slot.aimed::before{ color:#6a4bb5 }
#draftArea .slot.known{ border-color:#2f8f52; box-shadow:0 0 10px rgba(47,143,82,.35) }
#draftArea .slot{                   }
#draftArea .slot.frozenSlot{ border-color:#5f93c9; box-shadow:0 0 10px rgba(95,147,201,.55) }
#draftArea .slot.frozenSlot::after{ content:"🧊";                  ;         ;           ; font-size:9px }
#draftArea .slot.markedSlot{ border-color:#7a4bb5; box-shadow:0 0 10px rgba(122,75,181,.6) }
#draftArea .slot.markedSlot::after{ content:"👁";                  ;         ;           ; font-size:9px }
@keyframes pulseInk{ 50%{ box-shadow:0 0 12px rgba(106,75,181,.35) } }
#draftArea .clearRow{           ;            ; font-size:12px;                ;
  border-color:rgba(107,88,54,.5); background:rgba(255,255,255,.25); color:#6f5828 }
#book #legendBar{ position:relative; z-index:1; color:#6f5828; padding:2px 6px 4px;
  border-top:1px solid rgba(107,88,54,.28) }
#book #legendBar .pip.exploit{ background:#3da864; --ring:#2f8f52 }
#book #legendBar .pip.resonate{ border-color:#b8860b; color:#b8860b; background:rgba(255,255,255,.35); --ring:#b8860b }
#book #legendBar .pip.resist{ background:rgba(58,44,20,.55); border-color:#5a4f3a; color:#e6dcc4; --ring:#5a4f3a }
#book #legendBar .pip.echo{ box-shadow:0 0 0 1.5px #e2d2ac, 0 0 0 3px var(--ring) }

/* ---------- RUNE ARC ---------- */
#castArea{ background:linear-gradient(180deg, rgba(43,35,86,.85), rgba(30,24,64,.9));
  border:1px solid var(--ink-3); border-radius:var(--r-m);                    ;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 6px 18px rgba(0,0,0,.35) }
#castArea::before{ display:none }
#runeArc{ display:flex; align-items:center; justify-content:center; gap:4px;                   }
/* The candles were emoji at both ends of the arc. The entry harness has them painted
   in, so they were being drawn twice. Kept only for a build with no art. */
.hasUIArt #runeArc .candle{ display:none }
#runeArc .candle{ font-size:23px; flex:0 0 auto; filter:drop-shadow(0 0 10px rgba(255,190,90,.55));
  animation:flicker 3.4s ease-in-out infinite }
#runeArc .candle:last-child{ animation-delay:-1.7s }
@keyframes flicker{ 0%,100%{ opacity:.9; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-1px) } }
#runes{ display:flex; gap:5px; flex:1 1 auto; justify-content:center; align-items:flex-end }
.rune{ flex:1 1 0; min-width:0; border-radius:50% 50% 8px 8px }
/* the slight arc */
/* THE ARC WAS FOR THE OLD CURVED BENCH, which is gone. The concept sets the six
   in a straight centred row; the nudges only made them look misaligned against
   their own circular plates. Kept for the undressed screen, cancelled when the
   art is on. */
.rune:nth-child(1),.rune:nth-child(6){                           }
.rune:nth-child(2),.rune:nth-child(5){                           }
.hasUIArt #runes .rune:nth-child(n){                }
.hasUIArt #runes .rune:active{                                      }
.rune:active{                                      }
#cast{                }

/* ---------- KIT ---------- */
#kit{ flex:0 0 auto; background:linear-gradient(180deg, rgba(43,35,86,.85), rgba(30,24,64,.85));
  border:1px solid var(--ink-3); border-radius:var(--r-m);                  ;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 6px 18px rgba(0,0,0,.35) }
#kit #spellTray{                   }
.spell{ border-radius:8px;                     }
.spell .sg{ font-size:19px }

@media (max-height:760px){/* folded into the later declaration of #scene */

  #playerFig{ font-size:60px } #enemySprite{ font-size:50px }
  #book{ min-height:132px }
  #draftArea .slot{           ;            ; font-size:21px }
}
@media (max-height:670px){/* folded into the later declaration of #scene */
/* folded into the later declaration of #grimoire */

  #book #legendBar{ display:none }
  #playerPanel #relicStrip{ display:none }
}


/* ---- THE FIRST LESSON ---------------------------------------------------
   A bar that never covers what it is pointing at, and a ring that says
   "here". The ring pulses because a still highlight on a busy screen is
   easy to miss on a phone. */
#lessonBar{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:linear-gradient(180deg,rgba(12,10,24,.94),rgba(12,10,24,.99));
  border-top:1px solid var(--gold);box-shadow:0 -8px 30px rgba(0,0,0,.6);
  transform:translateY(110%);transition:transform .35s ease;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
#lessonBar.show{transform:translateY(0)}
.lessonInner{max-width:640px;margin:0 auto;font-size:15px;line-height:1.5;color:var(--vel)}
.lessonInner b{color:var(--gold2)}
.lessonInner .btn{margin-top:12px;width:100%}
.lessonPoint{position:relative;z-index:61;
  outline:2px solid var(--gold);outline-offset:3px;border-radius:10px;
  animation:lessonPulse 1.5s ease-in-out infinite}
@keyframes lessonPulse{
  0%,100%{outline-color:rgba(217,164,65,.45);box-shadow:0 0 0 0 rgba(217,164,65,.25)}
  50%    {outline-color:rgba(232,200,127,1);box-shadow:0 0 18px 4px rgba(217,164,65,.35)}
}
@media (prefers-reduced-motion:reduce){ .lessonPoint{animation:none;outline-color:var(--gold2)} }
/* the bar can be tall on a small screen — let the battle breathe above it */
body.lessonOn #app{padding-bottom:180px}

/* ---- the Sanctum's shelves --------------------------------------------- */
.shelfLabel{font-family:var(--fm);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);text-align:center;margin:16px 0 8px;position:relative}
.shelfLabel::before,.shelfLabel::after{content:"";position:absolute;top:50%;width:22%;
  height:1px;background:linear-gradient(90deg,transparent,rgba(217,164,65,.5))}
.shelfLabel::before{left:4%}
.shelfLabel::after{right:4%;transform:scaleX(-1)}
.shelfNote{text-align:center;color:var(--dim);font-style:italic;font-size:13px;margin:14px 0 6px}

/* ---- THE SANCTUM ---------------------------------------------------------
   Built to read as a keeper's stall rather than a list: a face at the top, wares
   standing in lit alcoves, each price on its own plaque. What a ware DOES lives
   behind a long press, which is the gesture the rest of the game already uses. */
.stall{ border:1px solid var(--ink-3); border-radius:var(--r-m); overflow:hidden;
  background:linear-gradient(180deg,rgba(24,19,52,.96),rgba(16,12,36,.98));
  box-shadow:inset 0 0 60px rgba(0,0,0,.5); margin-bottom:10px }

.stallKeeper{ position:relative; display:flex; flex-direction:column; align-items:center;
  gap:6px; padding:16px 14px 14px;
  background:radial-gradient(120% 90% at 50% 0%, rgba(157,123,255,.16), transparent 70%),
             linear-gradient(180deg,rgba(43,35,86,.7),transparent);
  border-bottom:1px solid rgba(217,164,65,.25) }
.keeperArt{ font-size:52px; line-height:1; filter:drop-shadow(0 0 14px rgba(157,123,255,.4)) }
.keeperLine{ font-size:12.5px; font-style:italic; color:var(--vellum-dim);
  text-align:center; max-width:34ch; line-height:1.4 }

/* the label plaques between shelves */
.shelfLabel{ font-family:var(--font-data); font-size:9.5px; letter-spacing:.26em;
  text-transform:uppercase; color:var(--gold); text-align:center;
  margin:0; padding:9px 0 8px; position:relative;
  background:linear-gradient(180deg,rgba(217,164,65,.09),transparent);
  border-top:1px solid rgba(217,164,65,.18); border-bottom:1px solid rgba(217,164,65,.18) }
.shelfLabel em{ font-style:normal; opacity:.55; letter-spacing:.08em; text-transform:none }

/* the alcoves themselves */
.shelf{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:10px 9px 12px }
.shelf.relics{ grid-template-columns:repeat(3,1fr) }
.ware{ position:relative; display:flex; flex-direction:column; align-items:center; gap:0;
  padding:0 0 5px; border-radius:var(--r-s); color:var(--vellum);
  border:1px solid var(--ink-3);
  background:linear-gradient(180deg,rgba(10,7,26,.9),rgba(30,24,64,.75));
  box-shadow:inset 0 8px 18px rgba(0,0,0,.55);
  transition:transform .12s, border-color .2s, box-shadow .2s }
.ware:active{ transform:scale(.96) }
.wareArt{ font-size:30px; line-height:1; padding:14px 0 8px;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.6)) }
.wareName{ font-size:10.5px; line-height:1.25; text-align:center; padding:0 5px 6px;
  color:var(--vellum-dim); min-height:2.4em; display:flex; align-items:center }
.warePrice{ font-family:var(--font-data); font-size:10px; letter-spacing:.08em;
  color:var(--gold2, #e8c87f); padding:3px 9px; border-radius:4px;
  border:1px solid rgba(217,164,65,.35); background:rgba(217,164,65,.1) }
.ware.common{   border-color:rgba(222,212,189,.22) }
.ware.uncommon{ border-color:rgba(122,200,255,.35); box-shadow:inset 0 8px 18px rgba(0,0,0,.55), 0 0 12px rgba(122,200,255,.08) }
.ware.rare{     border-color:rgba(168,107,223,.5);  box-shadow:inset 0 8px 18px rgba(0,0,0,.55), 0 0 16px rgba(168,107,223,.18) }
.ware.broke{ opacity:.4 }
.ware.broke .warePrice{ color:var(--resist, #c2566b); border-color:rgba(194,86,107,.4);
  background:rgba(194,86,107,.08) }

/* "Do you have anything else…?" */
.askAgain{ display:flex; align-items:center; gap:9px; width:calc(100% - 18px);
  margin:0 9px 12px; padding:9px 12px; border-radius:var(--r-s);
  border:1px solid rgba(217,164,65,.35); background:rgba(217,164,65,.07);
  color:var(--vellum); font-family:var(--font-display); font-size:13.5px; text-align:left }
.askAgain:active{ transform:scale(.99); border-color:var(--gold) }
.askTurn{ font-size:16px; color:var(--gold) }
.askText{ flex:1 }
.askPrice{ font-family:var(--font-data); font-size:10px; letter-spacing:.08em; color:var(--gold2,#e8c87f);
  padding:3px 8px; border-radius:4px; border:1px solid rgba(217,164,65,.3) }
.shelfNote{ text-align:center; color:var(--vellum-dim); font-style:italic; font-size:12.5px;
  padding:12px 14px 14px }

@media (max-width:360px){
  .shelf{ grid-template-columns:repeat(2,1fr) }
  .shelf.relics{ grid-template-columns:repeat(3,1fr) }
  .wareArt{ font-size:26px }
}

/* ---- THE TRIALS ----------------------------------------------------------
   One card per craft, each with its own ladder of pips, because the ladder is
   per-discipline now. The records sit under the pips: they are the reason to
   climb, so they should be visible without a tap. */
.trialCraft{ border:1px solid var(--ink-3); border-radius:var(--r-m); padding:11px 12px;
  margin-bottom:9px; background:linear-gradient(180deg,rgba(30,24,64,.55),rgba(16,12,36,.75)) }
.tcHead{ display:flex; align-items:center; gap:9px; margin-bottom:9px }
.tcGlyph{ font-size:21px }
.tcName{ flex:1; font-size:15px; color:var(--vellum) }
.tcTier{ font-family:var(--font-data); font-size:10.5px; letter-spacing:.08em; color:var(--gold2,#e8c87f) }
.tcTier em{ font-style:normal; opacity:.55; margin-left:5px }
.tcLadder{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px }
.tcPip{ flex:1; min-width:24px; text-align:center; font-family:var(--font-data); font-size:11px;
  padding:5px 0; border-radius:5px; border:1px solid var(--ink-3); color:var(--vellum-dim);
  cursor:pointer; transition:border-color .15s, background .15s }
.tcPip:active{ transform:scale(.94) }
.tcPip.on{ border-color:var(--gold); background:rgba(217,164,65,.16); color:var(--gold2,#e8c87f) }
.tcPip.off{ opacity:.3; cursor:not-allowed }
.tcNote{ font-size:12.5px; font-style:italic; color:var(--vellum-dim); margin-bottom:8px }
.tcRecords{ display:flex; flex-wrap:wrap; gap:4px 14px; font-family:var(--font-data);
  font-size:10px; letter-spacing:.05em; color:var(--vellum-dim); text-transform:uppercase }
.tcRecords b{ color:var(--vellum); font-family:var(--font-display); font-size:13px;
  letter-spacing:0; margin-right:3px }
.trialRow{ display:flex; gap:10px; align-items:baseline; padding:4px 2px; font-size:13px }
.trialRow .tn{ font-family:var(--font-data); font-size:10px; color:var(--gold);
  min-width:18px; text-align:right }
.trialRow .tt{ flex:1; color:var(--vellum-dim) }

/* ---- THE PATH, redesigned ------------------------------------------------
   A banner naming the act with the purse and the heart beside it, the map in its
   own frame, four ways out along the bottom, and the key in a panel of its own. */
.mapBanner{ border:1px solid rgba(217,164,65,.3); border-radius:var(--r-m);
  background:linear-gradient(180deg,rgba(43,35,86,.5),rgba(16,12,36,.8));
  padding:9px 13px 10px; margin-bottom:9px }
.mbAct{ font-family:var(--font-data); font-size:9px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--gold); text-align:center; opacity:.85 }
.mbRow{ display:flex; align-items:center; gap:10px; margin-top:3px }
.mbTitle{ flex:1; margin:0; font-size:23px; letter-spacing:.06em }
.mbVitals{ display:flex; gap:9px; align-items:center; flex-shrink:0 }
.mbCoin,.mbHeart{ font-family:var(--font-data); font-size:11px; letter-spacing:.05em;
  padding:4px 8px; border-radius:6px; border:1px solid var(--ink-3); background:rgba(10,7,26,.6) }
.mbCoin{ color:var(--aurels,#9d7bff) }
.mbHeart{ color:#e8737f }

.mapFrame{ border:1px solid var(--ink-3); border-radius:var(--r-m); overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%, rgba(43,35,86,.35), rgba(10,7,26,.7));
  box-shadow:inset 0 0 50px rgba(0,0,0,.55); padding:6px 4px }

/* four ways out, evenly weighted — no fifth, by design */
.mapTools{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:11px 0 9px }
.mapTool{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 3px;
  border:1px solid var(--ink-3); border-radius:var(--r-s); color:var(--vellum);
  background:linear-gradient(180deg,rgba(30,24,64,.7),rgba(12,9,30,.85)) }
.mapTool:active{ transform:scale(.96); border-color:var(--gold) }
.mtGlyph{ font-size:19px; line-height:1 }
.mtLabel{ font-size:10.5px; color:var(--vellum-dim); letter-spacing:.03em }

/* the key, in a panel rather than a run-on line */
.mapKey{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px 4px;
  border:1px solid var(--ink-3); border-radius:var(--r-m); padding:10px 8px;
  background:linear-gradient(180deg,rgba(30,24,64,.35),rgba(12,9,30,.5)) }
.mapKey span{ display:flex; align-items:center; gap:6px; justify-content:flex-start;
  font-size:11px; color:var(--vellum-dim) }
.mapKey i{ font-style:normal; font-size:15px; width:24px; height:24px; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--ink-3); border-radius:50%; background:rgba(10,7,26,.7) }
.mapSatchel{ text-align:center; font-size:17px; letter-spacing:4px; margin-top:8px; opacity:.85 }

/* ---- the character sheet ---- */
.chPortrait{ font-size:54px; text-align:center; line-height:1; margin:6px 0 10px;
  filter:drop-shadow(0 0 16px rgba(157,123,255,.35)) }
.chSheet{ border:1px solid var(--ink-3); border-radius:var(--r-m); overflow:hidden; margin:12px 0 }
.chRow{ display:flex; justify-content:space-between; align-items:baseline;
  padding:8px 12px; border-bottom:1px solid rgba(74,63,106,.35); font-size:13px;
  color:var(--vellum-dim) }
.chRow:last-child{ border-bottom:none }
.chRow b{ color:var(--vellum); font-family:var(--font-data); font-size:12px; letter-spacing:.05em }

@media (max-width:340px){ .mapKey{ grid-template-columns:repeat(2,1fr) } }

/* ---- the paths ----------------------------------------------------------
   Only the roads leaving the node you stand on are lit. The rest of the map
   stays quiet, so the eye lands on the choice rather than on everything. */
.mePath{ stroke-linecap:round }
.meHalo{ stroke:var(--gold); opacity:.34; filter:url(#meGlow) }
.meCore{ stroke:var(--gold2,#e8c87f); opacity:.95 }
/* a spark running the length of a live road, from where you stand toward what
   you might choose */
.meSpark{ stroke:#fff3d0; opacity:.9; stroke-dasharray:5 190;
  animation:meRun 2.2s linear infinite }
@keyframes meRun{ from{ stroke-dashoffset:195 } to{ stroke-dashoffset:0 } }
/* the road already walked: warm, but done talking */
.meTrod{ stroke:rgba(217,164,65,.42) }
.meAhead{ stroke:rgba(157,123,255,.16) }

@media (prefers-reduced-motion:reduce){
  .meSpark{ animation:none; opacity:0 }
  .meHalo{ opacity:.42 }
}

/* the lesson's escape hatch — present but quiet, so it does not compete with the
   instruction it sits beside */
.lessonSkip{ display:block; margin:9px auto 0; padding:4px 12px;
  font-family:var(--font-data); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--vellum-dim); background:none; border:1px solid var(--ink-3); border-radius:6px }
.lessonSkip:active{ transform:scale(.97); border-color:var(--gold); color:var(--gold2,#e8c87f) }

/* ---- THE TITLE ------------------------------------------------------------
   A name, the figure, and one clear action. Everything else the old screen
   carried was reference material standing where a decision belongs. */
/* THE STAGE. Absolute inside #screen, which is position:fixed inset:0 — so 100% here
   is the app viewport and nothing below depends on document flow. */
.mmScreen{ position:absolute; inset:0; padding:0 }
.mmTitle{ position:absolute; left:50%; top:8%; transform:translateX(-50%);
  width:max-content; max-width:92%; display:flex; align-items:center; justify-content:center;
  gap:12px; margin:0; z-index:4 }
.mmOrn{ color:var(--gold); font-size:12px; opacity:.75 }
.mmName{ margin:0; font-size:38px; letter-spacing:.02em; line-height:1.05;
  background:linear-gradient(180deg,#f4dda0,#d9a441 55%,#a97722);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 2px 18px rgba(217,164,65,.28) }

/* the sigil stands where the painted figure will */
.mmArt{ position:absolute; inset:0; margin:0; min-height:0; z-index:0 }
.mmFigure{ font-size:76px; line-height:1; filter:drop-shadow(0 0 30px rgba(217,164,65,.3)) }
.mmRing{ position:absolute; width:210px; height:210px; border-radius:50%;
  border:1px solid rgba(217,164,65,.28); border-bottom-color:transparent;
  animation:mmTurn 34s linear infinite }
.mmRing.two{ width:264px; height:264px; border-color:rgba(157,123,255,.2);
  border-top-color:transparent; animation-duration:52s; animation-direction:reverse }
/* THE CENTRING MUST SURVIVE THE ANIMATION. A keyframe of rotate() alone replaces the
   whole transform and drops translate(-50%,-50%), throwing the astrolabe off-centre for
   every frame it plays. */
@keyframes mmTurn{
  from{ transform:translate(-50%, -50%) rotate(0deg) }
  to{   transform:translate(-50%, -50%) rotate(360deg) }
}
.mmEl{ position:absolute; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:16px;
  border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
  background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 26%, transparent), rgba(10,7,26,.85));
  box-shadow:0 0 16px color-mix(in srgb, var(--c) 30%, transparent) }
.mmEl.e0{ top:34%; left:16% } .mmEl.e1{ top:62%; left:20% }
.mmEl.e2{ top:24%; left:30% } .mmEl.e3{ top:30%; right:18% }
.mmEl.e4{ top:58%; right:14% } .mmEl.e5{ bottom:16%; left:47% }

/* one clear action, and quieter ways past it */
/* A BUDGET, not a guess. The stack occupies the band from 54% down to 4% off the
   bottom, and each row takes a SHARE OF THAT BAND — so three rows fit by construction
   and a fourth would shrink them rather than running off the screen. Widths follow
   from the heights, which is what keeps every button's own proportions. */
.mmActions{ position:absolute; left:50%; top:54%; bottom:6%; transform:translateX(-50%);
  width:min(80%, 500px); display:flex; flex-direction:column;
  justify-content:center; gap:2.2%; margin:0; z-index:5 }
.mmActions > .mmBtn{ flex:0 1 auto; min-height:0; width:100%;
  max-height:none }
.mmBtn{ display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; padding:13px 14px; border-radius:var(--r-m); border:1px solid var(--ink-3);
  background:linear-gradient(180deg,rgba(30,24,64,.7),rgba(12,9,30,.9));
  color:var(--vellum); font-family:var(--font-display) }
.mmBtn:active{ transform:scale(.985) }
.mmLabel{ font-size:15px; letter-spacing:.22em; text-transform:uppercase }
.mmSub{ font-family:var(--font-data); font-size:9.5px; letter-spacing:.16em;
  color:rgba(60,40,10,.8) }

/* ---- the record ---- */
.acStats{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:6px }
