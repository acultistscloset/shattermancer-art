  /* The Excision takes a spell before the first turn is drawn. */
  if (B.enemy.onBattleBegin) B.enemy.onBattleBegin.call(B.enemy, B);
  playMusic(trackForBattle());
  /* On #sceneArt, not #app: the environment is the BATTLE'S background, and #app is
     the whole screen — the grimoire and the spell cards are not standing in a forest. */
  applyScene($("#sceneArt"), "battle:act" + ((RUN.act||0)+1));
  renderPlayerSprite();
  dressBook();
  applyLayout("battle");
  renderEnemySprite(forceId);
  playSfx("encounter_start");
  if (RUN.mapInsight){
    const seen = B.enemy.code[0];
    B.known.revealed[0] = seen; RUN.mapInsight = false;
    /* Captured, not re-read — same reason as Third Eye. */
    if (seen !== undefined)
      setTimeout(() => noteInsight(EL[seen].glyph + " goes in slot 1", "🗺"), 0);
  }
  if (RUN.nextWarded){ ELEMENTS.slice(0,2).forEach(e => B.enemy.resist[e.id] = 2); RUN.nextWarded = false; }
  emit("onBattleStart", {});
  showBattle();
  renderAll();
  beginTurn();
  const intro = B.enemy.flavour + (B.enemy.special ? "<br><b>" + B.enemy.special + "</b>" : "");
  toast("<b>" + B.enemy.name + "</b><br>" + intro, 4200);
  if (B.chaosElement){
    const ce = B.chaosElement;   // captured: B may be a different battle by the time this fires
    setTimeout(() => toast("Chaos Wand attunes to " + EL[ce].glyph + " " +
                           EL[ce].name + " this battle.", 3000), 4400);
  }
}
/* The incantation is a fixed-length array with nulls, not a growing list, so the
   player can fill slots out of order while deducing. */
function emptyDraft(len){ return new Array(len).fill(null); }
function draftFull(){ return B.draft.length === B.enemy.codeLength && B.draft.every(x => x); }
/* The next empty slot to the RIGHT of `from`, wrapping back to slot 1.
   Filling left-to-right and wrapping matches how the row is read, and keeps the
   cursor near the rune you just placed instead of jumping back to the start. */
function nextEmptyFrom(from){
  const n = B.enemy.codeLength;
  for (let k = 1; k <= n; k++){
    const i = (from + k) % n;
    if (!B.draft[i]) return i;
  }
  return null;
}
function nextEmptySlot(){ return nextEmptyFrom(B.cursor == null ? -1 : B.cursor); }
/* Where the next tapped rune lands: an explicitly aimed slot, else the cursor. */
function activeSlot(){
  if (B.target != null) return B.target;
  return nextEmptySlot();
}

function repeatCap(){ return CONFIG.maxRepeat; }
/* Counts how many times `el` appears in `arr`. */
function countOf(arr, el){ return arr.reduce((n,x) => n + (x === el ? 1 : 0), 0); }

function randomCode(len, duplicateHeavy){
  const cap = repeatCap();
  if (duplicateHeavy){
    /* Built from repeats: e.g. A A B B C. Guarantees the Echo mechanic matters —
       but still respects the cap, so it never degenerates into one rune. */
    const need = Math.max(2, Math.ceil(len / cap));
    const picks = shuffle(ELEMENTS.map(e => e.id)).slice(0, Math.max(need, Math.ceil(len/2)));
    const c = [];
    while (c.length < len){
      const el = picks[c.length % picks.length];
      c.push(countOf(c, el) < cap ? el : picks.find(p => countOf(c, p) < cap));
    }
    return shuffle(c).slice(0, len);
  }
  /* Draw uniformly, but reject any element that has already filled its quota. */
  const c = [];
  while (c.length < len){
    const allowed = ELEMENTS.filter(e => countOf(c, e.id) < cap);
    c.push(allowed[Math.floor(Math.random()*allowed.length)].id);
  }
  return c;
}

/* ============================================================
   9. HOOKS — wizard passive + relics, resolved as data.
   ============================================================ */
function activeHookSets(){
  const sets = [WIZ[RUN.wizard].hooks];
  RUN.relics.forEach(id => sets.push(RELICS[id].hooks || {}));
  return sets;
}
function emit(name, ctx){
  activeHookSets().forEach(h => { if (h[name]) h[name](ctx); });
  return ctx;
}

/* Which two elements a discipline draws on, read from its own spells rather than a
   table, so it stays true as content changes. */
function nativeElementsOf2(wiz){
  const seen = [];
  (SPELL_POOLS[wiz] || []).forEach(id => {
    const sp = SPELLS[id]; if (!sp) return;
    const el = Object.keys(sp.cost)[0];
    if (el && el !== "gold" && !seen.includes(el)) seen.push(el);
    if (sp.alt && !seen.includes(sp.alt)) seen.push(sp.alt);
  });
  return seen.slice(0, 2);
}
const hasRelic = id => RUN.relics.includes(id);
/* Iron Rations and Reliquary Chain raise the ceiling rather than healing, so the
   bonus is applied the moment the relic is taken and removed if it ever leaves. */
function applyRelicMaxHP(){
  const want = relicSum("maxHPBonus") + relicSum("maxHPPer");
  const had = RUN.relicMaxHP || 0;
  if (want === had) return;
  RUN.maxHP += (want - had);
  if (want > had) RUN.hp += (want - had);        // new capacity arrives filled
  RUN.relicMaxHP = want;
  renderHP();
}
/* Some relics are a number rather than a behaviour. Summing them in one place keeps
   every reader honest and means a new relic only has to name the property. */
function relicSum(prop){
  return (RUN.relics || []).reduce((n, id) => {
    const v = (RELICS[id] || {})[prop];
    return n + (typeof v === "function" ? (v() || 0) : (typeof v === "number" ? v : 0));
  }, 0);
}
function relicAny(prop){
  return (RUN.relics || []).some(id => !!(RELICS[id] || {})[prop]);
}
function relicMax(prop){
  return (RUN.relics || []).reduce((n, id) => {
    const v = (RELICS[id] || {})[prop];
    return typeof v === "number" ? Math.max(n, v) : n;
  }, 0);
}
const potionCapacity = () => Math.max(
  CONFIG.economy.potionCapacity + (hasRelic("bottomless_satchel") ? 3 : 0) +
    relicSum("potionCapacityBonus"),
  (RUN && RUN.sandboxCapacity) || 0);
/* Curse: Hexweaver's resource. Ticks at the end of the creature's turn. */
function totalWards(){
  return ELEMENTS.reduce((t,e) => t + (B.enemy.resist[e.id] || 0), 0);
}
/* A warded creature partly shrugs off hexes — wards are magical resistance, so
   they should mean something even to a wizard who never creates them. */
function curseResistChance(){
  return Math.min(CONFIG.curse.maxWardResist, totalWards() * CONFIG.curse.wardResistPerLevel);
}
function addCurse(n){
  if (n > 0) playSfx("curse");
  if (n <= 0) return;
  const chance = curseResistChance();
  if (chance > 0 && Math.random() < chance){
    floatText($("#enemySprite"), "warded", "small blocked");
    toast("Its wards turn the hex aside.", 1500);
    return;
  }
  B.curse = (B.curse || 0) + n;
  renderResist();
  floatText($("#enemySprite"), "🕷+" + n, "small");
}
/* Solving the sequence sets every hex off at once. */
/* Spend the stockpile. A Perfect pays a bonus that grows with the stack count but
   sub-linearly and capped, so hoarding for a solve beats rupturing on command —
   without making a manual rupture feel like a waste. */
function curseBurstDamage(stacks, perfect){
  let dmg = stacks * CONFIG.curse.burstPerStack;
  if (perfect){
    const bonus = Math.min(CONFIG.curse.perfectBonusCap,
                           stacks * CONFIG.curse.perfectBonusPerStack);
    dmg = dmg * (1 + bonus);
  }
  if (hasRelic("spider_sigil")) dmg = dmg * 1.5;
  return Math.round(dmg);
}
function detonateCurse(opts){
  opts = opts || {};
  if (!B.curse) return 0;
  const stacks = B.curse;
  const perfect = opts.perfect !== false;          // a Perfect unless told otherwise
  const dmg = curseBurstDamage(stacks, perfect);
  const hm = masteryOf("hex");
  B.curse = (hm && hm.residue) ? Math.floor(stacks * hm.residue()) : 0;
  renderResist();
  damageEnemy(dmg, { spell:true, big:true });
  banner(perfect ? "Hexes Detonate" : "Curse Ruptures", true);
  toast("<b>" + stacks + " Curse " + (perfect ? "detonates" : "ruptures") +
        " for " + dmg + ".</b>", 2600);
  return dmg;
}
/* The ceiling on a pool. Deep Draught raises it for the rest of a battle, so the
   vial has to be asked here rather than only setting a flag nobody read. */
/* The ceiling on a pool. Deep Draught raises it for a battle; Deep Cistern raises it
   for the two elements a discipline actually uses. */
const manaMax  = (el) => (hasRelic("mana_flask") ? 12 : CONFIG.mana.max) +
                       ((B && B.flags && B.flags.poolBonus) || 0) +
                       (el ? (RUN.relics||[]).reduce((n,id) => {
                         const f = (RELICS[id]||{}).poolBonusFor;
                         return n + (f ? (f(el) || 0) : 0); }, 0) : 0);

/* ============================================================
   10. RESOURCE HELPERS
   ============================================================ */
function addMana(el, amount, bonus){
  if (amount > 0) playSfx("mana");
  if (amount <= 0) return 0;
  /* Focus: the FIRST mana of its element each encounter arrives thicker. */
  if (!bonus && RUN.shop.focus[el] && !B.once["focus_" + el]){
    B.once["focus_" + el] = true;
    amount += 2 * RUN.shop.focus[el];
  }
  const before = B.mana[el];
  const ceiling = manaMax(el);
  B.mana[el] = Math.min(ceiling, before + amount);
  /* Runoff catches what a full pool would have thrown away. */
  const wasted = (before + amount) - B.mana[el];
  if (wasted > 0 && !bonus) emit("onSpill", { element:el, wasted });
  const real = B.mana[el] - before;
  RUN.stats.manaBy[el] += real;
  if (real) gainManaFx(el, real);
  emit("onMana", { element:el, amount, bonus:!!bonus });
  renderMana();
  return real;
}
function spendMana(cost){
  Object.keys(cost).forEach(el => B.mana[el] -= cost[el]);
  renderMana();
}
/* Announced AFTER the health has actually gone, or a relic that asks "am I below
   half" reads the value from before the blow — which is what silenced Second Wind. */
function noteDamageTaken(n){
  if (n > 0) emit("onTakeDamage", { amount:n });
}
function healPlayer(n){
  /* Bitter Restorative buys a large heal by closing the door on every later one. */
  if (B && B.flags && B.flags.noHeal) return 0;
  if (n > 0 && B && B.flags && B.flags.drinkingVial) n += relicSum("vialHealBonus");
  if (n > 0) playSfx("heal");
  const before = RUN.hp;
  RUN.hp = Math.min(RUN.maxHP, RUN.hp + n);
  renderHP();
  const got = RUN.hp - before;
  if (got) floatText($("#playerBar"), "+" + got, "small good");
  return got;
}
/* Damage the player takes from something other than the creature's own blow — the
   Recursion returning their work. Block still answers it; it is damage, not a cost. */
/* Every route by which the player gains Block passes through here, so the Thornback
   only has to be answered once. */
function gainBlock(n){
  if (n <= 0) return 0;
  B.block += n;
  if (B.enemy && B.enemy.mirrorsBlock){
    B.enemy.block += B.enemy.mirrorsBlock;
    toast("<b>The Thornback</b> thickens with you.", 1800);
  }
  renderHP();
  return n;
}
function hurtPlayerReflected(n){
  if (n <= 0) return;
  let dmg = n;
  if (B.block > 0){
    const soaked = Math.min(B.block, dmg);
    B.block -= soaked; dmg -= soaked;
    if (soaked) floatText($("#playerBar"), "-" + soaked, "small blocked");
  }
  if (dmg > 0){
    RUN.hp -= dmg; RUN.stats.taken += dmg;
    floatText($("#playerBar"), "-" + dmg, "small pain");
    noteDamageTaken(dmg);
  }
  renderHP();
  if (RUN.hp <= 0) defeat();
}
function hurtPlayerSelf(n){
  playSfx("hurt");
  RUN.hp -= n; renderHP();
  if (RUN.hp <= 0 && emit("onLethal", { prevented:false }).prevented){ RUN.hp = 1; renderHP(); }
  floatText($("#playerBar"), "-" + n, "small pain");
  emit("onSelfHPCost", { amount:n });
  if (RUN.hp <= 0) defeat();
}
/* Creatures that feed on your attunement. Stolen mana is stored on the creature
   and makes its blows heavier, so the player must decide whether to spend or lose it. */
function stealMana(n){
  const full = ELEMENTS.filter(e => B.mana[e.id] > 0)
                       .sort((a,b) => B.mana[b.id] - B.mana[a.id])[0];
  if (!full) return 0;
  const took = Math.min(n, B.mana[full.id]);
  B.mana[full.id] -= took;
  B.enemy.stolen = (B.enemy.stolen || 0) + took;
  renderMana(); renderResist();
  if (took) floatText($("#enemySprite"), "+" + took + EL[full.id].glyph, "small blocked");
  return took;
}

/* Collected wherever the creature's health reaches zero, so the debt is called in
   however it was finished — spell, incantation, or a lingering burn. */
/* The Blood Ledger settles the moment the creature falls. Everything the
   Necromancer paid in health — taps and spells alike — comes back. */
function settleBloodLedger(){
  if (!B || RUN.wizard !== "warlock") return;
  if (B.enemy.hp > 0) return;
  const owed = Math.round((B.hpSpent || 0) * CONFIG.blood.repayOnKill);
  B.hpSpent = 0;
  if (owed <= 0) return;
  const back = healPlayer(owed);
  if (back > 0) toast("<b>The ledger is settled</b> — " + back + " HP returns.", 2800);
}
function damageEnemy(amount, opts){
  opts = opts || {};
  playSfx(opts.big ? "hit_heavy" : "hit");
  /* Oil of Ruin: everything bites half again as deep while it lasts. */
  if (B.flags.ruinOil > 0) amount = Math.round(amount * 1.5);
  /* Creatures that answer differently depending on WHERE the damage came from.
     The Tally ignores spells entirely; the Hollow halves them; the Watcher and the
     Tide harden or soften on a schedule they announce. */
  if (opts.spell){
    if (B.enemy.ignoreSpellDamage){
      floatText($("#enemySprite"), "counts nothing", "small blocked");
      return;
    }
    if (B.enemy.halveSpellDamage) amount = Math.ceil(amount / 2);
  }
  /* The Long Hunt hardens permanently, so every blow lands for less as it lives. */
  if (B.flags.tough > 0) amount = Math.max(1, amount - B.flags.tough);
  if (B.intent && B.intent.watching) amount = Math.ceil(amount / 2);
  if (B.intent && B.intent.exposed)  amount = amount * 2;
  /* Executioner's Mark and anything else that scales a blow. */
  amount = emit("modDamage", { amount, opts }).amount;
  /* Some creatures cannot be worn down — only a solved sequence touches them. */
  if (B.enemy.onlyPerfectHarms && !opts.perfect){
    floatText($("#enemySprite"), "unharmed", "small blocked");
    return;
  }
  let left = amount;
  if (B.enemy.block > 0 && !opts.ignoreBlock){
    const soaked = Math.min(B.enemy.block, left);
    B.enemy.block -= soaked; left -= soaked;
    if (soaked) floatText($("#enemySprite"), "-" + soaked, "small blocked");
  }
  B.enemy.hp -= left;
  if (left > 0) B.flags.hurtThisTurn = true;      // the Overseer is watching for this
  RUN.stats.dealt += amount;
  if (B.enemy.hp <= 0) playSfx("enemy_dies");
  settleBloodLedger();
  const s = $("#enemySprite");
  s.classList.remove("hit"); void s.offsetWidth; s.classList.add("hit");
  if (left > 0) floatText($("#enemySprite"), "-" + left, opts.big ? "" : "small");
  renderHP();
  if (B.enemy.onDamaged) B.enemy.onDamaged();
  if (B.enemy.hp <= 0 && !B.over) victory();
}

/* ============================================================
   11. COMBAT — the turn cycle
   ============================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function beginTurn(){
  tickCooldowns();
  B.perTurn = {};
  B.flags.combustion = false;
  /* A creature may act before you do — the Censor forbids an element, the Unmaker
     silences a relic. Called before the intent is read, so the intent can describe it. */
  if (B.enemy.onTurnBegin) B.enemy.onTurnBegin.call(B.enemy, B);
  B.intent = B.enemy.intent ? B.enemy.intent.call(B.enemy, B) : atk(B.enemy.damage);
  /* Draught of Foresight: ask the creature a second time to see one turn further.
     Intents that depend on the board may differ when the turn actually comes, so
     this is a forecast rather than a promise — which is what foresight is. */
  B.nextIntent = (B.flags.deepIntent > 0 && B.enemy.intent)
    ? B.enemy.intent.call(B.enemy, B) : null;
  emit("onTurnStart", {});
  B.manaLastTurn = B.manaThisTurn || 0; B.manaThisTurn = 0;
  if (B.flags.reading){
    const r = B.flags.reading;
    B.flags.reading = null;
    if (B.enemy.code[r.pos] === r.rune){
      B.known.revealed[r.pos] = r.rune;
      noteInsight(EL[r.rune].glyph + " goes in slot " + (r.pos+1) + " — the reagent has spoken", "📜");
      renderSlots();
      toast("<b>Reagent Reading</b> — slot " + (r.pos+1) + " holds " + EL[r.rune].glyph + ".", 2600);
    } else {
      noteInsight("The reading is stale — that slot has changed", "📜");
    }
  }
  if (B.flags.slowAcid){
    let eaten = 0;
    ELEMENTS.forEach(e => { if (B.enemy.resist[e.id] > 0){ B.enemy.resist[e.id]--; eaten++; } });
    if (eaten) renderResist();
  }
  B.flags.brewCount = 0;                 // Double Batch counts within a turn
  if (B.flags.carrionDebt > 0) B.flags.carrionDebt--;   // the window closes
  B.flags.noWardTurn = false;            // Leaden Weight lasts one turn
  if (B.flags.permafrost > 0) B.flags.permafrost--;
  if (B.flags.sealed > 0) B.flags.sealed--;
  if (B.flags.rot > 0){
    B.flags.rot--;
    let decayed = 0;
    ELEMENTS.forEach(e => { if (B.enemy.resist[e.id] > 0){ B.enemy.resist[e.id]--; decayed++; } });
    if (decayed){
      renderResist();
      /* Necrosis: the rot bites as it eats. */
      if (has("NECROSIS")) damageEnemy(decayed * 2, { spell:true });
    }
  }
  tickSpellLocks(); tickElementLocks(); tickFrozenSlots();
  if (B.flags.malediction && --B.flags.malediction <= 0) B.flags.malediction = 0;
  tickWallOfFlame(); tickEffigy(); tickMeteor(); strikeWithThrall();
  if (B.flags.whiteout > 0 && has("WHITEWALL")){ gainBlock(4); renderHP(); }
  if (B.flags.whiteout > 0 && --B.flags.whiteout === 0)
    toast("The whiteout clears — it can ward again.", 2000);
  if (B.enemy.firstStrike && B.turn > 1) firstStrike();
  renderIntent(); renderSpells();
}

/* Some creatures strike as you prepare, before you commit the incantation. */
/* ---------- timed effects introduced with the new spells ---------- */
function tickWallOfFlame(){
  if (!B.flags.wallTurns) return;
  /* Conflagration: the longer it stands, the hotter it burns. */
  if (has("CONFLAGRATION")) B.flags.wallOfFlame += 2;
  if (--B.flags.wallTurns <= 0){ B.flags.wallOfFlame = 0; B.flags.wallTurns = 0; }
}
function tickEffigy(){
  if (!B.flags.effigyTurns) return;
  if (--B.flags.effigyTurns <= 0) B.flags.effigy = false;
}
/* Meteor charges on Fractures — far commoner than solves, so it always lands for
   something, with the charge as the reward rather than the requirement. */
function tickMeteor(){
  const m = B.flags.meteor;
  if (!m) return;
  if (--m.turns > 0){
    toast("The meteor falls — " + m.turns + " turn" + (m.turns > 1 ? "s" : "") + " (" +
          m.charge + " charged).", 1900);
    return;
  }
  /* Airburst trades half the charge for arriving a turn sooner. */
  const charge = has("AIRBURST") ? Math.floor(m.charge / 2) : m.charge;
  const dmg = CONFIG.fire.meteorBase + charge * CONFIG.fire.meteorPerExploit
              + 5 * potency("meteor");
  B.flags.meteor = null;
  banner("Meteor", true);
  damageEnemy(dmg, { spell:true, big:true });
  if (has("IMPACT")){
    const levels = totalWards();
    if (levels){
      ELEMENTS.forEach(e => B.enemy.resist[e.id] = 0);
      renderResist();
      toast("<b>Impact</b> — the blast scours away " + levels + " ward levels.", 2600);
    }
  }
  toast("<b>The meteor lands for " + dmg + "</b> (" + m.charge + " Fractures charged).", 3000);
}
/* The thrall mindlessly repeats your last incantation. It does not know the
   sequence has moved — which is the joke, and the cost. */
function strikeWithThrall(){
  const t = B.flags.thrall;
  if (!t) return;
  if (--t.turns < 0){ B.flags.thrall = null; return; }
  /* The sequence can change length mid-fight (Warded Sentry, Accretion). The
     thrall is mindless, not omniscient — a stale incantation of the wrong length
     simply misses rather than throwing. */
  if (t.guess.length !== B.enemy.code.length){ B.flags.thrall = null; return; }
  const res = evaluateGuess(t.guess, B.enemy.code);
  const hits = res.filter(r => r === "exploit").length;
  if (hits > 0){
    let dmg = Math.max(1, Math.round(hits * CONFIG.damage.perExploit * CONFIG.necromancy.thrallShare));
    if (has("SECOND_THRALL")) dmg *= 2;              // a second thrall, saying the same thing
    damageEnemy(dmg, { spell:true });
    floatText($("#enemySprite"), "💀" + dmg, "small");
    if (has("BONE_HUNGER")){
      const fed = healPlayer(Math.max(1, Math.round(dmg / 2)));
      if (fed) floatText($("#playerBar"), "+" + fed, "small heal");
    }
  }
}
function tickFrozenSlots(){
  const f = B.flags.frozen;
  if (!f) return;
  Object.keys(f).forEach(i => { if (--f[i].turns <= 0) delete f[i]; });
  renderSlots();
}
/* A frozen position holds its rune through any rotation, swap or re-forming. */
function enforceFrozen(){
  const f = B.flags.frozen;
  if (!f || !B.enemy) return;
  Object.keys(f).forEach(k => {
    const i = +k, want = f[k].rune;
    if (i >= B.enemy.code.length) return;
    if (B.enemy.code[i] === want) return;
    const j = B.enemy.code.findIndex((x, n) => x === want && !f[n]);
    if (j > -1){ const t = B.enemy.code[i]; B.enemy.code[i] = want; B.enemy.code[j] = t; }
    else B.enemy.code[i] = want;
  });
}

function firstStrike(){
  let dmg = B.enemy.firstStrike;
  if (B.block > 0){
    const soaked = Math.min(B.block, dmg);
    B.block -= soaked; dmg -= soaked;
  }
  if (dmg > 0){
    RUN.hp -= dmg; RUN.stats.taken += dmg;
    noteDamageTaken(dmg);          // Second Wind reads the health AFTER the blow
    floatText($("#playerBar"), "-" + dmg, "small pain");
    toast("<b>It strikes first</b> for " + B.enemy.firstStrike + ".", 1800);
  }
  renderHP();
  if (RUN.hp <= 0) defeat();
}

async function resolveCast(){
  if (B.busy || B.over) return;
  if (!LESSON.allows("cast")){ toast("Not yet — follow the lesson.", 1600); return; }
  if (B.lastGuess && B.draft.join() === B.lastGuess){
    toast("The creature has already answered that. <b>Say something new.</b>", 2400);
    return;
  }
  /* The sequence can change length mid-fight (Warded Sentry, Accretion). The UI
     rebuilds the draft when that happens, but guard anyway — evaluateGuess throws
     on a mismatch, which would end the run. */
  if (B.draft.length !== B.enemy.codeLength || !draftFull()){
    B.draft = emptyDraft(B.enemy.codeLength); B.target = null; B.cursor = -1;
    renderSlots();
    return;
  }
  B.busy = true; renderSlots(); renderSpells();

  const guess = B.draft.slice();
  const code  = B.enemy.code;
  const results = evaluateGuess(guess, code);
  const echoes  = CONFIG.hints.echoMarkers ? detectEchoes(guess, code, results) : results.map(()=>false);
  const perfect = results.every(r => r === "exploit");
  B.wardsRecent = {};        // wards raised by THIS incantation, undoable until the next
  const distinct = new Set(guess).size;

  RUN.stats.casts++;
  B.lastGuess = B.draft.join(); B.guesses++;
  guess.forEach(id => { RUN.stats.useBy[id]++; B.useCount[id]++; });
  RUN.stats.echoes += echoes.filter(Boolean).length;

  /* the bolt carries the outcome with it, so the screen reacts at the instant
     of arrival rather than after the tally has been printed */
  await flyRunes(guess, castOutcome(results),
                 results.filter(r => r === "exploit").length);

  /* --- tally --- */
  let damage = 0, spiteDamage = 0;
  const manaGain = Object.fromEntries(ELEMENTS.map(e=>[e.id,0]));

  results.forEach((r,i) => {
    const el = guess[i];
    /* The ice bites whatever strikes it. */
    if (B.flags.frozen && B.flags.frozen[i]){
      const table = has("KILLING_FROST") ? CONFIG.frost.prisonHard : CONFIG.frost.prison;
      const pay = table[r] || 0;
      if (pay){
        damageEnemy(pay, { spell:true });
        /* Ice shed from the prison behaves like Frost Armour: it thins rather than
           vanishing the moment the creature acts, or the shield half is worthless. */
        gainBlock(pay); B.flags.frostArmour = true; renderHP();
        floatText($("#enemySprite"), "🧊" + pay, "small");
      }
    }
    if (r === "exploit"){
      RUN.stats.exploits++;
      if (B.flags.malediction) addCurse(CONFIG.hex.maledictionCurse);
      if (B.flags.meteor) B.flags.meteor.charge++;
      if (B.flags.evilEye2 === i){
        B.flags.evilEye2 = null;
        addCurse(CONFIG.hex.evilEyeCurse);
      }
      if (B.flags.evilEye === i){
        B.flags.evilEye = null;
        const early = detonateCurse({ perfect:false });
        if (early) toast("<b>The eye opens early</b> — the mark bursts for " + early + ".", 2600);
      }
      /* The Origin answers only the first Fracture of an incantation; the rest are
         spoken into nothing. Counted here so every modifier still runs normally. */
      const ignored = B.enemy.onlyFirstExploit && B.perTurn.originCounted;
      B.perTurn.originCounted = true;
      const ctx = { element:el, damage:ignored ? 0 : CONFIG.damage.perExploit, distinct, perfect };
      emit("modExploit", ctx);

      if (B.flags.might) ctx.damage += 3;                    // Philter of Might
      ctx.damage -= (B.enemy.resist[el] || 0) * CONFIG.resist.damageReductionPerLevel;
      damage += Math.max(CONFIG.damage.minExploit, ctx.damage);
      if (ctx.gold){
        const g = B.flags.doubleAurels ? ctx.gold * 2 : ctx.gold;   // Philosopher's Stone
        RUN.gold += g; RUN.stats.goldEarned += g;
      }
      /* A Fracture feeds YOUR craft, not the rune that happened to land it: one to a
         discipline pool, and one to a foreign pool chosen at random from the emptiest,
         which keeps substitution alive without saying anything about the guess. */
      payCraft(manaGain, 1);
      payForeign(manaGain, 1);
      if (B.chaosElement) manaGain[B.chaosElement] += 1;             // Chaos Wand
      ELEMENTS.forEach(e => { manaGain[e.id] += (RUN.shop.attune[e.id] || 0); });
    } else if (r === "resonate"){
      RUN.stats.resonates++;
      /* Tuning Fork counts these — nothing else in the game rewards a Resonate. */
      emit("onResonate", { element:el });
      payCraft(manaGain, CONFIG.mana.perResonate * (B.flags.bloom ? 2 : 1));
    } else {
      RUN.stats.resists++;
      /* Backdraft: the wall answers a wrong rune as well as a landed blow. */
      if (B.flags.wallOfFlame && has("BACKDRAFT"))
        damageEnemy(B.flags.wallOfFlame, { spell:true });
      if (B.flags.evilEye === i){
        B.flags.evilEye = null;
        addCurse(CONFIG.hex.evilEyeCurse);
        toast("<b>The eye is answered wrongly</b> — " + CONFIG.hex.evilEyeCurse + " Curse.", 2400);
      }
      const rctx = { element:el, preventWard:false };
      emit("onResist", rctx);                                // Hexweaver curses instead of warding
      if (B.flags.doomMark) addCurse(3);                     // Doom Mark
      if (B.flags.cruelResist){                              // Cruel Draught
        B.flags.cruelResist = false;
        spiteDamage += 12;
      } else if (B.flags.spite){                             // Vial of Spite
        B.flags.spite = false;
        spiteDamage += 8;
      } else if (!B.flags.freeze && !rctx.preventWard){
        const mult = B.enemy.resistMultiplier || 1;
        /* Alkahest can make an element permanently unwardable for the fight. */
        if (!(B.flags.noWard && B.flags.noWard[el]) && !(B.flags.whiteout > 0) &&
            !B.flags.noWardTurn && !(B.flags.noWards > 0)){        // Sealing Wax
          const gain = CONFIG.resist.perResist * mult * ascWard();
          /* Null Stone refuses the ward before it rises; Solvent Flask eats it after,
             so the two do not cancel one another out. */
          const wctx = emit("onWardRaised", { element:el, amount:gain, prevented:false });
          if (!wctx.prevented){
            B.enemy.resist[el] = (B.enemy.resist[el] || 0) + gain;
            emit("onWardRose", { element:el, amount:gain });
          }
          /* Permafrost holds every ward down to a single level. */
          if (B.flags.permafrost > 0)
            B.enemy.resist[el] = Math.min(B.enemy.resist[el], CONFIG.frostNew.permafrostCap);
          B.wardsRecent[el] = (B.wardsRecent[el] || 0) + gain;   // Sands of Time undoes these
        }
      }
    }
  });
  B.flags.bloom = false;
  B.flags.might = false;
  B.flags.doomMark = false;
  if (B.flags.freeze){ B.flags.freeze = false; toast("The freeze holds — no wards formed.", 1800); }

  /* Prophecy: you named the number before you cast. Being right is the reward. */
  if (B.flags.prophecy != null){
    const called = B.flags.prophecy;
    B.flags.prophecy = null;
    const got = results.filter(r => r === "exploit").length;
    const full = CONFIG.divination.prophecyBonus + called * CONFIG.divination.prophecyPerExploit;
    if (got === called){
      /* Double Down: calling the largest number there could be pays twice. */
      const maxed = has("DOUBLE_DOWN") && called === B.enemy.codeLength;
      const bonus = maxed ? full * 2 : full;
      damageEnemy(bonus, { spell:true, big:true });
      ELEMENTS.forEach(e => manaGain[e.id] += CONFIG.divination.prophecyMana);
      banner(maxed ? "Foretold in full" : "Foretold", true);
      toast("<b>You called " + called + ", and it was " + called + "</b> — " + bonus + " damage." +
            (maxed ? " <b>Every rune, called.</b>" : ""), 3000);
    } else if (has("HEDGE") && Math.abs(got - called) === 1){
      /* Hedge: a near miss is still worth something. */
      const bonus = Math.round(full / 2);
      damageEnemy(bonus, { spell:true });
      toast("You called " + called + "; it was " + got + ". <b>Close enough</b> — " + bonus + ".", 2800);
    } else {
      toast("You called " + called + "; it was " + got + ". The prophecy fails.", 2400);
    }
  }
  if (perfect){
    const wiz = WIZ[RUN.wizard];
    const pm = wiz.perfectMultiplier || CONFIG.damage.perfectMultiplier;
    let perfectDamage = Math.round(damage * pm);
    /* A flat multiplier cannot guarantee "at least N solves" across a 28 HP slime
       and a 120 HP boss. Scaling the payoff to the creature's size does. */
    if (wiz.perfectFraction)
      perfectDamage = Math.max(perfectDamage, Math.round(B.enemy.maxHP * wiz.perfectFraction));
    /* A creature with perfectShare takes an exact fraction of its maximum per solve,
       so the number of solves needed is the same for every discipline regardless of
       how hard that discipline hits. */
    if (B.enemy.perfectShare) perfectDamage = Math.ceil(B.enemy.maxHP * B.enemy.perfectShare);
    const pctx = { damage: perfectDamage };
    emit("modPerfectDamage", pctx);
    damage = pctx.damage;
    B.lastPerfectDamage = damage;      // Mirror Shard needs to know how hard it hit
  }
  /* Relics that reshape a whole incantation rather than a single Fracture — Sequence
     Breaker, Opening Gambit, Cruel Geometry, Two Wells. Applied AFTER the Perfect
     multiplier, so a stated "+6" is 6 rather than 9 on a solved sequence. */
  {
    const ictx = { damage, results, guess, perfect };
    emit("modIncantation", ictx);
    damage = ictx.damage;
    /* THESE THREE ARE THE SHATTER'S, AND ONLY THE SHATTER'S. They sat outside this
       guard, so EVERY incantation — including one with nothing right at all — paid the
       Shatter mana bonus and was counted as a Shatter. The counter fed the summary's
       "turns to first Shatter", the campaign telemetry, and the lifetime tally behind
       the achievements, all of which were reading the number of CASTS. */
    if (perfect){
      B.lastPerfectDamage = damage;
      payCraft(manaGain, CONFIG.mana.perfectBonus * guess.length);
      RUN.stats.perfects++;
      if (!B.once.perfectTurn){ B.once.perfectTurn = B.turn; RUN.stats.firstPerfect.push(B.turn); }
      B.reformAfterCast = true;
    }
  }

  /* --- record, with the Wraith's veil applied to display only --- */
  const markers = results.map((r,i) => ({ kind:r, echo:echoes[i] }));
  /* The markers themselves speak: a Perfect sings, a Resist thuds. */
  if (results.every(r => r === "exploit")) playSfx("perfect");
  else if (results.some(r => r === "exploit")) playSfx("exploit");
  else playSfx("resist");
  const shown = shuffle(markers.slice());
  if (B.enemy.maskFeedback && B.enemy.maskFeedback()){
    shown[Math.floor(Math.random()*shown.length)] = { kind:"unknown", echo:false };
  }
  if (B.enemy.delayFeedback){
    /* The Archmage answers last turn's question. The row appears immediately so the
       player can see WHAT they cast — the markers arrive on the following cast. */
    B.history.push({ turn:B.turn, guess, results, shuffled:null, pending:true });
    if (B.pendingMarkers){
      const owner = [...B.history].reverse().find(h => h.pending && h.shuffled === null && h !== B.history[B.history.length-1]);
      if (owner){ owner.shuffled = B.pendingMarkers; owner.pending = false; }
    }
    B.pendingMarkers = shown;
  } else {
    B.history.push({ turn:B.turn, guess, results, shuffled:shown, dealt:damage });
  }
  renderHistory(); renderResist();
  await sleep(CONFIG.timing.reveal);

  if (LESSON.on) LESSON.saw(perfect ? "solved" : "cast");
  if (perfect){
    banner("SHATTER");
    $("#app").classList.add("shake");
    setTimeout(() => $("#app").classList.remove("shake"), 450);
    burstAt($("#enemySprite"), 24);
    emit("onPerfect", {});
    if (B.enemy.onPerfect) B.enemy.onPerfect();
    detonateCurse();
  }

  if (spiteDamage > 0){
    damageEnemy(spiteDamage, { spell:true });
    toast("Spite bites for " + spiteDamage + " — no ward formed.", 2000);
  }
  /* Combustion pays out on the incantation itself, so a bad guess still burns. */
  if (B.flags.fanFlames){
    const fires = B.draft.filter(x => x === "fire").length;
    if (fires){
      const bonus = fires * B.flags.fanFlames;
      damage += bonus;
      toast("<b>Fan the Flames</b> — +" + bonus + " from " + fires + " Fire runes.", 2200);
    }
    B.flags.fanFlames = 0;
  }
  if (B.flags.combustion){
    damage += B.flags.combustionBonus || 10;
    B.flags.combustion = false;
    toast("<b>Combustion</b> — +" + (B.flags.combustionBonus || 10) + " on this incantation.", 2200);
  }
  if (damage > 0) damageEnemy(damage, { ignoreBlock:perfect, big:perfect, perfect });
  else floatText($("#enemySprite"), results.includes("resonate") ? "Resonance" : "Warded", "small pain");

  ELEMENTS.forEach(e => { if (manaGain[e.id]) addMana(e.id, manaGain[e.id]); });

  const counts = { exploit:0, resonate:0, resist:0 };
  results.forEach(r => counts[r]++);
  const echoCount = echoes.filter(Boolean).length;
  toast(feedbackLine(counts, perfect, echoCount), echoCount ? 3000 : 2000);

  if (B.over){ B.busy = false; return; }
  if (B.enemy.onCast) B.enemy.onCast(guess, results);
  if (B.over){ B.busy = false; return; }
  if (B.enemy.afterCast) B.enemy.afterCast();
  if (B.over){ B.busy = false; return; }
  /* Last, so the player sees the markers and the damage against the sequence they
     actually broke — and only then watches it knit itself back together. */
  reformOnShatter();

  await sleep(CONFIG.timing.beforeEnemy);
  await enemyTurn();
  if (B.over){ B.busy = false; return; }

  B.draft = emptyDraft(B.enemy.codeLength); B.target = null; B.cursor = -1;
  B.known.slots = {}; B.turn++; B.busy = false;
  beginTurn(); renderSlots(); renderSpells();
  Tutorial.after(B.turn);
}

function feedbackLine(c, perfect, echoCount){
  let line;
  if (perfect) line = "Every rune struck true.";
  else {
    const parts = [];
    if (c.exploit)  parts.push(c.exploit + " Fracture");
    if (c.resonate) parts.push(c.resonate + " Resonate");
    if (c.resist)   parts.push(c.resist + " Resist");
    line = parts.join(" · ");
  }
  if (echoCount) line += '<br><span style="color:var(--gold-soft)">' +
    (echoCount === 1 ? "One rune echoes" : echoCount + " runes echo") +
    " — the sequence wants more of it.</span>";
  return line;
}

async function enemyTurn(){
  /* The creature is a teaching aid, not an opponent: it never strikes while the lesson
     runs, so a player reading an explanation is never punished for reading it. */
  if (LESSON.on){ B.block = 0; renderHP(); return; }
  if (B.flags.skipEnemy){
    B.flags.skipEnemy = false;
    toast("The creature cannot move.", 1600);
    await sleep(500);
    B.block = 0; renderHP();
    return;
  }
  const it = B.intent;
  const s = $("#enemySprite");
  s.classList.remove("lunge"); void s.offsetWidth; s.classList.add("lunge");
  await sleep(240);

  if (it.act === "guard"){
    B.enemy.block += it.amount; renderHP();
    floatText($("#enemySprite"), "+" + it.amount, "small blocked");
  } else if (it.act === "roar"){
    B.enemy.roar();
  } else {
    let dmg = it.amount != null ? it.amount : B.enemy.damage;
    /* Warding Bell softens the opening blow, before anything else touches it. */
    dmg = emit("modIncoming", { amount:dmg }).amount;
    if (B.flags.delayedDamage){                       // Cone of Cold stacks the held blow on
      dmg += B.flags.delayedDamage;
      toast("The held blow lands with this one.", 1800);
      B.flags.delayedDamage = 0;
    }
    /* The Snare tightens on a turn you spent idle — resolved here, because the
       intent is drawn before you have had the chance to act. */
    /* The Quarry Master doubles the blow when you spoke the rune it marked. */
    if (it.quarry && B.flags.quarryDouble){
      B.flags.quarryDouble = false;
      dmg *= 2;
      toast("<b>The mark answers</b> — the blow lands twice as hard.", 2400);
    }
    if (it.snare && !B.perTurn.castAnySpell){
      dmg += it.snare;
      toast("<b>The Snare</b> tightens — you did nothing with the turn.", 2200);
    }
    if (B.flags.leaden){ dmg = Math.ceil(dmg / 2); B.flags.leaden = false; }
    if (B.block > 0){
      const soaked = Math.min(B.block, dmg);
      B.block -= soaked; dmg -= soaked;
      /* Bone Ward is life turned to armour; when the armour shatters, what is
         left of it comes back as Shadow rather than as nothing. */
      /* Meltwater: the ice that shatters runs back into the pool. */
      if (B.block === 0 && B.flags.frostArmour && has("MELTWATER")){
        const back = Math.max(1, Math.floor(soaked / 2));
        addMana("ice", back);
        toast("<b>Meltwater</b> — " + back + " Ice runs back from the broken rime.", 2200);
      }
      if (soaked) floatText($("#playerBar"), "-" + soaked, "small blocked");
      if (B.flags.blockReflects && B.block <= 0 && dmg > 0)
        damageEnemy(has("SHATTERVEIN") ? dmg * 2 : dmg, { spell:true });
    }
    /* Draught of Denial stops one blow outright; Stoneblood halves what lands;
       Mirror Ward returns it; Thornwater answers every strike. */
    if (B.flags.denyNext){
      B.flags.denyNext = false;
      toast("<b>The blow does not land.</b>", 1800);
      dmg = 0;
    }
    if (dmg > 0 && B.flags.halveDamage > 0) dmg = Math.ceil(dmg / 2);
    if (dmg > 0 && B.flags.mirrorBlow){
      B.flags.mirrorBlow = false;
      damageEnemy(dmg, { spell:true, big:true });
      toast("<b>Mirror Ward</b> — the blow returns in full.", 2200);
    }
    if (B.flags.thorns > 0) damageEnemy(4, { spell:true });
    const soften = WIZ[RUN.wizard].damageTaken;
    if (soften && dmg > 0) dmg = Math.max(1, Math.round(dmg * soften));
    if (dmg > 0){
      RUN.hp -= dmg; RUN.stats.taken += dmg;
    noteDamageTaken(dmg);          // Second Wind reads the health AFTER the blow
      const bar = $("#playerBar");
      bar.classList.remove("hurt"); void bar.offsetWidth; bar.classList.add("hurt");
      floatText(bar, "-" + dmg, "small pain");
    }
    renderHP();
    /* Wall of Flame answers a blow that actually landed; Effigy shares your pain. */
    if (dmg > 0 && !B.over){
      if (B.flags.wallOfFlame){
        damageEnemy(B.flags.wallOfFlame, { spell:true });
        floatText($("#enemySprite"), "🔥" + B.flags.wallOfFlame, "small");
      }
      if (B.flags.effigy){
        const share = Math.max(1, Math.round(dmg * CONFIG.hex.effigyShare));
        damageEnemy(share, { spell:true });
        floatText($("#enemySprite"), "🪆" + share, "small");
      }
    }
    if (RUN.hp <= 0){ await defeat(); return; }
  }
  if (B.flags.ashfall > 0 && !B.over){
    damageEnemy(B.flags.ashfall, { spell:true });
    floatText($("#enemySprite"), "🌋" + B.flags.ashfall, "small");
  }
  if (B.flags.coneBite > 0 && !B.over){
    const bite = B.flags.coneBite;
    B.flags.coneBite = 0;
    damageEnemy(bite, { spell:true, big:true });
    toast("<b>The frost bites</b> — " + bite + " as it finally moves.", 2600);
  }
  if (B.flags.slowBurn > 0 && !B.over){
    const late = B.flags.slowBurn;
    B.flags.slowBurn = 0;
    damageEnemy(late, { spell:true, big:true });
    toast("<b>The smouldering catches</b> — " + late + ".", 2600);
  }
  if (B.flags.witheringGaze && B.curse > 0 && !B.over){
    const all = Math.round(B.curse * 1.25 * (1 + 0.25 * potency("withering_gaze")));
    B.flags.witheringGaze = false;
    B.curse = 0; renderResist();     // the curse chip lives in the resist strip
    damageEnemy(all, { spell:true, big:true });
    toast("<b>The gaze lands</b> — " + all + " at once.", 2600);
  }
  if (B.curse > 0 && !B.over){
    /* Scales with the stockpile, deliberately slowly — the trickle should reward
       stacking without making the burst redundant. Under 5 stacks it does nothing. */
    const tick = Math.floor(B.curse * CONFIG.curse.tickPerStack);
    if (tick > 0) damageEnemy(tick, { spell:true });
  }
  if (B.flags.burn && !B.over){
    /* Ashen Blade and anything else that thickens damage over time. */
    const tick = emit("modDot", { amount:B.flags.burn }).amount;
    damageEnemy(tick, { spell:true });
    toast("Burn sears for " + tick + ".", 1400);
    /* Ashen Draught burns for a stated number of turns rather than forever. */
    if (B.flags.burnTurns > 0 && --B.flags.burnTurns === 0) B.flags.burn = 0;
  }
  /* Rot Tincture eats a level from every ward, every turn, for the rest of the fight. */
  if (B.flags.wardRot && !B.over){
    let rotted = 0;
    ELEMENTS.forEach(e => { if (B.enemy.resist[e.id] > 0){ B.enemy.resist[e.id]--; rotted++; } });
    if (rotted){ renderResist(); toast("Rot eats " + rotted + " ward" + (rotted===1?"":"s") + ".", 1400); }
  }
  /* --- what the creature does with the end of its own turn --- */
  if (!B.over && B.enemy.toughensPerTurn){       // The Long Hunt
    B.flags.tough = (B.flags.tough || 0) + B.enemy.toughensPerTurn;
  }
  if (!B.over && B.enemy.blockPerTurn){            // Root Warden: a wall that keeps rising
    B.enemy.block += B.enemy.blockPerTurn;
    renderHP();
  }
  if (!B.over && B.enemy.healIfIdle && !B.flags.hurtThisTurn){   // Overseer
    B.enemy.hp = Math.min(B.enemy.maxHP, B.enemy.hp + B.enemy.healIfIdle);
    renderHP();
    toast("<b>The Overseer</b> mends " + B.enemy.healIfIdle + " — you left it untouched.", 2400);
  }
  if (!B.over && B.enemy.stealsEach){              // Loom Rat
    let took = 0;
    ELEMENTS.forEach(e => { if (B.mana[e.id] > 0){ B.mana[e.id]--; took++; } });
    if (took){ B.enemy.block += took; renderMana(); renderHP();
      toast("<b>The Loom Rat</b> takes " + took + " mana and hardens.", 2200); }
  }
  if (!B.over && B.enemy.reflectsHalf){            // Recursion
    const last = lastIncantation();
    const dealt = last ? (last.dealt || 0) : 0;
    const back = Math.floor(dealt / 2);
    if (back > 0){
      hurtPlayerReflected(back);
      toast("<b>The Recursion</b> returns " + back + " of your own work.", 2400);
    }
  }
  if (!B.over && B.enemy.erasesHistory){           // Palimpsest
    const rows = B.history.filter(h => !h.note);
    if (rows.length > 1){
      const oldest = B.history.indexOf(rows[0]);
      B.history.splice(oldest, 1);
      renderHistory();
      toast("<b>The Palimpsest</b> scrapes the oldest line away.", 2000);
    }
  }
  /* Relics silenced by the Unmaker come back on their own. */
  if (B.flags.mutedRelics){
    Object.keys(B.flags.mutedRelics).forEach(id => {
      if (--B.flags.mutedRelics[id] <= 0){
        delete B.flags.mutedRelics[id];
        toast(RELICS[id].name + " finds its voice again.", 2000);
      }
    });
  }
  B.flags.hurtThisTurn = false;
  /* Everything measured in turns counts down here, in one place. */
  ["ruinOil","halveDamage","thorns","noWards","sealSequence","deepIntent"].forEach(f => {
    if (B.flags[f] > 0) B.flags[f]--;
  });
  emit("onTurnEnd", {});                                  // Storm Glass answers here
  /* Armour no longer evaporates the moment the creature acts — it thins. Frost was
     recasting Frost Armor 2.4 times a fight simply to stand still. */
  /* Layered Robes: a quarter of the wall survives the turn. Frost Armor's own decay
     still applies on top, so the two do not simply stack into a fortress. */
  const carry = relicMax("blockCarry");
  if (carry > 0 && !B.flags.blockPersists){
    B.block = Math.max(Math.floor(B.block * carry), 0);
  } else if (!B.flags.blockPersists){
    B.block = B.flags.frostArmour
      ? Math.floor(B.block * CONFIG.frost.armourDecay)
      : 0;
    if (B.block <= 0) B.flags.frostArmour = false;
  }
  renderHP();
  await sleep(CONFIG.timing.enemyAct);
}

async function victory(){
  if (B.over) return;
  B.over = true; B.busy = true;
  /* Five relics wait for a creature to fall and nothing was telling them. */
  emit("onBattleEnd", { won:true });
  if (RUN.sandbox){
    $("#enemySprite").classList.add("dying");
    banner("Felled");
    await sleep(1100);
    return showSandbox("<b>" + B.enemy.name + "</b> defeated in " + B.turn + " turns.");
  }
  RUN.stats.encounters++;
  const wasBoss = RUN.currentNodeType === "boss";
  const band = wasBoss ? CONFIG.economy.goldBoss
             : RUN.currentNodeType === "elite" ? CONFIG.economy.goldElite
             : CONFIG.economy.goldEnemy;
  const gold = band[0] + Math.floor(Math.random() * (band[1] - band[0] + 1));
  RUN.gold += gold; RUN.stats.goldEarned += gold;
  if (wasBoss) RUN.stats.bossTurns.push(B.turn);
  $("#enemySprite").classList.add("dying");
  banner(wasBoss ? "The Boss Falls" : "Shattered");
  await sleep(1300);
  /* The lesson has things left to say after the creature falls. Hand the ending to it
     and let it choose when the run really begins — otherwise its last words flash past
     and turn up again, orphaned, at the start of the next fight. */
  if (LESSON.on){ LESSON.victory(gold); return; }
  if (wasBoss) return bossDefeated(gold);
  showNodeReward(gold);
}
async function defeat(){
  /* Stubborn Heart gets the last word before the run ends. */
  if (RUN.hp <= 0 && emit("onLethal", { prevented:false }).prevented){
    RUN.hp = 1; renderHP(); return;
  }
  if (B.over) return;
  B.over = true; B.busy = true;
  await sleep(800);
  if (RUN.sandbox) return showSandbox("You fell to <b>" + B.enemy.name + "</b> on turn " + B.turn + ".");
  showSummary(false);
}

/* ============================================================
   12. SPELLS — casting, cost, targeting
   ============================================================ */
/* A spell is written in one element, but any pool can pay for it — foreign mana
   just costs double. Without this, a run of bad guesses locks the player out of
   their whole kit, and a dead deduction turn becomes a dead turn outright. */
function spellBase(id){
  const c = SPELLS[id].cost, el = Object.keys(c)[0];
  return { element:el, amount:c[el] };
}
/* Every discipline draws on two elements, not one. A spell names its own element
   and may also accept a second at the SAME rate — the remaining pools still pay
   the doubled substitute price, so they stay sinks rather than alternatives.

   Without this a mono-element class faced a 4-rune sequence with a 48% chance its
   element appeared at all, and spent the rest of the fight paying double. */
function alsoPays(id){
  const sp = SPELLS[id];
  return sp && sp.alt ? sp.alt : null;
}
function paymentOptions(id){
  const base = spellBase(id);
  /* B is null outside a fight — a spell can be read on the loadout screen, at a
     campfire or in the tree, and none of those are battles. */
  let discount = (hasRelic("echo_rune") && B && B.spellsUsed === 0) ? 1 : 0;
  discount += efficiencyOf(id);                                     // talent: Efficiency
  if (B && B.flags && B.flags.thrift > 0) discount += 2;            // vial: Vial of Thrift
  /* The Toll Gate charges for the first spell of each turn. A negative discount, so
     every reader of the price — the button, the simulator — sees it without change. */
  if (B && B.enemy && B.enemy.spellTax && !B.perTurn.paidToll) discount -= B.enemy.spellTax;
  const mult = subMultiplier(RUN.shop.prismatic || 0);              // elite prize: Prismatic
  /* A SPELL PRICED IN AETHER CAN ALSO BE PAID IN MANA, expensively.
     Five of the Alchemist's ten spells cost Aurels and ALL of its damage is among
     them, so the purse was its mana bar — and the shop was what went without. A costly
     mana route removes the bottleneck without removing the incentive: paying in Aurels
     is always cheaper, so a full purse is still the reason to play the class, but an
     empty one no longer means an empty turn. */
  if (base.element === "gold"){
    const cost = Math.max(CONFIG.talents.efficiencyFloor * CONFIG.economy.goldPerMana,
                          base.amount - discount * CONFIG.economy.goldPerMana);
    const opts = [{ element:"gold", cost, native:true, gold:true, affordable:RUN.gold >= cost }];
    const inMana = Math.max(1, Math.ceil(cost / CONFIG.economy.goldPerMana * CONFIG.economy.leadRate)
                               - discount);
    ELEMENTS.forEach(e => {
      opts.push({ element:e.id, cost:inMana, native:false, lead:true,
                  affordable:B && B.mana[e.id] >= inMana });
    });
    return opts;
  }
  /* Necromancy at the edge: its own element drops to a single mana. Nothing else
     does — a foreign pool still pays the ordinary doubled price, so the mercy is
     Shadow's alone. */
  const desperate = base.element === "shadow" && RUN.wizard === "warlock" &&
                    RUN.hp <= RUN.maxHP * CONFIG.necromancy.desperateBelow;
  const alt = alsoPays(id);
  const opts = ELEMENTS.map(e => {
    /* The second element is native too: same price, same floor, same standing. */
    const native = e.id === base.element || e.id === alt;
    const raw = native ? base.amount : Math.ceil(base.amount * mult);
    /* The floor applies to the spell's own element; a foreign pool still pays the
       multiplier on top, so cheapening a spell never makes it free. */
    const floor = native ? CONFIG.talents.efficiencyFloor
                         : Math.ceil(CONFIG.talents.efficiencyFloor * mult);
    let cost = Math.max(floor, raw - discount);
    if (desperate && native) cost = CONFIG.necromancy.desperateCost;
    return { element:e.id, cost, native, affordable:!!B && B.mana[e.id] >= cost };
  });
  /* The Alchemist can settle a spell in Aurels — the two currencies work together
     rather than replacing one another. Priced high enough that Aurels stays
     precious for the Sanctum. */
  if (canPayWithGold() && !SPELLS[id].noGold){
    const cost = Math.max(1, base.amount - discount) * CONFIG.economy.goldPerMana;
    opts.push({ element:"gold", cost, native:false, gold:true, affordable:RUN.gold >= cost });
  }
  return opts;
}
const canPayWithGold = () => RUN && RUN.wizard === "alchemist";
function canAfford(id){ return paymentOptions(id).some(o => o.affordable); }
/* Potency now comes only from the talent tree: a Potency node or an Amplify node
   each grant one level, capped. */
const potency = id => {
  if (!RUN) return 0;
  const t = (RUN.talents && RUN.talents.potency[id]) || 0;
  return Math.min(CONFIG.talents.potencyMax, t + (RUN.shop.potency[id] || 0));
};
const efficiencyOf = id =>
  Math.min(CONFIG.talents.efficiencyMax, (RUN && RUN.talents && RUN.talents.efficiency[id]) || 0);
function spellLocked(id){ return !!(B.flags.lockedSpells && B.flags.lockedSpells[id] > 0); }
/* A spell rests for a turn after it is cast. */
function spellResting(id){ return !!(B && B.cooling && B.cooling[id] > 0); }
function restSpell(id){
  if (!B) return;
  B.cooling = B.cooling || {};
  /* SPELLS ARE FREE OF THE TURN — that is what makes them worth having, and it is
     also what lets one good spell be cast three times in a single turn while the rest
     of the satchel gathers dust. Resting until the next turn stops the repetition
     without touching the freedom. */
  B.cooling[id] = CONFIG.spells.cooldownTurns;
}
function tickCooldowns(){
  if (!B || !B.cooling) return;
  Object.keys(B.cooling).forEach(id => {
    if (B.cooling[id] > 0) B.cooling[id]--;
  });
}
function lockSpell(id, turns){
  B.flags.lockedSpells = B.flags.lockedSpells || {};
  B.flags.lockedSpells[id] = turns;
  renderSpells();
}
function tickSpellLocks(){
  const L = B.flags.lockedSpells; if (!L) return;
  Object.keys(L).forEach(id => { if (--L[id] <= 0) delete L[id]; });
}
/* The Excision removes a spell for the fight; it is still owned, simply unusable. */
function spellExcised(id){ return !!(B && B.flags && B.flags.excised === id); }
function spellReady(id){
  if (spellExcised(id)) return false;
  const sp = SPELLS[id];
  if (B.busy || B.over) return false;
  if (spellLocked(id)) return false;
  if (!canAfford(id)) return false;
  if (sp.ready && !sp.ready()) return false;
  return true;
}
function useSpell(id){
  if (!LESSON.allows("spell", id)){
    toast("Not yet — follow the lesson.", 1600);
    return;
  }
  if (spellResting(id)){
    toast("<b>" + SPELLS[id].name + "</b> is still gathering itself.", 1800);
    return;
  }
  const sp = SPELLS[id];
  if (B.busy || B.over) return;
  if (spellLocked(id)){
    toast("<b>" + sp.name + "</b> is sealed for " + B.flags.lockedSpells[id] + " more turn(s).", 1900);
    return;
  }
  if (sp.ready && !sp.ready()){ toast(sp.hint || (sp.name + " cannot be cast right now."), 1800); return; }
  const options = paymentOptions(id).filter(o => o.affordable);
  if (!options.length){ toast("No pool holds enough for " + sp.name + ".", 1800); return; }
  if (options.length === 1) return payAndCast(id, options[0]);
  openManaPicker(id, options);
}
/* Twin Wells watches for a pool running dry. Checked after any spend rather than
   inside each one, so nothing has to remember to announce it. */
/* Every ward-stripping effect goes through here, so Sapper's Kit only has to be
   honoured once rather than in each spell that strips. */
function stripWard(el, levels){
  const want = levels + relicSum("stripBonus");
  const had = B.enemy.resist[el] || 0;
  const took = Math.min(had, want);
  B.enemy.resist[el] = had - took;
  return took;
}
/* WHERE MANA GOES NOW THAT IT NO LONGER GOES WHERE IT CAME FROM.
   Both of these pick a pool WITHOUT looking at what was cast, which is the whole point:
   there must be nothing in the pools for a player to read backwards. */
function payCraft(into, amount){
  /* The emptiest of your discipline's own pools, ties broken at random so two equal
     pools do not always fill in the same order. */
  const mine = nativeElementsOf2(RUN.wizard);
  if (!mine.length) return;
  const low = Math.min(...mine.map(el => (B.mana[el] || 0) + (into[el] || 0)));
  const level = mine.filter(el => ((B.mana[el] || 0) + (into[el] || 0)) === low);
  into[rndOf(level)] += amount;
}
function payForeign(into, amount){
  /* A trickle into the pools your craft does not use, so foreign substitution is a
     real option rather than a rule nobody can afford. Emptiest first, random among
     equals — never the rune that was cast. */
  const mine = nativeElementsOf2(RUN.wizard);
  const others = ELEMENTS.map(e => e.id).filter(id => !mine.includes(id));
  if (!others.length) return;
  const low = Math.min(...others.map(el => (B.mana[el] || 0) + (into[el] || 0)));
  const level = others.filter(el => ((B.mana[el] || 0) + (into[el] || 0)) === low);
  into[rndOf(level)] += amount;
}
function notePoolsAfterSpend(before){
  ELEMENTS.forEach(e => {
    if ((before[e.id] || 0) > 0 && (B.mana[e.id] || 0) === 0)
      emit("onPoolEmpty", { element:e.id });
  });
}
function payAndCast(id, option){
  const sp = SPELLS[id];
  if (option && !option.gold) B.manaThisTurn = (B.manaThisTurn || 0) + option.cost;  // Rewind reads this
  const finish = arg => {
    if (option.gold){
      RUN.gold -= option.cost; RUN.stats.goldSpent += option.cost; renderPurse();
    } else {
      B.mana[option.element] -= option.cost;
    }
    renderMana();
    if (sp.hpCost){
      /* Toll: below half health, Soul Tithe is paid in Shadow mana instead. */
      {
        hurtPlayerSelf(sp.hpCost);
        B.hpSpent = (B.hpSpent || 0) + sp.hpCost;   // Exsanguinate and Gravecall read this
        if (B.flags.hemorrhage){
          const bite = sp.hpCost * (B.flags.hemorrhage + (has("ARTERIAL") ? 1 : 0));
          damageEnemy(bite, { spell:true });
          /* Clotting: the wound feeds you back as it feeds on them. */
          if (has("CLOTTING")) healPlayer(Math.round(bite / 2));
        }
      }
    }
    if (B.over) return;
    playSfx("cast:" + id, { fallback:"cast" });
    /* Remembered so Second Wind Vial can hand the mana back, and spent so Thrift
       counts down only when it actually saved you something. */
    if (option && !option.gold) B.flags.lastPaid = { element:option.element, cost:option.cost };
    if (B.flags.thrift > 0) B.flags.thrift--;
    LESSON.saw("spell", id);
    restSpell(id);
    B.perTurn.castAnySpell = true;      // the Snare tightens on a turn you spend idle
    B.perTurn.paidToll = true;          // the Toll Gate charges only the first each turn
    B.spellsUsed++; RUN.stats.spellsCast++;
    if (!option.native){
      RUN.stats.substitutions++;
      RUN.stats.substitutedFrom[option.element] = (RUN.stats.substitutedFrom[option.element] || 0) + 1;
    }
    let msg = sp.cast(arg);
    /* Draught of Haste — the same casting, spoken a second time. */
    if (B.flags.echoNextSpell && !B.over){
      B.flags.echoNextSpell = false;
      const again = sp.cast(arg);
      msg = msg + "<br><b>Again</b> — " + (again || "");
    }
    const paid = option.gold
      ? option.cost + " " + TEXT.currencyShort + " <i>(settled in " + TEXT.currency + ")</i>"
      : option.cost + EL[option.element].glyph + (option.native ? "" : " <i>(foreign mana)</i>");
    toast("<b>" + sp.glyph + " " + sp.name + "</b> — " + paid + "<br>" + msg, 3000);
    renderMana(); renderSpells(); renderSlots();
  };
  if (!sp.target) return finish();
  if (!promptFor(sp.target, sp.name, finish)){
    /* Never fail quietly: a spell that asks for something the game cannot ask for is
       a bug, and the player deserves to know rather than tapping a dead button. */
    console.error("no prompt for spell target: " + sp.target);
    toast("<b>" + sp.name + "</b> cannot be aimed right now.", 2400);
  }
}

/* Every way the game can ask the player for something, in ONE place. Spells and vials
   both route through it, so a new target kind cannot be handled in one and forgotten
   in the other — which is exactly how Prophecy came to do nothing at all. */
const PROMPTS = {
  position:     "Choose a position.",
  element:      "Choose an element.",
  twoPositions: "Choose two positions to compare.",
  count:        "How many Fractures will you score?"
};
function promptFor(kind, title, done){
  const ask = PROMPTS[kind];
  if (!ask) return false;
  openPicker(kind, title, ask, done);
  return true;
}

/* Which pool pays? Native first, then the doubled alternatives. */
function openManaPicker(id, options){
  const sp = SPELLS[id], base = spellBase(id);
  const all = paymentOptions(id);
  const opts = all.map(o =>
    '<button class="opt' + (o.native ? " native" : "") + (o.gold ? " goldpay" : "") +
    '" data-v="' + o.element + '"' + (o.affordable ? "" : " disabled") + '>' +
    (o.gold ? "🪙" : EL[o.element].glyph) +
    '<span class="sub">' + o.cost + (o.native ? " ·NATIVE" : o.gold ? " ·AETHER" : "") +
    '</span></button>').join("");
  const box = $("#pickerBox");
  /* A spell written in AETHER has no element, so the old header threw the moment the
     picker opened for one — which it never did before, because a gold spell used to
     offer a single option and was paid without asking. */
  const written = base.element === "gold"
    ? '<p>Written in \ud83e\ude99 ' + TEXT.currency +
      '. A pool can pay it instead, dearly \u2014 the purse is always the cheaper road.</p>'
    : '<p>Written in ' + EL[base.element].glyph + " " + EL[base.element].name +
      '. Any other pool can pay it at double cost.</p>';
  box.innerHTML = '<h2>' + sp.glyph + " " + sp.name + '</h2>' + written +
    '<div class="opts">' + opts + '</div>' +
    '<button class="btn ghost" id="pickCancel">Cancel</button>';
  $("#picker").classList.add("show");
  box.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    const el = b.dataset.v;
    closePicker();
    payAndCast(id, all.find(o => o.element === el));
  }));
  $("#pickCancel").addEventListener("click", closePicker);
}

/* target picker overlay */
let pickerState = null;
function openPicker(kind, title, prompt, done, items){
  pickerState = { kind, done, chosen:[] };
  const box = $("#pickerBox");
  let opts = "";
  if (kind === "element"){
    /* THROUGH rune(), like every other surface. These two spots wrote e.glyph and
       EL[..].glyph straight out, so the picker showed the EMOJI while the rest of
       the screen showed the registered art — the same element with two faces,
       depending on which control you opened. The old test named four functions and
       this was not one of them; a derived rule found it immediately. */
    opts = ELEMENTS.map(e =>
      '<button class="opt" data-v="' + e.id + '">' + rune(e.id) +
      '<span class="sub">' + e.name.toUpperCase() + '</span></button>').join("");
  } else if (kind === "count"){
    /* Naming a number, not a position: 0 up to the length of the sequence. */
    opts = Array.from({length:B.enemy.codeLength + 1}, (_,i) =>
      '<button class="opt" data-v="' + i + '">' + i +
      '<span class="sub">' + (i === 1 ? "FRACTURE" : "FRACTURES") + '</span></button>').join("");
  } else if (kind === "list"){
    /* A LIST THE CALLER SUPPLIES, rather than one derived from the board — the
       other kinds all read B.enemy, which does not exist outside a fight, and
       the full-satchel prompt has to work in the Sanctum and after a boss. */
    opts = (items || []).map((it, i) =>
      '<button class="opt" data-v="' + i + '">' + (it.glyph || "◇") +
      '<span class="sub">' + String(it.label || "").toUpperCase() + '</span></button>').join("");
  } else {
    const n = B.enemy.codeLength;
    opts = Array.from({length:n}, (_,i) =>
      '<button class="opt" data-v="' + i + '">' + (B.draft[i] ? rune(B.draft[i]) : "◇") +
      '<span class="sub">POS ' + (i+1) + '</span></button>').join("");
  }
  box.innerHTML = '<h2>' + title + '</h2><p>' + prompt + '</p>' +
                  '<div class="opts">' + opts + '</div>' +
                  '<button class="btn ghost" id="pickCancel">Cancel</button>';
  $("#picker").classList.add("show");
  box.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choosePicker(b)));
  $("#pickCancel").addEventListener("click", closePicker);
}
function choosePicker(btn){
  const raw = btn.dataset.v;
  const val = pickerState.kind === "element" ? raw : parseInt(raw, 10);
  if (pickerState.kind === "list"){
    const cb = pickerState.done; closePicker(); cb(val); return;
  }
  if (pickerState.kind === "twoPositions"){
    if (pickerState.chosen.includes(val)) return;
    pickerState.chosen.push(val);
    btn.classList.add("sel");
    if (pickerState.chosen.length < 2) return;
    const cb = pickerState.done, pair = pickerState.chosen;
    closePicker(); cb(pair); return;
  }
  const cb = pickerState.done;
  closePicker(); cb(val);
}
function closePicker(){
  /* CANCEL MEANS DECLINE, and the caller must hear it — a full satchel that
     simply closed would swallow the incoming vial with no word either way. */
  const st = pickerState;
  $("#picker").classList.remove("show"); pickerState = null;
  if (st && st.kind === "list" && st.done) st.done(null);
}

function markKnown(pos, hit){ B.known.slots[pos] = hit ? "yes" : "no"; renderSlots(); }

/* relic-granted actions (Oracle Eye) */
function useRelicAction(id){
  const act = RELICS[id].action;
  if (!act.ready()){ toast("Not available right now.", 1600); return; }
  const fire = arg => {
    const msg = act.run(arg);
    toast("<b>" + RELICS[id].glyph + " " + RELICS[id].name + "</b><br>" + msg, 3000);
    renderRelicActions();
  };
  if (act.target === "position") openPicker("position", RELICS[id].name, "Choose a position.", fire);
  else fire();
}

/* ============================================================
   13. UI RENDERING
   ============================================================ */
const $ = s => document.querySelector(s);
/* Attaches a listener only if the element exists. Optional buttons (developer-only,
   reward-dependent) would otherwise throw and silently kill every listener
   registered after them. */
function on(sel, fn, evt){
  const el = $(sel);
  if (el) el.addEventListener(evt || "click", fn);
  return !!el;
}
const slotsEl = () => $("#slots");
/* FIND A SLOT BY WHAT IT IS, NOT WHERE IT SITS. These two replace
   slotsEl().children[n] and a class-filtered children list — the only two
   places in the game that addressed an element by its position among siblings.
   Both now ask for the thing itself, so the row can hold anything else in any
   order and neither can ever return the wrong slot. */
const slotEl     = i  => document.querySelector('#slots .slot[data-slot="' + i + '"]');
const allSlotEls = () => [...document.querySelectorAll("#slots .slot[data-slot]")];

function buildRunes(){
  /* ONE CONTROL PER ELEMENT. The button you press and the pool you read used to
     be two separate rows; they are one thing now, because they answer one
     question together — press this, if you can afford it.

     THE MANA MARKUP IS UNCHANGED INSIDE THE BUTTON. .mana carries the same .g,
     .v/.n/.mx and .meter > i it always did, with the same #mana-<id>. That is
     not laziness: renderMana() queries those three by class every turn, and
     moving the HOST while keeping the CONTRACT means the render did not have to
     be touched at all. Rewriting both halves at once is how you get a screen
     that draws but never updates. */
  const el = $("#runes"); el.innerHTML = "";
  ELEMENTS.forEach(e => {
    const b = document.createElement("button");
    b.className = "rune"; b.dataset.el = e.id;
    b.dataset.tip = "element"; b.dataset.tipId = e.id;
    b.setAttribute("aria-label", "Add " + e.name);
    b.innerHTML =
      '<span class="glyph">' + rune(e.id) + '</span>' +
      '<span class="nm">' + e.name.toUpperCase() + '</span>' +
      '<span class="mana" id="mana-' + e.id + '">' +
        '<span class="v"><span class="n">0</span>/<span class="mx">10</span></span>' +
        '<span class="meter"><i style="--elCol:' + e.color + '"></i></span>' +
      '</span>';
    b.addEventListener("click", () => addRune(e.id, b));
    el.appendChild(b);
  });
}
function buildMana(){
  /* The pools live inside the buttons now — buildRunes draws them. This is kept
     as a no-op rather than deleted because it is called from three places and a
     missing function is a thrown error, not a blank space. */
  const el = $("#manaRow"); if (el) el.innerHTML = "";
}
function renderSlots(){
  const n = B.enemy.codeLength, host = slotsEl();
  host.innerHTML = "";
  for (let i = 0; i < n; i++){
    const d = document.createElement("div");
    d.className = "slot"; d.dataset.tip = "slot";
    /* EVERY SLOT CARRIES ITS OWN INDEX. Without it the only way to find slot 3
       was "the fourth child of the row", which is true until anything else is
       ever put in that row — and then the wrong slot lights and nothing throws. */
    d.dataset.slot = i;
    const filled = B.draft[i];
    if (filled){ d.classList.add("filled"); d.innerHTML = rune(filled); }
    if (B.target === i) d.classList.add("aimed");
    else if (B.target == null && i === nextEmptySlot()) d.classList.add("next");
    if (B.known.slots[i] === "yes") d.classList.add("known");
    if (B.flags.frozen && B.flags.frozen[i]) d.classList.add("frozenSlot");
    if (B.flags.evilEye === i) d.classList.add("markedSlot");
    const idx = document.createElement("span");
    idx.className = "idx"; idx.textContent = i + 1;
    d.appendChild(idx);
    if (B.known.revealed[i]){
      const lock = document.createElement("span");
      lock.className = "lock"; lock.innerHTML = rune(B.known.revealed[i]);
      d.appendChild(lock);
    }
    d.addEventListener("click", () => tapSlot(i));
    host.appendChild(d);
  }
  // Clear-all sits in the slot row itself so it is thumb-adjacent to the runes.
  const anyFilled = B.draft.some(x => x);
  const clr = document.createElement("button");
  clr.className = "clearRow" + (anyFilled ? "" : " empty");
  clr.textContent = "×";
  clr.dataset.tip = "clear";
  clr.setAttribute("aria-label", "Clear the whole incantation");
  clr.disabled = !anyFilled || B.busy || B.over;
  clr.addEventListener("click", clearDraft);
  host.appendChild(clr);


  const full = draftFull();
  $("#cast").disabled = !full || B.busy || B.over;
  $("#castArea").classList.toggle("armed", full);
}
/* The wright, drawn from the art registry. Falls back to the discipline's emoji, so a
   craft with no portrait yet still shows something rather than a hole. */
/* Dress a figure from the registry: an image if one is registered, the emoji if not.
   Both the wright and the creature go through here, so their behaviour cannot drift
   apart — and the creature is ready the day its portrait exists. */
function dressFigure(el, kind, id, fallback){
  if (!el) return;
  const src = artPath("portrait", kind + ":" + id);
  el.innerHTML = src
    ? '<img class="figArt" src="' + src + '" alt="' + (fallback.name || id) + '">'
    : (fallback.glyph || "\u2726");
  el.classList.toggle("hasArt", !!src);
  applyMotion(el, kind, id);
}

function renderPlayerSprite(){
  /* #playerFig WAS ALREADY THERE — the over-the-shoulder figure in the lower left of
     the scene, holding an emoji since the day it was written. It did not need a new
     slot beside it; it needed dressing. */
  if (!RUN) return;
  dressFigure($("#playerFig"), "wizard", RUN.wizard,
              { name:disciplineName(RUN.wizard), glyph:WIZ[RUN.wizard].glyph || "\ud83e\uddd9" });
}

/* The creature, by the same rule and into the opposite corner. */
function renderEnemySprite(forceId){
  if (!B || !B.enemy) return;
  const id = B.enemy.id || forceId;
  dressFigure($("#enemySprite"), "enemy", id,
              { name:B.enemy.name, glyph:B.enemy.sprite || "\ud83d\udfe2" });
}

function renderHP(){
  /* Flag danger on the bar itself — at a glance, colour is faster than arithmetic. */
  const pf = $("#playerHPFill"), lowP = RUN.hp / RUN.maxHP <= 0.3;
  if (pf) pf.classList.toggle("low", lowP);
  $("#enemyHPFill").style.width = Math.max(0, B.enemy.hp / B.enemy.maxHP * 100) + "%";
  $("#enemyHPNum").textContent = Math.max(0, B.enemy.hp) + " / " + B.enemy.maxHP;
  $("#playerHPFill").style.width = Math.max(0, RUN.hp / RUN.maxHP * 100) + "%";
  $("#playerHPNum").textContent = Math.max(0, RUN.hp) + " / " + RUN.maxHP;
  const eb = $("#enemyBlock"), pb = $("#playerBlock");
  /* THE NUMBER ONLY. This wrote "🛡 " + value every turn, so the emoji came straight
     back over the pack's shield however the markup was changed — the art is the chip's
     background and the value is the layer above it, which is what the pack asks for. */
  eb.innerHTML = "<b>" + B.enemy.block + "</b>"; eb.classList.toggle("zero", B.enemy.block <= 0);
  pb.innerHTML = "<b>" + B.block + "</b>";       pb.classList.toggle("zero", B.block <= 0);
}
function renderMana(){
  ELEMENTS.forEach(e => {
    const box = $("#mana-" + e.id);
    box.querySelector(".n").textContent = B.mana[e.id];
    box.querySelector(".mx").textContent = manaMax(e.id);
    box.querySelector(".meter i").style.width = (B.mana[e.id] / manaMax(e.id) * 100) + "%";
  });
}
/* Every element is always shown, so the player can see at a glance which are still
   safe to probe. Faded means no ward; lit with a number means it has learned one. */
function renderResist(){

  ELEMENTS.forEach(e => {

const roman = n => ROMAN[n] || n;

/* Rebuilding innerHTML resets scrollTop to 0, and the old code then forced it to
   the bottom — so any render while the player was reading back snapped them to the
   newest row. Preserve their position unless they were already at the bottom. */
function renderHistory(){
  const g = $("#grimoire");
  const prevTop = g.scrollTop;
  const prevMax = g.scrollHeight - g.clientHeight;
  const wasAtBottom = prevMax <= 0 || prevTop >= prevMax - 4;
  if (!B.history.length){
    g.innerHTML = '<div class="empty">Your grimoire is blank. Cast to learn its weakness.</div>';
    return;
  }
  g.innerHTML = "";
  B.history.forEach(h => {
    if (h.note){
      const n = document.createElement("div");
      n.className = "entry noteRow" + (h.insight ? " insightRow" : "");
      n.dataset.tip = "seqchange";
      n.innerHTML = '<span class="noteIcon">' + h.icon + '</span><span class="noteText">' + h.text + '</span>';
      g.appendChild(n);
      return;
    }
    const row = document.createElement("div");
    row.className = "entry";
    const seq  = h.guess.map(id => '<span>' + rune(id) + '</span>').join("");
    /* The ring rides on its own marker: markers are shuffled once, as objects, so
       kind and echo stay paired. A ringed Fracture really is a Fracture whose rune
       the sequence wants more of — the position is hidden, the pairing is not. */
    const pips = h.shuffled
      ? h.shuffled.map(m => '<span class="pip ' + m.kind + (m.echo ? " echo" : "") +
          '" title="' + (m.kind === "exploit" ? "Fracture" :
                         m.kind === "resonate" ? "Resonate" :
                         m.kind === "unknown" ? "Withheld" : "Resist") +
          (m.echo ? " — and the sequence holds more of that rune than you placed" : "") +
          '"></span>').join("")
      : '<span class="pendingMark">answer pending…</span>';
    /* Left page: what you said. Right page: what it answered. */
    row.innerHTML = '<span class="pgL"><span class="turn">' + roman(h.turn) + '</span>' +
                    '<span class="seq">' + seq + '</span></span>' +
                    '<span class="pgR"><span class="pips">' + pips + '</span></span>';
    g.appendChild(row);
  });
  /* Follow the newest row only if the player was already there; otherwise leave
     them where they were reading. */
  if (wasAtBottom) g.scrollTop = g.scrollHeight;
  else g.scrollTop = Math.min(prevTop, g.scrollHeight - g.clientHeight);
  updateBookNav();
}
/* The intent chip carries the incoming damage; the ability it is about to use sits

function intentParts(it){

  const i = raw.indexOf("·");
  return i === -1
    ? { main:raw, tag:it.act === "guard" ? "guard" : it.act === "roar" ? "roar" : "" }
    : { main:raw.slice(0, i).trim(), tag:raw.slice(i + 1).trim() };
}
/* Scroll affordances: the four-row window hides earlier casts, and on a small
   parchment surface a scrollbar is not obvious. */
function updateBookNav(){
  /* A NO-OP SINCE 2026-08-28. It lit the two arrow buttons, which are gone: the
     grimoire scrolls by touch and they were never commissioned art. Kept as an
     empty function because several call sites invoke it after a render or a

function renderIntent(){

  el.className = it.kind === "guard" ? "guard" : it.kind === "hex" ? "hex" : "";
  if (B.flags.skipEnemy){

  el.innerHTML = (artPath("ui", "attack-sword") ? "" : it.icon + " ") +
                 '<span class="intentText">' + p.main + '</span>';
  let tag = p.tag;
  if (B.flags.deepIntent > 0 && B.nextIntent){
    const q = intentParts(B.nextIntent);
    tag = (tag ? tag + " · " : "") + "then " + B.nextIntent.icon + " " + q.main;
  }
  const veiled = !tag && B.enemy.maskFeedback && B.enemy.maskFeedback();
  if (veiled) tag = "veiled";

    tagEl.textContent = tag;
    /* the pack has a badge for exactly this state, and nothing was using it */
