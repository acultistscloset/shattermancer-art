/* What a spell costs RIGHT NOW — after Efficiency, relics and any discipline
   discount — rather than what it costs on paper. A price that never moves when a
   talent is bought is worse than showing no price at all. */
/* ============================================================================
   THE COST, SET IN DRAWN NUMERALS.

   Costs change constantly — relics discount them, a discipline can pay in either
   of its two elements, gold spells run to 55 — so the number is composed at
   RUNTIME from a set of drawn glyphs rather than baked into any icon.

   THE GLYPHS ARE MASKS, NOT PICTURES. They were commissioned as solid white
   silhouettes precisely so the game can colour them: a cost prints green when a
   relic has cut it, red when it cannot be paid, dimmed when paying with
   substitute mana. A pre-coloured gold numeral could never become red. So each
   glyph is a box whose BACKGROUND is currentColor, masked to the numeral's
   shape — which means the existing .cost.cut / .short / .alt colour rules keep
   working untouched, and one set of sixteen files covers every state.
   ============================================================================ */
function numeral(ch){
  const key = /[0-9]/.test(ch) ? "num-" + ch
            : ch === "/" ? "num-slash"
            : ch === "+" ? "num-plus"
            : ch === "-" ? "num-minus"
            : ch === "\u2726" ? "num-aurel"      /* the Aurels mark */
            : ch === "\u2764" ? "num-health"
            : ch === "\u25c7" ? "num-substitute"
            : null;
  const src = key && artPath("ui", key);
  /* no art, no change: the character prints as itself, exactly as before */
  if (!src) return ch;
  return '<i class="num" style="-webkit-mask-image:url(' + src +
         ');mask-image:url(' + src + ')" aria-hidden="true"></i>';
}
/* a whole cost string, glyph by glyph, with the accessible text preserved */
function numerals(text){
  const s = String(text);
  const drawn = s.split("").map(numeral).join("");
  if (drawn === s) return s;                       /* nothing was drawn */
  return '<span class="nums" role="text" aria-label="' +
         s.replace(/"/g, "&quot;") + '">' + drawn + '</span>';
}

function liveCost(id){
  const sp = SPELLS[id], base = spellBase(id);
  let opts = [];
  try { opts = paymentOptions(id); } catch(e){}
  const native = opts.find(o => o.native);
  const parts = [];
  const now = native ? native.cost : base.amount;
  /* A spell that costs no mana should not display a mana price — the Efficiency
     floor otherwise makes free spells look like they cost 2. */
  if (base.amount === 0){
    if (sp.hpCost) parts.push({ text: sp.hpCost + "❤️", cut:false, afford: RUN.hp > sp.hpCost });
    else parts.push({ text:"free", cut:false, afford:true, dim:true });
    return parts;
  }
  if (base.element === "gold"){
    parts.push({ text: now + TEXT.currencyShort, cut: now < base.amount,
                 afford: native ? native.affordable : true });
  } else {
    /* Both of a discipline's elements are shown, since either pays at full rate. */
    const natives = opts.filter(o => o.native && !o.gold);
    if (natives.length){
      natives.forEach(o => parts.push({
        /* the number and the element are kept APART now: the number is set in
           drawn numerals and the element is drawn from the registered art, so
           they can no longer be concatenated into one string. */
        text: String(o.cost), el: o.element, cut: o.cost < base.amount, afford: o.affordable }));
    } else {
      parts.push({ text: String(now), el: base.element, cut: now < base.amount, afford:false });
    }
    const sub = opts.find(o => !o.native && !o.gold);
    if (sub) parts.push({ text: sub.cost + "\u25c7", cut:false, afford: sub.affordable, dim:true });
  }
  if (sp.hpCost) parts.push({ text: sp.hpCost + "❤️", cut:false, afford: RUN.hp > sp.hpCost });
  return parts;
}

function renderSpells(){
  const tray = $("#spellTray"); tray.innerHTML = "";
  RUN.spells.forEach(id => {
    const sp = SPELLS[id];
    /* THE ELEMENT COMES FROM THE REGISTERED ART, not an emoji. The cost line was
       the last place in battle still printing EL[..].glyph, so a freshly drawn
       numeral would have sat beside a system emoji. rune() is the one call that
       draws an element, everywhere. */
    const costStr = liveCost(id).map(p =>
      '<i class="cost' + (p.cut ? " cut" : "") + (p.afford ? "" : " short") +
      (p.dim ? " alt" : "") + '">' + numerals(p.text) +
      (p.el ? rune(p.el, "costEl") : "") + '</i>').join("");
    const b = document.createElement("button");
    b.className = "spell" + (spellReady(id) && !spellResting(id) ? " ready" : "") +
      (spellLocked(id) ? " sealed" : "") + (spellResting(id) ? " resting" : "");
    b.dataset.tip = "spell"; b.dataset.tipId = id;
    b.innerHTML = '<span class="sg">' + icon("spell", id) + '</span><span class="sn">' + sp.name +
                  '</span><span class="sc">' + costStr + '</span>';
    b.addEventListener("click", () => useSpell(id));
    tray.appendChild(b);
  });
  /* Pad to the harness's four sockets, so a carried spell always lands in a socket
     instead of being stretched across two. The blanks are inert. */
  for (let i = RUN.spells.length; i < CONFIG.spells.slots; i++){
    const blank = document.createElement("div");
    blank.className = "spell empty";
    tray.appendChild(blank);
  }
  renderRelicActions();
}
function renderRelicActions(){

function renderRelics(){
  /* EIGHT SOCKETS, showing the first eight (Kerry, 2026-08-25). The strip used

/* One way to grant Aurels, so the purse and the run's tally never disagree. */
function addAurels(n){

  RUN.gold += n;
  RUN.stats.goldEarned += n;

}
function renderPurse(){

/* ---------- input ---------- */
function elementLocked(id){ return !!(B.flags.lockedElements && B.flags.lockedElements[id] > 0); }
function lockElement(id, turns){
  B.flags.lockedElements = B.flags.lockedElements || {};
  B.flags.lockedElements[id] = turns;
  // a banished rune cannot stay in a prepared incantation
  B.draft = B.draft.map(x => x === id ? null : x);
  renderRunes(); renderSlots();
}
function tickElementLocks(){
  const L = B.flags.lockedElements; if (!L) return;
  Object.keys(L).forEach(id => { if (--L[id] <= 0) delete L[id]; });
  renderRunes();
}
/* Rune buttons are built once; this refreshes their locked state each turn. */
function renderRunes(){
  /* every rune button carries data-el; querying for that is exact, where
     .children is whatever happens to sit in the row */
  [...document.querySelectorAll("#runes .rune[data-el]")].forEach(b => {
    const locked = elementLocked(b.dataset.el);
    b.classList.toggle("locked", locked);
    b.disabled = locked;
  });
}

function addRune(id, btn){
  if (!B || B.busy || B.over) return;
  if (!LESSON.allows("rune", id)){
    toast("Not yet — follow the lesson.", 1600);
    return;
  }
  if (elementLocked(id)){
    toast(EL[id].glyph + " " + EL[id].name + " is banished for " +
          B.flags.lockedElements[id] + " more turn(s).", 1900);
    return;
  }
  /* The same cap binds the player: an incantation of one rune repeated would be a
     free enumeration of the sequence rather than a deduction. */
  if (countOf(B.draft, id) >= repeatCap()){
    toast("No incantation may hold more than <b>" + repeatCap() + "</b> of the same rune.", 2000);
    return;
  }
  const slot = activeSlot();
  if (slot == null) return;                       // every position already filled
  B.draft[slot] = id;
  delete B.known.slots[slot];                     // a new rune invalidates what was tested here
  B.cursor = slot;                                // advance rightward from where we just placed
  B.target = null;
  btn.classList.remove("tapped"); void btn.offsetWidth; btn.classList.add("tapped");
  renderSlots(); renderSpells();
  /* BY NAME, NOT BY POSITION. children[slot] meant the Nth child of the row,
     so anything else appearing in that row — a spacer, a decoration, the clear
     button drifting to the front — would pop the WRONG slot and throw nothing.
     Silent wrongness is the failure mode that survives testing. Each slot now
     carries its own index and is found by it. */
  const el = slotEl(slot);
  if (el) el.classList.add("pop");
  if (draftFull()) Tutorial.maybe("ready");
  LESSON.saw("rune", id);
}
function clearDraft(){
  if (!B || B.busy || B.over) return;
  if (!B.draft.some(x => x)) return;
  B.draft = emptyDraft(B.enemy.codeLength);
  B.target = null; B.cursor = -1;
  B.known.slots = {};          // tested positions referred to runes that are now gone
  renderSlots(); renderSpells();
}

/* Tapping a slot aims the next rune at it. Tapping the slot you have already
   aimed at clears it — so one control both targets and erases. */
function tapSlot(i){
  if (!B || B.busy || B.over) return;
  if (B.target === i){
    if (B.draft[i]){ B.draft[i] = null; delete B.known.slots[i]; }
    B.target = null;
  } else {
    B.target = i;
    if (!B.draft[i]) Tutorial.maybe("aim");
  }
  renderSlots(); renderSpells();
}

/* ============================================================
   14. EFFECTS
   ============================================================ */
/* Writes a marked line into the grimoire wherever the hidden sequence itself
   changed, so the player can see exactly which guesses predate the change and
   which of their deductions still hold. */
/* The grimoire holds note rows as well as incantations, so anything asking for
   "the last cast" must skip them. */
function lastIncantation(){
  for (let i = B.history.length - 1; i >= 0; i--) if (!B.history[i].note) return B.history[i];
  return null;
}

/* Grow (or shrink) the hidden sequence mid-fight. The draft is rebuilt to match
   and the grimoire keeps the older, shorter rows for reference. */
/* THE BINDING RE-FORMS WHEN IT BREAKS.
   Same runes, new order, and what you knew of the old order is void — a Shatter is a
   blow, not a key you go on using. 38% of bosses were being solved twice or more, at
   which point the same taps land full damage every turn and the fight stops being a
   puzzle. Called after the cast has resolved, so the player sees their markers and
   their damage against the sequence they actually beat. */
function reformOnShatter(){
  if (!B || B.over || !B.reformAfterCast) return;
  B.reformAfterCast = false;
  if (B.enemy.hp <= 0) return;                 // nothing left to re-bind
  const old = B.enemy.code.slice();
  let next = old.slice();
  for (let tries = 0; tries < 40 && next.join() === old.join(); tries++){
    next = old.slice(); shuffle(next);
  }
  B.enemy.code = next;
  B.flags.revealedEver = (B.flags.revealedEver || 0) + Object.keys(B.known.revealed || {}).length;
  B.known.revealed = {}; B.known.slots = {};
  B.draft = emptyDraft(B.enemy.codeLength);
  B.target = null; B.cursor = -1;
  B.lastGuess = null;                          // a new binding, so nothing repeats
  enforceFrozen();
  renderSlots(); renderHistory();
  noteInsight("Broken open, it knits itself anew \u2014 the same runes, another order.", "\ud83d\udd04");
}

function resizeCode(newLen, keepKnown){
  if (B.flags.sealed > 0){
    noteSequenceChange("The sequence strains against the seal — and holds.", "⛓");
    return;
  }
  const old = B.enemy.code.slice();
  B.enemy.codeLength = newLen;
  B.enemy.code = randomCode(newLen, B.enemy.duplicateHeavy);
  if (keepKnown) for (let i = 0; i < Math.min(old.length, newLen); i++) B.enemy.code[i] = old[i];
  B.draft = emptyDraft(newLen);
  B.target = null; B.cursor = -1;
  enforceFrozen();
  B.flags.revealedEver = (B.flags.revealedEver || 0) + Object.keys(B.known.revealed || {}).length;
  /* When the kept positions are unchanged, what the player deduced about them is STILL
     TRUE and must survive. Wiping it wholesale meant a Diviner who kept two runes saw
     an empty grimoire and a tooltip promising runes that were not there. */
  const kept = {};
  if (keepKnown){
    Object.keys(B.known.revealed || {}).forEach(k => {
      const pos = +k;
      if (pos < newLen && B.enemy.code[pos] === old[pos]) kept[pos] = B.known.revealed[k];
    });
  }
  B.known.revealed = kept; B.known.slots = {};
  const n = Object.keys(kept).length;
  if (n) noteInsight(n + " rune" + (n === 1 ? "" : "s") + " you had found are still where they were",
                     "🔎");
  renderSlots(); renderHistory();
}

/* Anything the player LEARNS is written into the grimoire permanently. A toast
   fades; deduction has to stay on screen or the spell that bought it was wasted. */
function noteInsight(text, icon){
  if (!B) return;
  B.history.push({ note:true, insight:true, text:text, icon:icon || "💡", turn:B.turn });
  renderHistory();
}

/* Sequence Salve pins the sequence: nothing may re-form, rotate or swap while it holds.
   Asked once, in one place, so every creature that moves the sequence respects it. */
function sequenceSealed(){
  if (B && B.flags && B.flags.sealSequence > 0){
    toast("<b>The salve holds</b> — the sequence cannot move.", 2000);
    return true;
  }
  return false;
}
function noteSequenceChange(text, icon){
  playSfx("sequence_shift");
  enforceFrozen();
  if (!B) return;
  B.history.push({ note:true, text:text, icon:icon || "🌀", turn:B.turn });
  renderHistory();
}

/* ============================================================
   AUDIO
   Two channels. MUSIC persists across screens — asking for the track already
   playing does nothing, so walking the map does not restart the map theme — and
   crossfades when the track genuinely changes. SFX are one-shot and overlapping.

   registerAudio({ music:{ map:"audio/music/map.mp3" },
                   sfx:{ cast:"audio/sfx/cast.wav" } });
   Nothing registered means silence; no errors, no missing-file requests.
   ============================================================ */
const AUDIO = { music:{}, sfx:{} };
let MUSIC_NOW = null, MUSIC_EL = null, MUSIC_FADING = null;
const SFX_CACHE = {};

function registerAudio(map){
  Object.keys(map || {}).forEach(ch => {
    if (!AUDIO[ch]) AUDIO[ch] = {};
    Object.assign(AUDIO[ch], map[ch]);
  });
}
function mediaOn(){
  return CONFIG.media.enabled && typeof Audio !== "undefined";
}
/* One-shot. Cached per key so rapid repeats do not re-fetch, and cloned so two
   casts in the same second overlap rather than cutting one another off. */
function playSfx(key, opts){
  if (!mediaOn()) return;
  /* "cast:fireball" plays that spell's own sound if one exists, and the shared
     cast sound otherwise — so a composer can start with one file and refine. */
  if (!AUDIO.sfx[key] && opts && opts.fallback) key = opts.fallback;
  if (!AUDIO.sfx[key]) return;
  try {
    if (!SFX_CACHE[key]) SFX_CACHE[key] = new Audio(AUDIO.sfx[key]);
    const node = SFX_CACHE[key].cloneNode();
    node.volume = Math.min(1, CONFIG.media.sfxVolume * ((opts && opts.volume) || 1));
    const p = node.play();
    if (p && p.catch) p.catch(() => {});      // autoplay refusal is not an error
  } catch(e){}
}
/* Persistent, crossfaded. Calling with the track already playing is a no-op, which
   is what keeps music continuous while the player moves between screens. */
function playMusic(key){
  if (!mediaOn()) { MUSIC_NOW = key; return; }
  if (MUSIC_NOW === key) return;
  const src = AUDIO.music[key];
  MUSIC_NOW = key;
  if (!src){ fadeOutMusic(); return; }
  try {
    const next = new Audio(src);
    next.loop = true; next.volume = 0;
    const p = next.play();
    if (p && p.catch) p.catch(() => {});
    const old = MUSIC_EL;
    MUSIC_EL = next;
    const steps = 24, ms = CONFIG.media.crossfadeMs / steps;
    let i = 0;
    clearInterval(MUSIC_FADING);
    MUSIC_FADING = setInterval(() => {
      i++;
      const t = i / steps;
      next.volume = Math.min(1, CONFIG.media.musicVolume * t);
      if (old) old.volume = Math.max(0, CONFIG.media.musicVolume * (1 - t));
      if (i >= steps){
        clearInterval(MUSIC_FADING);
        if (old){ try { old.pause(); } catch(e){} }
      }
    }, ms);
  } catch(e){}
}
function fadeOutMusic(){
  if (!MUSIC_EL) return;
  const el = MUSIC_EL; MUSIC_EL = null;
  const steps = 20, ms = CONFIG.media.crossfadeMs / steps;
  let i = 0;
  const t = setInterval(() => {
    i++;
    el.volume = Math.max(0, CONFIG.media.musicVolume * (1 - i / steps));
    if (i >= steps){ clearInterval(t); try { el.pause(); } catch(e){} }
  }, ms);
}
function setMusicVolume(v){
  CONFIG.media.musicVolume = Math.max(0, Math.min(1, v));
  if (MUSIC_EL) MUSIC_EL.volume = CONFIG.media.musicVolume;
}
function setSfxVolume(v){ CONFIG.media.sfxVolume = Math.max(0, Math.min(1, v)); }

/* Which track belongs to where. Named so a composer can be handed the list. */
function trackForScreen(name){
  if (name === "Title" || name === "Schools") return "title";
  if (name === "Map") return "map";
  if (name === "Rest") return "rest";
  if (name === "Shop") return "shop";
  if (name === "Treasure") return "treasure";
  if (name === "Talents" || name === "Spellbook" || name === "Glossary") return "study";
  if (name === "Summary") return "summary";
  return "map";
}
function trackForBattle(){
  if (!B || !B.enemy) return "battle_act1";
  if (B.isBoss) return "boss_act" + ((RUN.act || 0) + 1);
  if (B.isElite) return "elite_act" + ((RUN.act || 0) + 1);
  return "battle_act" + ((RUN.act || 0) + 1);
}

/* ============================================================
   ART REGISTRY
   Every drawable thing in the game asks for its art by KIND and ID. Until an asset
   is registered the registry answers with the emoji already in the data, so the
   game looks exactly as it does today and gains art one file at a time.

   registerArt({ icon:{ "spell:fireball":"art/spells/fireball.png" },
                 scene:{ "battle:act1":"art/scenes/act1.jpg" },
                 portrait:{ "enemy:goblin_mage":"art/enemies/goblin_mage.png" } });
   ============================================================ */
/* `fx` joins the buckets: the cast animation has ALWAYS asked for
   artPath("fx","element:<id>") and fallen back to the flat icon, because no such
   bucket existed to answer. It does now — the disciplines' aura art, mapped to
   elements by measured hue. A bucket missing from this list is silently dropped
   by loadAssets, which is why registering the files alone would have done
   nothing. */
/* `fxsheet` holds SPRITE SHEETS — a grid of frames in one file, with the grid
   itself stored beside the path. A sheet without its grid is unusable, so the
   two travel together, which is also the shape the art is being delivered in. */
const ART = { icon:{}, scene:{}, portrait:{}, ui:{}, sprite:{}, seal:{}, eyes:{}, fx:{}, fxsheet:{} };
function registerArt(map){
  Object.keys(map || {}).forEach(bucket => {
    if (!ART[bucket]) ART[bucket] = {};
    Object.assign(ART[bucket], map[bucket]);
  });
  if (typeof renderAll === "function" && B) renderAll();
}
function artPath(bucket, key){ return (ART[bucket] || {})[key] || null; }

/* ============================================================================
   THE ASSET MANIFEST
   Art used to be base64 inside this file — 77 images, 2 MB of text that inflated
   another third on top of the real bytes, and every one decoded at load whether the
   player ever saw it or not. That is what the phone was choking on.
   Now `assets.json` maps the same keys to file paths and the browser fetches each
   picture when it is first drawn. NOTHING ELSE CHANGED: registerArt still fills the
   same buckets and artPath still answers the same question, so the 172 lines that
   read art never learned the difference — and the 10,000 that do not were never
   involved.
   ============================================================================ */
async function loadAssets(){
  try {
    const res = await fetch("assets.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("assets.json " + res.status);
    const map = await res.json();
    registerArt(map);
    ASSETS_LOADED = true;
    return Object.keys(map).reduce((n, b) => n + Object.keys(map[b]).length, 0);
  } catch (e){
    /* THE GAME MUST STILL PLAY. Every screen falls back to its emoji when a key is
       missing — that was true when art was optional and it is true now. A missing
       manifest costs the pictures, not the game. */
    ASSETS_LOADED = false;
    if (typeof console !== "undefined" && console.warn)
      console.warn("Assets did not load — running unpainted. " + e.message +
        "\n  If you opened this file directly, it needs to be served over http.");
    return 0;
  }
}
let ASSETS_LOADED = false;

/* A path that 404s used to be impossible: a key either held a picture or did not
   exist. Now a key can name a file that is not there, which draws as a broken image
   rather than falling back. This checks every one and says which are missing. */
async function verifyAssets(){
  const missing = [];
  const all = [];
  Object.keys(ART).forEach(b => Object.keys(ART[b] || {}).forEach(k => {
    const v = ART[b][k];
    if (typeof v === "string" && !v.startsWith("data:")) all.push([b, k, v]);
  }));
  await Promise.all(all.map(([b, k, v]) =>
    fetch(v, { method: "HEAD" }).then(r => { if (!r.ok) missing.push(b + ":" + k + " -> " + v); })
                               .catch(() => missing.push(b + ":" + k + " -> " + v))));
  return { checked: all.length, missing };
}

/* THE RUNE, drawn wherever a rune appears.
   Every element glyph in the game was written straight from e.glyph — the wards, the
   incantation slots, the grimoire rows, the mana meters — so registering rune art
   changed none of them. This is the one call they all go through now, and it answers
   with the emoji until art exists. */
function rune(id, cls){
  const src = artPath("icon", "element:" + id);
  const el = EL[id] || {};
  return src
    ? '<img class="runeArt' + (cls ? " " + cls : "") + '" src="' + src +
      '" alt="' + (el.name || id) + '">'
    : '<span class="runeGlyph' + (cls ? " " + cls : "") + '">' + (el.glyph || "\u2726") + '</span>';
}

/* The emoji a thing carries today, whatever kind of thing it is. */
function glyphOf(kind, id){
  const table = { element:EL, spell:SPELLS, relic:RELICS, potion:POTIONS,
                  enemy:(typeof ENEMIES !== "undefined" ? ENEMIES : {}),
                  wizard:WIZ }[kind] || {};
  const it = table[id] || {};
  return it.glyph || "✦";
}
/* One call for every icon in the game: an image when one is registered, the
   emoji otherwise. Callers never need to know which. */
function icon(kind, id, cls){
  const src = artPath("icon", kind + ":" + id);
  const label = ((({ element:EL, spell:SPELLS, relic:RELICS, potion:POTIONS,
                     wizard:WIZ })[kind] || {})[id] || {}).name || id;
  const c = "ico ico-" + kind + (cls ? " " + cls : "");
  return src
    ? '<img class="' + c + '" src="' + src + '" alt="' + String(label).replace(/"/g,"&quot;") + '">'
    : '<span class="' + c + '">' + glyphOf(kind, id) + '</span>';
}
/* Backgrounds. A scene falls back to the gradient already in the stylesheet. */
function sceneStyle(key){
  const src = artPath("scene", key);
  return src ? ' style="background-image:url(' + src + ')" ' : "";
}
/* Creatures breathe. A named motion is a CSS class; a registered sprite sheet is a
   stepped animation. Neither is required — an unadorned portrait simply sits still. */
function applyMotion(el, kind, id){
  if (!el) return;
  MOTIONS.forEach(m => el.classList.remove("mo-" + m));
  el.classList.remove("spriteSheet");
  /* Guarded: not every element handed to this has a full CSSStyleDeclaration. */
  if (el.style && el.style.removeProperty){
    ["--frames", "--frameW", "--spriteDur"].forEach(p => el.style.removeProperty(p));
  }

  const table = kind === "enemy" ? (typeof ENEMIES !== "undefined" ? ENEMIES : {}) : WIZ;
  const def = (table || {})[id] || {};
  const sheet = artPath("sprite", kind + ":" + id);
  if (sheet && sheet.src){
    /* A sheet is a strip of equal frames; steps() walks it. */
    el.classList.add("spriteSheet");
    el.style.backgroundImage = "url(" + sheet.src + ")";
    if (el.style && el.style.setProperty){
      el.style.setProperty("--frames", sheet.frames || 1);
      el.style.setProperty("--frameW", (sheet.width || 128) + "px");
      el.style.setProperty("--spriteDur", ((sheet.frames || 1) / (sheet.fps || 10)) + "s");
    }
    return;
  }
  const motion = def.motion || (kind === "enemy" ? "breathe" : null);
  if (motion && MOTIONS.includes(motion)) el.classList.add("mo-" + motion);
}
/* The grimoire's page, if one is registered. The hand-built parchment gradient stays
   underneath as the fallback, so the book looks deliberate either way. */
function dressBook(){
  const el = $("#book");
  if (!el) return;
  const src = artPath("scene", "ui:grimoire");
  if (!src) return;
  el.classList.add("hasPage");
  /* handed to CSS as a variable, because border-image-source is what draws it now */
  el.style.setProperty("--pageArt", "url(" + src + ")");
}

/* THE PACK, HANDED TO CSS.
   Each component becomes a custom property once, at startup, so the stylesheet can ask
   for --ui-health-track without knowing whether an asset was ever registered. Nothing
   registered means the variable is simply unset and the painted fallback stands, which
   is what lets the art arrive one piece at a time. */
/* The observatory, under both the title and the Disciplines. It goes on the screen
   HOST, not on either screen's own markup, so the two share one floor and it is not
   torn down and rebuilt when the player moves between them. */
function dressStage(on){
  const el = screen();
  if (!el) return;
  const src = artPath("ui", "menu-background");
  el.classList.toggle("onStage", !!(on && src));
  if (on && src) el.style.setProperty("--stageArt", "url(" + src + ")");
}

  document.addEventListener("DOMContentLoaded", function(){
    try { measureShell(); } catch(e){}
  });

function dressUI(){
  const root = document.documentElement;
  if (!root || !root.style) return;
  Object.keys(ART.ui || {}).forEach(key => {
    root.style.setProperty("--ui-" + key, "url(" + ART.ui[key] + ")");
  });
  /* THE SIX ELEMENT MARKS, AND ONLY THOSE SIX.
     The battle element control paints two layers in one shorthand:
       background-image: var(--ui-element-icon-fire), var(--ui-element-btn)
     --ui-element-btn resolved correctly to rune.webp, but --ui-element-icon-fire
     was never defined — the element art lives in the ICON bucket as
     "element:fire", and only the ui bucket becomes CSS variables. ONE UNDEFINED
     VARIABLE IN A MULTI-LAYER SHORTHAND INVALIDATES THE WHOLE DECLARATION, so
     the computed value was `none` and the frame that WAS loaded went with it.
     Six ornate controls vanished because of one missing name.

     Kerry: the narrowest fix, without changing how anything else is published.
     dressUI's behaviour above is untouched and the icon bucket is not moved;
     these six names are added for the rule that needs them, and nothing more. */
  const ELEMENTS = ["fire", "water", "nature", "lightning", "ice", "shadow"];
  ELEMENTS.forEach(e => {
    const src = (ART.icon || {})["element:" + e];
    if (src) root.style.setProperty("--ui-element-icon-" + e, "url(" + src + ")");
  });
  if (Object.keys(ART.ui || {}).length) document.body.classList.add("hasUIArt");
}

}

}

/* Volume survives a session. */
function restoreMediaSettings(){
  try {
    const d = SAVE.data || {};
    if (d.musicVolume != null) CONFIG.media.musicVolume = d.musicVolume;
    if (d.sfxVolume   != null) CONFIG.media.sfxVolume   = d.sfxVolume;
    if (d.audioOn     != null) CONFIG.media.enabled     = d.audioOn;
  } catch(e){}
}
const rndOf = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Three movements, so a five-rune incantation reads as one spell rather than five:
     GATHER — each rune leaves its slot and meets the others at a point before the enemy
     WIND   — the ring turns, tightening, so the elements visibly fuse
     LAUNCH — the fused whole travels and breaks on the creature
   Each rune draws from ART "fx:element:<id>" if registered, then "icon:element:<id>",
   and finally the emoji — so this works with no art at all and improves with each file. */
/* ============================================================================
   THE SCREEN TREATMENT.

   The incantation's outcome is known before the bolt leaves the staff — the
   markers are already resolved — so the cast can SHOW the player their result
   before they read a single one. Four outcomes, four treatments:

     SHATTER      every rune right, in place. The rarest thing in the game and it
                  should feel like it: the screen holds still for a beat, then a
                  hard bloom and a deep shake. The pause is what sells it — a
                  held breath before the payoff reads as bigger than the payoff
                  by itself.
     FRACTURE     at least one rune landed. A firm shake, scaled to how many.
     RESONATE     right runes, wrong places. A soft nudge — contact without bite.
     FIZZLE       everything resisted. NO shake, NO flash. The colour drains
                  from the screen for a moment and comes back. The absence of
                  impact IS the feedback, and it must feel like a small loss.

   Every one of these is CSS on a single wrapper, so it costs nothing and cannot
   fail in a way that breaks the board. When the effect sheets arrive from
   ChatGPT they slot in ALONGSIDE this — the treatment is the screen's reaction,
   the sheets are the spell itself, and they are deliberately separate so either
   can be tuned without touching the other.

   AUDIO IS COMING LATER. Each treatment names its cue through playSfx with a
   fallback, so the moment sound files exist they play with no further wiring:
   sfx:"shatter", "impact_hard", "impact_soft", "fizzle".
   ============================================================================ */
/* ============================================================================
   THE SPRITE ENGINE.

   An effect is a grid of frames in one file, played by stepping a background
   position. No canvas, no library, no WebGL: one element, one image, and
   animation-timing-function:steps(), which the compositor runs on its own
   thread. It costs almost nothing and behaves identically in every browser —
   which the parchment taught us is worth more than cleverness.

   THE GRID COMES FROM THE MANIFEST, never from the code. The artist decides how
   many frames a thing needs; the game reads it. That is why nothing here has a
   frame count in it.

   playFx(key, opts) -> a handle with .stop(). Everything is optional: an effect
   whose sheet is missing simply does not play, and the cast continues. Art that
   has not arrived must never be able to break a fight.
   ============================================================================ */
function fxSheet(key){ return (ART.fxsheet || {})[key] || null; }

function playFx(key, opts){
  const s = fxSheet(key);
  const host = $("#fx");
  if (!s || !host) return { stop(){} };            /* no sheet, no effect, no error */
  const o = opts || {};

  const el = document.createElement("div");
  el.className = "fxSprite" + (o.className ? " " + o.className : "");
  el.setAttribute("aria-hidden", "true");

  /* THE SHEET IS SCALED TO THE SIZE IT IS DRAWN AT, not shown at native size.
     A 320px cell drawn at 190px means the whole sheet is scaled by the same
     factor, or the frames would not line up with the cell boundaries. */
  /* THE DRAWN SIZE IS THE SHEET'S OWN. Every caller used to pass a number and
     they drifted apart from the manifest; the pack states display_size per
     sheet and that is the only place it should live. */
  const draw = o.size || s.draw || s.cell[0] / 2;
  const k = draw / s.cell[0];
  el.style.width  = draw + "px";
  el.style.height = (s.cell[1] * k) + "px";
  el.style.backgroundImage = "url(" + s.src + ")";
  el.style.backgroundSize = (s.cols * s.cell[0] * k) + "px " +
                            (s.rows * s.cell[1] * k) + "px";

  /* centred on the point it was given */
  el.style.left = (o.x || 0) + "px";
  el.style.top  = (o.y || 0) + "px";
  const rot = (o.rotate != null ? o.rotate : (s.rotate || 0));
  el.style.transform = "translate(-50%,-50%)" + (rot ? " rotate(" + rot + "deg)" : "");
  /* THE TINT IS A GLOW, NOT A FILL.
     It used to set background-color under mix-blend-mode:multiply — and a sheet
     is mostly TRANSPARENT, so the colour showed straight through everywhere the
     art was not, painting a solid orange rectangle over the creature. The
     filmstrip caught it; a still never would have.
     A drop-shadow in the element's colour reads as elemental without touching a
     single pixel of the artist's work, and it cannot fill anything, because it
     only draws where the art already is. Only sheets the manifest marks
     runtime_tintable get it. */
  if (o.tint && s.tintable){
    el.style.filter = "drop-shadow(0 0 6px " + o.tint + ") " +
                      "drop-shadow(0 0 14px " + o.tint + ")";
  }

  /* THE FRAMES. steps(n) on a two-axis walk: the browser advances the
     background position one cell at a time, along the row and then down. */
  const dur = (s.frames / (s.fps || 24));
  el.style.setProperty("--sheetCols", s.cols);
  el.style.setProperty("--sheetRows", s.rows);
  el.style.setProperty("--fxW", (s.cols * s.cell[0] * k) + "px");
  el.style.setProperty("--fxH", (s.rows * s.cell[1] * k) + "px");
  /* TWO ANIMATIONS, ONE WALK. The X step runs across a row and repeats once per
     row; the Y step runs down the rows in the same total time. Together they
     visit every cell in order, which is all a sprite sheet needs.
     A looping sheet repeats both forever; a one-shot runs the X animation
     exactly `rows` times and holds on the last cell. */
  const reps = s.loop ? "infinite" : String(s.rows);
  el.style.animation =
    "sheetRow " + (dur / s.rows).toFixed(3) + "s steps(" + s.cols + ") " + reps + ", " +
    "sheetCol " + dur.toFixed(3) + "s steps(" + s.rows + ") " +
      (s.loop ? "infinite" : "1 forwards");

  host.appendChild(el);
  let dead = false;
  const stop = () => { if (dead) return; dead = true; el.remove(); };
  if (!s.loop) setTimeout(stop, dur * 1000 + 40);
  return { el, stop, ms: dur * 1000 };
}

/* where a point sits inside #fx, which is the layer every effect lives on */
function fxPoint(el, fx, fy){
  const host = $("#fx"), r = el && el.getBoundingClientRect();
  if (!host || !r) return { x:0, y:0 };
  const h = host.getBoundingClientRect();
  return { x: r.left - h.left + r.width  * (fx == null ? 0.5 : fx),
           y: r.top  - h.top  + r.height * (fy == null ? 0.5 : fy) };
}

function castOutcome(results){
  if (!results || !results.length) return "fizzle";
  if (results.every(r => r === "exploit")) return "shatter";
  if (results.some(r => r === "exploit")) return "fracture";
  if (results.some(r => r === "resonate")) return "resonate";
  return "fizzle";
}

function screenTreatment(kind, strength){
  const app = $("#app");
  if (!app) return;
  const on = c => {
    app.classList.remove(c); void app.offsetWidth; app.classList.add(c);
    setTimeout(() => app.classList.remove(c), 1400);
  };
  /* how hard, from how much landed — one Fracture should not shake like five */
  app.style.setProperty("--shake", Math.min(1, 0.45 + (strength || 0) * 0.22).toFixed(2));

  if (kind === "shatter"){
    on("castShatter");
    playSfx("shatter", { fallback:"hit_heavy" });
  } else if (kind === "fracture"){
    on("castFracture");
    playSfx("impact_hard", { fallback:"hit" });
  } else if (kind === "resonate"){
    on("castResonate");
    playSfx("impact_soft", { fallback:"hit" });
  } else {
    on("castFizzle");
    playSfx("fizzle", { fallback:"wind" });
  }
}

async function flyRunes(guess, outcome, landed){
  const fx = $("#fx"), enemy = $("#enemySprite");
  if (!fx || !enemy) { await sleep(CONFIG.timing.runeFlight); return; }
  const t = enemy.getBoundingClientRect();
  const tx = t.left + t.width/2, ty = t.top + t.height/2;

  /* the same lookup, and it already had to FILTER the row's children by class —
     which is the tell that position was never the right way to find these */
  const slots = allSlotEls();
  if (!slots.length){ await sleep(CONFIG.timing.runeFlight); return; }

  /* THE RUNES MEET AT THE STAFF. They used to gather at the midpoint between the
     board and the creature — a place with nothing in it, which is why the cast
     looked like it began nowhere. The wright holds the staff up and to his
     right; the head of it is about 72% across his figure and 18% down. Falls
     back to the old midpoint if the figure is not drawn. */
  const first = slots[0].getBoundingClientRect();
  const fig = $("#playerFig");
  const fr = fig && fig.getBoundingClientRect();
  const gx = (fr && fr.width) ? fr.left + fr.width * 0.72 : (first.left + tx) / 2;
  const gy = (fr && fr.height) ? fr.top + fr.height * 0.18 : (first.top + ty) / 2 - 10;

  const ring = document.createElement("div");
  ring.className = "castRing";
  ring.style.left = gx + "px";
  ring.style.top  = gy + "px";
  fx.appendChild(ring);

  /* THE AURAS OVERLAP. Flat rune icons needed a ring wide enough that they did
     not collide; these are soft, semi-transparent clouds, and their whole
     appeal is that they PASS THROUGH one another. So the radius shrinks and the
     motes grow — they gather into a single knot of mixed colour rather than a
     tidy circle of separate marks. */
  /* WIDER. The knot was tight from the first frame, so there was never a circle
     to see — only a clump that shrank. It opens to a real ring at the staff and
     tightens later, which is the shape Kerry asked for. */
  /* THE SHEETS TAKE OVER WHEN THEY EXIST. Each stage asks for its sprite sheet
     first and falls back to the aura clouds if none is registered — so the day
     the six charge sheets land they simply play, and until then nothing changes.
     The dominant element decides which sheet and which tint: the one cast most,
     with the first rune breaking a tie, because that is the one the player
     leaned on. */
  const tally = {};
  guess.forEach(e => { tally[e] = (tally[e] || 0) + 1; });
  const dominant = guess.slice().sort((a, b) =>
    (tally[b] - tally[a]) || (guess.indexOf(a) - guess.indexOf(b)))[0] || guess[0];
  const tintOf = el => (EL[el] && EL[el].color) || "#e8d9a8";

  const auraCast = !!artPath("fx", "element:" + guess[0]);
  const n = slots.length;
  const radius = auraCast ? Math.min(42, 22 + n * 4) : Math.min(30, 12 + n * 3);
  const seen = {};                       /* how many times each element has come up */
  const motes = slots.map((slot, i) => {
    const r = slot.getBoundingClientRect();
    const el = guess[i];
    const m = document.createElement("div");
    m.className = "mote el-" + el + (auraCast ? " aura" : "");
    /* AN ELEMENT MAY OWN MORE THAN ONE AURA. Seven discipline auras, six
       elements, and every one is cast — so shadow carries both dark crafts and
       they alternate as shadow repeats within an incantation.
       TWO KEYS, NOT A LIST: every tool that walks the manifest assumes bucket
       values are strings, and a list broke the orphan check, the alpha check and
       two suites' own registration at once. `<key>:alt` keeps the shape. */
    seen[el] = (seen[el] || 0);
    const alt = artPath("fx", "element:" + el + ":alt");
    let art = (alt && seen[el] % 2) ? alt : artPath("fx", "element:" + el);
    seen[el]++;
    art = art || artPath("icon", "element:" + el);
    m.innerHTML = art ? '<img src="' + art + '" alt="">' : (EL[el] || {}).glyph || "✦";
    /* start where the rune sits on the board, in the ring's own coordinates */
    m.style.transform = "translate(" + (r.left + r.width/2 - gx) + "px," +
                                       (r.top + r.height/2 - gy) + "px)";
    m.style.transition = "transform " + CONFIG.cast.gatherMs + "ms cubic-bezier(.4,0,.5,1)";
    ring.appendChild(m);
    return { m, i };
  });

  /* GATHER — into a knot around the meeting point. Each aura is given its own
     starting angle AND its own rotation, so the clouds cross rather than sitting
     at tidy stations on a circle. */
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  motes.forEach(({ m, i }) => {
    const a = (i / n) * Math.PI * 2;
    const spin = auraCast ? " rotate(" + (i * 47) + "deg)" : "";
    m.style.transform = "translate(" + (Math.cos(a) * radius) + "px," +
                                       (Math.sin(a) * radius) + "px)" + spin;
  });
  /* CHARGE — at the staff, looping while the incantation gathers */
  /* #fx is position:fixed inset:0, so a viewport coordinate IS an fx-layer
     coordinate — no origin to subtract. Checked rather than assumed. */
  /* the charge sits at the head of the already-rendered staff; the sheets carry
     no staff of their own, which is what the wireframe round settled */
  const chargeFx = playFx("charge:" + dominant, { x:gx, y:gy });
  playSfx("gather");
  await sleep(CONFIG.cast.gatherMs);

  /* SWIRL — the ring circles at the staff, wide and unhurried. The LONGEST beat
     of the cast, and the only one that holds still enough to be read: the motes
     keep their radius and the whole ring turns once, evenly, with no easing at
     either end so it neither starts nor stops abruptly. */
  ring.style.transition = "transform " + CONFIG.cast.swirlMs + "ms linear";
  ring.style.transform = "rotate(" + (CONFIG.cast.spinTurns * 360) + "deg) scale(1.06)";
  ring.classList.add("winding");
  playSfx("wind");
  await sleep(CONFIG.cast.swirlMs);

  /* CONTRACT — a quick tightening. Short and eased-in, so it reads as a
     wind-up rather than as another stage of the swirl. */
  motes.forEach(({ m, i }) => {
    const a = (i / n) * Math.PI * 2;
    const tight = radius * 0.34;
    const spin = auraCast ? " rotate(" + (i * 47 + 120) + "deg)" : "";
    m.style.transition = "transform " + CONFIG.cast.contractMs + "ms cubic-bezier(.5,0,.8,1)";
    m.style.transform = "translate(" + (Math.cos(a) * tight) + "px," +
                                       (Math.sin(a) * tight) + "px)" + spin;
  });
  ring.style.transition = "transform " + CONFIG.cast.contractMs + "ms cubic-bezier(.5,0,.8,1)";
  ring.style.transform = "rotate(" + (CONFIG.cast.spinTurns * 360 + 40) + "deg) scale(.78)";
  await sleep(CONFIG.cast.contractMs);

  /* LAUNCH — the fused whole travels and breaks. */
  /* LAUNCH — eased IN, so it leaves the staff like something released rather
     than drifting off at a constant speed. */
  ring.style.transition = "transform " + CONFIG.cast.launchMs + "ms cubic-bezier(.55,0,.85,1)," +
                          " opacity " + CONFIG.cast.launchMs + "ms";
  ring.style.transform = "translate(" + (tx - gx) + "px," + (ty - gy) + "px)" +
                         " rotate(" + (CONFIG.cast.spinTurns * 360 + 200) + "deg) scale(.86)";
  ring.style.opacity = ".15";
  /* TRAVEL — the bolt crosses to the creature. The sheet is authored flying
     left-to-right with its trail baked to the left, so it is ROTATED to the real
     flight angle and never mirrored: mirroring would put the trail in front. */
  const travel = fxSheet("travel:bolt");
  let boltFx = null;
  if (travel){
    /* THE BOLT IS AUTHORED ON +X — knot right, trail left — so it is rotated to
       the real flight angle and NEVER mirrored: mirroring would put the trail in
       front of the knot. The pack states this twice, in the readme and the
       placement notes. */
    const ang = Math.atan2(ty - gy, tx - gx) * 180 / Math.PI;
    boltFx = playFx("travel:bolt", { x:gx, y:gy, rotate:ang, tint:tintOf(dominant) });
    if (boltFx.el){
      boltFx.el.style.transition = "transform " + CONFIG.cast.launchMs + "ms cubic-bezier(.55,0,.85,1)";
      requestAnimationFrame(() => {
        boltFx.el.style.transform = "translate(-50%,-50%) translate(" +
          (tx - gx) + "px," + (ty - gy) + "px) rotate(" + ang + "deg)";
      });
    }
  }
  if (chargeFx) chargeFx.stop();

  playSfx("launch", { fallback:"cast" });
  await sleep(CONFIG.cast.launchMs);
  if (boltFx) boltFx.stop();
  ring.remove();
  /* IMPACT — the creature flashes as it lands. Its own `hit` shake belongs to
     DAMAGE and fires later, from damageEnemy; this is the arrival of the
     incantation, which happens whether or not the guess hurt it. */
  /* THE ARRIVAL. A fizzle does not strike anything — the bolt comes apart before
     it lands — so the creature is not flashed and the screen is not shaken. That
     absence is the whole point: the player should feel nothing happen. */
  const kind = outcome || "fracture";
  if (kind !== "fizzle"){
    const target = $("#enemySprite");
    if (target){
      target.classList.remove("struck"); void target.offsetWidth;
      target.classList.add("struck");
      setTimeout(() => target.classList.remove("struck"), 320);
    }
  }
  /* a Shatter holds for a beat before it lands — the pause is what makes it
     read as bigger, and it is the only place in the cast that waits */
  /* IMPACT — the outcome chooses the sheet. A fizzle plays its own; a Shatter
     plays the break; anything that bit plays the element. Resonate has its own
     sheet precisely so it is not a smaller version of a Fracture. */
  /* ROUTED EXACTLY AS docs/routing_reference.md STATES IT:
       one or more Fractures -> the loud elemental burst
       Resonate only         -> five motes drifting apart. NEVER a small impact:
                                the pack made this a separate sheet on purpose,
                                "required for outcome readability"
       all Resist            -> the fizzle, which drains and falls
       perfect               -> the shatter
     The size comes from each sheet's own display_size, so nothing here says 190. */
  const impactKey =
      kind === "fizzle"   ? "fizzle"
    : kind === "shatter"  ? "shatter"
    : kind === "resonate" ? "resonate"
    : "impact:" + dominant;
  playFx(impactKey, { x:tx, y:ty, tint:tintOf(dominant) });

  /* THE OVERLAYS ARE OPTIONAL AND SHARED, and the pack is explicit that they do
     not replace the outcome sheet. A fizzle gets neither: it is a failure, and
     "without a satisfying flash or shockwave" is the direction. */
  if (kind !== "fizzle"){
    playFx("shockwave", { x:tx, y:ty, tint:tintOf(dominant) });
    playFx("hitflash",  { x:tx, y:ty, tint:tintOf(dominant) });
  }

  if (kind === "shatter") await sleep(180);
  screenTreatment(kind, landed || 0);
}
function floatText(anchor, text, cls){
  const r = anchor.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "dmg " + (cls || "");
  d.textContent = text;
  d.style.left = (r.left + r.width/2) + "px";
  d.style.top  = (r.top + r.height/3) + "px";
  $("#fx").appendChild(d);
  setTimeout(() => d.remove(), 1100);
}
function burstAt(anchor, n){
  const r = anchor.getBoundingClientRect();
  for (let i = 0; i < n; i++){
    const p = document.createElement("div");
    const e = ELEMENTS[i % ELEMENTS.length];
    const a = Math.random()*Math.PI*2, dist = 60 + Math.random()*90;
    p.className = "burst"; p.style.background = e.color;
    p.style.left = (r.left + r.width/2) + "px";
    p.style.top  = (r.top + r.height/2) + "px";
    p.style.setProperty("--dx", Math.cos(a)*dist + "px");
    p.style.setProperty("--dy", Math.sin(a)*dist + "px");
    $("#fx").appendChild(p);
    setTimeout(() => p.remove(), 750);
  }
}
function gainManaFx(id, amount){
  const box = $("#mana-" + id);
  if (!box) return;
  box.classList.remove("gain"); void box.offsetWidth; box.classList.add("gain");
  const f = document.createElement("span");
  f.className = "float"; f.textContent = "+" + amount; f.style.color = EL[id].color;
  box.appendChild(f);
  setTimeout(() => f.remove(), 950);
}
function banner(text, dire){
  playSfx(dire ? "banner_bad" : "banner_good");
  const b = $("#banner");
  b.textContent = text;
  b.className = dire ? "dire" : "";
  void b.offsetWidth; b.classList.add("show");
}
let toastTimer;
function toast(html, ms){

  t.innerHTML = html;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms || 2400);
}
document.addEventListener("click", () => $("#toast").classList.remove("show"));

/* ============================================================
   14b. TOOLTIPS — long-press to open, tap anywhere to close.
   Content is resolved live from game state, so a tooltip always describes the
   situation in front of the player rather than a static blurb.
   ============================================================ */
function elementTipBody(id){
  const e = EL[id];
  const mana = B ? B.mana[id] : 0;
  const ward = B ? (B.enemy.resist[id] || 0) : 0;
  let b = "Place this rune in your incantation.<br><br>" +
    "<b>Fracture</b> (right place) deals " + CONFIG.damage.perExploit +
    " damage and grants " + CONFIG.mana.perExploit + " " + e.name + " mana.<br>" +
    "<b>Resonate</b> (wrong place) grants " + CONFIG.mana.perResonate + " mana.<br>" +
    "<b>Resist</b> (not in the sequence) raises this creature's " + e.name + " ward.";
  if (ward) b += '<br><br><span class="warn">Warded ' + ward + " — " + e.name +
    " Fractures deal " + ward + " less damage (minimum " + CONFIG.damage.minExploit + ").</span>";
  if (B) b += '<div class="tipRow"><span>Pool</span><span>' + mana + " / " + manaMax() + "</span></div>";
  return b;
}

function spellTipBody(id){
  const sp = SPELLS[id], base = spellBase(id);
  const opts = paymentOptions(id);
  const nat = opts.find(o => o.native), foreign = opts.find(o => !o.native);
  if (base.element === "gold"){
    return sp.desc + "<br><br>Priced in " + TEXT.currency + ", not mana: <b>" + nat.cost + " " +
           TEXT.currencyShort + "</b>.<br><br>Spending it here means not spending it in the " + TEXT.shop + "." +
           (B && !canAfford(id) ? '<br><br><span class="warn">Not enough ' + TEXT.currency + '.</span>' : "");
  }
  const goldOpt = opts.find(o => o.gold);
  let b = sp.desc + "<br><br>Spells never consume your turn.<br><br>" +
    "<b>" + nat.cost + " " + EL[base.element].glyph + "</b> from its own pool, or <b>" +
    foreign.cost + "</b> from any other pool." +
    (goldOpt ? "<br>Or settle it with <b>" + goldOpt.cost + " " + TEXT.currencyShort + "</b>." : "") +
    (sp.hpCost ? "<br>Also costs <b>" + sp.hpCost + " HP</b>." : "");
  const m = masteryOf(id);
  if (m) b += '<br><br><b>' + m.name + '</b> — ' + m.desc;
  const pot = potency(id);
  if (pot) b += "<br><br>Potency +" + pot + " from the Sanctum.";
  if (B){
    if (!canAfford(id)) b += '<br><br><span class="warn">No pool holds enough right now.</span>';
    else if (sp.ready && !sp.ready()) b += '<br><br><span class="warn">' + (sp.hint || "Cannot be cast right now.") + '</span>';
  }
  return b;
}

function enemyTipBody(){
  const e = B.enemy;
  let b = "<i>" + e.flavour + "</i><br><br>";
  if (e.special) b += (e.tier === "Boss" ? "<b>Breaks the rules:</b> " : "<b>Special:</b> ") + e.special + "<br><br>";
  if (e.tier === "Boss")
    b += "Bosses change one assumption you have learned — but they never lie, never alter the " +
         "sequence silently, and always tell you what they did.<br><br>";
  b += '<div class="tipRow"><span>Health</span><span>' + Math.max(0,e.hp) + " / " + e.maxHP + "</span></div>" +
       '<div class="tipRow"><span>Sequence length</span><span>' + e.codeLength + " runes</span></div>" +
       '<div class="tipRow"><span>Attack</span><span>' + e.damage + "</span></div>";
  if (e.block) b += '<div class="tipRow"><span>Block</span><span>' + e.block + "</span></div>";
  const wards = ELEMENTS.filter(x => B.enemy.resist[x.id]);
  if (wards.length) b += '<div class="tipRow"><span>Wards</span><span>' +
    wards.map(x => x.glyph + (B.enemy.resist[x.id])).join(" ") + "</span></div>";
  return b;
}

/* What ELSE the coming action does — read from the creature, so a player never has
   to remember a boss rule they were told once at the start of the fight. */
function intentExtra(){
  const e = B.enemy, t = B.turn;
  const L = [];
  switch (e.id){
    case "runeshifter":
      if (t % e.shiftEvery === 0) L.push("<b>The whole sequence rotates one place right</b> after your cast. " +
        "Everything you have deduced stays true — it simply moves. Your revealed runes move with it.");
      else L.push("The sequence rotates every " + e.shiftEvery + " turns. Next rotation on turn " +
        (Math.ceil(t / e.shiftEvery) * e.shiftEvery) + ".");
      break;
    case "chaos_cultist":
      if (t >= 4) L.push("<b>Two positions will swap</b> after your cast. It always names which two.");
      else L.push("From turn 4 it begins swapping two positions each turn.");
      break;
    case "wraith":
      if (t % 3 === 2) L.push("<b>One of your feedback markers will be veiled</b> next turn — shown as ? — " +
        "so you will learn one fact fewer than usual.");
      else L.push("Every third turn it veils one of your markers.");
      break;
    case "prismatic_dragon":
      if (t % 4 === 0) L.push("<b>Elemental Roar:</b> it wards the element you have cast most this battle by +2, " +
        "instead of attacking.");
      if (!B.once.shift) L.push("At 75 health its core shifts: two positions change and all its wards are stripped.");
      break;
    case "echo_lord":
      L.push("Its sequence is built from <b>repeated runes</b>. Casting the exact COUNT of a repeated rune " +
        "cracks its armour; casting too few thickens it.");
      break;
    case "mirror_archmage":
      L.push("<b>Insight is one turn late.</b> The markers you receive describe your PREVIOUS incantation, " +
        "never the one you are about to cast.");
      break;
    case "silencer":
      if (t % 2 === 1) L.push("<b>It will seal one of your spells for 3 turns</b> after this cast.");
      else L.push("It seals a spell every second turn. Your deduction is untouched — only your kit.");
      break;
    case "nullifier":
      if (t % 3 === 2) L.push("<b>It will banish an element for 3 turns</b> after this cast. Its sequence may " +
        "still contain the banished rune.");
      else L.push("It banishes an element every third turn.");
      break;
    case "chorus":
      L.push("<b>" + { 1:"It will rotate the sequence one place right.",
                       2:"It will veil one of your feedback markers.",
                       3:"It will swap two positions.",
                       0:"It will ward your most-used element by +2." }[t % 4] + "</b>" +
             "<br>It cycles rotate → veil → swap → ward, and always tells you which is next.");
      break;
    case "accretion":
      L.push("Every Shatter <b>adds a rune</b> to its sequence, up to 5. It is currently " +
             e.codeLength + ".");
      break;
    case "warded_sentry":
      if (!B.once.sentryOpened) L.push("Shatter its 3-rune outer ward and <b>a fresh 4-rune " +
        "sequence</b> is revealed beneath.");
      break;
    case "mana_leech":
      L.push("<b>It drains 2 mana</b> from your fullest pool each turn, and hits 1 harder for every 3 it holds" +
             (e.stolen ? " — it holds " + e.stolen + "." : "."));
      break;
    case "stone_golem":
      L.push("<b>It hardens in whichever element you spend first</b>, and a Shatter " +
             "shakes its whole guard apart.");
      break;
    case "goblin_mage":
      L.push("Every Resist raises its ward by <b>2 instead of 1</b> — wrong runes cost double here.");
      break;
    case "arcane_knight":
      L.push("It alternates attacking and guarding. <b>A Shatter ignores Block entirely.</b>");
      break;
  }
  return L.join("<br><br>");
}

function intentTipBody(){
  const it = B.intent || atk(B.enemy.damage);
  if (B.flags.skipEnemy) return "The creature is held and will lose its next action entirely.";
  const map = {
    attack: "It will strike for <b>" + (it.amount != null ? it.amount : B.enemy.damage) +
            "</b> damage after your next incantation. Block absorbs this before your HP does.",
    guard:  "It will raise <b>" + it.amount + " Block</b> instead of attacking. Block soaks damage until it is gone — " +
            "but a <b>Shatter ignores Block entirely</b>.",
    roar:   "It will ward the element you have used most this battle by +2 instead of attacking."
  };
  let b = map[it.act] || it.label;
  const extra = intentExtra();
  if (extra) b += "<br><br>" + extra;
  b += "<br><br><i>The intent is always shown before you commit, so you can decide whether to spend mana on defence.</i>";
  return b;
}

function showTip(kind, id){
  LESSON.saw("longPress", kind);
  let t;
  try { t = TIPS[kind] && TIPS[kind](id); } catch(e){ return; }
  if (!t) return;
  $("#tipCard").innerHTML =
    '<div class="tipHead"><span class="tipGlyph">' + (t.glyph || "✦") + '</span>' +
    '<h3>' + t.title + '</h3>' + (t.tag ? '<span class="tipTag">' + t.tag + '</span>' : "") + '</div>' +
    '<div class="tipBody">' + t.body + '</div>' +
    '<div class="tipDismiss">tap anywhere to close</div>';
  $("#tipLayer").classList.add("show");
}
function hideTip(){ $("#tipLayer").classList.remove("show"); }
const tipOpen = () => $("#tipLayer").classList.contains("show");

/* ---- long-press gesture ----
   A press that lasts TIP_HOLD_MS opens the tooltip and swallows the click that
   would otherwise follow, so holding a rune never also places it. */
(function tooltipGesture(){
  let timer = null, hintTimer = null, startX = 0, startY = 0, target = null, fired = false;
  let inScroller = false;

  const findTip = el => {
    const host = el && el.closest ? el.closest("[data-tip]") : null;
    return host ? { kind:host.dataset.tip, id:host.dataset.tipId, host } : null;
  };
  /* A press that begins inside a scrollable surface is far more likely to be the
     start of a drag, so it is judged much more strictly and shows no feedback until
     the gesture has clearly settled. */
  const inScrollable = el => !!(el && el.closest && el.closest("[data-scroll]"));

  const cancel = () => {
    clearTimeout(timer); clearTimeout(hintTimer);
    timer = hintTimer = null;
    if (target && target.host) target.host.classList.remove("pressing");
    target = null;
  };

  document.addEventListener("pointerdown", e => {
    if (tipOpen()) return;
    const t = findTip(e.target);
    if (!t) return;
    target = t; fired = false;
    startX = e.clientX; startY = e.clientY;
    inScroller = inScrollable(e.target);

    /* The highlight is NOT applied on contact — that was the flash. It waits until
       the press has already outlived a plausible flick. */
    const hintDelay = inScroller ? 260 : 120;
    hintTimer = setTimeout(() => {
      if (target && target.host) target.host.classList.add("pressing");
    }, hintDelay);

    timer = setTimeout(() => {
      fired = true;
      clearTimeout(hintTimer);
      if (target && target.host) target.host.classList.remove("pressing");
      showTip(t.kind, t.id);
      if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
    }, inScroller ? TIP_HOLD_MS + 180 : TIP_HOLD_MS);
  }, { passive:true });

  document.addEventListener("pointermove", e => {
    if (!timer) return;
    const dx = Math.abs(e.clientX - startX), dy = Math.abs(e.clientY - startY);
    /* Inside a scroller almost any vertical movement means "I am reading", so the
       press yields immediately rather than competing with the scroll. */
    if (inScroller){ if (dy > 3 || dx > 12) cancel(); return; }
    if (dx > 10 || dy > 8) cancel();
  }, { passive:true });

  /* Any scroll — including the browser's own momentum — abandons the press. */
  document.addEventListener("scroll", cancel, { capture:true, passive:true });
  ["pointerup","pointercancel","pointerleave","touchmove"].forEach(evt =>
    document.addEventListener(evt, evt === "touchmove" ? (e => { if (inScroller) cancel(); }) : cancel,
      { passive:true }));

  // swallow the click that follows a long press, and the one that dismisses a tip
  document.addEventListener("click", e => {
    if (tipOpen()){ e.preventDefault(); e.stopPropagation(); hideTip(); fired = false; return; }
    if (fired){ e.preventDefault(); e.stopPropagation(); fired = false; }
  }, true);

  document.addEventListener("contextmenu", e => {
    if (findTip(e.target)) e.preventDefault();     // stop iOS/Android callout menus
  });
})();

/* ============================================================
   THE FIRST LESSON
   A scripted fight against the Slime, which exists for no other purpose. The sequence
   never changes — 🔥⚡🔥 — because a tutorial that can be unlucky is not a tutorial.
   Each step names exactly what to press, waits for it, and explains what happened.
   The player is never blocked from reading a tooltip or looking around; they are only
   stopped from casting the wrong thing.
   ============================================================ */
const LESSON = {
  on:false, step:0, waiting:null,

  /* The one sequence, and the one opening guess we walk them through. It is chosen so
     a single cast produces EVERY marker at once: Fracture, Resist, Resonate and an Echo. */
  CODE:  ["fire","lightning","fire"],
  GUESS: ["fire","water","lightning"],

  done(){ return localStorage.getItem("rw_lesson_done") === "1"; },
  finish(){
    localStorage.setItem("rw_lesson_done", "1");
    this.on = false; this.step = 0; this.waiting = null;
    document.body.classList.remove("lessonOn");
    this.clearHighlights();
    const bar = $("#lessonBar"); if (bar) bar.remove();
  },

  /* ---------------- the script ---------------- */
  steps: [
    { key:"look",
      say:"Welcome, Shattermancer.<br><br>This creature is bound by a secret order of runes. " +
          "Find it, and it falls.<br><br><b>Press and hold the creature</b> to see what it is.",
      point:"#enemySprite",
      until:"longPress" },

    { key:"held",
      say:"Everything in this game answers a long press — a rune, a spell, a ward, the " +

  /* ---------------- driving it ---------------- */
  begin(){
    this.on = true; this.step = 0;
    document.body.classList.add("lessonOn");
    newRun("pyromancer");
    RUN.tutorial = true;
    beginAct(0);
    /* AFTER beginAct: act 0 rebuilds the loadout from the talent tree, which would
       otherwise throw away the single spell this lesson is built around. */
    RUN.spells = ["fireball"];
    startEncounter("enemy", "slime");
    /* Fixed sequence, gentle creature, and enough Fire for the scripted Fireball. */
    B.enemy.code = LESSON.CODE.slice();
    B.enemy.codeLength = 3;
    B.enemy.hp = 40; B.enemy.maxHP = 40;
    B.enemy.damage = 0;              // nothing may kill a player who is still reading
    B.draft = emptyDraft(3);
    renderAll();
    this.show();
  },

  show(){
    const s = this.steps[this.step];
    if (!s) return this.finish();
    this.waiting = s;
    this.skipArmed = false;        // never carry an armed skip into a new step
    if (s.enter) s.enter();
    this.clearHighlights();
    if (s.point) this.pointAt(s.point);
    this.bar(s.say, s.until === "tap");
  },

  advance(){
    this.step++;
    if (this.step >= this.steps.length){
      this.outro();
      return;
    }
    this.show();
  },

  /* Every interaction the player can make reports here; the step decides if it counts. */
  saw(what, detail){
    if (!this.on || !this.waiting) return;
    const s = this.waiting;
    if (s.until !== what) return;
    if (s.want && s.want !== detail) return;
    setTimeout(() => this.advance(), what === "cast" || what === "solved" ? 900 : 250);
  },

  /* Only the rune or spell the lesson asked for may be used. Everything else is
     allowed — looking, holding, reading — so the player can explore safely. */
  allows(what, detail){
    if (!this.on || !this.waiting) return true;
    const s = this.waiting;
    if (what === "rune")  return s.until === "rune"  ? s.want === detail : s.until === "solved";
    if (what === "spell") return s.until === "spell" && s.want === detail;
    if (what === "cast")  return s.until === "cast"  || s.until === "solved";
    return true;
  },

  /* ---------------- the furniture ---------------- */
  bar(html, tappable){
    let el = $("#lessonBar");
    if (!el){
      el = document.createElement("div");
      el.id = "lessonBar";
      document.body.appendChild(el);
    }
    el.innerHTML = '<div class="lessonInner">' + html +
      (tappable ? '<button class="btn" id="lessonNext">Go on</button>' : "") +
      /* An escape hatch for anyone who has played before — on another device, or on a
         wiped save. It ARMS on the first tap and skips on the second, the same way the
         talent tree spends a Veilglass, so a stray thumb cannot cost someone the
         lesson they have not had yet. */
      '<button class="lessonSkip" id="lessonSkip">' +
        (this.skipArmed ? "Skip the lesson \u2014 tap again" : "Skip") + '</button>' +
      '</div>';
    el.classList.add("show");
    const next = $("#lessonNext");
    if (next) next.addEventListener("click", () => this.saw("tap"));
    const skip = $("#lessonSkip");
    if (skip) skip.addEventListener("click", () => {
      if (!this.skipArmed){
        this.skipArmed = true;
        this.bar(html, tappable);
        return;
      }
      this.skip();
    });
  },

  /* Skipping ends the lesson AND the run it was teaching in. The player has not chosen
     a discipline — the lesson chose Fire for them — so they are put back at the choice
     rather than dropped into a Pyromancer run they never asked for. */
  skip(){
    this.skipArmed = false;
    this.finish();
    if (B) B.over = true;
    RUN = null;
    toast("Lesson skipped. It can be seen again by erasing your progress.", 3600);
    showSchools();
  },

  pointAt(sel){
    const el = document.querySelector(sel);
    if (!el) return;
    el.classList.add("lessonPoint");
    this.pointed = el;
  },
  clearHighlights(){
    document.querySelectorAll(".lessonPoint").forEach(e => e.classList.remove("lessonPoint"));
    this.pointed = null;
  },

  /* Called by victory() instead of the reward screen, so the lesson keeps the stage
     until it has finished speaking. */
  victory(){
    /* NOTHING IS AWARDED. A Slime pays no Veilglass and neither does any ordinary
       creature — handing one over here taught the opposite, and the player already
       holds the three their discipline was given, which is what the first tier costs.
       The lesson also does NOT advance: the killing blow is usually the solve, and the
       solve is what opens the Perfect explanation. */
  },
  /* The tree is where the lesson ends, and where a real run begins. */
  toTree(){
    showTalents("map");
    const s = this.steps[this.step];
    if (s && s.point) setTimeout(() => this.pointAt(s.point), 0);
  },
  outro(){
    /* The lesson ENDS ON THE TREE, not on a screen of its own. The player has just been
       told fragments are theirs to spend and shown where to spend them — replacing that
       with a congratulation would take the tree away at exactly the wrong moment.
       The run they have been playing simply carries on: same Pyromancer, same act, and
       the road waiting behind the tree's own way out. */
    this.finish();
    showTalents("map");
    toast("<b>You are a Shattermancer.</b> Spend what you earned, then take the road.", 4200);
  }
};

const Tutorial = {
  seen: JSON.parse(localStorage.getItem("rw_tut") || "{}"),
  mark(k){ this.seen[k] = true; localStorage.setItem("rw_tut", JSON.stringify(this.seen)); },

      tips:"<b>Long-press anything</b> — a rune, a spell, the creature, a ward — to see exactly what it does."

            '<b class="k-resist">╱</b> Resist — not in the sequence at all<br>' +
            '<b style="color:var(--gold-soft)">◎</b> Echo — the sequence wants more of that rune' +
            '<span class="tap">markers are shuffled — they never say which slot</span>', 7000);

      this.mark("mana");

  reset(){ this.seen = {}; localStorage.removeItem("rw_tut"); }
};

const screen = () => $("#screen");
/* What the player is carrying, shown on every non-battle stop. A decision at a
   shop or an event depends on health, relics and vials, and asking someone to
   remember all three across screens is asking them to guess. */
function statusStrip(){
  const hpPct = Math.max(0, Math.round(RUN.hp / RUN.maxHP * 100));
  const hurt = hpPct <= 33 ? " low" : hpPct <= 66 ? " worn" : "";

  const relics = RUN.relics.length
    ? RUN.relics.map(id => '<i class="tok" data-tip="relic" data-tip-id="' + id + '">' +
        icon("relic", id) + '</i>').join("")
    : '<i class="tok none">none</i>';

  const cap = potionCapacity();
  const vials = RUN.potions.length
    ? RUN.potions.map(id => '<i class="tok" data-tip="potion" data-tip-id="' + id + '">' +
        icon("potion", id) + '</i>').join("")
    : '<i class="tok none">none</i>';

  return '<div class="statusStrip">' +
    '<div class="ss hp' + hurt + '"><b>' + RUN.hp + '<span>/' + RUN.maxHP + '</span></b>' +
      '<u>health</u><em style="width:' + hpPct + '%"></em></div>' +
    '<div class="ss"><b>' + TEXT.currencyShort + " " + RUN.gold + '</b><u>' + TEXT.currency + '</u></div>' +
    '<div class="ss wide"><span class="toks">' + relics + '</span>' +
      '<u>relics · ' + RUN.relics.length + '</u></div>' +
    '<div class="ss wide"><span class="toks">' + vials + '</span>' +
      '<u>vials · ' + RUN.potions.length + '/' + cap + '</u></div>' +
    '</div>';
}
/* Screens that are stops on the road, not fights — each one shows the strip. */
function showScreenWithStatus(html){ showScreen(statusStrip() + html); }

/* Every screen names its track; asking for the one already playing is a no-op,
   which is what keeps music continuous as the player moves around. */
/* the ladder order, named once — the title, the disciplines orbit and the
   manifestations must all agree on it */
const DISC_LADDER = ["pyromancer","cryomancer","warlock","apothecary",
                     "alchemist","hexweaver","diviner"];

/* when the page opened — the clock every ambient drift is measured against, so
   a redraw cannot send them back to their starting pose */
const FX_EPOCH = Date.now();

/* ============================================================================
   BAKED TEXT, HANDLED EXPLICITLY.

   Where a word is PAINTED INTO an asset, the game must not type it as well or it
   appears twice in two faces. The manifest declares which assets carry which
   words; this is the game's side of that contract — every declared asset named
   here, with how it is handled.

   IT IS A LIST, NOT AN INFERENCE. bakedtext.py used to guess by looking for the
   asset's name in a CSS selector, and reported the grimoire as unhandled when it
   was handled — by a rule on #bookHeads, which does not contain the word
   "grimoire" anywhere. A guess that cries wolf is a guess that gets ignored.
   An artist declares; this list acknowledges; the tool compares two lists and
   cannot be wrong.

   ADD A LINE HERE WHENEVER A PACK DECLARES baked_text. If it is not here, the
   check fails, and the fault is caught before the screen is looked at.
   ============================================================================ */
const BAKED_HANDLED = {
  "grimoire_book":  "#bookTitle and #bookHeads were REMOVED in the 2026-08-28 " +
                    "migration; book.png paints GRIMOIRE, INCANTATION and " +
                    "INSIGHT, and nothing in the game types them",
  "cast_label":     "delivered as its own file and drawn by ::after; #cast is " +
                    "font-size:0 so the button never types CAST",
  "feedback_legend_button_default": "the ? is painted; #legendBtn types nothing",
  "menu_button_default": "labels are separate files; .mmBtn is font-size:0",
  "book_button_default": "labels are separate files; #dTree/#dGo are font-size:0"
};

let SCREEN_NOW = null;
function showScreen(html, name){
  /* GUARDED. The suites run this file in a headless shim where document.body
     can be absent, and an unguarded .classList threw before a single assertion
     ran — two suites died on my own line rather than on anything in the game. */
  if (document.body) document.body.classList.remove("inBattle");
  /* Cleared by default: only the title and the Disciplines raise it again, so the
     observatory never turns up behind the Sanctum or the talent tree. */
  dressStage(false);

  /* AND SO IS THE SCROLL LOCK. Every screen is drawn into the SAME #screen element, so
     an inline overflow set for one screen applied to every screen after it — open the
     title, then Settings, and Settings could not scroll. A screen that must be locked
     says so through the table when it draws; everything else scrolls, which is what a
     list of options or a glossary needs.
     This is cleared BEFORE the new screen renders, so a lock is never inherited. */
  { const sc = screen();
    if (sc && sc.style) sc.style.overflowY = "";
    /* and the Path's full-bleed backdrop is dropped, or it would sit behind the Sanctum */
    if (sc && sc.classList) sc.classList.remove("onPath"); }
  $("#screenInner").innerHTML = html;
  screen().classList.add("show");
  if (name){ SCREEN_NOW = name; playMusic(trackForScreen(name)); applyScene(screen(), "screen:" + name); }
  playSfx("screen_open");
}
function showBattle(){
  screen().classList.remove("show");
  /* The dressed battle darkens the whole stage (Kerry, 2026-08-25: the purple
     must not show through the new UI). A body class, because the purple lives
     on body — showScreen clears it, so every menu screen still gets the game's
     usual violet without naming each one. */
  if (document.body) document.body.classList.add("inBattle");
  try { dressBattleStage(); } catch(e){}
  playMusic(trackForBattle());
}

function showTitle(){
  /* THE TITLE, to the design: a name, the figure, and ONE clear action.
     Everything the old screen carried — the marker legend, the run tally, the
     spellbook, the developer switch — was reference material standing where a decision
     belongs. The rules live in the Glossary and the tutorial teaches them; a player
     opening the game wants to play it. */
  const saved = RUNSAVE.peek();
  const ver = CONFIG.version || "0.4.1";

  /* THE BUTTON ART CARRIES ITS OWN LETTERING, so the game must not write the word over
     it — that printed every label twice. The label survives as the ACCESSIBLE NAME,
     since the art's words are only pixels to a screen reader, and as a visible fallback
     when there is no art at all.
     The primary's sub-line — the act, craft and health of a saved run — is NOT painted
     into anything and stays. */
  const dressed = !!artPath("ui", "menu-button-primary");
  /* THE PRIMARY REPLACES ITSELF. New Game with no run; Continue with one — the same
     row, wearing a different picture, rather than two buttons stacked. */
  const primary = (id, label, sub) =>
    '<button class="mmBtn mmPrimary' + (id === "mmContinue" ? " resume" : "") +
      '" id="' + id + '" aria-label="' + label + '">' +
      (dressed ? "" : '<span class="mmLabel">' + label + '</span>') +
      (sub ? '<span class="mmSub">' + sub + '</span>' : "") + '</button>';
  const second = (id, label, glyph) =>
    '<button class="mmBtn" id="' + id + '" aria-label="' + label + '">' +
      (dressed ? "" :
        (glyph ? '<span class="mmGlyph">' + glyph + '</span>' : "") +
        '<span class="mmLabel">' + label + '</span>') + '</button>';

  showScreen(
    '<div class="mmScreen">' +
      /* ONE TITLE. The logo when it exists, the lettering when it does not — never
         both, and never the old ornament behind either. The ornament layer is gone from
         the build: 2.57% of it was opaque near-white, which is what drew the arcs
         behind the title. */
      '<div class="mmTitle' + (artPath("ui","menu-logo") ? " isLogo" : "") + '">' +
        (artPath("ui","menu-logo")
          ? '<img class="mmLogo" src="' + artPath("ui","menu-logo") + '" alt="Shattermancer">'
          : '<span class="mmOrn">\u2727</span><h1 class="mmName">Shattermancer</h1>' +
            '<span class="mmOrn">\u2727</span>') +
      '</div>' +

      /* The sigil stands where the painted figure will. It is built from the six
         elements circling a hooded shape, so the screen means something before the
         art arrives rather than holding an empty box. */
      '<div class="mmArt" aria-hidden="true">' +
        /* The astrolabe and the wright, when the kit is present. The drawn rings and
           the emoji figure are the fallback and stay for a build without art. */
        (artPath("ui","menu-astrolabe")
          ? '<img class="mmAstro" src="' + artPath("ui","menu-astrolabe") + '" alt="">'
          : '<div class="mmRing"></div><div class="mmRing two"></div>') +
        (artPath("ui","menu-wizard")
          ? '<img class="mmWizard" src="' + artPath("ui","menu-wizard") + '" alt="">' +
            /* on the title he wears the eyes of whichever craft was played last, or
               none at all on a fresh save */
            (artPath("eyes", SAVE.data.lastWizard)
              ? '<img class="mmEyes" src="' + artPath("eyes", SAVE.data.lastWizard) + '" alt="">' : "")
          : '<div class="mmFigure">\ud83e\uddd9</div>') +
        /* the seals drift here, atmospheric and not pressable, as the kit asks */
        /* THE MANIFESTATIONS. The 2026-08 pack replaces the drifting seals with
           seven spell EVENTS — fire in the raised hand, frost in the other, the
           rest spiralling around the figure. The pack's placement notes ask for
           an irregular spiral: unequal radius, scale, tilt and depth, some in
           front of the wright and some behind. Positions are in the layout table
           so Kerry can drag them; the z alternation is what puts some behind. */
        (artPath("ui","manifest-pyromancer")
          ? DISC_LADDER.map(id =>
              '<img class="mmManifest mf-' + id + '" src="' +
              artPath("ui","manifest-" + id) + '" alt="">').join("")
          : artPath("seal","pyromancer")
          ? disciplinesInLadderOrder().map((w, n) =>
              '<img class="mmSeal s' + n + '" src="' + artPath("seal", w.id) + '" alt="">').join("")
          : ELEMENTS.map((e, n) =>
              '<span class="mmEl e' + n + '" style="--c:var(--' + e.id + ')">' + e.glyph + '</span>').join("")) +
        /* the reflected light the manifestations throw back onto the scene, and the
           shadow that seats the wright on the floor — both atmosphere, both inert */
        (artPath("ui","menu-reflected-light")
          ? '<img class="mmLight" src="' + artPath("ui","menu-reflected-light") + '" alt="">' : "") +
        (artPath("ui","menu-wright-shadow")
          ? '<img class="mmGroundShadow" src="' + artPath("ui","menu-wright-shadow") + '" alt="">' : "") +
      '</div>' +

      /* EXACTLY TWO ROWS, ALWAYS. Continue REPLACES New game in the primary slot rather
         than being added above it — a third row would change the stack's height and
         push the wright, the title and the seals upward the moment a save existed.
         Only the text inside the primary button differs between the two states. */
      '<div class="mmActions">' +
        (saved
          ? primary("mmContinue", "Continue",
